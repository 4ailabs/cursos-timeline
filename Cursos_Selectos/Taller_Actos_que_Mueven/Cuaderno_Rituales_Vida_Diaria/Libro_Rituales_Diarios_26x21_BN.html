<script>
const RITUALES=[{"num":"01","title":"01. La Mesa Vacía","subtitle":"Ritual para dormir cuando la mente no se apaga","para":["Para cuando te acuestas y el cuerpo no entra al descanso. La cama está lista, la luz se apaga, pero la mente sigue trabajando: pendientes, conversaciones, mensajes, cuentas, decisiones, cosas que no se resolvieron.","No es que no quieras dormir. Es que tu sistema nervioso sigue tratando la noche como una extensión del día. La cama se vuelve escritorio, tribunal, sala de espera y lista de pendientes."],"principio":["El cuerpo necesita fronteras claras. Si todo lo que quedó abierto durante el día entra contigo a la cama, el sistema nervioso no sabe que ya puede bajar la guardia. Sigue sosteniendo información, anticipando consecuencias y buscando soluciones.","Cuando escribes lo pendiente, lo metes en un sobre y lo dejas fuera de la cama, le das al cuerpo una señal física: esto existe, pero no va conmigo al descanso. El sobre cerrado no borra lo pendiente. Lo contiene. Y esa contención permite dormir."],"materiales":["Una hoja.","Una pluma.","Un sobre.","Un vaso con agua.","Una mesa, silla o superficie fuera de la cama."],"cuando":"Hazlo por la noche, antes de acostarte, especialmente cuando notes que estás repasando pendientes o conversaciones. No lo hagas ya acostado. El cuerpo debe sentir que el cierre ocurre antes de entrar a la cama.","steps":[{"title":"Sacar la noche de la cabeza","phrase":"Esto es lo que hago: llevo el día a la cama.","body":["Siéntate en una mesa o silla, no en la cama. Coloca la hoja frente a ti.","Durante dos minutos, escribe todo lo que sigue abierto:","pendientes\npreocupaciones\nfrases que alguien dijo\ncosas que no alcanzaste a hacer\ndecisiones que no quieres olvidar\nemociones que siguen dando vueltas","No ordenes. No expliques. Solo vacía."]},{"title":"Volver al cuerpo","phrase":"Mi cuerpo está aquí. No tengo que resolver todo ahora.","body":["Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos:","inhalar 4 segundos\nsostener 4 segundos\nexhalar 6 segundos","Con cada exhalación, siente el peso de tu cuerpo en la silla. La hoja está afuera. Tu cuerpo está aquí."]},{"title":"Reconocer que sobreviviste el día","phrase":"Sobreviví este día. Mi cuerpo puede descansar.","body":["Pon ambos pies en el suelo. Presiona suavemente los dedos contra el piso.","Mira alrededor y nombra tres cosas reales que están contigo: una pared, una lámpara, una taza, la mesa, tu respiración.","Después mira la hoja y recuerda: nada de eso desapareció por estar escrito. Sigues aquí.","Di en voz alta:"]},{"title":"Que queda realmente abierto","phrase":"Qué necesita esperar hasta mañana?","body":["Toma la hoja con ambas manos.","Pregúntale en voz alta:","Qué necesita esperar hasta mañana?","Lee por encima lo que escribiste. Marca con una línea solo una cosa que realmente requiera acción mañana. Solo una."]},{"title":"Cerrar el sobre","phrase":"Cierro este día. La noche no resuelve. La noche repara.","body":["Dobla la hoja lentamente. Siente el papel doblarse. Escucha el sonido.","Mete la hoja dentro del sobre.","Cierra el sobre. Si tiene pegamento, séllalo. Si no, doblalo bien o ponle cinta.","Este es el momento importante: tu cuerpo espera que, si dejas de pensar en esto, algo se pierda. El sobre le muestra otra cosa: no se pierde, queda contenido."]}],"newPhrase":"Mi cuerpo entra al descanso. Mañana vuelvo a mirar.","accion":["Toma el vaso con agua.","Bebe tres tragos lentos, de pie o sentado, sintiendo el agua bajar por la garganta."],"cierre":["El sobre se queda cerrado durante la noche. No se abre si despiertas a media noche. Si aparece otro pendiente, anótalo en una nota aparte y ponlo encima del sobre, sin abrirlo.","Al día siguiente, abre el sobre fuera de la cama. Revisa solo la cosa marcada. Decide una acción concreta.","---"],"observar":["Si tardaste menos en dormir.","Si el cuerpo sintió alivio al dejar el sobre fuera.","Si despertaste con menos urgencia mental.","Si apareció ansiedad por querer abrir el sobre.","Si algún pendiente dejo de parecer tan urgente al día siguiente."]},{"num":"02","title":"02. La Puerta del Día","subtitle":"Ritual para cerrar el día antes de entrar al descanso","para":["Para cuando el día termino, pero tu cuerpo sigue adentro de el. Sigues contestando mentalmente, repasando lo que hiciste mal, pensando en lo que falto, sintiendo una conversación, una exigencia o una tensión del trabajo.","Este ritual crea una frontera física entre el día y la noche. La puerta se vuelve el límite que el cuerpo puede tocar, cerrar y reconocer."],"principio":["El sistema nervioso entiende mejor los gestos que las ideas. Decir ya voy a descansar no siempre basta, porque el cuerpo sigue actuando como si el día continuara. En cambio, escribir lo que termina, rasgarlo y cerrar una puerta con la mano produce una señal concreta: algo quedó del otro lado.","La puerta no es metáfora decorativa. Es una frontera real. El cuerpo la ve, la toca, escucha el cierre y registra que ya no está en el mismo espacio."],"materiales":["La puerta de tu cuarto o del espacio donde vas a descansar.","Un papel pequeño.","Una pluma.","Un bote de basura fuera del cuarto."],"cuando":"Hazlo al final del día, antes de entrar al cuarto o antes de iniciar tu descanso. Funciona especialmente bien cuando vienes de trabajar, atender personas, discutir o resolver problemas.","steps":[{"title":"Reconocer que sigues adentro del día","phrase":"Esto es lo que hago: sigo dentro del día aunque ya termino.","body":["Quédate de pie frente a la puerta abierta.","No entres todavía.","Siente tu cuerpo: hombros, mandíbula, pecho, manos, estómago.","Di en voz alta:"]},{"title":"Respirar en el umbral","phrase":"Estoy aquí. Puedo cerrar antes de descansar.","body":["Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","Siente tus pies en el suelo. Estás en el umbral: ni completamente en el día, ni completamente en la noche.","Di en voz alta:"]},{"title":"Sentir que tienes donde llegar","phrase":"Tengo un lugar donde descansar. Puedo entrar sin cargar todo.","body":["Mira hacia dentro del cuarto o del espacio de descanso.","Nombra tres cosas que te reciban: cama, cobija, almohada, lámpara, silencio, oscuridad, aire.","Después mira tus pies y presiónalos contra el suelo.","Di en voz alta:"]},{"title":"Lo que termina hoy","phrase":"Qué parte de este día ya no necesita entrar conmigo?","body":["En el papel pequeño, escribe una frase que nombre lo que debe quedarse fuera.","Ejemplos:","La conversación con ___\nLa preocupación por ___\nLa exigencia de terminar todo\nEl enojo que traje del trabajo\nLa culpa por no haber hecho más","No escribas una página. Una frase basta."]},{"title":"Rasgar y cerrar","phrase":"este día termina aquí. Mi cuerpo entra al descanso.","body":["Rasga el papel en cuatro pedazos.","Hazlo con las manos, escuchando el sonido. No uses tijeras. El cuerpo necesita sentir el rasgado.","El cuerpo puede creer que si suelta el día, algo queda sin control. El rasgado y la puerta cerrada le muestran otra cosa: lo que termina no desaparece; deja de entrar contigo.","Mientras lo rasgas, di en voz alta:"]}],"newPhrase":"Esto es noche. Esto es descanso. Estoy dentro.","accion":["Entra al espacio de descanso.","Toca la cama o la almohada con ambas manos."],"cierre":["Si durante la noche vuelve el pensamiento del día, mira la puerta cerrada o imagínala cerrada. No vuelvas al bote. No recuperes el papel.","Al día siguiente, si algo requiere acción, aparecerá con más claridad. Lo que solo era activación no necesita ser rescatado.","---"],"observar":["Si el cuerpo sintió diferencia al cerrar la puerta.","Si hubo resistencia a tirar el papel.","Si apareció alivio, tristeza o cansancio después del cierre.","Si dormiste con menos sensación de estar en pendiente.","Si al día siguiente recuerdas el problema con menos carga corporal."]},{"num":"03","title":"03. La Caja de la Noche","subtitle":"Ritual para dejar el celular antes de dormir","para":["Para cuando el teléfono sigue jalando tu atención aunque ya quieras descansar. Revisas mensajes, redes, noticias, pendientes o silencios. A veces no estás buscando nada específico: solo sigues mirando, como si algo pudiera aparecer y cambiar la sensación interna.","El teléfono no es el enemigo. Pero de noche puede convertirse en una puerta siempre abierta. Este ritual no busca prohibirte usarlo. Busca devolverle al cuerpo la experiencia de que puede estar sin vigilancia durante unas horas."],"principio":["El celular activa espera. Cada notificación posible mantiene al sistema nervioso disponible para responder. Aunque no suene, el cuerpo sabe que podría sonar. Esa posibilidad impide que el descanso sea completo.","Poner el teléfono en una caja, cubrirlo y hacer un nudo crea una barrera con fricción. No es destrucción: si hay una emergencia real, puedes abrirla. Pero entre el impulso y la acción aparece un gesto físico que le da tiempo al cuerpo para decidir."],"materiales":["Tu celular.","Una caja pequeña con tapa.","Un pañuelo, tela o mascada.","Cargador, si lo necesitas.","Una mesa fuera de la cama."],"cuando":"Hazlo 20 a 30 minutos antes de dormir. No esperes a estar agotado. El ritual funciona mejor cuando todavía puedes decidir.","steps":[{"title":"Mirar la espera","phrase":"Esto es lo que hago: dejo que una pantalla me mantenga despierto.","body":["Siéntate con el celular en la mano.","No lo desbloquees todavía.","Mira la pantalla apagada. Nota si la mano quiere prenderla. Nota si aparece urgencia, curiosidad, miedo, aburrimiento o vacío.","Di en voz alta:"]},{"title":"Bajar del impulso al cuerpo","phrase":"Estoy aquí. No tengo que estar disponible toda la noche.","body":["Coloca el teléfono boca abajo sobre la mesa.","Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","Con cada exhalacion, siente que no estás respondiendo a nada. Nadie te esta pidiendo nada en este momento."]},{"title":"Recordar que existes sin la pantalla","phrase":"Tengo cuerpo. Tengo noche. Tengo derecho a apagarme.","body":["Ponte de pie.","Da tres pasos lentos lejos del teléfono y tres pasos de vuelta. Siente tus pies.","Mira tus manos vacías.","Di en voz alta:"]},{"title":"Que busco en el teléfono","phrase":"Qué estoy esperando encontrar aquí?","body":["Toma el celular apagado o bloqueado entre las manos.","Pregúntale en voz alta:","Qué estoy esperando encontrar aquí?","Espera sin desbloquearlo."]},{"title":"Guardar y cubrir","phrase":"La noche no me busca. La noche me devuelve.","body":["Pon el celular dentro de la caja.","Si necesitas cargarlo, deja el cable conectado de forma que la caja pueda quedar cerrada o semicerrada.","Cierra la caja.","Cubre la caja con la tela."]}],"newPhrase":"Estoy conmigo. Esto también es suficiente.","accion":["Elige una acción breve que no tenga pantalla:","lavarte la cara\nleer una página en papel\napagar una luz\npreparar ropa para mañana\ntomar agua"],"cierre":["La caja se abre al día siguiente, no durante la noche.","Si despiertas y quieres revisar el teléfono, toca el nudo primero. Antes de abrir, respira una vez y pregunta: Es emergencia o impulso? Si es impulso, vuelve a la cama. Si es emergencia real, abre.","---"],"observar":["Cuanta urgencia aparece al principio.","Si el cuerpo descansa diferente sin pantalla cerca.","Si hay ansiedad, aburrimiento o tristeza cuando el teléfono no esta disponible.","Si despiertas menos durante la noche.","Si al día siguiente sientes más claridad o menos saturacion."]},{"num":"04","title":"04. El Ultimo Pensamiento","subtitle":"Ritual para cerrar una preocupación insistente antes de dormir","para":["Para cuando no tienes toda la mente llena, sino una sola preocupación que insiste. Una frase, una imagen, un pendiente, una posibilidad. Apagas la luz y eso vuelve. Intentas no pensarlo, pero vuelve más fuerte.","Este ritual no pelea con el pensamiento. Lo saca del circuito repetitivo y lo coloca en un objeto cerrado hasta mañana."],"principio":["Una preocupación que se repite antes de dormir suele tener una intención: que no olvides algo, que prevengas algo, que controles algo. Si intentas expulsarla, el cuerpo puede interpretarlo como peligro: si dejo de pensar en esto, algo malo pasará.","El ritual crea un acuerdo corporal: no se niega la preocupación, se guarda. El libro cerrado funciona como contenedor. Lo que queda dentro no desaparece, pero deja de circular."],"materiales":["Una nota adhesiva o papel pequeño.","Una pluma.","Un libro o cuaderno que pueda cerrarse.","Una mesa de noche o superficie fuera de la cama."],"cuando":"Hazlo cuando aparezca una preocupación repetitiva antes de dormir. Si hay muchas, usa primero el ritual 01, La Mesa Vacía. Este ritual es para una sola cosa.","steps":[{"title":"Atrapar el pensamiento","phrase":"Esto es lo que hago: repito esto para sentir control.","body":["Siéntate fuera de la cama.","Toma la nota y escribe la preocupación en una sola frase.","Ejemplos:","Y si mañana sale mal.\nNo debí decir eso.\nTengo miedo de olvidar esto.\nNo se que va a pasar con ___"]},{"title":"Bajar la repetición","phrase":"Mi cuerpo está aquí. Esto es una preocupación, no una orden.","body":["Coloca la nota sobre una mesa.","Pon una mano sobre la nota y otra sobre el pecho.","Respira 4-4-6 durante seis ciclos.","Siente que la mano toca papel, no amenaza. Es una frase. está afuera."]},{"title":"Recordar que puedes volver mañana","phrase":"Puedo volver a esto mañana. esta noche no tengo que vigilar.","body":["Toma el libro cerrado entre las manos.","Siente su peso. Siente las tapas. Abrelo y cierralo una vez, escuchando el sonido.","Di en voz alta:","Puedo volver a esto mañana. esta noche no tengo que vigilar."]},{"title":"Que intenta proteger","phrase":"Qué intentas proteger en mi?","body":["Mira la nota.","Pregúntale en voz alta:","Qué intentas proteger en mi?","Espera 30 segundos."]},{"title":"Cerrar el pensamiento","phrase":"Esto queda cerrado hasta mañana.","body":["Dobla la nota una vez.","Colócala dentro del libro.","Cierra el libro con ambas manos.","Presiona la portada durante unos segundos."]}],"newPhrase":"No vigilo mientras duermo. Mi cuerpo sabe reparar.","accion":["Apaga una luz o baja la intensidad del espacio.","Pon ambas manos en el pecho."],"cierre":["Al día siguiente, abre el libro en un horario despierto, no desde la cama. Lee la nota. Decide si requiere acción real.","Si requiere acción, escribe una acción pequeña. Si no requiere acción, rompe la nota y tírala.","---"],"observar":["Si el pensamiento pierde fuerza después de cerrar el libro.","Si aparece impulso de abrirlo otra vez.","Si el cuerpo puede aceptar mañana como respuesta.","Si al día siguiente la preocupación parece más pequeña o más concreta.","Si el sueno mejora cuando el pensamiento tiene contenedor."]},{"num":"05","title":"05. Los Zapatos del Día","subtitle":"Ritual para empezar el día sin arrastrar ayer","para":["Para cuando despiertas y el cuerpo ya viene cansado. No necesariamente dormiste mal; simplemente sientes que el día empieza encima de ti. Hay inercia, desgano, prisa o una sensación de estar repitiendo ayer.","Este ritual usa los zapatos como objeto de dirección. Antes de salir al mundo, el cuerpo necesita saber que hoy camina este día, no el anterior."],"principio":["Los pies le informan al sistema nervioso donde estás. Cuando empiezas el día desde la cabeza, el cuerpo queda atrás: piensas pendientes, horarios, obligaciones, pero no sientes el suelo. Entonces el día se vuelve algo que te empuja.","Ponerte los zapatos lentamente y dar los primeros pasos con intención crea una señal distinta: no soy arrastrado por el día; entro en el día con mis pies."],"materiales":["Los zapatos que usaras ese día.","Una silla.","Un espacio donde puedas dar al menos tres pasos."],"cuando":"Hazlo por la mañana, antes de salir de casa o antes de empezar tu primera actividad importante. No lo hagas con prisa. Toma entre 7 y 10 minutos.","steps":[{"title":"Reconocer la inercia","phrase":"Esto es lo que hago: empiezo el día arrastrando lo de ayer.","body":["Siéntate frente a tus zapatos sin ponertelos todavía.","Miralos en el suelo. Nota si tu cuerpo quiere hacerlo rápido, como siempre. Nota el cansancio, la prisa o la resistencia.","Di en voz alta:","Esto es lo que hago: empiezo el día arrastrando lo de ayer."]},{"title":"Bajar al cuerpo","phrase":"Estoy aquí. Este es otro día.","body":["Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos:","inhalar 4 segundos\nsostener 4 segundos\nexhalar 6 segundos","Con cada exhalacion, siente el peso de tu cuerpo en la silla."]},{"title":"Sentir los pies antes del camino","phrase":"Tengo pies. Tengo suelo. Puedo empezar desde aquí.","body":["Antes de ponerte los zapatos, coloca ambos pies descalzos o con calcetines sobre el piso.","Presiona los dedos contra el suelo. Luego los talones. Luego toda la planta.","Siente que tus pies están debajo de ti.","Di en voz alta:"]},{"title":"Que estoy arrastrando","phrase":"Qué estoy intentando meter en este día que pertenece a ayer?","body":["Toma un zapato con ambas manos.","Pregúntale en voz alta:","Qué estoy intentando meter en este día que pertenece a ayer?","Espera unos segundos."]},{"title":"Calzar el nuevo día","phrase":"Este pie entra en este día.","body":["Ponte el primer zapato lentamente.","Mientras lo ajustas, di en voz alta:","Este pie entra en este día.","Ponte el segundo zapato."]}],"newPhrase":"Mi primer paso concreto es ___.","accion":["Elige una sola dirección para la primera parte del día. No una lista. Una.","Di en voz alta:"],"cierre":["Durante el día, si sientes que vuelves a arrastrar ayer, mira tus zapatos o siente tus pies dentro de ellos.","Repite en voz baja:","Este es el día que camino."],"observar":["Si el inicio del día se siente menos automático.","Si notas más presencia en los primeros pasos.","Si aparece resistencia a soltar el día anterior.","Si la prisa baja aunque sea un poco.","Si el cuerpo recuerda la frase al caminar."]},{"num":"06","title":"06. La Llave de Salida","subtitle":"Ritual para salir de casa con una dirección clara","para":["Para cuando sales de casa disperso, corriendo o con la sensación de que el día ya te gano. Llevas llaves, bolsa, pendientes, mensajes, responsabilidades. Pero no llevas una dirección interna.","Este ritual usa la llave como objeto de salida consciente. La llave abre y cierra espacios; también puede marcar el paso entre estar en casa y entrar al mundo."],"principio":["Salir de casa es un cambio de estado. El cuerpo cruza un umbral: de lo privado a lo externo, de lo propio a lo social, del descanso a la acción. Cuando ese cruce ocurre con prisa, el sistema nervioso no registra transición. Solo salta.","Sostener la llave, nombrar una intención y escuchar la puerta cerrar crea una secuencia física de orientacion. No necesitas resolver todo el día antes de salir. Necesitas una dirección."],"materiales":["La llave de tu casa o del lugar del que sales.","La puerta de salida.","Tu cuerpo de pie, sin celular en la mano."],"cuando":"Hazlo antes de salir de casa, consultorio, oficina o cualquier espacio importante. Funciona especialmente bien en días con mucho pendiente o ansiedad anticipatoria.","steps":[{"title":"Notar la dispersión","phrase":"Esto es lo que hago: salgo corriendo sin saber desde donde salgo.","body":["Párate frente a la puerta de salida con la llave en la mano.","No abras todavía. No salgas todavía.","Siente si tu cuerpo está acelerado. Nota si estás pensando en varias cosas a la vez.","Di en voz alta:"]},{"title":"Respirar antes del umbral","phrase":"Estoy aquí. todavía no tengo que correr.","body":["Coloca la llave contra el pecho, sosteniéndola con una mano.","Pon la otra mano en el abdomen.","Respira 4-4-6 durante cinco ciclos.","Siente el metal de la llave: temperatura, borde, peso."]},{"title":"Reconocer lo que llevas","phrase":"Llevo recursos. No salgo vacío.","body":["Con la llave en la mano, nombra tres recursos que si llevas contigo.","No cosas ideales. Cosas reales.","Ejemplos:","Llevo mis manos.\nLlevo mi experiencia.\nLlevo mi voz.\nLlevo mi capacidad de pedir ayuda.\nLlevo mi respiración."]},{"title":"Elegir una sola dirección","phrase":"Qué dirección necesita mi cuerpo hoy?","body":["Mira la puerta.","Preguntate en voz alta:","Qué dirección necesita mi cuerpo hoy?","Espera unos segundos."]},{"title":"Cruzar el umbral","phrase":"Salgo con una dirección. Una basta.","body":["Abre la puerta lentamente.","Antes de cruzar, sostén la llave en la mano dominante.","El cuerpo puede creer que necesita salir cargando todas las posibilidades. Cruzar con una sola dirección le muestra otra cosa: una dirección basta para empezar el día.","Mientras das el paso para salir, di en voz alta:"]}],"newPhrase":"La llevo conmigo. Vuelvo cuando sea tiempo de volver.","accion":["Guarda la llave en un lugar concreto: bolsillo, bolsa, llavero.","Mientras la guardas, di en voz alta:"],"cierre":["Durante el día, si te dispersas, toca la llave o el llavero.","Repite:","Una dirección basta."],"observar":["Si sales con menos prisa interna.","Si recuerdas la dirección elegida durante el día.","Si aparece ansiedad por haber elegido solo una cosa.","Si el sonido de la puerta cerrando produce alivio o tensión.","Si tocar la llave te ayuda a volver al cuerpo."]},{"num":"07","title":"07. El Vaso de Mañana","subtitle":"Ritual para activar el cuerpo antes de trabajar","para":["Para cuando empiezas el día seco, apagado o desconectado. Ya estás despierto, pero el cuerpo no termina de llegar. Puedes funcionar, pero sin sentirte realmente presente.","Este ritual no busca darte energía artificial. Busca marcar un primer gesto de nutricion: suficiente para empezar."],"principio":["Muchas personas empiezan el día desde la exigencia: todo lo que falta, todo lo que hay que hacer, todo lo que deberia estar listo. El cuerpo recibe el mensaje de que nunca es suficiente.","Un vaso de agua a la mitad enseña otra cosa: no hace falta estar completo, perfecto o lleno hasta el borde para comenzar. La mitad también sostiene. La mitad puede ser suficiente para dar el primer paso."],"materiales":["Un vaso transparente.","Agua.","Una mesa o superficie limpia."],"cuando":"Hazlo por la mañana, antes del café, antes del celular o antes de iniciar trabajo. Toma entre 5 y 8 minutos.","steps":[{"title":"Notar la exigencia de estar lleno","phrase":"Esto es lo que hago: creo que debo estar completo para empezar.","body":["Coloca el vaso vacío frente a ti.","Miralo unos segundos.","Nota si el cuerpo siente vacío, prisa, sequedad o exigencia.","Di en voz alta:"]},{"title":"Respirar con el vaso vacío","phrase":"Estoy aquí. No necesito llenarme de golpe.","body":["Pon una mano alrededor del vaso vacío y otra en el pecho.","Respira 4-4-6 durante cinco ciclos.","Siente el vidrio, la temperatura y el espacio vacío dentro del vaso.","Di en voz alta:"]},{"title":"Reconocer lo disponible","phrase":"Tengo algo disponible. Eso basta para empezar.","body":["Llena el vaso exactamente a la mitad.","Miralo a la altura de los ojos.","No lo corrijas. No le agregues más. La mitad es la medida.","Di en voz alta:"]},{"title":"Que necesita mi cuerpo primero","phrase":"Qué necesita mi cuerpo antes de entrar al día?","body":["Sostén el vaso con ambas manos.","Pregúntale al cuerpo en voz alta:","Qué necesita mi cuerpo antes de entrar al día?","Espera 30 segundos."]},{"title":"Beber la mitad suficiente","phrase":"La mitad es suficiente para empezar.","body":["De pie, sostén el vaso con ambas manos.","Bebe el agua despacio. No de un golpe. Siente cada trago.","Este es el cambio: no estás lleno hasta el borde, no estás perfecto, no estás completamente listo. Y aún así empiezas.","Mientras terminas de beber, di en voz alta:"]}],"newPhrase":"Empiezo con lo que tengo. Eso es vida.","accion":["Lava el vaso o enjuagalo.","Colócalo boca abajo sobre la mesa o el escurridor."],"cierre":["Durante el día, cuando aparezca la sensación de no estoy listo, recuerda el vaso a la mitad.","Repite:","No necesito estar completo para comenzar."],"observar":["Si el cuerpo empieza el día con menos exigencia.","Si puedes hacer una primera acción sin esperar sentirte perfecto.","Si aparece incomodidad al dejar el vaso solo a la mitad.","Si hay más conciencia de sed, hambre o ritmo.","Si la frase vuelve cuando te sientes insuficiente."]},{"num":"08","title":"08. El Hielo en la Mano","subtitle":"Ritual para cuando la ansiedad sube","para":["Para cuando la ansiedad aparece como una ola: pecho apretado, respiración corta, manos inquietas, pensamientos rapidos, necesidad de controlar algo o salir corriendo de la sensación.","Este ritual no busca pelear con la ansiedad ni convencerte de que no pasa nada. Busca mostrarle al cuerpo una verdad simple: una ola sube, cambia y baja. Tu cuerpo puede quedarse presente mientras eso ocurre."],"principio":["La ansiedad se vuelve más fuerte cuando el cuerpo cree que la sensación no va a terminar. Entonces intenta escapar, controlar, revisar, llamar, comer, comprar, discutir o distraerse.","El hielo le da al sistema nervioso una experiencia física concreta: algo intenso puede estar en la mano y cambiar de forma. El frio aparece, se siente fuerte, luego se derrite. No se queda igual. La ansiedad tampoco."],"materiales":["Un cubo de hielo.","Una tela pequeña, servilleta o pañuelo.","Un plato, vaso o recipiente.","Acceso a lavabo o una planta."],"cuando":"Hazlo cuando la ansiedad este subiendo, pero todavía puedas seguir instrucciones simples. Si estás en panico intenso, primero solo respira, mira alrededor y busca apoyo. Este ritual es para activación leve a moderada.","steps":[{"title":"Reconocer la ola","phrase":"Esto es lo que hago: creo que esta sensación no va a terminar.","body":["Siéntate o ponte de pie en un lugar seguro.","Coloca el cubo de hielo envuelto en la tela frente a ti, sin tocarlo todavía.","Observa tu cuerpo: manos, pecho, garganta, estómago, mandíbula.","Di en voz alta:"]},{"title":"Preparar el cuerpo","phrase":"Mi cuerpo está aquí. Puedo sentir sin salir corriendo.","body":["Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","Si la respiración 4-4-6 se siente difícil, solo alarga un poco la exhalacion.","Di en voz alta:"]},{"title":"Elegir el contacto","phrase":"Tengo suelo. Tengo manos. Puedo elegir cuanto contacto.","body":["Toca la tela que envuelve el hielo con la punta de los dedos.","No lo tomes todavía. Solo siente el frio a distancia.","Presiona los pies contra el suelo.","Di en voz alta:"]},{"title":"Donde vive la ansiedad","phrase":"Donde esta la ola en mi cuerpo?","body":["Toma el hielo envuelto con una mano.","Sostenlo unos segundos.","Pregúntale al cuerpo en voz alta:","Donde esta la ola en mi cuerpo?"]},{"title":"Sostener el cambio","phrase":"Esto sube. Esto baja. Yo sigo aquí.","body":["Sostén el hielo envuelto durante 30 a 60 segundos, segun tolerancia.","Observa tres cosas:","el frio cambia\nla tela se humedece\ntu mano sigue aquí","El cuerpo puede creer que la ansiedad no va a terminar. El hielo le muestra otra cosa: una sensación intensa puede cambiar mientras tu sigues aquí."]}],"newPhrase":"La ola se mueve. No tengo que quedarme atrapado.","accion":["Cuando el hielo se haya derretido un poco, lleva el agua al lavabo o a una planta.","Mientras la viertes, di en voz alta:"],"cierre":["Guarda la tela extendida para que se seque.","La tela humeda es el ancla: algo intenso paso por ella y ahora se esta secando. No quedó igual, pero tampoco quedó destruida.","Si la ansiedad vuelve, toca la tela o recuerda la sensación de la mano después del hielo."],"observar":["Si la ansiedad cambio de intensidad.","Si tu cuerpo pudo quedarse con la sensación sin escapar.","Si apareció temblor, suspiro, bostezo o calor después.","Si el frio fue demasiado o adecuado.","Si la frase esto sube, esto baja aparece luego de manera espontanea."]},{"num":"09","title":"09. La Pared que Sostiene","subtitle":"Ritual de emergencia emocional de cinco minutos","para":["Para momentos en que algo se desborda: ganas de llorar, enojo, miedo, temblor, sensación de caer, confusion o saturacion repentina.","Este ritual no necesita materiales especiales. Usa una pared real para que el cuerpo sienta resistencia, límite y sostén. A veces el sistema nervioso no necesita una explicacion; necesita encontrar algo firme."],"principio":["Cuando una emoción sube rápido, el cuerpo puede sentir que no hay borde. Todo se vuelve demasiado grande. Empujar una pared con las manos activa musculos, orienta el cuerpo en el espacio y devuelve una experiencia concreta: hay algo que me sostiene y algo que me limita.","La pared no se mueve. Y eso ayuda. Frente a una emoción que se mueve demasiado, la pared ofrece estabilidad."],"materiales":["Una pared firme.","Tus manos.","Un espacio donde puedas estar de pie."],"cuando":"Hazlo cuando sientas que una emoción sube y necesitas volver al cuerpo rápido. Puede hacerse en casa, consultorio, bano, pasillo o cualquier lugar donde haya una pared.","steps":[{"title":"Reconocer el desborde","phrase":"Esto es lo que hago: siento que esto me rebasa.","body":["Párate frente a una pared, a la distancia de tus brazos.","Mira la pared.","Nota si el cuerpo quiere llorar, gritar, escapar, congelarse o colapsar.","Di en voz alta, aunque sea bajo:"]},{"title":"Encontrar la exhalacion","phrase":"Estoy aquí. Hay una pared. Hay suelo. Hay cuerpo.","body":["Con las manos en la pared, respira.","No busques respirar perfecto. Solo alarga un poco la salida del aire.","Haz cinco exhalaciones lentas.","Di en voz alta:"]},{"title":"Sentir fuerza disponible","phrase":"Tengo fuerza. No estoy cayendo.","body":["Presiona la pared con ambas manos. No con toda tu fuerza; solo lo suficiente para sentir resistencia.","Siente brazos, hombros, espalda, abdomen, piernas y pies.","La pared no se mueve. Tu cuerpo si responde.","Di en voz alta:"]},{"title":"Que necesita sostén","phrase":"Qué parte de mi necesita sostén ahora?","body":["Mantén las manos en la pared.","Pregúntale al cuerpo:","Qué parte de mi necesita sostén ahora?","Espera unos segundos."]},{"title":"Empujar y soltar","phrase":"Hay algo que me sostiene. No tengo que caer.","body":["Vuelve a presionar la pared, ahora un poco más firme.","El cuerpo puede creer que la emoción te va a tirar o rebasar. La pared le muestra otra cosa: puedes sentir fuerza, resistencia y sostén al mismo tiempo.","Mientras empujas, di en voz alta:","Hay algo que me sostiene. No tengo que caer."]}],"newPhrase":"Ahora me apoyo. Mi cuerpo no esta solo.","accion":["Pon una mano en el pecho y otra en el abdomen.","Apoya la espalda contra la pared."],"cierre":["Antes de irte, toca la pared una vez con la palma abierta.","Di:","Se donde volver."],"observar":["Si la emoción bajo, cambio o se volvió más clara.","Si apareció llanto, suspiro, calor, temblor o cansancio.","Si empujar dio alivio o si fue demasiado.","Si apoyar la espalda produjo sensación de sostén.","Si el cuerpo recuerda la pared cuando vuelve la saturacion."]},{"num":"10","title":"10. La Bolsa del Exceso","subtitle":"Ritual para cuando todo se siente demasiado","para":["Para cuando no es una sola emoción ni un solo problema: es todo. Pendientes, voces, necesidades de otros, decisiones, mensajes, cansancio, culpa, ruido. El cuerpo siente que lleva más de lo que puede ordenar.","Este ritual convierte el exceso en objetos pequeños que pueden salir del cuerpo y entrar en una bolsa. No resuelve todo. Pero separa lo que existe de lo que llevas encima."],"principio":["La saturacion aumenta cuando todo se mezcla. El sistema nervioso no distingue entre una tarea, una emoción, una deuda, una conversación y un miedo; solo registra demasiado.","Escribir cada carga en un papelito y meterla en una bolsa le da forma al exceso. Cerrar la bolsa y ponerla en el suelo cambia la relación corporal: esto existe, pero no va encima de mi."],"materiales":["Una bolsa de papel, tela o plastico.","Papelitos pequeños.","Una pluma.","Una mesa.","Un lugar en el suelo donde dejar la bolsa."],"cuando":"Hazlo cuando sientas saturacion mental o emocional. Es útil al final del día, antes de trabajar, después de atender personas o cuando no sabes por donde empezar.","steps":[{"title":"Sentir el exceso","phrase":"Esto es lo que hago: cargo todo junto en mi cuerpo.","body":["Coloca la bolsa vacía sobre la mesa.","Pon todos los papelitos a un lado.","Mira la bolsa vacía y nota el cuerpo: hombros, pecho, cabeza, manos.","Di en voz alta:"]},{"title":"Respirar antes de meterlo todo","phrase":"Mi cuerpo está aquí. Esto ya está afuera de mi cabeza.","body":["Antes de poner los papelitos en la bolsa, coloca una mano sobre ellos y otra en el pecho.","Respira 4-4-6 durante seis ciclos.","Di en voz alta:","Mi cuerpo está aquí. Esto ya está afuera de mi cabeza."]},{"title":"Tocar lo que si puedes sostener","phrase":"Tengo manos. Tengo borde. Puedo separar.","body":["Toma la bolsa vacía con ambas manos.","Siente su textura, peso y borde.","La bolsa puede contener. Tus manos pueden decidir que entra y que no.","Di en voz alta:"]},{"title":"Que carga pesa más","phrase":"Cuál de estás cargas pesa más hoy?","body":["Mira los papelitos.","Pregúntale al cuerpo:","Cuál de estás cargas pesa más hoy?","Espera. No elijas con la cabeza. Deja que el cuerpo mire, toque o se incline hacia una."]},{"title":"Cerrar el exceso","phrase":"Esto existe, pero no va encima de mi.","body":["Mete ese primer papelito en la bolsa.","Después mete los demas, uno por uno. No los avientes todos juntos. Cada papel entra como una carga separada.","Cuando todos esten dentro, cierra la bolsa: doblala, enrollala, haz un nudo o ponle una cinta.","El cuerpo puede creer que si no cargas todo junto, abandonas algo. La bolsa le muestra otra cosa: las cargas siguen existiendo, pero ya no van encima de ti."]}],"newPhrase":"Una cosa. Una acción. Eso puedo hacer.","accion":["Acercate a la bolsa y saca solo un papelito: el que puedas atender hoy o ahora.","Solo uno."],"cierre":["La bolsa no se abre completa el mismo día, salvo que sea necesario. Si te da miedo olvidarla, pon una hora para revisarla mañana.","El propósito no es abandonar responsabilidades. Es sacar el exceso del cuerpo para recuperar capacidad de acción.","---"],"observar":["Si el cuerpo se siente más liviano al ver la bolsa lejos.","Si aparece culpa por no cargar todo.","Si elegir una sola acción produce alivio o resistencia.","Si alguna carga deja de sentirse urgente al día siguiente.","Si la saturacion baja cuando las cosas están separadas."]},{"num":"11","title":"11. La Línea en el Piso","subtitle":"Ritual para poner un límite","para":["Para cuando necesitas decir que no, pedir espacio, detener una invasion o recordar que tu cuerpo tiene borde. Sirve antes de una conversación difícil o después de sentir que alguien cruzo un límite.","Este ritual usa una línea física en el piso para que el cuerpo experimente algo que a veces la mente no logra sostener: aquí termino yo, ahi empieza lo otro."],"principio":["Un límite no empieza en la frase. Empieza en el cuerpo. Si el cuerpo no siente borde, la boca puede decir no y aún así todo adentro seguir cediendo.","La cinta en el piso convierte el límite en una experiencia visible y tangible. Pararte detras de la línea, levantar la mano y decir una frase breve le da al sistema nervioso una referencia clara: hay un hasta aquí."],"materiales":["Cinta adhesiva de papel o masking tape.","Tijeras, opcional.","Un espacio en el piso donde puedas pararte.","Tu cuaderno o una hoja para pegar un trozo de cinta al final."],"cuando":"Hazlo antes de decir un límite importante, después de una conversación donde cediste demasiado o cuando sientas que necesitas recuperar tu espacio.","steps":[{"title":"Reconocer la invasion","phrase":"Esto es lo que hago: dejo que crucen mi espacio.","body":["Corta un tramo de cinta y tenlo en la mano.","Antes de pegarlo, siente tu cuerpo. Nota si se encoge, se justifica, se acelera o se endurece.","Di en voz alta:","Esto es lo que hago: dejo que crucen mi espacio."]},{"title":"Respirar detras de la línea","phrase":"Estoy aquí. Puedo sentir mi borde.","body":["Párate detras de la línea.","Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","Mira la línea mientras respiras."]},{"title":"Sentir el espacio propio","phrase":"Tengo cuerpo. Tengo espacio. Tengo derecho a ocuparlo.","body":["Presiona los pies contra el suelo.","Abre un poco los brazos, sin exagerar. Siente el espacio a los lados de tu cuerpo.","Levanta la mirada.","Di en voz alta:"]},{"title":"Que límite hace falta","phrase":"Qué necesita detenerse aquí?","body":["Mira la línea.","Pregúntale a tu cuerpo:","Qué necesita detenerse aquí?","Espera unos segundos."]},{"title":"Levantar la mano","phrase":"Hasta aquí. Este espacio es mío.","body":["Párate firme detras de la línea.","Levanta una mano con la palma abierta hacia el frente.","El cuerpo puede creer que si marcas un límite, pierdes vínculo o provocas dano. La línea le muestra otra cosa: puedes tener borde y seguir presente.","Mientras levantas la mano, di en voz alta:"]}],"newPhrase":"Mi límite queda registrado. No necesito explicarlo todo.","accion":["Retira la cinta del piso lentamente.","Corta o separa un trozo pequeño y pegalo en tu cuaderno o en una hoja."],"cierre":["Si vas a tener una conversación real, escribe una sola frase de límite. No un discurso.","Ejemplos:","No puedo hacerlo hoy.\nNo voy a hablar si me gritas.\nNecesito pensarlo antes de responder.\nEsto no me corresponde."],"observar":["Si el cuerpo pudo sentir la línea.","Si apareció culpa al decir hasta aquí.","Si tu voz cambio al repetir la frase.","Si el trozo de cinta en el cuaderno te ayuda a recordar el límite.","Si después del ritual puedes decir menos y sostener más."]},{"num":"12","title":"12. La Frase que No Se Trago","subtitle":"Ritual para preparar una conversación difícil","para":["Para cuando hay algo que necesitas decir, pero el cuerpo se cierra: la garganta se aprieta, el pecho se encoge, aparecen explicaciones largas o miedo a incomodar.","Este ritual no garantiza que la otra persona responda bien. Lo que hace es preparar tu cuerpo para que la frase esencial no se quede tragada."],"principio":["Muchas conversaciones dificiles fallan antes de empezar porque el cuerpo llega sin voz. La mente prepara argumentos, pero la garganta sigue creyendo que hablar es peligroso.","Escribir una sola frase, leerla en voz alta y beber agua después convierte la expresion en una experiencia física: la voz sale, la garganta vibra, el agua pasa. El cuerpo aprende que decir algo necesario no lo destruye."],"materiales":["Un vaso con agua.","Una hoja pequeña o tarjeta.","Una pluma.","Un espacio privado."],"cuando":"Hazlo antes de una conversación importante, antes de enviar un mensaje difícil o después de notar que estás evitando decir algo.","steps":[{"title":"Reconocer el silencio","phrase":"Esto es lo que hago: trago lo que necesito decir.","body":["Siéntate con la hoja frente a ti y el vaso de agua a un lado.","Pon una mano suave en la garganta.","Di en voz alta:","Esto es lo que hago: trago lo que necesito decir."]},{"title":"Abrir espacio para la voz","phrase":"Mi garganta está aquí. Mi voz tiene espacio.","body":["Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","En cada exhalacion, deja que la mandíbula se afloje un poco.","Di en voz alta:"]},{"title":"Sentir que puedes hablar","phrase":"Tengo voz. Tengo agua. Puedo decir lo necesario.","body":["Toma el vaso con ambas manos.","No bebas todavía.","Siente su peso, su temperatura, el agua moviendose adentro.","Di en voz alta:"]},{"title":"Encontrar la frase esencial","phrase":"Qué necesita decir mi garganta sin adornarlo?","body":["En la hoja, escribe la frase que necesitas decir en una sola línea.","No escribas justificaciones. No escribas defensa. No escribas toda la historia.","Ejemplos:","No puedo hacerme cargo de esto.\nMe dolio lo que dijiste.\nNecesito que me hables con respeto.\nNo quiero continuar esta conversación así.\nNecesito tiempo para responder."]},{"title":"Decir y tragar agua","phrase":"Mi voz sale. Mi cuerpo sigue aquí.","body":["Ponte de pie.","Sostén la tarjeta frente al pecho.","Lee la frase en voz alta tres veces:","1. La primera, como salga.\n2. La segunda, más lento.\n3. La tercera, mirando al frente."]}],"newPhrase":"Llevo mi frase. No llevo un discurso.","accion":["Dobla la tarjeta y guardala en un bolsillo, bolsa o cuaderno.","Di en voz alta:"],"cierre":["Después de la conversación, vuelve a beber agua. Aunque haya salido imperfecta, reconoce que la frase no se quedó completamente adentro.","Di:","Dije algo. Eso ya movio algo."],"observar":["Si la garganta se siente distinta.","Si la frase se simplifico.","Si aparece miedo a la reacción del otro.","Si pudiste decir menos y ser más claro.","Si después de hablar aparece cansancio, alivio o temblor."]},{"num":"13","title":"13. Lo Que Alguien Dijo","subtitle":"Ritual para soltar una frase que se quedó dando vueltas","para":["Para cuando alguien dijo algo y la frase se quedó viviendo en tu cuerpo. Una critica, un comentario, una burla, un mensaje frio, una insinuacion, una palabra que se repite aunque la conversación ya termino.","Este ritual separa la frase ajena de tu sistema. No discute si la persona tuvo razon. Trabaja con otra pregunta: esa frase sigue teniendo derecho a ocupar tu cuerpo?"],"principio":["Las palabras no son solo ideas. Cuando una frase llega con carga emocional, el cuerpo puede guardarla como si fuera un objeto: en la garganta, el pecho, el estómago, la espalda.","Escribir la frase, enrollarla con hilo y cortar el hilo crea una salida física. El corte no borra lo ocurrido, pero interrumpe el lazo que mantiene la frase girando adentro."],"materiales":["Una hoja pequeña.","Una pluma.","Hilo, estambre o cuerda delgada.","Tijeras.","Bote de basura."],"cuando":"Hazlo cuando una frase ajena siga repitiendose en tu mente o generando reacción corporal después de la conversación.","steps":[{"title":"Escuchar la repetición","phrase":"Esto es lo que hago: repito una frase que no elegi cargar.","body":["Siéntate con la hoja frente a ti.","Escribe exactamente la frase que se quedó. Si no recuerdas las palabras exactas, escribe como la sintió tu cuerpo.","Mira la frase.","Di en voz alta:"]},{"title":"Volver a tu voz","phrase":"Estoy aquí. esta frase está afuera de mi.","body":["Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","Con cada exhalacion, nota que la frase está en el papel, no dentro de tu boca.","Di en voz alta:"]},{"title":"Recordar tu propio centro","phrase":"Tengo manos. Puedo tomar y puedo soltar.","body":["Toma el hilo con ambas manos.","Estiralo suavemente entre tus dedos. Siente tensión y longitud.","Di en voz alta:","Tengo manos. Puedo tomar y puedo soltar."]},{"title":"Que parte se engancho","phrase":"Qué parte de mi se engancho con esto?","body":["Mira la frase escrita.","Pregúntale al cuerpo:","Qué parte de mi se engancho con esto?","Espera."]},{"title":"Enrollar y cortar","phrase":"Así se enredo. Así lo veo.","body":["Enrolla la hoja hasta formar un tubo pequeño, con la frase hacia adentro.","Ata el hilo alrededor del papel. Da varias vueltas, como si estuvieras mostrando como la frase se enredo.","Mientras enrollas, di en voz alta:","Así se enredo. Así lo veo."]}],"newPhrase":"Mis manos quedan libres. Mi voz vuelve a mi.","accion":["Tira los pedazos al bote de basura.","Lava o sacude tus manos."],"cierre":["Si la frase vuelve, no discutas con ella. Mira tus manos y recuerda el corte.","Di:","Eso ya fue cortado."],"observar":["Si la frase pierde volumen interno.","Si aparece otra emoción debajo: tristeza, enojo, vergüenza o alivio.","Si tu cuerpo ubica mejor donde se engancho.","Si necesitas poner un límite real con la persona.","Si surge una frase propia más clara."]},{"num":"14","title":"14. La Silla de la Espera","subtitle":"Ritual para cerrar la espera de un mensaje, llamada o respuesta","para":["Para cuando tu cuerpo se queda pendiente de alguien: un mensaje que no llega, una llamada, una respuesta, una confirmacion, una disculpa, una señal.","No se trata solo del teléfono. Se trata de la posicion interna: sentarte a esperar que algo de afuera te diga si estás bien, si importas, si puedes descansar."],"principio":["La espera intermitente mantiene al sistema nervioso activado. No hay cierre, pero tampoco ausencia total. Cada posibilidad de respuesta conserva abierta la expectativa.","Sentarte frente al teléfono muestra la escena tal como es: una parte de ti esta esperando. Poner el teléfono en una caja y levantarte no destruye el vínculo ni decide por ti. Pero interrumpe el gesto corporal de quedarte ahi."],"materiales":["Una silla.","Tu celular.","Una caja pequeña con tapa.","Una tela o pañuelo, opcional.","Una ventana, puerta o espacio hacia donde puedas caminar después."],"cuando":"Hazlo cuando notes que revisas el teléfono repetidamente o que tu estado emocional depende de si alguien responde.","steps":[{"title":"Sentarte a esperar conscientemente","phrase":"Esto es lo que hago: me siento a esperar una respuesta.","body":["Coloca la silla frente a una mesa o frente a la caja.","Siéntate con el celular en las manos.","No revises nada durante un minuto. Solo mira la pantalla apagada.","Siente la espera en el cuerpo."]},{"title":"Poner el teléfono boca abajo","phrase":"Mi cuerpo está aquí. No estoy dentro del teléfono.","body":["Coloca el teléfono boca abajo sobre la mesa.","Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","Di en voz alta:"]},{"title":"Sentir que puedes levantarte","phrase":"Tengo piernas. Puedo moverme aunque no llegue respuesta.","body":["Pon ambos pies firmes en el suelo.","Antes de levantarte, siente las piernas.","Empuja suavemente el piso con los pies, como preparando el movimiento.","Di en voz alta:"]},{"title":"Que estoy esperando realmente","phrase":"Qué estoy esperando que esta respuesta me de?","body":["Toma el teléfono, todavía bloqueado.","Pregúntale al cuerpo:","Qué estoy esperando que esta respuesta me de?","Espera."]},{"title":"Guardar el teléfono y levantarte","phrase":"No me quedó sentada esperando mi valor.","body":["Pon el teléfono dentro de la caja.","Cierra la caja. Si tienes una tela, cubrela.","El cuerpo puede creer que si deja de esperar, pierde valor o pierde la posibilidad. La caja y la silla vacía le muestran otra cosa: puedes levantarte antes de recibir respuesta.","Mientras cierras, di en voz alta:"]}],"newPhrase":"Mi vida sigue aquí, antes de cualquier respuesta.","accion":["Camina hacia una ventana, puerta o espacio abierto.","Mira algo que no sea el teléfono: luz, calle, pared, planta, cielo, mesa."],"cierre":["Puedes abrir la caja después de un tiempo concreto: 20 minutos, una hora o al día siguiente, segun el caso. Decide el tiempo antes de cerrar la caja.","Si al abrir no hay respuesta, no vuelvas a la silla. Repite:","No regreso a esperar sentado."],"observar":["Si el impulso de revisar baja o sube.","Si el cuerpo siente vacío al levantarse.","Si aparece enojo, tristeza o vergüenza.","Si la silla vacía produce claridad.","Si puedes hacer una acción propia antes de revisar de nuevo."]},{"num":"15","title":"15. La Taza que Vuelve a Mi","subtitle":"Ritual para recuperar energía después de atender, cuidar o trabajar","para":["Para cuando terminas de atender, cuidar, ensenar, escuchar o resolver para otros y sientes que algo de ti se quedó afuera. No necesariamente estás triste; estás drenado. Como si hubieras dado presencia, voz, energía o calma y no hubieras vuelto completamente a ti.","Este ritual usa una taza caliente o tibia como objeto de retorno. La taza se sostiene con ambas manos para que el cuerpo reciba algo, no solo siga dando."],"principio":["Quien cuida, atiende o acompana puede acostumbrarse a salir de si mismo para leer al otro: su tono, su dolor, su necesidad, su urgencia. Eso es útil, pero si no hay regreso, el cuerpo queda abierto y cansado.","Sostener una taza con ambas manos, nombrar lo que se entrego y beber despacio crea una acción inversa: algo vuelve hacia adentro. El cuerpo deja de operar en modo entrega y entra en modo recepcion."],"materiales":["Una taza.","Agua tibia, te, infusion o bebida caliente segura.","Una silla.","Un lugar tranquilo durante 7 a 10 minutos."],"cuando":"Hazlo después de consulta, clase, reunion intensa, cuidado de familiares, trabajo emocional o cualquier situación donde hayas dado mucho de ti.","steps":[{"title":"Reconocer la salida","phrase":"Esto es lo que hago: doy y no siempre regreso a mi.","body":["Siéntate con la taza vacía frente a ti.","Mira la taza y siente tu cuerpo: manos, pecho, espalda, ojos, garganta.","Di en voz alta:","Esto es lo que hago: doy y no siempre regreso a mi."]},{"title":"Volver a tu respiración","phrase":"Estoy aquí. Mi cuerpo también necesita recibir.","body":["Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","No pienses en la persona, tarea o situación que acabas de atender. Cada exhalacion vuelve a tu cuerpo.","Di en voz alta:"]},{"title":"Llenar la taza","phrase":"Tengo manos para sostenerme. Tengo algo que vuelve.","body":["Llena la taza con agua tibia, te o infusion.","Sostén la taza con ambas manos.","Siente el calor, el peso, la textura, el vapor si lo hay.","Di en voz alta:"]},{"title":"Que se quedó afuera","phrase":"Qué parte de mi se quedó alla?","body":["Con la taza entre las manos, pregunta en voz alta:","Qué parte de mi se quedó alla?","Espera.","Puede aparecer una palabra: calma, voz, atención, paciencia, alegria, fuerza, claridad, ternura."]},{"title":"Beber el retorno","phrase":"Vuelvo a mi. Lo que doy no me vacía.","body":["Acerca la taza a la boca.","Bebe tres sorbos lentos.","Con cada sorbo, imagina que no estás tragando prisa ni obligacion; estás recibiendo de vuelta presencia.","El cuerpo puede creer que dar significa vaciarse. La taza le muestra otra cosa: después de dar, también puedes recibir."]}],"newPhrase":"Lo que es mío vuelve a su lugar.","accion":["Termina la bebida o dejala hasta donde el cuerpo quiera.","Lava la taza lentamente."],"cierre":["Esta taza puede convertirse en tu taza de regreso. No tiene que ser especial, pero si la usas repetidamente, el cuerpo la reconocera como señal de retorno.","No uses este ritual mientras sigues trabajando. Hazlo como frontera entre dar y volver.","---"],"observar":["Si el cansancio cambia de calidad.","Si aparece emoción al nombrar lo que se quedó afuera.","Si cuesta recibir sin hacer otra cosa al mismo tiempo.","Si lavar la taza produce sensación de cierre.","Si el cuerpo identifica mejor cuando ya dio suficiente."]},{"num":"16","title":"16. El Cierre de Jornada","subtitle":"Ritual para separar trabajo de casa","para":["Para cuando el trabajo termina, pero sigue caminando contigo: pendientes en la cabeza, conversaciones internas, mensajes por contestar, preocupaciones por mañana, sensación de que nunca se acaba.","Este ritual crea un cierre físico de jornada. No pretende que todo quede resuelto. Pretende que el cuerpo sepa donde termina el trabajo por hoy."],"principio":["El trabajo se vuelve invasivo cuando no tiene borde. Si todo queda abierto, el sistema nervioso sigue procesando en segundo plano, aún durante la comida, el descanso o la convivencia.","Escribir tres pendientes reales, cerrar el cuaderno y atarlo con una liga o cinta le da al cuerpo una señal concreta: esto queda contenido. Mañana puede abrirse. Hoy no tiene que vivir en mi pecho."],"materiales":["Un cuaderno o libreta.","Una pluma.","Una liga, cinta o cordon.","Una mesa de trabajo."],"cuando":"Hazlo al terminar tu jornada laboral, después de consulta, al cerrar la computadora o antes de salir del espacio de trabajo.","steps":[{"title":"Reconocer que el trabajo sigue abierto","phrase":"Esto es lo que hago: dejo el trabajo abierto dentro de mi.","body":["Siéntate frente al cuaderno abierto.","Antes de escribir, siente tu cuerpo. Nota si sigues en modo responder, resolver o anticipar.","Di en voz alta:","Esto es lo que hago: dejo el trabajo abierto dentro de mi."]},{"title":"Bajar el ritmo","phrase":"Estoy aquí. Puedo cerrar sin terminarlo todo.","body":["Pon la pluma sobre la mesa.","Coloca una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","Di en voz alta:"]},{"title":"Distinguir pendiente de amenaza","phrase":"Son pendientes. No son mi cuerpo.","body":["Toma la pluma.","Escribe tres pendientes reales para mañana o para la siguiente jornada. Solo tres.","No escribas todo. El ritual necesita borde.","Después mira la lista y di en voz alta:"]},{"title":"Que queda más cargado","phrase":"Cuál de estos quiere seguir viviendo en mi después de cerrar?","body":["Mira los tres pendientes.","Pregúntale al cuerpo:","Cuál de estos quiere seguir viviendo en mi después de cerrar?","Espera."]},{"title":"Cerrar y atar","phrase":"El trabajo queda aquí. Mi cuerpo vuelve a casa.","body":["Cierra el cuaderno con ambas manos.","Escucha el sonido de las hojas cerrandose.","Pasa la liga, cinta o cordon alrededor del cuaderno.","El cuerpo puede creer que si cierras sin terminar todo, el trabajo se cae o desaparece. El cuaderno cerrado muestra otra cosa: el trabajo queda contenido y puede esperar."]}],"newPhrase":"Salgo del trabajo. Entro en mi vida.","accion":["Haz una acción física de salida:","apagar la computadora\napagar la luz\ncerrar la puerta\nlavar tus manos\ncambiarte de zapatos\nguardar la pluma"],"cierre":["El cuaderno se abre hasta la siguiente jornada. Si aparece otro pendiente, anótalo en una hoja externa y dejala encima, sin abrir el cuaderno.","La regla es simple: no se rompe el cierre por ansiedad.","---"],"observar":["Si el cuerpo siente diferencia al ver el cuaderno atado.","Si aparece impulso de abrirlo.","Si descansas mejor al tener solo tres pendientes.","Si el trabajo invade menos la casa.","Si el pendiente marcado pierde o gana claridad al día siguiente."]},{"num":"17","title":"17. El Billete que No Me Achica","subtitle":"Ritual para cobrar, pagar o mirar dinero sin encogerte","para":["Para cuando el dinero activa contraccion: cobrar te da pena, poner precio te incomoda, pagar te genera culpa, mirar cuentas te achica o hablar de valor te pone en defensa.","Este ritual no promete abundancia ni cambia tus finanzas por magia. Trabaja con algo más básico: que tu cuerpo pueda mirar el dinero sin hacerse pequeño."],"principio":["El dinero no es solo número. Para muchas personas esta cargado de historia: deuda, vergüenza, comparación, miedo, sacrificio, culpa, permiso, valor propio. Por eso el cuerpo reacciona antes de que la mente piense.","Sostener un billete o moneda de pie, nombrar algo que tiene valor y guardarlo en un sobre marcado crea una experiencia concreta: puedo mirar valor sin esconderme."],"materiales":["Un billete o moneda de cualquier denominación.","Un sobre.","Una pluma o marcador.","Una mesa."],"cuando":"Hazlo antes de cobrar, poner precio, enviar una cotización, pagar algo importante, revisar cuentas o trabajar una sensación de vergüenza con el dinero.","steps":[{"title":"Reconocer el encogimiento","phrase":"Esto es lo que hago: miro el dinero y me hago pequeño.","body":["Coloca el billete o moneda sobre la mesa.","Míralo sin tocarlo durante 30 segundos.","Nota que hace tu cuerpo: se encoge, se tensa, se distrae, juzga, calcula, evita.","Di en voz alta:"]},{"title":"Respirar frente al dinero","phrase":"Estoy aquí. Esto es dinero, no una sentencia.","body":["Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","Deja el billete o moneda visible. No lo tapes.","Di en voz alta:"]},{"title":"Sostener valor","phrase":"Tengo trabajo. Tengo historia. Tengo algo que ofrecer.","body":["Toma el billete o moneda con ambas manos.","Siente textura, temperatura, borde, peso.","Ponte de pie.","Di en voz alta:"]},{"title":"Que historia aparece","phrase":"Qué historia aparece cuando miro valor?","body":["Sostén el billete o moneda frente al pecho.","Pregúntale al cuerpo:","Qué historia aparece cuando miro valor?","Espera."]},{"title":"Guardar valor sin esconderte","phrase":"Puedo mirar el dinero sin hacerme pequeño.","body":["Toma el sobre.","Escribe en el frente una sola palabra: VALOR.","Mira el billete o moneda una vez más.","Nombra en voz alta algo concreto que tiene valor en ti o en tu trabajo."]}],"newPhrase":"El valor tiene lugar. Yo también.","accion":["Coloca el sobre en tu escritorio, cartera, cajon de trabajo o lugar donde hagas cuentas.","Di en voz alta:"],"cierre":["El sobre VALOR se queda durante 7 días en un lugar visible o accesible. No es amuleto; es recordatorio corporal.","Cuando vuelvas a hablar de dinero, toca el sobre primero si lo necesitas.","---"],"observar":["Si el cuerpo se encogio menos al mirar dinero.","Si apareció culpa, vergüenza o enojo.","Si nombrar valor propio fue difícil.","Si la acción concreta fue más fácil después del ritual.","Si aparece una historia familiar o antigua sobre cobrar, pagar o merecer."]},{"num":"18","title":"18. La Piedra que No Era Mia","subtitle":"Ritual para soltar culpa o carga ajena","para":["Para cuando cargas algo que no sabes si te corresponde: la tristeza de alguien, la culpa de no hacer suficiente, la responsabilidad por el enojo de otro, el peso de sostener a una persona, una familia o una historia.","Este ritual no busca volverte indiferente. Busca distinguir entre cuidar y cargar. Puedes amar, acompañar o responder sin llevar en el cuerpo lo que no es tuyo."],"principio":["La culpa se vuelve confusa porque pesa parecido a la responsabilidad. El cuerpo no siempre distingue entre esto me toca y esto lo cargo para que otro no lo sienta. Por eso hace falta un objeto con peso real.","La piedra permite sentir la carga en la mano. La etiqueta le da nombre. Quitar la etiqueta y lavar la piedra crea una separación física: la carga fue reconocida, pero no queda pegada igual."],"materiales":["Una piedra que quepa en la mano.","Una etiqueta adhesiva o papel pequeño.","Cinta adhesiva, si usas papel.","Pluma o marcador.","Agua.","Una toalla o servilleta."],"cuando":"Hazlo cuando sientas culpa, peso emocional o responsabilidad excesiva por otra persona. No lo uses para evadir una responsabilidad concreta; usalo para separar carga ajena de acción propia.","steps":[{"title":"Sentir el peso","phrase":"Esto es lo que hago: cargo algo sin saber si es mío.","body":["Sostén la piedra en una mano.","No la cambies de mano todavía. Siente su peso, temperatura y textura.","Di en voz alta:","Esto es lo que hago: cargo algo sin saber si es mío."]},{"title":"Respirar con la carga visible","phrase":"Mi cuerpo está aquí. Puedo mirar esta carga.","body":["Pon la mano que sostiene la piedra sobre tu regazo o frente a ti.","Coloca la otra mano en el pecho.","Respira 4-4-6 durante seis ciclos.","Di en voz alta:"]},{"title":"Reconocer capacidad sin exceso","phrase":"Tengo manos. Puedo sostener, pero también puedo soltar.","body":["Cambia la piedra de mano.","Siente la diferencia. Nota que puedes moverla, pasarla, dejarla en otra parte. no estás pegado a ella.","Di en voz alta:","Tengo manos. Puedo sostener, pero también puedo soltar."]},{"title":"Nombrar la carga","phrase":"Qué parte de esto realmente me pertenece?","body":["Escribe en la etiqueta una palabra o frase corta que nombre lo que cargas.","Ejemplos:","culpa por mamá\nenojo de otros\nsalvar a todos\nhacerme responsable\nno fallar\ncuidar para que me quieran","Pega la etiqueta en la piedra."]},{"title":"Despegar y lavar","phrase":"Reconozco esta carga. No toda me pertenece.","body":["Sostén la piedra con la etiqueta.","Lee la etiqueta en voz alta.","Después despega la etiqueta lentamente. Siente la resistencia del papel al separarse.","El cuerpo puede creer que si suelta la culpa, abandona a alguien. La etiqueta que se despega le muestra otra cosa: puedes reconocer una carga sin dejarla pegada a ti."]}],"newPhrase":"Puedo cuidar sin cargarlo todo.","accion":["Seca la piedra.","Colócala fuera del cuarto o fuera de tu espacio de descanso: en una ventana, patio, maceta, entrada o mesa exterior."],"cierre":["La piedra no vuelve a tu cama ni a tu bolsa. Si quieres conservarla, que sea fuera del espacio íntimo. La carga fue reconocida, lavada y reubicada.","Si la culpa vuelve, no repitas todo de inmediato. Primero mira la piedra y pregunta: Qué acción concreta me toca, si es que me toca alguna?","Este ritual no sirve para evadir responsabilidades reales. Sirve para que la responsabilidad no se convierta en castigo corporal."],"observar":["Si la culpa baja o cambia de forma.","Si aparece miedo a ser egoista.","Si puedes distinguir acción propia de peso ajeno.","Si el cuerpo se siente más liviano o más triste.","Si surge una conversación o límite necesario."]},{"num":"19","title":"19. Devuelto al Remitente","subtitle":"Ritual para devolver una expectativa familiar o ajena","para":["Para cuando cargas un mandato pequeño pero persistente: no falles, no incomodes, se fuerte, callate, se buena persona, no superes a nadie, no cobres tanto, no descanses, no digas que no.","No siempre viene como orden directa. A veces llega como mirada, costumbre, frase familiar o expectativa silenciosa. Este ritual no rompe el vínculo con nadie. Devuelve una expectativa que no quieres seguir cargando igual."],"principio":["Muchas expectativas llegan antes de que podamos elegir. El cuerpo las toma como instrucciones de pertenencia: si hago esto, sigo siendo aceptado; si no lo hago, algo se rompe.","Escribir el mandato, romperlo y meterlo en un sobre marcado Devuelto al remitente crea un acto de diferenciación. No destruye a la persona ni a la familia. Devuelve una carga simbólica al lugar de donde vino."],"materiales":["Una hoja.","Un sobre.","Pluma o marcador.","Una mesa.","Un lugar donde guardar el sobre durante 7 días."],"cuando":"Hazlo cuando identifiques una expectativa que sigues obedeciendo automáticamente, aunque ya no te haga bien.","steps":[{"title":"Reconocer el mandato","phrase":"Esto es lo que hago: obedezco una expectativa que no elegi.","body":["Siéntate frente a la hoja.","Escribe una frase que empiece con:","Tengo que...","Ejemplos:"]},{"title":"Respirar antes de devolver","phrase":"Estoy aquí. Puedo mirar esto sin obedecerlo todavía.","body":["Pon una mano sobre la hoja y otra en el pecho.","Respira 4-4-6 durante seis ciclos.","Siente que la frase está en papel. Ya no esta solamente dentro de ti.","Di en voz alta:"]},{"title":"Reconocer que hay eleccion","phrase":"Tengo opcion. Puedo recibir, revisar y devolver.","body":["Toma el sobre vacío.","Abrelo y cierralo una vez. Siente que tiene entrada y salida.","Di en voz alta:","Tengo opcion. Puedo recibir, revisar y devolver."]},{"title":"De donde viene","phrase":"De donde aprendi que tenia que vivir así?","body":["Mira la frase escrita.","Pregunta en voz alta:","De donde aprendi que tenia que vivir así?","Espera."]},{"title":"Romper y devolver","phrase":"Esto llego a mi. Hoy no lo cargo igual.","body":["Lee la frase una ultima vez.","Rompe la hoja en pedazos, con las manos.","El cuerpo puede creer que si devuelves una expectativa, traicionas tu pertenencia. Romper la frase le muestra otra cosa: puedes pertenecer sin obedecer todo igual.","Mientras la rompes, di:"]}],"newPhrase":"Elijo una forma nueva. No necesito cargar la antigua igual.","accion":["En otra parte del sobre, escribe una frase nueva y breve.","Ejemplos:"],"cierre":["Después de 7 días, decide:","si el mandato perdio fuerza, tira el sobre\nsi aún pesa, repite el ritual con una frase más específica\nsi requiere una conversación real, escribe una acción concreta","Cuando tires el sobre, hazlo fuera de tu cuarto o espacio íntimo. Si decides conservarlo, archivarlo también debe ser una acción consciente: ya no va escondido en el cuerpo, va en un lugar elegido."],"observar":["Si aparece culpa o miedo de traicionar.","Si notas que el mandato opera en situaciones pequeñas.","Si la frase nueva se siente posible o lejana.","Si el cuerpo se relaja o se activa después de cerrar el sobre.","Si aparece claridad sobre una acción pendiente."]},{"num":"20","title":"20. El Plato de Lo Mío y Lo Tuyo","subtitle":"Ritual para distinguir responsabilidad de sacrificio","para":["Para cuando confundes amar con cargar todo. Te haces responsable de emociones, decisiones, consecuencias o necesidades que no son completamente tuyas. Terminas agotado, resentido o culpable, pero sigues diciendo si no lo hago yo, nadie lo hace.","Este ritual separa visual y físicamente lo que te toca de lo que no te toca. No elimina el cuidado. Le devuelve borde."],"principio":["El sacrificio se instala cuando todo cae en el mismo plato. Lo mío, lo tuyo, lo urgente, lo emocional, lo histórico, lo que puedo hacer y lo que no puedo controlar. Si todo esta junto, el cuerpo intenta cargarlo todo.","Dos platos o dos hojas crean una separación concreta. Mover papelitos de un lado a otro ayuda al cuerpo a entender que amar no significa absorber todas las responsabilidades."],"materiales":["Dos platos, o dos hojas si no quieres usar platos.","Papelitos pequeños.","Pluma.","Una mesa."],"cuando":"Hazlo cuando estes cargando una relación, familia, trabajo o situación donde no distingues que es tuyo y que pertenece a otra persona.","steps":[{"title":"Poner todo junto","phrase":"Esto es lo que hago: pongo todo junto y lo cargo todo.","body":["Coloca un solo plato u hoja frente a ti.","Durante tres minutos, escribe en papelitos todo lo que estás cargando.","Ejemplos:","su enojo\nmi decisión\nque no se sienta mal\npagar a tiempo\nque me quiera\ndecir la verdad\nsu reacción\nmi descanso"]},{"title":"Respirar frente al monton","phrase":"Mi cuerpo está aquí. Puedo separar antes de cargar.","body":["Mira el plato lleno.","Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","Di en voz alta:"]},{"title":"Preparar dos espacios","phrase":"Tengo dos espacios. No todo pertenece al mismo lugar.","body":["Coloca dos platos u hojas frente a ti.","Escribe en uno: MÍO.","Escribe en el otro: TUYO.","Si no se trata de una persona, puedes escribir: MÍO y NO MÍO."]},{"title":"Separar con honestidad","phrase":"Esto me toca a mi, o lo estoy cargando por otro?","body":["Toma cada papelito del monton y pregúntale al cuerpo:","Esto me toca a mi, o lo estoy cargando por otro?","Colócalo en MÍO o en TUYO/NO MÍO.","No busques hacerlo perfecto. Hazlo honesto."]},{"title":"Retirar lo que no corresponde","phrase":"Puedo amar sin cargar lo que no me toca.","body":["Toma el plato u hoja TUYO/NO MÍO.","Aléjalo físicamente de tu cuerpo: al otro extremo de la mesa, a una silla o al suelo.","El cuerpo puede creer que si separas lo que no es tuyo, abandonas a alguien. Este movimiento le muestra otra cosa: separar no es abandonar; es recuperar claridad para cuidar sin sacrificarte.","Mientras lo alejas, di:"]}],"newPhrase":"Esto si me toca. Esto puedo atender.","accion":["Del plato MÍO, elige un solo papelito.","Solo uno."],"cierre":["Conserva el papel MÍO que elegiste.","Cierra o dobla la hoja/plato TUYO/NO MÍO y dejalo aparte. Si son papelitos que no requieren acción, tíralos. Si requieren conversación, guárdalos en un sobre marcado para hablar, no para cargar.","Di:"],"observar":["Si aparece culpa al alejar lo que no es tuyo.","Si el plato MÍO se siente más manejable.","Si descubres que estabas cargando reacciones ajenas.","Si aparece una acción concreta más clara.","Si necesitas repetir el ritual con una relación específica."]},{"num":"21","title":"21. La Mano que Vuelve","subtitle":"Ritual de cierre e integración del cuaderno","para":["Para cerrar un ciclo de uso del cuaderno. Puede hacerse después de completar varios rituales, al terminar los 21, o cuando sientas que algo importante volvió a tu cuerpo: voz, descanso, límite, dirección, energía, calma o presencia.","Este ritual no abre un tema nuevo. Integra lo movido. La mano se vuelve mapa de lo que regreso."],"principio":["Después de mover patrones, el cuerpo necesita registrar que algo cambio. Si solo pasas al siguiente ritual, puedes acumular experiencias sin integrarlas. Cerrar es tan importante como abrir.","Trazar tu mano en una hoja crea una imagen física de presencia: esta es mi mano, este es mi cuerpo, esto volvió a mi. Colocar encima un objeto usado en algún ritual une memoria, acción y cuerpo."],"materiales":["Una hoja.","Pluma o marcador.","Un objeto usado en algún ritual anterior: piedra, sobre, taza, trozo de cinta, llave, tela, tarjeta, etc.","Tu cuaderno."],"cuando":"Hazlo al terminar el cuaderno, después de una semana de práctica o cuando sientas que necesitas integrar antes de seguir moviendo cosas.","steps":[{"title":"Reconocer que has estado moviendo","phrase":"Esto es lo que hice: movi algo que mi cuerpo cargaba.","body":["Coloca frente a ti el objeto elegido de un ritual anterior.","Miralo.","Recuerda brevemente que acto hiciste con el.","Di en voz alta:"]},{"title":"Llegar al cierre","phrase":"Estoy aquí. Puedo cerrar y recibir lo que cambio.","body":["Pon una mano en el pecho y otra en el abdomen.","Respira 4-4-6 durante seis ciclos.","Siente que no tienes que abrir otro tema ahora.","Di en voz alta:"]},{"title":"Sentir la mano propia","phrase":"Esta es mi mano. Este es mi cuerpo. Estoy aquí.","body":["Extiende una mano sobre la hoja.","Antes de trazarla, siente palma, dedos, unas, temperatura, peso.","Di en voz alta:","Esta es mi mano. Este es mi cuerpo. Estoy aquí."]},{"title":"Que volvió","phrase":"Qué volvió a mi cuerpo?","body":["Traza el contorno de tu mano sobre la hoja.","Dentro de cada dedo, escribe algo que haya vuelto o algo que estes recuperando.","Ejemplos:","descanso\nvoz\nlímite\ncalma\ndirección\nenergía\nclaridad\npermiso\npresencia\ncuerpo"]},{"title":"Sellar la integración","phrase":"Esto volvió a mi cuerpo. Lo reconozco.","body":["Coloca el objeto elegido encima del centro de la mano dibujada.","Pon tu mano real encima del objeto, sin aplastarlo demasiado.","Aquí el cambio no es abrir otro tema. El cambio es permitir que algo termine y quede registrado.","Mientras haces contacto, di en voz alta:"]}],"newPhrase":"No termino perfecto. Termino presente.","accion":["Retira la mano.","Escribe debajo del dibujo:"],"cierre":["Este ritual cierra el ciclo. No hagas otro ritual profundo el mismo día. Deja que el cuerpo integre.","Si quieres continuar, vuelve al índice y elige solo un ritual para repetir durante la semana siguiente.","---"],"observar":["Si puedes reconocer cambios pequeños sin exigir una transformación total.","Si algún ritual del cuaderno aparece como el más importante.","Si el objeto elegido despierta una memoria corporal.","Si hay cansancio, alivio, orgullo, tristeza o calma.","Si surge una práctica que quieras sostener."]}];

function esc(s){return String(s||"").replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));}
function cleanTitle(t){return String(t||"").replace(/^\d+\.\s*/,'');}
function bullets(items, max=4){return (items||[]).slice(0,max).map(x=>'<div class="bul"><i class="dot"></i><span>'+esc(x)+'</span></div>').join('');}
function paras(items, max=2){return (items||[]).slice(0,max).map(x=>'<p class="p">'+esc(x)+'</p>').join('');}
function bodyParas(items){return (items||[]).map(x=>'<p>'+esc(x)+'</p>').join('');}
function quoteHint(text){
  const q = String(text||'').trim();
  if (!q) return '';
  if (q.includes('___') || q.includes('____')) return 'Completa y dilo en voz alta:';
  if (/^(Qué|Cuál|De dónde|Dónde|Cuándo|Cómo|Es )/.test(q)) return 'Pregunta en voz alta y espera:';
  return 'Dilo en voz alta, despacio:';
}
function quoteBlock(text){
  if (!text) return '';
  return '<div class="quoteHint">'+esc(quoteHint(text))+'</div><div class="quote">'+esc(text)+'</div>';
}
function mark(){return '<svg class="mark" viewBox="-1 -19 138 155" fill="none"><path d="M 72 122 C 73 121, 74 120, 73 119 C 72 118, 71 119, 71 120 C 71 121, 72 122, 72 122 C 76 121, 79 117, 78 113 C 76 109, 70 108, 68 111 C 66 114, 68 120, 72 119 C 80 116, 88 104, 84 92 C 80 80, 62 76, 52 84 C 42 92, 50 108, 66 104 C 90 96, 108 72, 100 52 C 92 34, 56 26, 40 40 C 24 54, 34 78, 58 74 C 100 62, 128 32, 118 10 C 108 -6, 48 -10, 26 8 C 8 24, 18 50, 48 48" stroke="#111" stroke-width="4.2" stroke-linecap="round" opacity=".82"/><circle cx="72" cy="124" r="5.5" fill="#111" opacity=".55"/></svg>'}
function shell(inner, cls=''){
  return '<section class="spread '+cls+'"><div class="bind"><i class="hole h1"></i><i class="hole h2"></i><i class="hole h3"></i><i class="hole h4"></i></div><div class="gutter"></div>'+inner+'</section>';
}

function cover(){
  return shell('<div class="coverLockup">'+mark()+'<div class="coverBrand">Ritual<br><em>Experiencing</em></div></div><div class="page left"><div class="label">Libro de práctica cotidiana</div><div class="coverBook" style="font-size:43pt;line-height:.88;margin-top:6mm">Rituales<br><em>para la</em><br>Vida Diaria</div><div class="rule" style="margin-top:8mm"></div><div class="coverSub">Actos somáticos con objetos cotidianos para descanso, límites, dirección, energía e integración corporal.</div></div><div class="page right"></div><div class="coverBand"><p>Preparar · Hacer · Integrar</p><p style="text-align:right">Dr. Miguel Ojeda Rios<br>Instituto Centrobioenergetica · 2026</p></div>', 'cover');
}

function blankAfterCover(){
  return shell('', 'blankAfterCover');
}

function guide(){
  return shell('<div class="page left"><div class="label">Cómo usar este libro</div><div class="title">Hazlo para mover algo,<br><em>no para entenderlo todo.</em></div><div class="rule"></div><p class="p">Cada ritual usa un objeto, una acción física y una frase dicha en voz alta para darle al cuerpo una experiencia distinta.</p><p class="p">Lee primero la preparación. Después ejecuta los pasos en orden, sin saltar la pausa posterior al acto central.</p><div class="mini">Reglas básicas</div>'+bullets(['Di las frases en voz alta.','Respeta silencios y tiempos.','Haz la acción nueva, aunque sea pequeña.','Si el cuerpo se abruma, vuelve al suelo y busca apoyo.'])+'<div class="smallNote">Este libro está diseñado para aplicarse. No uses los rituales como lectura rápida: prepara el objeto, haz el gesto, di la frase y observa el cuerpo.</div></div><div class="page right"><div class="label">Índice</div><div class="title">21 actos<br><em>cotidianos</em></div><div class="indexGrid">'+RITUALES.map(r=>'<div class="idx"><b>'+r.num+'</b><span>'+esc(cleanTitle(r.title))+'</span></div>').join('')+'</div></div>');
}

function ritualContext(r, idx){
  return shell('<div class="page left"><div class="label">Ritual '+r.num+' · contexto</div><div class="title">'+esc(cleanTitle(r.title))+'</div><div class="subtitle">'+esc(String(r.subtitle||'').replace(/^Ritual\s+/,''))+'</div><div class="rule"></div><div class="mini">Para quién es</div>'+paras(r.para,3)+'<div class="mini">Principio</div>'+paras(r.principio,2)+'</div><div class="page right"><div class="label">Ritual '+r.num+' · preparación</div><div class="mini">Materiales</div>'+bullets(r.materiales,8)+'<div class="mini">Cuándo hacerlo</div><p class="p">'+esc(r.cuando)+'</p><div class="mini">Antes de empezar</div>'+bullets(['Prepara todos los objetos antes de iniciar.','Lee el paso completo antes de hacerlo.','Si una frase se siente difícil, dilo más lento, no más bajo.','Si te activas demasiado, detente y vuelve a la respiración.'],4)+'<div class="smallNote">Duración sugerida: 10 a 20 minutos. Hazlo sin prisa y sin celular en la mano.</div><div class="footer">'+String(idx).padStart(2,'0')+' · Preparación</div></div>');
}

function ritualExecution(r, idx){
  const steps = (r.steps||[]).map((s,i)=>'<div class="step"><div class="num">'+String(i+1).padStart(2,'0')+'</div><div><div class="st">'+esc(s.title)+'</div><div class="sb">'+bodyParas(s.body)+'</div>'+quoteBlock(s.phrase)+'</div></div>').join('');
  return shell('<div class="page left exec"><div class="label">Ritual '+r.num+' · ejecución</div>'+steps+'</div><div class="page right"><div class="label">Ritual '+r.num+' · cierre</div><div class="callout"><div class="mini">Acción nueva</div><div class="quoteHint">'+esc(quoteHint(r.newPhrase||''))+'</div><div class="quote">'+esc(r.newPhrase||'')+'</div></div><div class="mini">Después del acto</div>'+paras(r.accion,1)+paras(r.cierre,2)+'<div class="mini">Qué observar después</div>'+bullets(r.observar,5)+'<div class="smallNote">No evalúes si lo hiciste perfecto. Observa si el cuerpo quedó igual, más liviano, más activo, triste, cansado o presente.</div><div class="footer">'+String(idx).padStart(2,'0')+' · Ejecución</div></div>');
}

function closing(){
  return shell('<div class="page left"><div class="label">Registro de integración</div><div class="title">Lo que se movió<br><em>en mi cuerpo</em></div><div class="rule"></div>'+['Ritual realizado','Objeto usado','Frase que movió algo','Dónde lo sentí en el cuerpo','Qué acción nueva hice'].map(x=>'<div class="mini">'+x+'</div><div style="height:13mm;border-bottom:1px solid #cfcfcf"></div>').join('')+'</div><div class="page right" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">'+mark()+'<div class="label" style="margin-top:10mm">Ritual Experiencing</div><div class="title" style="font-size:25pt;margin-top:5mm">Rituales<br><em>para la Vida Diaria</em></div><div class="rule" style="margin:7mm auto 5mm"></div><p class="p" style="width:8.2cm;margin-top:0">Preparar · Hacer · Integrar</p><div class="mini" style="margin-top:7mm">Dr. Miguel Ojeda Rios</div><p class="p" style="font-size:8.8pt;margin-top:2mm;width:8.2cm">Ritual Experiencing — Instituto Centrobioenergetica · 2026</p></div>');
}

const book = document.getElementById('book');
book.innerHTML = cover() + blankAfterCover() + guide() + RITUALES.map((r,i)=>ritualContext(r,i+1)+ritualExecution(r,i+1)).join('') + closing();
[...document.querySelectorAll('.spread')].forEach((spread, i) => {
  spread.classList.remove('backSide');
});
[...document.querySelectorAll('.spread:not(.cover):not(.blankAfterCover)')].forEach((spread, i) => {
  const folio = String(i + 1).padStart(2, '0');
  spread.insertAdjacentHTML('beforeend', '<div class="folio">'+folio+'</div>');
});
</script>
</body>
</html>
