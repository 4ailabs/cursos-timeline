// ─── DESIGN CANVAS ────────────────────────────────────────
if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style'); s.id='dc-styles';
  s.textContent = '.dc-exp{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s;width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}[data-dc-slot]:hover .dc-exp{opacity:1}.dc-exp:hover{background:rgba(0,0,0,.06)}';
  document.head.appendChild(s);
}
const DCCtx = React.createContext(null);

function DesignCanvas({ children }) {
  const [focus, setFocus] = React.useState(null);
  const api = React.useMemo(() => ({ focus, setFocus }), [focus]);
  const registry = {}, sectionMeta = {};
  React.Children.forEach(children, sec => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    const ids = [];
    React.Children.forEach(sec.props.children, ab => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      registry[`${sid}/${aid}`] = { sectionId:sid, artboard:ab };
      ids.push(aid);
    });
    sectionMeta[sid] = { slotIds:ids };
  });
  React.useEffect(() => {
    const k = e => { if (e.key==='Escape') setFocus(null); };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  }, []);
  return (
    <DCCtx.Provider value={api}>
      <DCViewport>{children}</DCViewport>
      {focus && registry[focus] && <DCFocusOverlay entry={registry[focus]} sectionMeta={sectionMeta}/>}
    </DCCtx.Provider>
  );
}

function DCViewport({ children }) {
  const vpRef = React.useRef(null), worldRef = React.useRef(null);
  const tf = React.useRef({ x:0, y:0, scale:1 });
  const apply = React.useCallback(() => {
    const {x,y,scale}=tf.current;
    if(worldRef.current) worldRef.current.style.transform=`translate3d(${x}px,${y}px,0) scale(${scale})`;
  },[]);
  React.useEffect(() => {
    const vp = vpRef.current; if(!vp) return;
    const zoomAt=(cx,cy,f)=>{const r=vp.getBoundingClientRect(),t=tf.current,n=Math.min(8,Math.max(0.1,t.scale*f)),k=n/t.scale;t.x=(cx-r.left)-((cx-r.left)-t.x)*k;t.y=(cy-r.top)-((cy-r.top)-t.y)*k;t.scale=n;apply();};
    let drag=null;
    const onW=e=>{e.preventDefault();if(e.ctrlKey){zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.01))}else{tf.current.x-=e.deltaX;tf.current.y-=e.deltaY;apply();}};
    const onPD=e=>{if(!(e.button===1||(e.button===0&&!e.target.closest('[data-dc-slot]'))))return;e.preventDefault();vp.setPointerCapture(e.pointerId);drag={id:e.pointerId,lx:e.clientX,ly:e.clientY};vp.style.cursor='grabbing';};
    const onPM=e=>{if(!drag||e.pointerId!==drag.id)return;tf.current.x+=e.clientX-drag.lx;tf.current.y+=e.clientY-drag.ly;drag.lx=e.clientX;drag.ly=e.clientY;apply();};
    const onPU=e=>{if(!drag||e.pointerId!==drag.id)return;vp.releasePointerCapture(e.pointerId);drag=null;vp.style.cursor='';};
    vp.addEventListener('wheel',onW,{passive:false});
    vp.addEventListener('pointerdown',onPD);
    vp.addEventListener('pointermove',onPM);
    vp.addEventListener('pointerup',onPU);
    return()=>{vp.removeEventListener('wheel',onW);vp.removeEventListener('pointerdown',onPD);vp.removeEventListener('pointermove',onPM);vp.removeEventListener('pointerup',onPU);};
  },[apply]);
  const grid=`url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='rgba(0,0,0,0.055)' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div ref={vpRef} style={{height:'100vh',width:'100vw',background:'#f0ede8',overflow:'hidden',overscrollBehavior:'none',touchAction:'none',position:'relative'}}>
      <div ref={worldRef} style={{position:'absolute',top:0,left:0,transformOrigin:'0 0',willChange:'transform',width:'max-content',minWidth:'100%',minHeight:'100%',padding:'60px 0 80px'}}>
        <div style={{position:'absolute',inset:-6000,backgroundImage:grid,backgroundSize:'120px 120px',pointerEvents:'none',zIndex:-1}}/>
        {children}
      </div>
    </div>
  );
}

function DCSection({ id, title, children, gap=40 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const abs = React.Children.toArray(children).filter(c=>c&&c.type===DCArtboard);
  return (
    <div style={{marginBottom:72}}>
      <div style={{padding:'0 60px 40px',fontSize:22,fontWeight:600,color:'rgba(40,30,20,0.85)',fontFamily:'-apple-system,sans-serif'}}>{title}</div>
      <div style={{display:'flex',gap,padding:'0 60px',alignItems:'flex-start',width:'max-content'}}>
        {abs.map(ab=>{
          const aid=ab.props.id??ab.props.label;
          return (
            <div key={aid} data-dc-slot={aid} style={{position:'relative',flexShrink:0}}>
              <div style={{position:'absolute',bottom:'100%',left:-4,marginBottom:4,fontSize:13,fontWeight:500,color:'rgba(60,50,40,0.7)',fontFamily:'-apple-system,sans-serif',padding:'0 6px 3px',userSelect:'none'}}>{ab.props.label}</div>
              <button className="dc-exp" onClick={()=>ctx&&ctx.setFocus(`${sid}/${aid}`)}>
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
              </button>
              <div style={{borderRadius:2,boxShadow:'0 1px 3px rgba(0,0,0,.09),0 4px 16px rgba(0,0,0,.07)',overflow:'hidden',width:ab.props.width||450,height:ab.props.height||690}}>
                {ab.props.children}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
function DCArtboard() { return null; }

function DCFocusOverlay({ entry, sectionMeta }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const aid = artboard.props.id ?? artboard.props.label;
  const peers = sectionMeta[sectionId]?.slotIds||[];
  const idx = peers.indexOf(aid);
  const go = d => { const n=peers[(idx+d+peers.length)%peers.length]; if(n) ctx.setFocus(`${sectionId}/${n}`); };
  React.useEffect(()=>{const k=e=>{if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}if(e.key==='ArrowRight'){e.preventDefault();go(1);}};document.addEventListener('keydown',k);return()=>document.removeEventListener('keydown',k);});
  const [vp,setVp]=React.useState({w:window.innerWidth,h:window.innerHeight});
  React.useEffect(()=>{const r=()=>setVp({w:window.innerWidth,h:window.innerHeight});window.addEventListener('resize',r);return()=>window.removeEventListener('resize',r);},[]);
  const {width=450,height=690}=artboard.props;
  const scale=Math.max(0.1,Math.min((vp.w-160)/width,(vp.h-220)/height,2));
  return ReactDOM.createPortal(
    <div onClick={()=>ctx.setFocus(null)} style={{position:'fixed',inset:0,zIndex:100,background:'rgba(20,15,10,.65)',backdropFilter:'blur(16px)'}}>
      <div onClick={e=>e.stopPropagation()} style={{position:'absolute',top:0,right:0,padding:16}}>
        <button onClick={()=>ctx.setFocus(null)} style={{border:'none',background:'transparent',color:'rgba(255,255,255,.6)',width:32,height:32,borderRadius:16,fontSize:22,cursor:'pointer',lineHeight:1}}>×</button>
      </div>
      <div style={{position:'absolute',top:60,bottom:48,left:80,right:80,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14}}>
        <div onClick={e=>e.stopPropagation()} style={{width:width*scale,height:height*scale,position:'relative'}}>
          <div style={{width,height,transform:`scale(${scale})`,transformOrigin:'top left',background:'#fff',overflow:'hidden',boxShadow:'0 20px 80px rgba(0,0,0,.45)'}}>
            {artboard.props.children}
          </div>
        </div>
        <div style={{fontSize:13,opacity:.8,color:'#fff',fontFamily:'-apple-system,sans-serif'}}>{artboard.props.label} <span style={{opacity:.5}}>{idx+1}/{peers.length}</span></div>
      </div>
      {[[-1,'left'],[1,'right']].map(([d,dir])=>(
        <button key={dir} onClick={e=>{e.stopPropagation();go(d);}} style={{position:'absolute',top:'50%',[dir]:24,transform:'translateY(-50%)',border:'none',background:'rgba(255,255,255,.08)',color:'rgba(255,255,255,.9)',width:40,height:40,borderRadius:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d={dir==='left'?'M11 3L5 9l6 6':'M7 3l6 6-6 6'}/></svg>
        </button>
      ))}
      <div onClick={e=>e.stopPropagation()} style={{position:'absolute',bottom:16,left:'50%',transform:'translateX(-50%)',display:'flex',gap:7}}>
        {peers.map((p,i)=><button key={p} onClick={()=>ctx.setFocus(`${sectionId}/${p}`)} style={{border:'none',padding:0,cursor:'pointer',width:6,height:6,borderRadius:3,background:i===idx?'#fff':'rgba(255,255,255,.3)'}}/>)}
      </div>
    </div>,
    document.body
  );
}
