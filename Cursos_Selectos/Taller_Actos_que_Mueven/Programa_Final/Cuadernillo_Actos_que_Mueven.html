// DESIGN CANVAS — pan/zoom viewer (Figma-style)
// ═══════════════════════════════════════════════════════════
const DC = {
  bg:'#f0ede8', grid:'rgba(0,0,0,0.055)', label:'rgba(60,50,40,0.7)',
  title:'rgba(40,30,20,0.85)', font:'-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif',
};
if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style'); s.id='dc-styles';
  s.textContent = [
    '.dc-edit{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px}',
    '.dc-edit:focus{background:#fff;box-shadow:0 0 0 1.5px #c96442}',

    '.dc-exp:hover{background:rgba(0,0,0,.06)}',
    '[data-dc-slot]:hover .dc-exp{opacity:1}',
  ].join('\n');
  document.head.appendChild(s);
}

const DCCtx = React.createContext(null);

function DesignCanvas({ children, minScale=0.1, maxScale=8 }) {
  const [state, setState] = React.useState({ sections:{}, focus:null });
  const [ready, setReady] = React.useState(false);
  React.useEffect(() => { setTimeout(() => setReady(true), 50); }, []);
  const api = React.useMemo(() => ({
    state,
    section: id => state.sections[id] || {},
    patchSection: (id,p) => setState(s => ({ ...s, sections:{ ...s.sections, [id]:{ ...(s.sections[id]||{}), ...(typeof p==='function'?p(s.sections[id]||{}):p) } } })),
    setFocus: id => setState(s => ({ ...s, focus:id })),
  }), [state]);
  const registry = {};
  const sectionMeta = {};
  const sectionOrder = [];
  React.Children.forEach(children, sec => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const srcIds = [];
    React.Children.forEach(sec.props.children, ab => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId:sid, artboard:ab };
      srcIds.push(aid);
    });
    sectionMeta[sid] = { title: sec.props.title, slotIds: srcIds };
  });
  React.useEffect(() => {
    const k = e => { if (e.key==='Escape') api.setFocus(null); };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  }, [api]);
  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder}/>
      )}
    </DCCtx.Provider>
  );
}

function DCViewport({ children, minScale=0.1, maxScale=8 }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x:0, y:0, scale:1 });
  const apply = React.useCallback(() => {
    const {x,y,scale} = tf.current;
    if (worldRef.current) worldRef.current.style.transform = `translate3d(${x}px,${y}px,0) scale(${scale})`;
  }, []);
  React.useEffect(() => {
    const vp = vpRef.current; if (!vp) return;
    const zoomAt = (cx,cy,factor) => {
      const r = vp.getBoundingClientRect();
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale*factor));
      const k = next/t.scale;
      t.x = (cx-r.left) - ((cx-r.left)-t.x)*k;
      t.y = (cy-r.top)  - ((cy-r.top) -t.y)*k;
      t.scale = next; apply();
    };
    const isWheel = e => e.deltaMode!==0||(e.deltaX===0&&Number.isInteger(e.deltaY)&&Math.abs(e.deltaY)>=40);
    let gsBase=1, isGest=false;
    const onWheel = e => { e.preventDefault(); if(isGest)return; if(e.ctrlKey){zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.01))} else if(isWheel(e)){zoomAt(e.clientX,e.clientY,Math.exp(-Math.sign(e.deltaY)*0.18))} else{tf.current.x-=e.deltaX;tf.current.y-=e.deltaY;apply()} };
    const onGS = e => { e.preventDefault(); isGest=true; gsBase=tf.current.scale; };
    const onGC = e => { e.preventDefault(); zoomAt(e.clientX,e.clientY,(gsBase*e.scale)/tf.current.scale); };
    const onGE = e => { e.preventDefault(); isGest=false; };
    let drag=null;
    const onPD = e => { const onBg=!e.target.closest('[data-dc-slot],.dc-edit'); if(!(e.button===1||(e.button===0&&onBg)))return; e.preventDefault(); vp.setPointerCapture(e.pointerId); drag={id:e.pointerId,lx:e.clientX,ly:e.clientY}; vp.style.cursor='grabbing'; };
    const onPM = e => { if(!drag||e.pointerId!==drag.id)return; tf.current.x+=e.clientX-drag.lx; tf.current.y+=e.clientY-drag.ly; drag.lx=e.clientX; drag.ly=e.clientY; apply(); };
    const onPU = e => { if(!drag||e.pointerId!==drag.id)return; vp.releasePointerCapture(e.pointerId); drag=null; vp.style.cursor=''; };
    vp.addEventListener('wheel',onWheel,{passive:false});
    vp.addEventListener('gesturestart',onGS,{passive:false});
    vp.addEventListener('gesturechange',onGC,{passive:false});
    vp.addEventListener('gestureend',onGE,{passive:false});
    vp.addEventListener('pointerdown',onPD);
    vp.addEventListener('pointermove',onPM);
    vp.addEventListener('pointerup',onPU);
    vp.addEventListener('pointercancel',onPU);
    return () => { vp.removeEventListener('wheel',onWheel); vp.removeEventListener('gesturestart',onGS); vp.removeEventListener('gesturechange',onGC); vp.removeEventListener('gestureend',onGE); vp.removeEventListener('pointerdown',onPD); vp.removeEventListener('pointermove',onPM); vp.removeEventListener('pointerup',onPU); vp.removeEventListener('pointercancel',onPU); };
  }, [apply,minScale,maxScale]);
  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div ref={vpRef} style={{ height:'100vh', width:'100vw', background:DC.bg, overflow:'hidden', overscrollBehavior:'none', touchAction:'none', position:'relative', fontFamily:DC.font, boxSizing:'border-box' }}>
      <div ref={worldRef} style={{ position:'absolute', top:0, left:0, transformOrigin:'0 0', willChange:'transform', width:'max-content', minWidth:'100%', minHeight:'100%', padding:'60px 0 80px' }}>
        <div style={{ position:'absolute', inset:-6000, backgroundImage:gridSvg, backgroundSize:'120px 120px', pointerEvents:'none', zIndex:-1 }}/>
        {children}
      </div>
    </div>
  );
}

function DCSection({ id, title, children, gap=40 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const artboards = React.Children.toArray(children).filter(c => c && c.type===DCArtboard);
  return (
    <div data-dc-section={sid} style={{ marginBottom:72 }}>
      <div style={{ padding:'0 60px 40px', fontSize:22, fontWeight:600, color:DC.title, letterSpacing:-0.3 }}>{title}</div>
      <div style={{ display:'flex', gap, padding:'0 60px', alignItems:'flex-start', width:'max-content' }}>
        {artboards.map(ab => {
          const aid = ab.props.id ?? ab.props.label;
          return (
            <div key={aid} data-dc-slot={aid} style={{ position:'relative', flexShrink:0 }}>
              <div className="dc-lr" style={{ position:'absolute', bottom:'100%', left:-4, marginBottom:4, color:DC.label }}>
                <div className="dc-lt" style={{ fontSize:13, fontWeight:500, color:DC.label }}>{ab.props.label}</div>
              </div>
              <button className="dc-exp" onClick={() => ctx && ctx.setFocus(`${sid}/${aid}`)}>
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
              </button>
              <div className="dc-card" style={{ borderRadius:2, boxShadow:'0 1px 3px rgba(0,0,0,.09),0 4px 16px rgba(0,0,0,.07)', overflow:'hidden', width:ab.props.width||390+60, height:ab.props.height||630+60, background:'#fff' }}>
                {ab.props.children}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function DCArtboard() { return null; }

function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const meta = sectionMeta[sectionId];
  const aid = artboard.props.id ?? artboard.props.label;
  const peers = meta.slotIds;
  const idx = peers.indexOf(aid);
  const go = d => { const n = peers[(idx+d+peers.length)%peers.length]; if(n) ctx.setFocus(`${sectionId}/${n}`); };
  React.useEffect(() => {
    const k = e => { if(e.key==='ArrowLeft'){e.preventDefault();go(-1)} if(e.key==='ArrowRight'){e.preventDefault();go(1)} };
    document.addEventListener('keydown',k); return () => document.removeEventListener('keydown',k);
  });
  const { width=450, height=690 } = artboard.props;
  const [vp,setVp] = React.useState({w:window.innerWidth,h:window.innerHeight});
  React.useEffect(() => { const r=()=>setVp({w:window.innerWidth,h:window.innerHeight}); window.addEventListener('resize',r); return ()=>window.removeEventListener('resize',r); },[]);
  const scale = Math.max(0.1, Math.min((vp.w-160)/width, (vp.h-220)/height, 2));
  const Arrow = ({ dir, onClick }) => (
    <button onClick={e=>{e.stopPropagation();onClick()}} style={{ position:'absolute', top:'50%', [dir]:24, transform:'translateY(-50%)', border:'none', background:'rgba(255,255,255,.08)', color:'rgba(255,255,255,.9)', width:40, height:40, borderRadius:20, fontSize:18, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', transition:'background .15s' }} onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,.18)'} onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,.08)'}>
      <svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d={dir==='left'?'M11 3L5 9l6 6':'M7 3l6 6-6 6'}/></svg>
    </button>
  );
  return ReactDOM.createPortal(
    <div onClick={()=>ctx.setFocus(null)} onWheel={e=>e.preventDefault()} style={{ position:'fixed', inset:0, zIndex:100, background:'rgba(20,15,10,.65)', backdropFilter:'blur(16px)', fontFamily:DC.font, color:'#fff' }}>
      <div onClick={e=>e.stopPropagation()} style={{ position:'absolute', top:0, right:0, padding:16 }}>
        <button onClick={()=>ctx.setFocus(null)} style={{ border:'none', background:'transparent', color:'rgba(255,255,255,.6)', width:32, height:32, borderRadius:16, fontSize:22, cursor:'pointer', lineHeight:1 }}>×</button>
      </div>
      <div style={{ position:'absolute', top:60, bottom:48, left:80, right:80, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:14 }}>
        <div onClick={e=>e.stopPropagation()} style={{ width:width*scale, height:height*scale, position:'relative' }}>
          <div style={{ width, height, transform:`scale(${scale})`, transformOrigin:'top left', background:'#fff', borderRadius:2, overflow:'hidden', boxShadow:'0 20px 80px rgba(0,0,0,.45)' }}>
            {artboard.props.children}
          </div>
        </div>
        <div style={{ fontSize:13, opacity:.8 }}>{(ctx.section(sectionId).labels||{})[aid] ?? artboard.props.label} <span style={{opacity:.5}}>{idx+1}/{peers.length}</span></div>
      </div>
      <Arrow dir="left" onClick={()=>go(-1)}/>
      <Arrow dir="right" onClick={()=>go(1)}/>
      <div onClick={e=>e.stopPropagation()} style={{ position:'absolute', bottom:16, left:'50%', transform:'translateX(-50%)', display:'flex', gap:7 }}>
        {peers.map((p,i) => <button key={p} onClick={()=>ctx.setFocus(`${sectionId}/${p}`)} style={{ border:'none', padding:0, cursor:'pointer', width:6, height:6, borderRadius:3, background:i===idx?'#fff':'rgba(255,255,255,.3)' }}/>)}
      </div>
    </div>,
    document.body
  );
}
