<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actos que Mueven — Cuadernillo del Participante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>* { margin:0; padding:0; box-sizing:border-box; } body { background:#1c1815; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ─── DESIGN CANVAS ────────────────────────────────────────
if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style'); s.id='dc-styles';
  s.textContent = '.dc-exp{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s;width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}[data-dc-slot]:hover .dc-exp{opacity:1}.dc-exp:hover{background:rgba(0,0,0,.06)}';
  document.head.appendChild(s);
}
const DCCtx = React.createContext(null);

function DesignCanvas({ children }) {
  const [focus, setFocus] = React.useState(null);
  const api = React.useMemo(() => ({ focus, setFocus }), [focus]);
  const registry = {}, sectionMeta = {};
  React.Children.forEach(children, sec => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    const ids = [];
    React.Children.forEach(sec.props.children, ab => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      registry[`${sid}/${aid}`] = { sectionId:sid, artboard:ab };
      ids.push(aid);
    });
    sectionMeta[sid] = { slotIds:ids };
  });
  React.useEffect(() => {
    const k = e => { if (e.key==='Escape') setFocus(null); };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  }, []);
  return (
    <DCCtx.Provider value={api}>
      <DCViewport>{children}</DCViewport>
      {focus && registry[focus] && <DCFocusOverlay entry={registry[focus]} sectionMeta={sectionMeta}/>}
    </DCCtx.Provider>
  );
}

function DCViewport({ children }) {
  const vpRef = React.useRef(null), worldRef = React.useRef(null);
  const tf = React.useRef({ x:0, y:0, scale:1 });
  const apply = React.useCallback(() => {
    const {x,y,scale}=tf.current;
    if(worldRef.current) worldRef.current.style.transform=`translate3d(${x}px,${y}px,0) scale(${scale})`;
  },[]);
  React.useEffect(() => {
    const vp = vpRef.current; if(!vp) return;
    const zoomAt=(cx,cy,f)=>{const r=vp.getBoundingClientRect(),t=tf.current,n=Math.min(8,Math.max(0.1,t.scale*f)),k=n/t.scale;t.x=(cx-r.left)-((cx-r.left)-t.x)*k;t.y=(cy-r.top)-((cy-r.top)-t.y)*k;t.scale=n;apply();};
    let drag=null;
    const onW=e=>{e.preventDefault();if(e.ctrlKey){zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.01))}else{tf.current.x-=e.deltaX;tf.current.y-=e.deltaY;apply();}};
    const onPD=e=>{if(!(e.button===1||(e.button===0&&!e.target.closest('[data-dc-slot]'))))return;e.preventDefault();vp.setPointerCapture(e.pointerId);drag={id:e.pointerId,lx:e.clientX,ly:e.clientY};vp.style.cursor='grabbing';};
    const onPM=e=>{if(!drag||e.pointerId!==drag.id)return;tf.current.x+=e.clientX-drag.lx;tf.current.y+=e.clientY-drag.ly;drag.lx=e.clientX;drag.ly=e.clientY;apply();};
    const onPU=e=>{if(!drag||e.pointerId!==drag.id)return;vp.releasePointerCapture(e.pointerId);drag=null;vp.style.cursor='';};
    vp.addEventListener('wheel',onW,{passive:false});
    vp.addEventListener('pointerdown',onPD);
    vp.addEventListener('pointermove',onPM);
    vp.addEventListener('pointerup',onPU);
    return()=>{vp.removeEventListener('wheel',onW);vp.removeEventListener('pointerdown',onPD);vp.removeEventListener('pointermove',onPM);vp.removeEventListener('pointerup',onPU);};
  },[apply]);
  const grid=`url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='rgba(0,0,0,0.055)' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div ref={vpRef} style={{height:'100vh',width:'100vw',background:'#f0ede8',overflow:'hidden',overscrollBehavior:'none',touchAction:'none',position:'relative'}}>
      <div ref={worldRef} style={{position:'absolute',top:0,left:0,transformOrigin:'0 0',willChange:'transform',width:'max-content',minWidth:'100%',minHeight:'100%',padding:'60px 0 80px'}}>
        <div style={{position:'absolute',inset:-6000,backgroundImage:grid,backgroundSize:'120px 120px',pointerEvents:'none',zIndex:-1}}/>
        {children}
      </div>
    </div>
  );
}

function DCSection({ id, title, children, gap=40 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const abs = React.Children.toArray(children).filter(c=>c&&c.type===DCArtboard);
  return (
    <div style={{marginBottom:72}}>
      <div style={{padding:'0 60px 40px',fontSize:22,fontWeight:600,color:'rgba(40,30,20,0.85)',fontFamily:'-apple-system,sans-serif'}}>{title}</div>
      <div style={{display:'flex',gap,padding:'0 60px',alignItems:'flex-start',width:'max-content'}}>
        {abs.map(ab=>{
          const aid=ab.props.id??ab.props.label;
          return (
            <div key={aid} data-dc-slot={aid} style={{position:'relative',flexShrink:0}}>
              <div style={{position:'absolute',bottom:'100%',left:-4,marginBottom:4,fontSize:13,fontWeight:500,color:'rgba(60,50,40,0.7)',fontFamily:'-apple-system,sans-serif',padding:'0 6px 3px',userSelect:'none'}}>{ab.props.label}</div>
              <button className="dc-exp" onClick={()=>ctx&&ctx.setFocus(`${sid}/${aid}`)}>
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
              </button>
              <div style={{borderRadius:2,boxShadow:'0 1px 3px rgba(0,0,0,.09),0 4px 16px rgba(0,0,0,.07)',overflow:'hidden',width:ab.props.width||450,height:ab.props.height||690}}>
                {ab.props.children}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
function DCArtboard() { return null; }

function DCFocusOverlay({ entry, sectionMeta }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const aid = artboard.props.id ?? artboard.props.label;
  const peers = sectionMeta[sectionId]?.slotIds||[];
  const idx = peers.indexOf(aid);
  const go = d => { const n=peers[(idx+d+peers.length)%peers.length]; if(n) ctx.setFocus(`${sectionId}/${n}`); };
  React.useEffect(()=>{const k=e=>{if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}if(e.key==='ArrowRight'){e.preventDefault();go(1);}};document.addEventListener('keydown',k);return()=>document.removeEventListener('keydown',k);});
  const [vp,setVp]=React.useState({w:window.innerWidth,h:window.innerHeight});
  React.useEffect(()=>{const r=()=>setVp({w:window.innerWidth,h:window.innerHeight});window.addEventListener('resize',r);return()=>window.removeEventListener('resize',r);},[]);
  const {width=450,height=690}=artboard.props;
  const scale=Math.max(0.1,Math.min((vp.w-160)/width,(vp.h-220)/height,2));
  return ReactDOM.createPortal(
    <div onClick={()=>ctx.setFocus(null)} style={{position:'fixed',inset:0,zIndex:100,background:'rgba(20,15,10,.65)',backdropFilter:'blur(16px)'}}>
      <div onClick={e=>e.stopPropagation()} style={{position:'absolute',top:0,right:0,padding:16}}>
        <button onClick={()=>ctx.setFocus(null)} style={{border:'none',background:'transparent',color:'rgba(255,255,255,.6)',width:32,height:32,borderRadius:16,fontSize:22,cursor:'pointer',lineHeight:1}}>×</button>
      </div>
      <div style={{position:'absolute',top:60,bottom:48,left:80,right:80,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14}}>
        <div onClick={e=>e.stopPropagation()} style={{width:width*scale,height:height*scale,position:'relative'}}>
          <div style={{width,height,transform:`scale(${scale})`,transformOrigin:'top left',background:'#fff',overflow:'hidden',boxShadow:'0 20px 80px rgba(0,0,0,.45)'}}>
            {artboard.props.children}
          </div>
        </div>
        <div style={{fontSize:13,opacity:.8,color:'#fff',fontFamily:'-apple-system,sans-serif'}}>{artboard.props.label} <span style={{opacity:.5}}>{idx+1}/{peers.length}</span></div>
      </div>
      {[[-1,'left'],[1,'right']].map(([d,dir])=>(
        <button key={dir} onClick={e=>{e.stopPropagation();go(d);}} style={{position:'absolute',top:'50%',[dir]:24,transform:'translateY(-50%)',border:'none',background:'rgba(255,255,255,.08)',color:'rgba(255,255,255,.9)',width:40,height:40,borderRadius:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d={dir==='left'?'M11 3L5 9l6 6':'M7 3l6 6-6 6'}/></svg>
        </button>
      ))}
      <div onClick={e=>e.stopPropagation()} style={{position:'absolute',bottom:16,left:'50%',transform:'translateX(-50%)',display:'flex',gap:7}}>
        {peers.map((p,i)=><button key={p} onClick={()=>ctx.setFocus(`${sectionId}/${p}`)} style={{border:'none',padding:0,cursor:'pointer',width:6,height:6,borderRadius:3,background:i===idx?'#fff':'rgba(255,255,255,.3)'}}/>)}
      </div>
    </div>,
    document.body
  );
}

// ─── TOKENS ───────────────────────────────────────────────
const MM=3, W=130*MM, H=210*MM, MX=13*MM, MT=14*MM, MB=12*MM;
const SERIF="'Cormorant Garamond',Georgia,serif", MONO="'Courier New',monospace";
const C={siena:'#8B4513',sienaL:'#C4926A',arena:'#F2E8DC',arenaL:'#F7F0E8',ink:'#2C2C2A',cream:'#E8E6DE',grey:'#888780',grey2:'#B4B2A9',warm:'#FAF9F6',rule:'#DDD7CE'};
const BG='#26201c';

// ─── PRIMITIVES ───────────────────────────────────────────
const Vortex=({size=24,color='#8B4513'})=>(
  <svg width={size} height={size} viewBox="-1 -19 138 155" fill="none">
    <path d="M 72 122 C 73 121, 74 120, 73 119 C 72 118, 71 119, 71 120 C 71 121, 72 122, 72 122 C 76 121, 79 117, 78 113 C 76 109, 70 108, 68 111 C 66 114, 68 120, 72 119 C 80 116, 88 104, 84 92 C 80 80, 62 76, 52 84 C 42 92, 50 108, 66 104 C 90 96, 108 72, 100 52 C 92 34, 56 26, 40 40 C 24 54, 34 78, 58 74 C 100 62, 128 32, 118 10 C 108 -6, 48 -10, 26 8 C 8 24, 18 50, 48 48" stroke={color} strokeWidth="2.5" strokeLinecap="round" opacity="0.82"/>
    <circle cx="72" cy="124" r="2.8" fill={color} opacity="0.55"/>
  </svg>
);

const Pg=({bg=C.warm,children})=>(
  <div style={{width:W,height:H,background:bg,position:'relative',overflow:'hidden',fontFamily:SERIF,userSelect:'none'}}>
    {children}
  </div>
);

const Ct=({children,style={}})=>(
  <div style={{position:'absolute',left:MX,right:MX,top:MT,bottom:MB,display:'flex',flexDirection:'column',overflow:'hidden',zIndex:2,...style}}>
    {children}
  </div>
);

const Lbl=({children,color=C.grey})=>(
  <div style={{fontFamily:MONO,fontSize:8,letterSpacing:'0.14em',textTransform:'uppercase',color,lineHeight:1.35,flexShrink:0}}>{children}</div>
);

const Rule=({color=C.rule,my=0})=>(
  <div style={{height:1,background:color,flexShrink:0,marginTop:my,marginBottom:my}}/>
);

const PgN=({n,dark=false})=>(
  <div style={{position:'absolute',top:14,right:MX,fontFamily:SERIF,fontSize:11,fontWeight:300,color:dark?`${C.grey2}60`:`${C.grey}60`,lineHeight:1}}>{n}</div>
);

const NoteLines=()=>(
  <div style={{flex:1,backgroundImage:`repeating-linear-gradient(to bottom, transparent 0px, transparent 21px, ${C.rule} 21px, ${C.rule} 22px)`}}/>
);

const Ph=({text})=>(
  <div style={{borderLeft:`2px solid ${C.siena}45`,paddingLeft:7,marginTop:4,fontFamily:SERIF,fontSize:10,fontStyle:'italic',color:C.ink,lineHeight:1.45,flexShrink:0}}>
    "{text}"
  </div>
);

const Step=({n,name,inst,phrases=[]})=>(
  <div style={{display:'flex',gap:7,marginBottom:8.5,flexShrink:0}}>
    <div style={{fontFamily:MONO,fontSize:7,color:C.sienaL,lineHeight:1,paddingTop:3,width:14,flexShrink:0}}>{n}</div>
    <div style={{flex:1}}>
      <div style={{fontFamily:SERIF,fontSize:11.5,fontWeight:500,color:C.siena,lineHeight:1.2}}>{name}</div>
      {inst&&<div style={{fontFamily:SERIF,fontSize:10,color:C.grey,lineHeight:1.55,marginTop:2}}>{inst}</div>}
      {phrases.length>0&&<div style={{fontFamily:MONO,fontSize:8,letterSpacing:'0.1em',textTransform:'uppercase',color:C.sienaL,marginTop:7,marginBottom:2,flexShrink:0}}>Di en voz alta</div>}
      {phrases.map((p,i)=><Ph key={i} text={p}/>)}
    </div>
  </div>
);

const MatItem=({text})=>(
  <div style={{display:'flex',alignItems:'flex-start',gap:5,marginTop:3,flexShrink:0}}>
    <div style={{width:2.5,height:2.5,borderRadius:'50%',background:C.sienaL,marginTop:5,flexShrink:0}}/>
    <span style={{fontFamily:SERIF,fontSize:10,color:C.grey,lineHeight:1.5}}>{text}</span>
  </div>
);

const S=({children})=>(
  <div style={{width:W+60,height:H+60,background:BG,display:'flex',alignItems:'center',justifyContent:'center',padding:30}}>
    {children}
  </div>
);

const ActHeader=({num,title,tagline,cont=false})=>(
  <>
    <Lbl color={C.siena}>Acto {num}{cont?' · continuación':''}</Lbl>
    {!cont&&<>
      <div style={{marginTop:6,fontFamily:SERIF,fontSize:23,fontWeight:300,fontStyle:'italic',color:C.ink,lineHeight:1.05,letterSpacing:'-0.01em',flexShrink:0}}>{title}</div>
      {tagline&&<div style={{marginTop:4,fontFamily:SERIF,fontSize:11,color:C.grey,fontStyle:'italic',lineHeight:1.5,flexShrink:0}}>{tagline}</div>}
    </>}
    <Rule my={9} color={`${C.siena}30`}/>
  </>
);

const NotePage=({num,title,pgN})=>(
  <Pg>
    <Ct>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexShrink:0}}>
        <Lbl color={C.siena}>Notas · Acto {num}</Lbl>
        <Lbl color={`${C.grey}80`}>{title}</Lbl>
      </div>
      <div style={{marginTop:10,height:1,background:C.rule,flexShrink:0}}/>
      <NoteLines/>
      <div style={{display:'flex',justifyContent:'center',paddingBottom:2,flexShrink:0}}><Vortex size={14} color={C.arena}/></div>
    </Ct>
    <PgN n={pgN}/>
  </Pg>
);

  <Pg bg={C.ink}>
    <Ct>
      <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
        <Vortex size={16} color={C.sienaL}/>
        <div>
          <div style={{fontFamily:MONO,fontSize:7,letterSpacing:'0.15em',textTransform:'uppercase',color:C.grey,lineHeight:1.3}}>Instituto</div>
          <div style={{fontFamily:MONO,fontSize:7,letterSpacing:'0.15em',textTransform:'uppercase',color:`${C.grey}70`,lineHeight:1.3}}>Centrobioenergetica</div>
        </div>
      </div>
      <div style={{marginTop:24,fontFamily:MONO,fontSize:8.5,letterSpacing:'0.14em',textTransform:'uppercase',color:C.sienaL,flexShrink:0}}>Sábado 1 · Actos que Mueven</div>
      <div style={{marginTop:10,flexShrink:0}}>
        <div style={{fontFamily:SERIF,fontSize:53,fontWeight:300,lineHeight:0.9,color:C.cream,letterSpacing:'-0.025em'}}>
          Actos<br/><em style={{fontStyle:'italic',color:C.sienaL}}>que</em><br/>Mueven
        </div>
      </div>
      <div style={{marginTop:14,width:36,height:1,background:C.siena,flexShrink:0}}/>
      <div style={{marginTop:10,fontFamily:SERIF,fontSize:14.5,fontWeight:300,fontStyle:'italic',color:C.grey,lineHeight:1.5,flexShrink:0}}>Cuadernillo del Participante</div>
      <div style={{flex:1}}/>
      <div style={{border:`1px solid ${C.siena}40`,padding:'11px 13px',flexShrink:0}}>
        <Lbl color={C.grey}>Nombre</Lbl>

        <div>
          <div style={{fontFamily:MONO,fontSize:8,letterSpacing:'0.12em',textTransform:'uppercase',color:C.grey2}}>Dr. Miguel Ojeda Rios</div>
          <div style={{fontFamily:MONO,fontSize:7,letterSpacing:'0.08em',color:`${C.grey}75`,marginTop:2}}>Ritual Experiencing · Bioenergética V4</div>
        </div>
        <div style={{fontFamily:SERIF,fontSize:12,fontWeight:300,color:`${C.sienaL}45`}}>2026</div>
      </div>
    </Ct>

);

// MANUAL
// ═══════════════════════════════════════════════════════════
const P03=()=>(
  <Pg>
    <Ct>
      <Lbl color={C.siena}>Manual del Participante · I</Lbl>
      <div style={{marginTop:7,fontFamily:SERIF,fontSize:23,fontWeight:300,color:C.ink,lineHeight:1.05,flexShrink:0}}>Qué es Ritual<br/>Experiencing</div>
      <Rule my={10}/>
      <div style={{fontFamily:SERIF,fontSize:13,color:C.ink,lineHeight:1.65,flexShrink:0}}>

      </div>
      <div style={{marginTop:10,borderLeft:`2.5px solid ${C.siena}45`,paddingLeft:9,flexShrink:0}}>
        <div style={{fontFamily:SERIF,fontSize:14,fontWeight:300,fontStyle:'italic',color:C.ink,lineHeight:1.55}}>

      </div>

      </div>
      <div style={{flex:1}}/>
    </Ct>
    <PgN n={2}/>
  </Pg>
);

const P04=()=>(
  <Pg>
    <Ct>
      <Lbl color={C.siena}>Manual del Participante · II</Lbl>
      <div style={{marginTop:7,fontFamily:SERIF,fontSize:23,fontWeight:300,color:C.ink,lineHeight:1.05,flexShrink:0}}>Cómo se forman<br/>los patrones</div>
      <Rule my={10}/>
      <div style={{fontFamily:SERIF,fontSize:13,color:C.ink,lineHeight:1.65,flexShrink:0}}>
        Los patrones no se formaron con ideas — se formaron con experiencias que el cuerpo registró como reglas de supervivencia. Una experiencia intensa o repetida queda grabada en la memoria implícita. No está en la narrativa consciente — está en la tensión del hombro, en la contracción del estómago, en el reflejo de hacerse pequeño antes de que nadie lo pida.
      </div>
      <div style={{marginTop:8,fontFamily:SERIF,fontSize:13,color:C.grey,lineHeight:1.65,fontStyle:'italic',flexShrink:0}}>
        Si me muestro → me rechazan. Si suelto el control → todo se derrumba. Si cobro lo que valgo → pierdo el vínculo.
      </div>
      <div style={{marginTop:8,fontFamily:SERIF,fontSize:13,color:C.ink,lineHeight:1.65,flexShrink:0}}>
        Estas predicciones corren solas, sin que la persona las decida. Responden a <em>experiencia nueva</em> que contradiga la regla que aprendieron.
      </div>
      <Rule my={11}/>
      <Lbl>Qué es un acto ritual</Lbl>
      <div style={{marginTop:7,fontFamily:SERIF,fontSize:13,color:C.ink,lineHeight:1.65,flexShrink:0}}>

      <Step n="03" name="Recursos"
        inst="Pies en el suelo, columna erguida. Recuerda un momento en que ocupaste espacio sin pedir permiso a nadie. Siente dónde lo registra el cuerpo."
        phrases={['Ya sé cómo se siente ocupar el espacio. Lo hice.']}/>

        inst="Toma la hoja YO — intacta, entera. Léela en voz alta. Dóblala y guárdala cerca del cuerpo — en el bolsillo o la bolsa."

      <Rule my={9} color={`${C.siena}20`}/>

      <MatItem text="Papel tissue — hoja FAMILIA · Hoja normal — hoja YO"/>

    </Ct>

const A07a=()=>(
  <Pg bg={C.arenaL}>
    <Ct>
      <ActHeader num="07" title="El Plato Roto y la Reverencia" tagline="Para cuando lo que se fragmentó puede volverse más valioso que lo que estaba entero."/>
      <Step n="01" name="Romper"
        inst="Sostén el plato con ambas manos. Siente el plato entero — así estaba el sistema antes de lo que pasó. Ponlo sobre la toalla. Rómpelo contra la toalla. Puede dejarse caer o golpearse suavemente. Lo que importa es que se rompa. Escucha el sonido."
        phrases={['Esto es lo que pasó en mi sistema: se fragmentó para ___.']}/>
      <Step n="02" name="Recoger y respirar"
        inst="Recoge cada pedazo con cuidado — guantes disponibles si los necesitas. Colócalos en fila frente a ti. Manos en el pecho. Inhala 4 — aguanta 4 — exhala 6. Tres ciclos. Los pedazos frente a ti durante toda la respiración."
        phrases={['Estoy aquí. Tengo todo lo que necesito para seguir.']}/>
      <Step n="03" name="La reverencia"
        inst="Arrodíllate frente a los pedazos. Si no puedes arrodillarte, inclínate profundamente. Mira cada pedazo — cada uno es una parte que se separó para proteger algo: una que aprendió a callar para que hubiera paz, una que aprendió a cargar para que otros no cargaran, una que aprendió a desaparecer para que el sistema sobreviviera. Esas partes hicieron lo que tenían que hacer. Y funcionó — estás aquí. Mantén 30 segundos."
        phrases={['Cada parte de mí que se separó tenía una razón. Se separaron para que yo sobreviviera. Hoy las reconozco a todas.']}/>
      <div style={{flex:1}}/>
    </Ct>
    <PgN n={17}/>
  </Pg>
);
const A07b=()=>(
  <Pg bg={C.arenaL}>
    <Ct>
      <ActHeader num="07" cont/>
      <Step n="04" name="Reparar"
        inst="Toma el pegamento. Pega los pedazos uno por uno — con calma, sin apuro. Con cada pedazo que unas, di en voz baja la frase de abajo. El plato no va a quedar como nuevo y ese es el punto: las grietas quedarán visibles con el pegamento dorado. Si falta un pedazo, deja el espacio vacío — no todos los fragmentos se recuperan. 10 a 12 minutos."
        phrases={['Esto se reconecta.']}/>
      <Step n="05" name="Ponerse de pie"
        inst="Cuando el plato esté reparado, ponte de pie. Sostenlo a la altura del pecho con las dos manos. Veinte segundos de pie con el plato."
        phrases={['Estoy entero. Las grietas son mías y son hermosas. Lo que se rompió se reconectó — no como antes, sino mejor.']}/>
      <Step n="06" name="Llevarlo a casa"
        inst="El plato se lleva a casa — no al cajón, a un lugar visible. Las grietas doradas a la vista. Cada vez que lo veas, el sistema recibe la señal: lo fragmentado puede ser una sola pieza."
        phrases={[]}/>
      <Rule my={9} color={`${C.siena}20`}/>
      <Lbl>Materiales</Lbl>
      <MatItem text="Plato de cerámica o barro — 1 por persona"/>
      <MatItem text="Pegamento dorado · Toalla para romper · Guantes opcionales"/>
      <div style={{flex:1}}/>
    </Ct>
    <PgN n={18}/>
  </Pg>
);
