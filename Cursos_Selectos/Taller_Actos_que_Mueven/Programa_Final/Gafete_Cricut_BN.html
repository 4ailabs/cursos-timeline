<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gafete Instituto CentroBioenergética BN — Cricut</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      padding: 20px;
    }
    .container {
      width: 377px;
      height: 226px;
      background: white;
      border: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .gafete {
      width: 100%;
      height: 100%;
      background: white;
      border: 2px solid #000;
      border-radius: 2px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* Logo circular simplificado — blanco y negro */
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 4px;
    }
    .logo-circles {
      width: 36px;
      height: 36px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid #000;
    }
    .circle-ring-1 { width: 24px; height: 24px; }
    .circle-ring-2 { width: 14px; height: 14px; }
    .circle-center {
      width: 4px;
      height: 4px;
      background: #000;
      border-radius: 50%;
      position: absolute;
    }

    .header {
      text-align: center;
      line-height: 1.1;
    }
    .institution {
      font-size: 12px;
      font-weight: 700;
      color: #000;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .institution-name {
      font-size: 9px;
      color: #000;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 1px;
    }

    .divider {
      height: 1.5px;
      background: #000;
      margin: 6px 20px;
    }

    .content {
      text-align: center;
      line-height: 1.2;
    }
    .ritual-title {
      font-size: 9px;
      font-weight: 600;
      color: #000;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .course-name {
      font-size: 8px;
      color: #000;
      letter-spacing: 0.3px;
      margin-top: 1px;
      font-weight: 500;
    }

    /* Esquinas decorativas */
    .corner {
      position: absolute;
      width: 6px;
      height: 6px;
      border: 1px solid #000;
    }
    .corner-tl { top: 3px; left: 3px; border-right: none; border-bottom: none; }
    .corner-tr { top: 3px; right: 3px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 3px; left: 3px; border-right: none; border-top: none; }
    .corner-br { bottom: 3px; right: 3px; border-left: none; border-top: none; }

    /* Para impresión/exportación */
    @media print {
      body { background: white; padding: 0; }
      .container { box-shadow: none; border: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="gafete">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <div class="logo-container">
        <div class="logo-circles">
          <div class="circle-ring circle-ring-1"></div>
          <div class="circle-ring circle-ring-2"></div>
          <div class="circle-center"></div>
        </div>
      </div>

      <div class="header">
        <div class="institution">Instituto</div>
        <div class="institution-name">CentroBioenergética</div>
      </div>

      <div class="divider"></div>

      <div class="content">
        <div class="ritual-title">Ritual Experiencing</div>
        <div class="course-name">Actos que Mueven</div>
      </div>
    </div>
  </div>
</body>
</html>
