<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gafete Instituto CentroBioenergética BN — Cricut</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      padding: 20px;
    }
    .container {
      width: 377px;
      height: 226px;
      background: white;
      border: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .gafete {
      width: 100%;
      height: 100%;
      background: white;
      border: 2px solid #000;
      border-radius: 2px;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    /* Vortex logo */
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content {
      text-align: center;
      line-height: 1.2;
    }
    .ritual-title {
      font-size: 9px;
      font-weight: 600;
      color: #000;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .course-name {
      font-size: 8px;
      color: #000;
      letter-spacing: 0.3px;
      margin-top: 1px;
      font-weight: 500;
    }

    /* Esquinas decorativas */
    .corner {
      position: absolute;
      width: 6px;
      height: 6px;
      border: 1px solid #000;
    }
    .corner-tl { top: 3px; left: 3px; border-right: none; border-bottom: none; }
    .corner-tr { top: 3px; right: 3px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 3px; left: 3px; border-right: none; border-top: none; }
    .corner-br { bottom: 3px; right: 3px; border-left: none; border-top: none; }

    /* Para impresión/exportación */
    @media print {
      body { background: white; padding: 0; }
      .container { box-shadow: none; border: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="gafete">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <div class="logo-container">
        <svg width="32" height="32" viewBox="-1 -19 138 155" fill="none">
          <path d="M 72 122 C 73 121, 74 120, 73 119 C 72 118, 71 119, 71 120 C 71 121, 72 122, 72 122 C 76 121, 79 117, 78 113 C 76 109, 70 108, 68 111 C 66 114, 68 120, 72 119 C 80 116, 88 104, 84 92 C 80 80, 62 76, 52 84 C 42 92, 50 108, 66 104 C 90 96, 108 72, 100 52 C 92 34, 56 26, 40 40 C 24 54, 34 78, 58 74 C 100 62, 128 32, 118 10 C 108 -6, 48 -10, 26 8 C 8 24, 18 50, 48 48" stroke="#000" stroke-width="2.5" stroke-linecap="round" opacity="0.82"/>
          <circle cx="72" cy="124" r="2.8" fill="#000" opacity="0.55"/>
        </svg>
      </div>

      <div class="content">
        <div class="ritual-title">Ritual Experiencing</div>
        <div class="course-name">Actos que Mueven · Instituto</div>
      </div>
    </div>
  </div>
</body>
</html>
