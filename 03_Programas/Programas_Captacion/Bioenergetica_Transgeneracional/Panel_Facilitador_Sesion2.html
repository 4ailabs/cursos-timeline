<title>Panel del Facilitador — Sesión 2</title>

<style>
  :root {
    --ground: #F2ECE1;
    --panel: #FFFFFF;
    --panel-2: #F8F3E9;
    --line: #E0D5C4;
    --line-soft: #EBE2D4;
    --ink: #2A231D;
    --muted: #6E6357;
    --accent: #A8543B;
    --accent-soft: rgba(168, 84, 59, 0.10);
    --voice: #8B4A2A;
    --do: #62804A;
    --warn: #9A6A12;
    --warn-soft: rgba(154, 106, 18, 0.10);
    --shadow: 0 1px 2px rgba(58, 40, 24, .06), 0 8px 26px rgba(58, 40, 24, .09);

    --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #17130F;
      --panel: #211B16;
      --panel-2: #2A221B;
      --line: #3A3029;
      --line-soft: #2F2721;
      --ink: #F0E7DC;
      --muted: #A8998A;
      --accent: #D07A57;
      --accent-soft: rgba(208, 122, 87, 0.14);
      --voice: #E8D5B8;
      --do: #9DB489;
      --warn: #D9A441;
      --warn-soft: rgba(217, 164, 65, 0.12);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .34);
    }
  }

  :root[data-theme="dark"] {
    --ground: #17130F;
    --panel: #211B16;
    --panel-2: #2A221B;
    --line: #3A3029;
    --line-soft: #2F2721;
    --ink: #F0E7DC;
    --muted: #A8998A;
    --accent: #D07A57;
    --accent-soft: rgba(208, 122, 87, 0.14);
    --voice: #E8D5B8;
    --do: #9DB489;
    --warn: #D9A441;
    --warn-soft: rgba(217, 164, 65, 0.12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .34);
  }

  :root[data-theme="light"] {
    --ground: #F2ECE1;
    --panel: #FFFFFF;
    --panel-2: #F8F3E9;
    --line: #E0D5C4;
    --line-soft: #EBE2D4;
    --ink: #2A231D;
    --muted: #6E6357;
    --accent: #A8543B;
    --accent-soft: rgba(168, 84, 59, 0.10);
    --voice: #8B4A2A;
    --do: #62804A;
    --warn: #9A6A12;
    --warn-soft: rgba(154, 106, 18, 0.10);
    --shadow: 0 1px 2px rgba(58, 40, 24, .06), 0 8px 26px rgba(58, 40, 24, .09);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .app {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }

  /* ---------- barra superior ---------- */

  .topbar {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .7rem clamp(.8rem, 3vw, 1.6rem) .5rem;
    border-bottom: 1px solid var(--line-soft);
  }

  .iconbtn {
    display: grid;
    place-items: center;
    width: 2.3rem;
    height: 2.3rem;
    border-radius: 7px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .iconbtn:hover { background: var(--accent-soft); color: var(--accent); }
  .iconbtn svg { width: 19px; height: 19px; display: block; }

  .topmeta {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: .5rem;
  }
  .topmeta .where {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topmeta .count {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
    flex-shrink: 0;
  }

  .rail {
    display: flex;
    gap: 2px;
    padding: 0 clamp(.8rem, 3vw, 1.6rem) .6rem;
  }
  .rail .tick {
    height: 3px;
    flex: 1;
    background: var(--line);
    border-radius: 2px;
    transition: background .2s ease;
  }
  .rail .tick.done { background: var(--accent); opacity: .45; }
  .rail .tick.now { background: var(--accent); opacity: 1; }
  .rail .gap { width: 10px; flex: 0 0 10px; }

  /* ---------- tarjeta ---------- */

  .stage {
    overflow-y: auto;
    padding: clamp(.9rem, 3vw, 1.7rem) clamp(.8rem, 3vw, 1.6rem) 1.2rem;
    -webkit-overflow-scrolling: touch;
  }

  .card {
    max-width: 46rem;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: clamp(1.1rem, 3.4vw, 1.9rem);
    display: flex;
    flex-direction: column;
    gap: 1.05rem;
  }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise .22s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
  }

  .card-head { display: flex; align-items: flex-start; gap: 1rem; }
  .card-head .h { flex: 1; min-width: 0; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
    margin-bottom: .35rem;
  }
  .card h1 {
    font-family: var(--display);
    font-size: clamp(1.45rem, 4.4vw, 1.95rem);
    font-weight: 600;
    line-height: 1.13;
    letter-spacing: -.005em;
    margin: 0;
    text-wrap: balance;
  }
  .slidechip {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .04em;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: .3rem .6rem;
    white-space: nowrap;
    flex-shrink: 0;
  }

  ul.cues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .78rem; }
  ul.cues li {
    position: relative;
    padding-left: 1.15rem;
    font-size: clamp(1rem, 2.7vw, 1.08rem);
    line-height: 1.5;
  }
  ul.cues li::before {
    content: "";
    position: absolute;
    left: 0;
    top: .58em;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--line);
  }
  ul.cues li.do::before { background: var(--do); border-radius: 1px; }
  ul.cues li b, ul.cues li strong { color: var(--accent); font-weight: 650; }
  ul.cues li em { font-style: italic; }

  li.say {
    padding-left: .95rem;
    border-left: 2px solid var(--voice);
    font-family: var(--display);
    font-style: italic;
    font-size: clamp(1.06rem, 2.9vw, 1.18rem);
    line-height: 1.42;
    color: var(--voice);
  }
  li.say::before { display: none; }
  li.say .beat {
    font-family: var(--ui);
    font-style: normal;
    font-size: .72em;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-left: .45rem;
    white-space: nowrap;
  }
  li.say b { color: var(--voice); }

  .note {
    background: var(--warn-soft);
    border-left: 3px solid var(--warn);
    border-radius: 0 7px 7px 0;
    padding: .7rem .85rem;
    font-size: .95rem;
    line-height: 1.45;
  }
  .note .lbl {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--warn);
    display: block;
    margin-bottom: .2rem;
  }

  /* ---------- navegación inferior ---------- */

  .navbar {
    border-top: 1px solid var(--line-soft);
    background: var(--ground);
    padding: .55rem clamp(.8rem, 3vw, 1.6rem) max(.55rem, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: .7rem;
  }
  .navbtn {
    display: grid;
    place-items: center;
    width: 3rem;
    height: 2.9rem;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--panel);
    color: var(--ink);
    flex-shrink: 0;
  }
  .navbtn:hover { border-color: var(--accent); color: var(--accent); }
  .navbtn[disabled] { opacity: .32; cursor: default; }
  .navbtn[disabled]:hover { border-color: var(--line); color: var(--ink); }
  .navbtn svg { width: 20px; height: 20px; }

  .next-label {
    flex: 1;
    min-width: 0;
    font-family: var(--display);
    font-style: italic;
    font-size: .95rem;
    line-height: 1.3;
    color: var(--muted);
  }
  .next-label b { font-style: normal; font-family: var(--ui); font-weight: 600; color: var(--accent); }

  .reftray { display: flex; gap: .4rem; flex-shrink: 0; }
  .refbtn {
    display: grid;
    place-items: center;
    width: 2.9rem;
    height: 2.9rem;
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: 9px;
    background: var(--warn-soft);
  }
  .refbtn:hover { background: var(--warn); color: var(--ground); }
  .refbtn svg { width: 20px; height: 20px; }

  /* ---------- índice ---------- */

  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(10, 7, 4, .5);
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(21rem, 86vw);
    background: var(--panel);
    border-right: 1px solid var(--line);
    z-index: 50;
    transform: translateX(-101%);
    transition: transform .22s cubic-bezier(.3, .8, .4, 1);
    display: flex;
    flex-direction: column;
  }
  .drawer.on { transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .drawer { transition: none; }
  }

  .drawer header {
    padding: 1rem 1.1rem .7rem;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    gap: .6rem;
  }
  .drawer header h2 {
    font-family: var(--display);
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
    flex: 1;
  }
  .drawer .list { overflow-y: auto; padding: .6rem .6rem 1.6rem; }
  .drawer .grouplbl {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
    padding: .9rem .55rem .35rem;
  }
  .drawer .item {
    display: flex;
    gap: .6rem;
    width: 100%;
    text-align: left;
    padding: .5rem .55rem;
    border-radius: 7px;
    font-size: .95rem;
    line-height: 1.3;
    align-items: baseline;
  }
  .drawer .item:hover { background: var(--panel-2); }
  .drawer .item .n {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    min-width: 1.3rem;
  }
  .drawer .item.current { background: var(--accent-soft); }
  .drawer .item.current .t { color: var(--accent); font-weight: 600; }
  .drawer .item.current .n { color: var(--accent); }

  /* ---------- consulta rápida ---------- */

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: var(--ground);
    display: none;
    grid-template-rows: auto minmax(0, 1fr);
  }
  .overlay.on { display: grid; }
  .overlay header {
    display: flex;
    align-items: center;
    gap: .7rem;
    padding: .8rem clamp(.8rem, 3vw, 1.6rem);
    border-bottom: 1px solid var(--line);
  }
  .overlay header h2 {
    font-family: var(--display);
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0;
    flex: 1;
  }
  .overlay header .tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--warn);
  }
  .overlay .body {
    overflow-y: auto;
    padding: clamp(.9rem, 3vw, 1.5rem);
  }
  .overlay .inner { max-width: 46rem; margin: 0 auto; }

  /* rosa */
  .rosewrap { display: flex; flex-direction: column; gap: 1.1rem; align-items: center; }
  .rose { width: min(20rem, 78vw); height: auto; display: block; touch-action: manipulation; }
  .rose .wedge { fill: var(--panel); stroke: var(--line); stroke-width: 1; cursor: pointer; transition: fill .15s ease; }
  .rose .wedge:hover { fill: var(--accent-soft); }
  .rose .wedge.sel { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
  .rose .quad { fill: var(--panel-2); }
  .rose text { font-family: var(--ui); pointer-events: none; }
  .rose .lbl { font-size: 13px; font-weight: 650; fill: var(--ink); }
  .rose .sub { font-size: 9.5px; fill: var(--muted); letter-spacing: .04em; }
  .rose .qlbl { font-size: 9.5px; font-weight: 600; fill: var(--muted); }
  .rose .axis { stroke: var(--line); stroke-width: 1; }

  .rosedetail {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: .7rem;
  }
  .rosedetail .rd-top { display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; }
  .rosedetail h3 { font-family: var(--display); font-size: 1.3rem; margin: 0; font-weight: 600; }
  .rosedetail .kind {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rosedetail .marcos { display: grid; gap: .45rem; }
  .rosedetail .marco { display: flex; gap: .6rem; font-size: .93rem; line-height: 1.4; }
  .rosedetail .marco .mk {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--do);
    min-width: 5.4rem;
    flex-shrink: 0;
    padding-top: .22em;
  }
  .rosedetail .costo { font-size: .93rem; line-height: 1.4; color: var(--muted); }
  .rosedetail .costo b { color: var(--ink); font-weight: 600; }
  .rosedetail .ask {
    border-left: 2px solid var(--voice);
    padding-left: .9rem;
    font-family: var(--display);
    font-style: italic;
    font-size: 1.08rem;
    line-height: 1.42;
    color: var(--voice);
  }
  .rosedetail .askhead {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    font-style: normal;
    display: block;
    margin-bottom: .25rem;
  }

  /* improntas */
  .imp { display: flex; flex-direction: column; gap: .55rem; }
  .improw {
    display: grid;
    grid-template-columns: 7.4rem 1fr;
    gap: .3rem .9rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: .7rem .85rem;
  }
  .improw .code { display: flex; flex-direction: column; gap: .1rem; }
  .improw .code .c { font-family: var(--mono); font-size: 10px; letter-spacing: .09em; color: var(--accent); }
  .improw .code .nm { font-family: var(--display); font-size: 1.06rem; font-weight: 600; line-height: 1.15; }
  .improw .txt { font-size: .93rem; line-height: 1.42; }
  .improw .txt .lin { color: var(--muted); }
  .improw .txt .her { display: block; margin-top: .2rem; }
  .improw .txt .her b { color: var(--accent); font-weight: 600; }
  .improw .cre {
    grid-column: 1 / -1;
    font-family: var(--display);
    font-style: italic;
    color: var(--voice);
    font-size: 1rem;
    margin-top: .15rem;
  }
  @media (max-width: 30rem) {
    .improw { grid-template-columns: 1fr; }
  }

  /* contingencias */
  .cont { display: flex; flex-direction: column; gap: .6rem; }
  .controw {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--warn);
    border-radius: 0 9px 9px 0;
    padding: .75rem .9rem;
  }
  .controw .if {
    font-weight: 650;
    font-size: .98rem;
    line-height: 1.35;
    display: block;
    margin-bottom: .25rem;
  }
  .controw .then { font-size: .95rem; line-height: 1.45; color: var(--muted); }
  .controw .then b { color: var(--ink); font-weight: 600; }

  .hint {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    padding-top: .9rem;
  }
</style>

<div class="app">
  <div class="topbar">
    <button class="iconbtn" id="btn-index" aria-label="Abrir índice de la sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>

  <div class="rail" id="rail"></div>

  <main class="stage" id="stage"></main>

  <nav class="navbar">

<div class="scrim" id="scrim"></div>

  <div class="body"><div class="inner" id="ov-body"></div></div>

<script>
(function () {
  "use strict";

  /* ============ contenido ============ */

  var CARDS = [
    {
      grupo: "Antes de empezar", where: "Preparación",

  function el(tag, cls, html) {

  function renderRail() {

      if (prevGroup !== null && c.grupo !== prevGroup) railEl.appendChild(el("div", "gap"));

      var t = el("div", "tick" + (i < idx ? " done" : i === idx ? " now" : ""));
      railEl.appendChild(t);
    });
  }

  function renderCard() {
    var c = CARDS[idx];
    stage.scrollTop = 0;
    stage.innerHTML = "";

    var card = el("article", "card");

    var head = el("div", "card-head");
    var h = el("div", "h");
    h.appendChild(el("span", "eyebrow", c.eyebrow));
    h.appendChild(el("h1", null, c.title));
    head.appendChild(h);
    if (c.slide) head.appendChild(el("span", "slidechip", c.slide));
    card.appendChild(head);

    var ul = el("ul", "cues");
    c.cues.forEach(function (q) {
      var li = el("li", q.k === "say" ? "say" : q.k === "do" ? "do" : null);
      li.innerHTML = q.t + (q.beat ? ' <span class="beat">' + q.beat + "</span>" : "");
      ul.appendChild(li);
    });
    card.appendChild(ul);

    if (c.note) {
      var nb = el("div", "note");
      nb.appendChild(el("span", "lbl", "Nota de facilitación"));
      nb.appendChild(el("span", null, c.note));
      card.appendChild(nb);

    stage.appendChild(card);

    whereEl.textContent = c.where;
    countEl.textContent = (idx + 1) + " / " + CARDS.length;
    nextEl.innerHTML = c.next ? (idx < CARDS.length - 1 ? "<b>Sigue</b> · " : "") + c.next : "";

    nextBtn.disabled = idx === CARDS.length - 1;

    renderRail();
    markIndex();
    save();
  }

  function go(n) {

  function buildIndex() {

      b.appendChild(el("span", "t", c.title));
      b.addEventListener("click", function () {

      indexList.appendChild(b);

  function polar(cx, cy, r, deg) {
    var a = (deg * Math.PI) / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }

  function wedgePath(cx, cy, r, a1, a2) {
    var p1 = polar(cx, cy, r, a1);
    var p2 = polar(cx, cy, r, a2);
    return "M" + cx + "," + cy + " L" + p1[0].toFixed(1) + "," + p1[1].toFixed(1) +
      " A" + r + "," + r + " 0 0 1 " + p2[0].toFixed(1) + "," + p2[1].toFixed(1) + " Z";
  }

  function buildRosa() {
    var wrap = el("div", "rosewrap");
    var SVGNS = "http://www.w3.org/2000/svg";
    var size = 300, c = 150, r = 132;

    var svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + size + " " + size);
    svg.setAttribute("class", "rose");
    svg.setAttribute("role", "group");
    svg.setAttribute("aria-label", "Rosa de los cuatro caminos");

    SECTORS.forEach(function (s) {
      var p = document.createElementNS(SVGNS, "path");
      p.setAttribute("d", wedgePath(c, c, r, s.a, s.a + 45));
      p.setAttribute("class", "wedge" + (s.sub ? "" : " quad"));
      p.dataset.k = s.k;
      p.setAttribute("tabindex", "0");
      p.setAttribute("role", "button");
      p.setAttribute("aria-label", ROSA[s.k].name);
      p.addEventListener("click", function () { selectSector(s.k); });
      p.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectSector(s.k); }
      });
      svg.appendChild(p);
    });

    [[c, c - r, c, c + r], [c - r, c, c + r, c]].forEach(function (ln) {
      var l = document.createElementNS(SVGNS, "line");
      l.setAttribute("x1", ln[0]); l.setAttribute("y1", ln[1]);
      l.setAttribute("x2", ln[2]); l.setAttribute("y2", ln[3]);
      l.setAttribute("class", "axis");
      svg.appendChild(l);
    });

    SECTORS.forEach(function (s) {
      var rr = s.sub ? 96 : 100;
      var x = c + s.lx * rr, y = c + s.ly * rr;
      var t1 = document.createElementNS(SVGNS, "text");
      t1.setAttribute("x", x); t1.setAttribute("y", y);
      t1.setAttribute("text-anchor", "middle");
      t1.setAttribute("class", s.sub ? "lbl" : "qlbl");
      t1.textContent = s.label;
      svg.appendChild(t1);
      if (s.sub) {
        var t2 = document.createElementNS(SVGNS, "text");
        t2.setAttribute("x", x); t2.setAttribute("y", y + 13);
        t2.setAttribute("text-anchor", "middle");
        t2.setAttribute("class", "sub");
        t2.textContent = s.sub;
        svg.appendChild(t2);
      }
    });

    wrap.appendChild(svg);
    var detail = el("div", "rosedetail");
    detail.id = "rose-detail";
    wrap.appendChild(detail);
    wrap.appendChild(el("div", "hint", "Toca la dirección en que cayó el muñeco"));
    return wrap;
  }

    rosa: { title: "Rosa de los cuatro caminos", build: buildRosa, after: function () { selectSector("N"); } },
    improntas: { title: "Las siete improntas", build: buildImprontas },
    contingencias: { title: "Contingencias de la demostración", build: buildContingencias }
  };

  function openRef(key) {
    var r = REFS[key];
    ovTitle.textContent = r.title;
    ovBody.innerHTML = "";
    ovBody.appendChild(r.build());
    overlay.classList.add("on");
    scrim.classList.add("on");
    if (r.after) r.after();
  }
  function closeOverlay() {
    overlay.classList.remove("on");
    if (!drawer.classList.contains("on")) scrim.classList.remove("on");
  }

  /* ============ eventos ============ */

  prevBtn.addEventListener("click", function () { go(idx - 1); });
  nextBtn.addEventListener("click", function () { go(idx + 1); });
  document.getElementById("btn-index").addEventListener("click", openDrawer);
  document.getElementById("btn-close-index").addEventListener("click", closeDrawer);
  document.getElementById("btn-close-ov").addEventListener("click", closeOverlay);
  scrim.addEventListener("click", function () { closeDrawer(); closeOverlay(); });

  var refBtns = document.querySelectorAll(".refbtn");
  for (var i = 0; i < refBtns.length; i++) {
    refBtns[i].addEventListener("click", function (ev) {
      openRef(ev.currentTarget.dataset.ref);
    });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeDrawer(); closeOverlay(); return; }
    if (overlay.classList.contains("on") || drawer.classList.contains("on")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(idx + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(idx - 1); }
  });

  var tx = 0, ty = 0;
  stage.addEventListener("touchstart", function (e) {
    tx = e.changedTouches[0].clientX;
    ty = e.changedTouches[0].clientY;
  }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.8) go(dx < 0 ? idx + 1 : idx - 1);
  }, { passive: true });

  var themeBtn = document.getElementById("btn-theme");
  themeBtn.addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });

  buildIndex();
  renderCard();
})();
</script>
