<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Etiqueta UMBRAL — B/N impresión</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #ccc;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Cormorant Garamond', Georgia, serif;
}

.etiqueta {
  width: 340px;
  height: 163px;
  background: #fff;
  border: 1px solid #000;
  display: flex;
  flex-direction: row;
  overflow: hidden;
  position: relative;
}

.lateral-izq {
  width: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  border-right: 1px solid #000;
}

.lateral-izq .texto-vertical {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-family: Georgia, serif;
  font-size: 5.5px;
  letter-spacing: 0.8px;
  color: #444;
  white-space: nowrap;
}

.centro {
  flex: 1;
  display: flex;
  flex-direction: row;
  overflow: hidden;
}

.lado-izq {
  width: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 8px;
  position: relative;
}

.lado-izq::after {
  content: '';
  position: absolute;
  right: 0;
  top: 14px;
  bottom: 14px;
  width: 1px;
  background: #000;
  opacity: 0.25;
}

.lado-der {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 12px 14px 12px 14px;
}

.marca {
  font-size: 8px;
  font-weight: 400;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: #000;
  margin-bottom: 5px;
}

.nombre {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 3px;
  color: #000;
  line-height: 1;
  margin-bottom: 4px;
}

.subtitulo {
  font-size: 10px;
  font-weight: 400;
  color: #333;
  letter-spacing: 0.5px;
  margin-bottom: 7px;
  font-style: italic;
}

.fases {
  font-size: 8px;
  font-weight: 400;
  letter-spacing: 2.5px;
  text-transform: lowercase;
  color: #444;
  margin-bottom: 7px;
}

.fases span {
  color: #666;
  margin: 0 3px;
}

.info-pie {
  display: flex;
  align-items: center;
  gap: 8px;
}

.flores {
  font-family: Georgia, serif;
  font-size: 5.5px;
  color: #444;
  letter-spacing: 0.3px;
  line-height: 1.5;
}

.contenido {
  font-family: Georgia, serif;
  font-size: 7px;
  color: #000;
  font-weight: 700;
  letter-spacing: 1px;
  white-space: nowrap;
}

.lateral-der {
  width: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  border-left: 1px solid #000;
}

.lateral-der .texto-vertical {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-family: Georgia, serif;
  font-size: 5.5px;
  letter-spacing: 0.8px;
  color: #444;
  white-space: nowrap;
}

@media print {
  body { background: white; }
  .etiqueta {
    width: 9cm;
    height: 4.3cm;
  }
}
</style>
</head>
<body>

<div class="etiqueta">

  <div class="lateral-izq">
    <div class="texto-vertical">Consérvese en lugar fresco y seco</div>
  </div>

  <div class="centro">
    <div class="lado-izq">
      <svg width="32" height="32" viewBox="-1 -19 138 155">
        <path d="M 72 122 C 73 121, 74 120, 73 119 C 72 118, 71 119, 71 120 C 71 121, 72 122, 72 122 C 76 121, 79 117, 78 113 C 76 109, 70 108, 68 111 C 66 114, 68 120, 72 119 C 80 116, 88 104, 84 92 C 80 80, 62 76, 52 84 C 42 92, 50 108, 66 104 C 90 96, 108 72, 100 52 C 92 34, 56 26, 40 40 C 24 54, 34 78, 58 74 C 100 62, 128 32, 118 10 C 108 -6, 48 -10, 26 8 C 8 24, 18 50, 48 48" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="72" cy="124" r="2.8" fill="#000" opacity="0.6"/>
      </svg>
    </div>
    <div class="lado-der">
      <div class="marca">Ritual Experiencing</div>
      <div class="nombre">UMBRAL</div>
      <div class="subtitulo">Mezcla floral de acompañamiento</div>
      <div class="fases">preparar<span>·</span>hacer<span>·</span>integrar</div>
      <div class="info-pie">
        <div class="flores">Star of Bethlehem · Cherry Plum<br>Rock Rose · Walnut · Olive</div>
        <div class="contenido">20 ml</div>
      </div>
    </div>
  </div>

  <div class="lateral-der">
    <div class="texto-vertical">contacto@institutocentrobioenergetica.com</div>
  </div>

</div>

</body>
</html>
