<script type="text/babel">
const RITUALES=[{"num":"01","title":"01. La Mesa Vacia","subtitle":"Ritual para dormir cuando la mente no se apaga","para":["Para cuando te acuestas y el cuerpo no entra al descanso. La cama esta lista, la luz se apaga, pero la mente sigue trabajando: pendientes, conversaciones, mensajes, cuentas, decisiones, cosas que no se resolvieron.","No es que no quieras dormir. Es que tu sistema nervioso sigue tratando la noche como una extension del dia. La cama se vuelve escritorio, tribunal, sala de espera y lista de pendientes."],"principio":["El cuerpo necesita fronteras claras. Si todo lo que quedo abierto durante el dia entra contigo a la cama, el sistema nervioso no sabe que ya puede bajar la guardia. Sigue sosteniendo informacion, anticipando consecuencias y buscando soluciones.","Cuando escribes lo pendiente, lo metes en un sobre y lo dejas fuera de la cama, le das al cuerpo una senal fisica: esto existe, pero no va conmigo al descanso. El sobre cerrado no borra lo pendiente. Lo contiene. Y esa contencion permite dormir."],"materiales":["Una hoja.","Una pluma.","Un sobre.","Un vaso con agua.","Una mesa, silla o superficie fuera de la cama."],"cuando":"Hazlo por la noche, antes de acostarte, especialmente cuando notes que estas repasando pendientes o conversaciones. No lo hagas ya acostado. El cuerpo debe sentir que el cierre ocurre antes de entrar a la cama.","steps":[{"title":"sacar la noche de la cabeza","phrase":"Esto es lo que hago: llevo el dia a la cama.","body":"Siéntate en una mesa o silla, no en la cama. Coloca la hoja frente a ti."},{"title":"volver al cuerpo","phrase":"Mi cuerpo esta aqui. No tengo que resolver todo ahora.","body":"Pon una mano en el pecho y otra en el abdomen."},{"title":"reconocer que sobreviviste el dia","phrase":"Sobrevivi este dia. Mi cuerpo puede descansar.","body":"Pon ambos pies en el suelo. Presiona suavemente los dedos contra el piso."},{"title":"que queda realmente abierto","phrase":"Que necesita esperar hasta manana?","body":"Toma la hoja con ambas manos."},{"title":"cerrar el sobre","phrase":"Cierro este dia. La noche no resuelve. La noche repara.","body":"Dobla la hoja lentamente. Siente el papel doblarse. Escucha el sonido."}],"central":"Cierro este dia. La noche no resuelve. La noche repara.","newPhrase":"Mi cuerpo entra al descanso. Manana vuelvo a mirar.","cierre":["El sobre se queda cerrado durante la noche. No se abre si despiertas a media noche. Si aparece otro pendiente, anotalo en una nota aparte y ponlo encima del sobre, sin abrirlo.","Al dia siguiente, abre el sobre fuera de la cama. Revisa solo la cosa marcada. Decide una accion concreta."],"observar":["Si tardaste menos en dormir.","Si el cuerpo sintio alivio al dejar el sobre fuera.","Si despertaste con menos urgencia mental.","Si aparecio ansiedad por querer abrir el sobre.","Si algun pendiente dejo de parecer tan urgente al dia siguiente."]},{"num":"02","title":"02. La Puerta del Dia","subtitle":"Ritual para cerrar el dia antes de entrar al descanso","para":["Para cuando el dia termino, pero tu cuerpo sigue adentro de el. Sigues contestando mentalmente, repasando lo que hiciste mal, pensando en lo que falto, sintiendo una conversacion, una exigencia o una tension del trabajo.","Este ritual crea una frontera fisica entre el dia y la noche. La puerta se vuelve el limite que el cuerpo puede tocar, cerrar y reconocer."],"principio":["El sistema nervioso entiende mejor los gestos que las ideas. Decir ya voy a descansar no siempre basta, porque el cuerpo sigue actuando como si el dia continuara. En cambio, escribir lo que termina, rasgarlo y cerrar una puerta con la mano produce una senal concreta: algo quedo del otro lado.","La puerta no es metafora decorativa. Es una frontera real. El cuerpo la ve, la toca, escucha el cierre y registra que ya no esta en el mismo espacio."],"materiales":["La puerta de tu cuarto o del espacio donde vas a descansar.","Un papel pequeno.","Una pluma.","Un bote de basura fuera del cuarto."],"cuando":"Hazlo al final del dia, antes de entrar al cuarto o antes de iniciar tu descanso. Funciona especialmente bien cuando vienes de trabajar, atender personas, discutir o resolver problemas.","steps":[{"title":"reconocer que sigues adentro del dia","phrase":"Esto es lo que hago: sigo dentro del dia aunque ya termino.","body":"Quédate de pie frente a la puerta abierta."},{"title":"respirar en el umbral","phrase":"Estoy aqui. Puedo cerrar antes de descansar.","body":"Pon una mano en el pecho y otra en el abdomen."},{"title":"sentir que tienes donde llegar","phrase":"Tengo un lugar donde descansar. Puedo entrar sin cargar todo.","body":"Mira hacia dentro del cuarto o del espacio de descanso."},{"title":"lo que termina hoy","phrase":"Que parte de este dia ya no necesita entrar conmigo?","body":"En el papel pequeno, escribe una frase que nombre lo que debe quedarse fuera."},{"title":"rasgar y cerrar","phrase":"Este dia termina aqui. Mi cuerpo entra al descanso.","body":"Rasga el papel en cuatro pedazos."}],"central":"Este dia termina aqui. Mi cuerpo entra al descanso.","newPhrase":"Esto es noche. Esto es descanso. Estoy dentro.","cierre":["Si durante la noche vuelve el pensamiento del dia, mira la puerta cerrada o imaginala cerrada. No vuelvas al bote. No recuperes el papel.","Al dia siguiente, si algo requiere accion, aparecera con mas claridad. Lo que solo era activacion no necesita ser rescatado."],"observar":["Si el cuerpo sintio diferencia al cerrar la puerta.","Si hubo resistencia a tirar el papel.","Si aparecio alivio, tristeza o cansancio despues del cierre.","Si dormiste con menos sensacion de estar en pendiente.","Si al dia siguiente recuerdas el problema con menos carga corporal."]},{"num":"03","title":"03. La Caja de la Noche","subtitle":"Ritual para dejar el celular antes de dormir","para":["Para cuando el telefono sigue jalando tu atencion aunque ya quieras descansar. Revisas mensajes, redes, noticias, pendientes o silencios. A veces no estas buscando nada especifico: solo sigues mirando, como si algo pudiera aparecer y cambiar la sensacion interna.","El telefono no es el enemigo. Pero de noche puede convertirse en una puerta siempre abierta. Este ritual no busca prohibirte usarlo. Busca devolverle al cuerpo la experiencia de que puede estar sin vigilancia durante unas horas."],"principio":["El celular activa espera. Cada notificacion posible mantiene al sistema nervioso disponible para responder. Aunque no suene, el cuerpo sabe que podria sonar. Esa posibilidad impide que el descanso sea completo.","Poner el telefono en una caja, cubrirlo y hacer un nudo crea una barrera con friccion. No es destruccion: si hay una emergencia real, puedes abrirla. Pero entre el impulso y la accion aparece un gesto fisico que le da tiempo al cuerpo para decidir."],"materiales":["Tu celular.","Una caja pequena con tapa.","Un panuelo, tela o mascada.","Cargador, si lo necesitas.","Una mesa fuera de la cama."],"cuando":"Hazlo 20 a 30 minutos antes de dormir. No esperes a estar agotado. El ritual funciona mejor cuando todavia puedes decidir.","steps":[{"title":"mirar la espera","phrase":"Esto es lo que hago: dejo que una pantalla me mantenga despierto.","body":"Siéntate con el celular en la mano."},{"title":"bajar del impulso al cuerpo","phrase":"Estoy aqui. No tengo que estar disponible toda la noche.","body":"Coloca el telefono boca abajo sobre la mesa."},{"title":"recordar que existes sin la pantalla","phrase":"Tengo cuerpo. Tengo noche. Tengo derecho a apagarme.","body":"Ponte de pie."},{"title":"que busco en el telefono","phrase":"Que estoy esperando encontrar aqui?","body":"Toma el celular apagado o bloqueado entre las manos."},{"title":"guardar y cubrir","phrase":"La noche no me busca. La noche me devuelve.","body":"Pon el celular dentro de la caja."}],"central":"La noche no me busca. La noche me devuelve.","newPhrase":"Estoy conmigo. Esto tambien es suficiente.","cierre":["La caja se abre al dia siguiente, no durante la noche.","Si despiertas y quieres revisar el telefono, toca el nudo primero. Antes de abrir, respira una vez y pregunta: Es emergencia o impulso? Si es impulso, vuelve a la cama. Si es emergencia real, abre."],"observar":["Cuanta urgencia aparece al principio.","Si el cuerpo descansa diferente sin pantalla cerca.","Si hay ansiedad, aburrimiento o tristeza cuando el telefono no esta disponible.","Si despiertas menos durante la noche.","Si al dia siguiente sientes mas claridad o menos saturacion."]},{"num":"04","title":"04. El Ultimo Pensamiento","subtitle":"Ritual para cerrar una preocupacion insistente antes de dormir","para":["Para cuando no tienes toda la mente llena, sino una sola preocupacion que insiste. Una frase, una imagen, un pendiente, una posibilidad. Apagas la luz y eso vuelve. Intentas no pensarlo, pero vuelve mas fuerte.","Este ritual no pelea con el pensamiento. Lo saca del circuito repetitivo y lo coloca en un objeto cerrado hasta manana."],"principio":["Una preocupacion que se repite antes de dormir suele tener una intencion: que no olvides algo, que prevengas algo, que controles algo. Si intentas expulsarla, el cuerpo puede interpretarlo como peligro: si dejo de pensar en esto, algo malo pasara.","El ritual crea un acuerdo corporal: no se niega la preocupacion, se guarda. El libro cerrado funciona como contenedor. Lo que queda dentro no desaparece, pero deja de circular."],"materiales":["Una nota adhesiva o papel pequeno.","Una pluma.","Un libro o cuaderno que pueda cerrarse.","Una mesa de noche o superficie fuera de la cama."],"cuando":"Hazlo cuando aparezca una preocupacion repetitiva antes de dormir. Si hay muchas, usa primero el ritual 01, La Mesa Vacia. Este ritual es para una sola cosa.","steps":[{"title":"atrapar el pensamiento","phrase":"Esto es lo que hago: repito esto para sentir control.","body":"Siéntate fuera de la cama."},{"title":"bajar la repeticion","phrase":"Mi cuerpo esta aqui. Esto es una preocupacion, no una orden.","body":"Coloca la nota sobre una mesa."},{"title":"recordar que puedes volver manana","phrase":"Puedo volver a esto manana. Esta noche no tengo que vigilar.","body":"Toma el libro cerrado entre las manos."},{"title":"que intenta proteger","phrase":"Que intentas proteger en mi?","body":"Mira la nota."},{"title":"cerrar el pensamiento","phrase":"Esto queda cerrado hasta manana.","body":"Dobla la nota una vez."}],"central":"Esto queda cerrado hasta manana.","newPhrase":"No vigilo mientras duermo. Mi cuerpo sabe reparar.","cierre":["Al dia siguiente, abre el libro en un horario despierto, no desde la cama. Lee la nota. Decide si requiere accion real.","Si requiere accion, escribe una accion pequena. Si no requiere accion, rompe la nota y tirala."],"observar":["Si el pensamiento pierde fuerza despues de cerrar el libro.","Si aparece impulso de abrirlo otra vez.","Si el cuerpo puede aceptar manana como respuesta.","Si al dia siguiente la preocupacion parece mas pequena o mas concreta.","Si el sueno mejora cuando el pensamiento tiene contenedor."]},{"num":"05","title":"05. Los Zapatos del Dia","subtitle":"Ritual para empezar el dia sin arrastrar ayer","para":["Para cuando despiertas y el cuerpo ya viene cansado. No necesariamente dormiste mal; simplemente sientes que el dia empieza encima de ti. Hay inercia, desgano, prisa o una sensacion de estar repitiendo ayer.","Este ritual usa los zapatos como objeto de direccion. Antes de salir al mundo, el cuerpo necesita saber que hoy camina este dia, no el anterior."],"principio":["Los pies le informan al sistema nervioso donde estas. Cuando empiezas el dia desde la cabeza, el cuerpo queda atras: piensas pendientes, horarios, obligaciones, pero no sientes el suelo. Entonces el dia se vuelve algo que te empuja.","Ponerte los zapatos lentamente y dar los primeros pasos con intencion crea una senal distinta: no soy arrastrado por el dia; entro en el dia con mis pies."],"materiales":["Los zapatos que usaras ese dia.","Una silla.","Un espacio donde puedas dar al menos tres pasos."],"cuando":"Hazlo por la manana, antes de salir de casa o antes de empezar tu primera actividad importante. No lo hagas con prisa. Toma entre 7 y 10 minutos.","steps":[{"title":"reconocer la inercia","phrase":"Esto es lo que hago: empiezo el dia arrastrando lo de ayer.","body":"Siéntate frente a tus zapatos sin ponertelos todavia."},{"title":"bajar al cuerpo","phrase":"Estoy aqui. Este es otro dia.","body":"Pon una mano en el pecho y otra en el abdomen."},{"title":"sentir los pies antes del camino","phrase":"Tengo pies. Tengo suelo. Puedo empezar desde aqui.","body":"Antes de ponerte los zapatos, coloca ambos pies descalzos o con calcetines sobre el piso."},{"title":"que estoy arrastrando","phrase":"Que estoy intentando meter en este dia que pertenece a ayer?","body":"Toma un zapato con ambas manos."},{"title":"calzar el nuevo dia","phrase":"Este pie entra en este dia.","body":"Ponte el primer zapato lentamente."}],"central":"Este pie entra en este dia.","newPhrase":"Mi primer paso concreto es ___.","cierre":["Durante el dia, si sientes que vuelves a arrastrar ayer, mira tus zapatos o siente tus pies dentro de ellos.","Repite en voz baja:"],"observar":["Si el inicio del dia se siente menos automatico.","Si notas mas presencia en los primeros pasos.","Si aparece resistencia a soltar el dia anterior.","Si la prisa baja aunque sea un poco.","Si el cuerpo recuerda la frase al caminar."]},{"num":"06","title":"06. La Llave de Salida","subtitle":"Ritual para salir de casa con una direccion clara","para":["Para cuando sales de casa disperso, corriendo o con la sensacion de que el dia ya te gano. Llevas llaves, bolsa, pendientes, mensajes, responsabilidades. Pero no llevas una direccion interna.","Este ritual usa la llave como objeto de salida consciente. La llave abre y cierra espacios; tambien puede marcar el paso entre estar en casa y entrar al mundo."],"principio":["Salir de casa es un cambio de estado. El cuerpo cruza un umbral: de lo privado a lo externo, de lo propio a lo social, del descanso a la accion. Cuando ese cruce ocurre con prisa, el sistema nervioso no registra transicion. Solo salta.","Sostener la llave, nombrar una intencion y escuchar la puerta cerrar crea una secuencia fisica de orientacion. No necesitas resolver todo el dia antes de salir. Necesitas una direccion."],"materiales":["La llave de tu casa o del lugar del que sales.","La puerta de salida.","Tu cuerpo de pie, sin celular en la mano."],"cuando":"Hazlo antes de salir de casa, consultorio, oficina o cualquier espacio importante. Funciona especialmente bien en dias con mucho pendiente o ansiedad anticipatoria.","steps":[{"title":"notar la dispersion","phrase":"Esto es lo que hago: salgo corriendo sin saber desde donde salgo.","body":"Párate frente a la puerta de salida con la llave en la mano."},{"title":"respirar antes del umbral","phrase":"Estoy aqui. Todavia no tengo que correr.","body":"Coloca la llave contra el pecho, sosteniendola con una mano."},{"title":"reconocer lo que llevas","phrase":"Llevo recursos. No salgo vacio.","body":"Con la llave en la mano, nombra tres recursos que si llevas contigo."},{"title":"elegir una sola direccion","phrase":"Que direccion necesita mi cuerpo hoy?","body":"Mira la puerta."},{"title":"cruzar el umbral","phrase":"Salgo con una direccion. Una basta.","body":"Abre la puerta lentamente."}],"central":"Salgo con una direccion. Una basta.","newPhrase":"La llevo conmigo. Vuelvo cuando sea tiempo de volver.","cierre":["Durante el dia, si te dispersas, toca la llave o el llavero.","Repite:"],"observar":["Si sales con menos prisa interna.","Si recuerdas la direccion elegida durante el dia.","Si aparece ansiedad por haber elegido solo una cosa.","Si el sonido de la puerta cerrando produce alivio o tension.","Si tocar la llave te ayuda a volver al cuerpo."]},{"num":"07","title":"07. El Vaso de Manana","subtitle":"Ritual para activar el cuerpo antes de trabajar","para":["Para cuando empiezas el dia seco, apagado o desconectado. Ya estas despierto, pero el cuerpo no termina de llegar. Puedes funcionar, pero sin sentirte realmente presente.","Este ritual no busca darte energia artificial. Busca marcar un primer gesto de nutricion: suficiente para empezar."],"principio":["Muchas personas empiezan el dia desde la exigencia: todo lo que falta, todo lo que hay que hacer, todo lo que deberia estar listo. El cuerpo recibe el mensaje de que nunca es suficiente.","Un vaso de agua a la mitad ensena otra cosa: no hace falta estar completo, perfecto o lleno hasta el borde para comenzar. La mitad tambien sostiene. La mitad puede ser suficiente para dar el primer paso."],"materiales":["Un vaso transparente.","Agua.","Una mesa o superficie limpia."],"cuando":"Hazlo por la manana, antes del cafe, antes del celular o antes de iniciar trabajo. Toma entre 5 y 8 minutos.","steps":[{"title":"notar la exigencia de estar lleno","phrase":"Esto es lo que hago: creo que debo estar completo para empezar.","body":"Coloca el vaso vacio frente a ti."},{"title":"respirar con el vaso vacio","phrase":"Estoy aqui. No necesito llenarme de golpe.","body":"Pon una mano alrededor del vaso vacio y otra en el pecho."},{"title":"reconocer lo disponible","phrase":"Tengo algo disponible. Eso basta para empezar.","body":"Llena el vaso exactamente a la mitad."},{"title":"que necesita mi cuerpo primero","phrase":"Que necesita mi cuerpo antes de entrar al dia?","body":"Sostén el vaso con ambas manos."},{"title":"beber la mitad suficiente","phrase":"La mitad es suficiente para empezar.","body":"De pie, sostén el vaso con ambas manos."}],"central":"La mitad es suficiente para empezar.","newPhrase":"Empiezo con lo que tengo. Eso es vida.","cierre":["Durante el dia, cuando aparezca la sensacion de no estoy listo, recuerda el vaso a la mitad.","Repite:"],"observar":["Si el cuerpo empieza el dia con menos exigencia.","Si puedes hacer una primera accion sin esperar sentirte perfecto.","Si aparece incomodidad al dejar el vaso solo a la mitad.","Si hay mas conciencia de sed, hambre o ritmo.","Si la frase vuelve cuando te sientes insuficiente."]},{"num":"08","title":"08. El Hielo en la Mano","subtitle":"Ritual para cuando la ansiedad sube","para":["Para cuando la ansiedad aparece como una ola: pecho apretado, respiracion corta, manos inquietas, pensamientos rapidos, necesidad de controlar algo o salir corriendo de la sensacion.","Este ritual no busca pelear con la ansiedad ni convencerte de que no pasa nada. Busca mostrarle al cuerpo una verdad simple: una ola sube, cambia y baja. Tu cuerpo puede quedarse presente mientras eso ocurre."],"principio":["La ansiedad se vuelve mas fuerte cuando el cuerpo cree que la sensacion no va a terminar. Entonces intenta escapar, controlar, revisar, llamar, comer, comprar, discutir o distraerse.","El hielo le da al sistema nervioso una experiencia fisica concreta: algo intenso puede estar en la mano y cambiar de forma. El frio aparece, se siente fuerte, luego se derrite. No se queda igual. La ansiedad tampoco."],"materiales":["Un cubo de hielo.","Una tela pequena, servilleta o panuelo.","Un plato, vaso o recipiente.","Acceso a lavabo o una planta."],"cuando":"Hazlo cuando la ansiedad este subiendo, pero todavia puedas seguir instrucciones simples. Si estas en panico intenso, primero solo respira, mira alrededor y busca apoyo. Este ritual es para activacion leve a moderada.","steps":[{"title":"reconocer la ola","phrase":"Esto es lo que hago: creo que esta sensacion no va a terminar.","body":"Siéntate o ponte de pie en un lugar seguro."},{"title":"preparar el cuerpo","phrase":"Mi cuerpo esta aqui. Puedo sentir sin salir corriendo.","body":"Pon una mano en el pecho y otra en el abdomen."},{"title":"elegir el contacto","phrase":"Tengo suelo. Tengo manos. Puedo elegir cuanto contacto.","body":"Toca la tela que envuelve el hielo con la punta de los dedos."},{"title":"donde vive la ansiedad","phrase":"Donde esta la ola en mi cuerpo?","body":"Toma el hielo envuelto con una mano."},{"title":"sostener el cambio","phrase":"Esto sube. Esto baja. Yo sigo aqui.","body":"Sostén el hielo envuelto durante 30 a 60 segundos, segun tolerancia."}],"central":"Esto sube. Esto baja. Yo sigo aqui.","newPhrase":"La ola se mueve. No tengo que quedarme atrapado.","cierre":["Guarda la tela extendida para que se seque.","La tela humeda es el ancla: algo intenso paso por ella y ahora se esta secando. No quedo igual, pero tampoco quedo destruida."],"observar":["Si la ansiedad cambio de intensidad.","Si tu cuerpo pudo quedarse con la sensacion sin escapar.","Si aparecio temblor, suspiro, bostezo o calor despues.","Si el frio fue demasiado o adecuado.","Si la frase esto sube, esto baja aparece luego de manera espontanea."]},{"num":"09","title":"09. La Pared que Sostiene","subtitle":"Ritual de emergencia emocional de cinco minutos","para":["Para momentos en que algo se desborda: ganas de llorar, enojo, miedo, temblor, sensacion de caer, confusion o saturacion repentina.","Este ritual no necesita materiales especiales. Usa una pared real para que el cuerpo sienta resistencia, limite y sostén. A veces el sistema nervioso no necesita una explicacion; necesita encontrar algo firme."],"principio":["Cuando una emocion sube rapido, el cuerpo puede sentir que no hay borde. Todo se vuelve demasiado grande. Empujar una pared con las manos activa musculos, orienta el cuerpo en el espacio y devuelve una experiencia concreta: hay algo que me sostiene y algo que me limita.","La pared no se mueve. Y eso ayuda. Frente a una emocion que se mueve demasiado, la pared ofrece estabilidad."],"materiales":["Una pared firme.","Tus manos.","Un espacio donde puedas estar de pie."],"cuando":"Hazlo cuando sientas que una emocion sube y necesitas volver al cuerpo rapido. Puede hacerse en casa, consultorio, bano, pasillo o cualquier lugar donde haya una pared.","steps":[{"title":"reconocer el desborde","phrase":"Esto es lo que hago: siento que esto me rebasa.","body":"Párate frente a una pared, a la distancia de tus brazos."},{"title":"encontrar la exhalacion","phrase":"Estoy aqui. Hay una pared. Hay suelo. Hay cuerpo.","body":"Con las manos en la pared, respira."},{"title":"sentir fuerza disponible","phrase":"Tengo fuerza. No estoy cayendo.","body":"Presiona la pared con ambas manos. No con toda tu fuerza; solo lo suficiente para sentir resistencia."},{"title":"que necesita sostén","phrase":"Que parte de mi necesita sostén ahora?","body":"Mantén las manos en la pared."},{"title":"empujar y soltar","phrase":"Hay algo que me sostiene. No tengo que caer.","body":"Vuelve a presionar la pared, ahora un poco mas firme."}],"central":"Hay algo que me sostiene. No tengo que caer.","newPhrase":"Ahora me apoyo. Mi cuerpo no esta solo.","cierre":["Antes de irte, toca la pared una vez con la palma abierta.","Di:"],"observar":["Si la emocion bajo, cambio o se volvio mas clara.","Si aparecio llanto, suspiro, calor, temblor o cansancio.","Si empujar dio alivio o si fue demasiado.","Si apoyar la espalda produjo sensacion de sostén.","Si el cuerpo recuerda la pared cuando vuelve la saturacion."]},{"num":"10","title":"10. La Bolsa del Exceso","subtitle":"Ritual para cuando todo se siente demasiado","para":["Para cuando no es una sola emocion ni un solo problema: es todo. Pendientes, voces, necesidades de otros, decisiones, mensajes, cansancio, culpa, ruido. El cuerpo siente que lleva mas de lo que puede ordenar.","Este ritual convierte el exceso en objetos pequenos que pueden salir del cuerpo y entrar en una bolsa. No resuelve todo. Pero separa lo que existe de lo que llevas encima."],"principio":["La saturacion aumenta cuando todo se mezcla. El sistema nervioso no distingue entre una tarea, una emocion, una deuda, una conversacion y un miedo; solo registra demasiado.","Escribir cada carga en un papelito y meterla en una bolsa le da forma al exceso. Cerrar la bolsa y ponerla en el suelo cambia la relacion corporal: esto existe, pero no va encima de mi."],"materiales":["Una bolsa de papel, tela o plastico.","Papelitos pequenos.","Una pluma.","Una mesa.","Un lugar en el suelo donde dejar la bolsa."],"cuando":"Hazlo cuando sientas saturacion mental o emocional. Es util al final del dia, antes de trabajar, despues de atender personas o cuando no sabes por donde empezar.","steps":[{"title":"sentir el exceso","phrase":"Esto es lo que hago: cargo todo junto en mi cuerpo.","body":"Coloca la bolsa vacia sobre la mesa."},{"title":"respirar antes de meterlo todo","phrase":"Mi cuerpo esta aqui. Esto ya esta afuera de mi cabeza.","body":"Antes de poner los papelitos en la bolsa, coloca una mano sobre ellos y otra en el pecho."},{"title":"tocar lo que si puedes sostener","phrase":"Tengo manos. Tengo borde. Puedo separar.","body":"Toma la bolsa vacia con ambas manos."},{"title":"que carga pesa mas","phrase":"Cual de estas cargas pesa mas hoy?","body":"Mira los papelitos."},{"title":"cerrar el exceso","phrase":"Esto existe, pero no va encima de mi.","body":"Mete ese primer papelito en la bolsa."}],"central":"Esto existe, pero no va encima de mi.","newPhrase":"Una cosa. Una accion. Eso puedo hacer.","cierre":["La bolsa no se abre completa el mismo dia, salvo que sea necesario. Si te da miedo olvidarla, pon una hora para revisarla manana.","El proposito no es abandonar responsabilidades. Es sacar el exceso del cuerpo para recuperar capacidad de accion."],"observar":["Si el cuerpo se siente mas liviano al ver la bolsa lejos.","Si aparece culpa por no cargar todo.","Si elegir una sola accion produce alivio o resistencia.","Si alguna carga deja de sentirse urgente al dia siguiente.","Si la saturacion baja cuando las cosas estan separadas."]},{"num":"11","title":"11. La Linea en el Piso","subtitle":"Ritual para poner un limite","para":["Para cuando necesitas decir que no, pedir espacio, detener una invasion o recordar que tu cuerpo tiene borde. Sirve antes de una conversacion dificil o despues de sentir que alguien cruzo un limite.","Este ritual usa una linea fisica en el piso para que el cuerpo experimente algo que a veces la mente no logra sostener: aqui termino yo, ahi empieza lo otro."],"principio":["Un limite no empieza en la frase. Empieza en el cuerpo. Si el cuerpo no siente borde, la boca puede decir no y aun asi todo adentro seguir cediendo.","La cinta en el piso convierte el limite en una experiencia visible y tangible. Pararte detras de la linea, levantar la mano y decir una frase breve le da al sistema nervioso una referencia clara: hay un hasta aqui."],"materiales":["Cinta adhesiva de papel o masking tape.","Tijeras, opcional.","Un espacio en el piso donde puedas pararte.","Tu cuaderno o una hoja para pegar un trozo de cinta al final."],"cuando":"Hazlo antes de decir un limite importante, despues de una conversacion donde cediste demasiado o cuando sientas que necesitas recuperar tu espacio.","steps":[{"title":"reconocer la invasion","phrase":"Esto es lo que hago: dejo que crucen mi espacio.","body":"Corta un tramo de cinta y tenlo en la mano."},{"title":"respirar detras de la linea","phrase":"Estoy aqui. Puedo sentir mi borde.","body":"Párate detras de la linea."},{"title":"sentir el espacio propio","phrase":"Tengo cuerpo. Tengo espacio. Tengo derecho a ocuparlo.","body":"Presiona los pies contra el suelo."},{"title":"que limite hace falta","phrase":"Que necesita detenerse aqui?","body":"Mira la linea."},{"title":"levantar la mano","phrase":"Hasta aqui. Este espacio es mio.","body":"Párate firme detras de la linea."}],"central":"Hasta aqui. Este espacio es mio.","newPhrase":"Mi limite queda registrado. No necesito explicarlo todo.","cierre":["Si vas a tener una conversacion real, escribe una sola frase de limite. No un discurso.","Ejemplos:"],"observar":["Si el cuerpo pudo sentir la linea.","Si aparecio culpa al decir hasta aqui.","Si tu voz cambio al repetir la frase.","Si el trozo de cinta en el cuaderno te ayuda a recordar el limite.","Si despues del ritual puedes decir menos y sostener mas."]},{"num":"12","title":"12. La Frase que No Se Trago","subtitle":"Ritual para preparar una conversacion dificil","para":["Para cuando hay algo que necesitas decir, pero el cuerpo se cierra: la garganta se aprieta, el pecho se encoge, aparecen explicaciones largas o miedo a incomodar.","Este ritual no garantiza que la otra persona responda bien. Lo que hace es preparar tu cuerpo para que la frase esencial no se quede tragada."],"principio":["Muchas conversaciones dificiles fallan antes de empezar porque el cuerpo llega sin voz. La mente prepara argumentos, pero la garganta sigue creyendo que hablar es peligroso.","Escribir una sola frase, leerla en voz alta y beber agua despues convierte la expresion en una experiencia fisica: la voz sale, la garganta vibra, el agua pasa. El cuerpo aprende que decir algo necesario no lo destruye."],"materiales":["Un vaso con agua.","Una hoja pequena o tarjeta.","Una pluma.","Un espacio privado."],"cuando":"Hazlo antes de una conversacion importante, antes de enviar un mensaje dificil o despues de notar que estas evitando decir algo.","steps":[{"title":"reconocer el silencio","phrase":"Esto es lo que hago: trago lo que necesito decir.","body":"Siéntate con la hoja frente a ti y el vaso de agua a un lado."},{"title":"abrir espacio para la voz","phrase":"Mi garganta esta aqui. Mi voz tiene espacio.","body":"Pon una mano en el pecho y otra en el abdomen."},{"title":"sentir que puedes hablar","phrase":"Tengo voz. Tengo agua. Puedo decir lo necesario.","body":"Toma el vaso con ambas manos."},{"title":"encontrar la frase esencial","phrase":"Que necesita decir mi garganta sin adornarlo?","body":"En la hoja, escribe la frase que necesitas decir en una sola linea."},{"title":"decir y tragar agua","phrase":"Mi voz sale. Mi cuerpo sigue aqui.","body":"Ponte de pie."}],"central":"Mi voz sale. Mi cuerpo sigue aqui.","newPhrase":"Llevo mi frase. No llevo un discurso.","cierre":["Despues de la conversacion, vuelve a beber agua. Aunque haya salido imperfecta, reconoce que la frase no se quedo completamente adentro.","Di:"],"observar":["Si la garganta se siente distinta.","Si la frase se simplifico.","Si aparece miedo a la reaccion del otro.","Si pudiste decir menos y ser mas claro.","Si despues de hablar aparece cansancio, alivio o temblor."]},{"num":"13","title":"13. Lo Que Alguien Dijo","subtitle":"Ritual para soltar una frase que se quedo dando vueltas","para":["Para cuando alguien dijo algo y la frase se quedo viviendo en tu cuerpo. Una critica, un comentario, una burla, un mensaje frio, una insinuacion, una palabra que se repite aunque la conversacion ya termino.","Este ritual separa la frase ajena de tu sistema. No discute si la persona tuvo razon. Trabaja con otra pregunta: esa frase sigue teniendo derecho a ocupar tu cuerpo?"],"principio":["Las palabras no son solo ideas. Cuando una frase llega con carga emocional, el cuerpo puede guardarla como si fuera un objeto: en la garganta, el pecho, el estomago, la espalda.","Escribir la frase, enrollarla con hilo y cortar el hilo crea una salida fisica. El corte no borra lo ocurrido, pero interrumpe el lazo que mantiene la frase girando adentro."],"materiales":["Una hoja pequena.","Una pluma.","Hilo, estambre o cuerda delgada.","Tijeras.","Bote de basura."],"cuando":"Hazlo cuando una frase ajena siga repitiendose en tu mente o generando reaccion corporal despues de la conversacion.","steps":[{"title":"escuchar la repeticion","phrase":"Esto es lo que hago: repito una frase que no elegi cargar.","body":"Siéntate con la hoja frente a ti."},{"title":"volver a tu voz","phrase":"Estoy aqui. Esta frase esta afuera de mi.","body":"Pon una mano en el pecho y otra en el abdomen."},{"title":"recordar tu propio centro","phrase":"Tengo manos. Puedo tomar y puedo soltar.","body":"Toma el hilo con ambas manos."},{"title":"que parte se engancho","phrase":"Que parte de mi se engancho con esto?","body":"Mira la frase escrita."},{"title":"enrollar y cortar","phrase":"Asi se enredo. Asi lo veo.","body":"Enrolla la hoja hasta formar un tubo pequeno, con la frase hacia adentro."}],"central":"Asi se enredo. Asi lo veo.","newPhrase":"Mis manos quedan libres. Mi voz vuelve a mi.","cierre":["Si la frase vuelve, no discutas con ella. Mira tus manos y recuerda el corte.","Di:"],"observar":["Si la frase pierde volumen interno.","Si aparece otra emocion debajo: tristeza, enojo, verguenza o alivio.","Si tu cuerpo ubica mejor donde se engancho.","Si necesitas poner un limite real con la persona.","Si surge una frase propia mas clara."]},{"num":"14","title":"14. La Silla de la Espera","subtitle":"Ritual para cerrar la espera de un mensaje, llamada o respuesta","para":["Para cuando tu cuerpo se queda pendiente de alguien: un mensaje que no llega, una llamada, una respuesta, una confirmacion, una disculpa, una senal.","No se trata solo del telefono. Se trata de la posicion interna: sentarte a esperar que algo de afuera te diga si estas bien, si importas, si puedes descansar."],"principio":["La espera intermitente mantiene al sistema nervioso activado. No hay cierre, pero tampoco ausencia total. Cada posibilidad de respuesta conserva abierta la expectativa.","Sentarte frente al telefono muestra la escena tal como es: una parte de ti esta esperando. Poner el telefono en una caja y levantarte no destruye el vinculo ni decide por ti. Pero interrumpe el gesto corporal de quedarte ahi."],"materiales":["Una silla.","Tu celular.","Una caja pequena con tapa.","Una tela o panuelo, opcional.","Una ventana, puerta o espacio hacia donde puedas caminar despues."],"cuando":"Hazlo cuando notes que revisas el telefono repetidamente o que tu estado emocional depende de si alguien responde.","steps":[{"title":"sentarte a esperar conscientemente","phrase":"Esto es lo que hago: me siento a esperar una respuesta.","body":"Coloca la silla frente a una mesa o frente a la caja."},{"title":"poner el telefono boca abajo","phrase":"Mi cuerpo esta aqui. No estoy dentro del telefono.","body":"Coloca el telefono boca abajo sobre la mesa."},{"title":"sentir que puedes levantarte","phrase":"Tengo piernas. Puedo moverme aunque no llegue respuesta.","body":"Pon ambos pies firmes en el suelo."},{"title":"que estoy esperando realmente","phrase":"Que estoy esperando que esta respuesta me de?","body":"Toma el telefono, todavia bloqueado."},{"title":"guardar el telefono y levantarte","phrase":"No me quedo sentada esperando mi valor.","body":"Pon el telefono dentro de la caja."}],"central":"No me quedo sentada esperando mi valor.","newPhrase":"Mi vida sigue aqui, antes de cualquier respuesta.","cierre":["Puedes abrir la caja despues de un tiempo concreto: 20 minutos, una hora o al dia siguiente, segun el caso. Decide el tiempo antes de cerrar la caja.","Si al abrir no hay respuesta, no vuelvas a la silla. Repite:"],"observar":["Si el impulso de revisar baja o sube.","Si el cuerpo siente vacio al levantarse.","Si aparece enojo, tristeza o verguenza.","Si la silla vacia produce claridad.","Si puedes hacer una accion propia antes de revisar de nuevo."]},{"num":"15","title":"15. La Taza que Vuelve a Mi","subtitle":"Ritual para recuperar energia despues de atender, cuidar o trabajar","para":["Para cuando terminas de atender, cuidar, ensenar, escuchar o resolver para otros y sientes que algo de ti se quedo afuera. No necesariamente estas triste; estas drenado. Como si hubieras dado presencia, voz, energia o calma y no hubieras vuelto completamente a ti.","Este ritual usa una taza caliente o tibia como objeto de retorno. La taza se sostiene con ambas manos para que el cuerpo reciba algo, no solo siga dando."],"principio":["Quien cuida, atiende o acompana puede acostumbrarse a salir de si mismo para leer al otro: su tono, su dolor, su necesidad, su urgencia. Eso es util, pero si no hay regreso, el cuerpo queda abierto y cansado.","Sostener una taza con ambas manos, nombrar lo que se entrego y beber despacio crea una accion inversa: algo vuelve hacia adentro. El cuerpo deja de operar en modo entrega y entra en modo recepcion."],"materiales":["Una taza.","Agua tibia, te, infusion o bebida caliente segura.","Una silla.","Un lugar tranquilo durante 7 a 10 minutos."],"cuando":"Hazlo despues de consulta, clase, reunion intensa, cuidado de familiares, trabajo emocional o cualquier situacion donde hayas dado mucho de ti.","steps":[{"title":"reconocer la salida","phrase":"Esto es lo que hago: doy y no siempre regreso a mi.","body":"Siéntate con la taza vacia frente a ti."},{"title":"volver a tu respiracion","phrase":"Estoy aqui. Mi cuerpo tambien necesita recibir.","body":"Pon una mano en el pecho y otra en el abdomen."},{"title":"llenar la taza","phrase":"Tengo manos para sostenerme. Tengo algo que vuelve.","body":"Llena la taza con agua tibia, te o infusion."},{"title":"que se quedo afuera","phrase":"Que parte de mi se quedo alla?","body":"Con la taza entre las manos, pregunta en voz alta:"},{"title":"beber el retorno","phrase":"Vuelvo a mi. Lo que doy no me vacia.","body":"Acerca la taza a la boca."}],"central":"Vuelvo a mi. Lo que doy no me vacia.","newPhrase":"Lo que es mio vuelve a su lugar.","cierre":["Esta taza puede convertirse en tu taza de regreso. No tiene que ser especial, pero si la usas repetidamente, el cuerpo la reconocera como senal de retorno.","No uses este ritual mientras sigues trabajando. Hazlo como frontera entre dar y volver."],"observar":["Si el cansancio cambia de calidad.","Si aparece emocion al nombrar lo que se quedo afuera.","Si cuesta recibir sin hacer otra cosa al mismo tiempo.","Si lavar la taza produce sensacion de cierre.","Si el cuerpo identifica mejor cuando ya dio suficiente."]},{"num":"16","title":"16. El Cierre de Jornada","subtitle":"Ritual para separar trabajo de casa","para":["Para cuando el trabajo termina, pero sigue caminando contigo: pendientes en la cabeza, conversaciones internas, mensajes por contestar, preocupaciones por manana, sensacion de que nunca se acaba.","Este ritual crea un cierre fisico de jornada. No pretende que todo quede resuelto. Pretende que el cuerpo sepa donde termina el trabajo por hoy."],"principio":["El trabajo se vuelve invasivo cuando no tiene borde. Si todo queda abierto, el sistema nervioso sigue procesando en segundo plano, aun durante la comida, el descanso o la convivencia.","Escribir tres pendientes reales, cerrar el cuaderno y atarlo con una liga o cinta le da al cuerpo una senal concreta: esto queda contenido. Manana puede abrirse. Hoy no tiene que vivir en mi pecho."],"materiales":["Un cuaderno o libreta.","Una pluma.","Una liga, cinta o cordon.","Una mesa de trabajo."],"cuando":"Hazlo al terminar tu jornada laboral, despues de consulta, al cerrar la computadora o antes de salir del espacio de trabajo.","steps":[{"title":"reconocer que el trabajo sigue abierto","phrase":"Esto es lo que hago: dejo el trabajo abierto dentro de mi.","body":"Siéntate frente al cuaderno abierto."},{"title":"bajar el ritmo","phrase":"Estoy aqui. Puedo cerrar sin terminarlo todo.","body":"Pon la pluma sobre la mesa."},{"title":"distinguir pendiente de amenaza","phrase":"Son pendientes. No son mi cuerpo.","body":"Toma la pluma."},{"title":"que queda mas cargado","phrase":"Cual de estos quiere seguir viviendo en mi despues de cerrar?","body":"Mira los tres pendientes."},{"title":"cerrar y atar","phrase":"El trabajo queda aqui. Mi cuerpo vuelve a casa.","body":"Cierra el cuaderno con ambas manos."}],"central":"El trabajo queda aqui. Mi cuerpo vuelve a casa.","newPhrase":"Salgo del trabajo. Entro en mi vida.","cierre":["El cuaderno se abre hasta la siguiente jornada. Si aparece otro pendiente, anotalo en una hoja externa y dejala encima, sin abrir el cuaderno.","La regla es simple: no se rompe el cierre por ansiedad."],"observar":["Si el cuerpo siente diferencia al ver el cuaderno atado.","Si aparece impulso de abrirlo.","Si descansas mejor al tener solo tres pendientes.","Si el trabajo invade menos la casa.","Si el pendiente marcado pierde o gana claridad al dia siguiente."]},{"num":"17","title":"17. El Billete que No Me Achica","subtitle":"Ritual para cobrar, pagar o mirar dinero sin encogerte","para":["Para cuando el dinero activa contraccion: cobrar te da pena, poner precio te incomoda, pagar te genera culpa, mirar cuentas te achica o hablar de valor te pone en defensa.","Este ritual no promete abundancia ni cambia tus finanzas por magia. Trabaja con algo mas basico: que tu cuerpo pueda mirar el dinero sin hacerse pequeno."],"principio":["El dinero no es solo numero. Para muchas personas esta cargado de historia: deuda, verguenza, comparacion, miedo, sacrificio, culpa, permiso, valor propio. Por eso el cuerpo reacciona antes de que la mente piense.","Sostener un billete o moneda de pie, nombrar algo que tiene valor y guardarlo en un sobre marcado crea una experiencia concreta: puedo mirar valor sin esconderme."],"materiales":["Un billete o moneda de cualquier denominacion.","Un sobre.","Una pluma o marcador.","Una mesa."],"cuando":"Hazlo antes de cobrar, poner precio, enviar una cotizacion, pagar algo importante, revisar cuentas o trabajar una sensacion de verguenza con el dinero.","steps":[{"title":"reconocer el encogimiento","phrase":"Esto es lo que hago: miro el dinero y me hago pequeno.","body":"Coloca el billete o moneda sobre la mesa."},{"title":"respirar frente al dinero","phrase":"Estoy aqui. Esto es dinero, no una sentencia.","body":"Pon una mano en el pecho y otra en el abdomen."},{"title":"sostener valor","phrase":"Tengo trabajo. Tengo historia. Tengo algo que ofrecer.","body":"Toma el billete o moneda con ambas manos."},{"title":"que historia aparece","phrase":"Que historia aparece cuando miro valor?","body":"Sostén el billete o moneda frente al pecho."},{"title":"guardar valor sin esconderte","phrase":"Puedo mirar el dinero sin hacerme pequeno.","body":"Toma el sobre."}],"central":"Puedo mirar el dinero sin hacerme pequeno.","newPhrase":"El valor tiene lugar. Yo tambien.","cierre":["El sobre VALOR se queda durante 7 dias en un lugar visible o accesible. No es amuleto; es recordatorio corporal.","Cuando vuelvas a hablar de dinero, toca el sobre primero si lo necesitas."],"observar":["Si el cuerpo se encogio menos al mirar dinero.","Si aparecio culpa, verguenza o enojo.","Si nombrar valor propio fue dificil.","Si la accion concreta fue mas facil despues del ritual.","Si aparece una historia familiar o antigua sobre cobrar, pagar o merecer."]},{"num":"18","title":"18. La Piedra que No Era Mia","subtitle":"Ritual para soltar culpa o carga ajena","para":["Para cuando cargas algo que no sabes si te corresponde: la tristeza de alguien, la culpa de no hacer suficiente, la responsabilidad por el enojo de otro, el peso de sostener a una persona, una familia o una historia.","Este ritual no busca volverte indiferente. Busca distinguir entre cuidar y cargar. Puedes amar, acompanar o responder sin llevar en el cuerpo lo que no es tuyo."],"principio":["La culpa se vuelve confusa porque pesa parecido a la responsabilidad. El cuerpo no siempre distingue entre esto me toca y esto lo cargo para que otro no lo sienta. Por eso hace falta un objeto con peso real.","La piedra permite sentir la carga en la mano. La etiqueta le da nombre. Quitar la etiqueta y lavar la piedra crea una separacion fisica: la carga fue reconocida, pero no queda pegada igual."],"materiales":["Una piedra que quepa en la mano.","Una etiqueta adhesiva o papel pequeno.","Cinta adhesiva, si usas papel.","Pluma o marcador.","Agua.","Una toalla o servilleta."],"cuando":"Hazlo cuando sientas culpa, peso emocional o responsabilidad excesiva por otra persona. No lo uses para evadir una responsabilidad concreta; usalo para separar carga ajena de accion propia.","steps":[{"title":"sentir el peso","phrase":"Esto es lo que hago: cargo algo sin saber si es mio.","body":"Sostén la piedra en una mano."},{"title":"respirar con la carga visible","phrase":"Mi cuerpo esta aqui. Puedo mirar esta carga.","body":"Pon la mano que sostiene la piedra sobre tu regazo o frente a ti."},{"title":"reconocer capacidad sin exceso","phrase":"Tengo manos. Puedo sostener, pero tambien puedo soltar.","body":"Cambia la piedra de mano."},{"title":"nombrar la carga","phrase":"Que parte de esto realmente me pertenece?","body":"Escribe en la etiqueta una palabra o frase corta que nombre lo que cargas."},{"title":"despegar y lavar","phrase":"Reconozco esta carga. No toda me pertenece.","body":"Sostén la piedra con la etiqueta."}],"central":"Reconozco esta carga. No toda me pertenece.","newPhrase":"Puedo cuidar sin cargarlo todo.","cierre":["La piedra no vuelve a tu cama ni a tu bolsa. Si quieres conservarla, que sea fuera del espacio intimo. La carga fue reconocida, lavada y reubicada.","Si la culpa vuelve, no repitas todo de inmediato. Primero mira la piedra y pregunta: Que accion concreta me toca, si es que me toca alguna?"],"observar":["Si la culpa baja o cambia de forma.","Si aparece miedo a ser egoista.","Si puedes distinguir accion propia de peso ajeno.","Si el cuerpo se siente mas liviano o mas triste.","Si surge una conversacion o limite necesario."]},{"num":"19","title":"19. Devuelto al Remitente","subtitle":"Ritual para devolver una expectativa familiar o ajena","para":["Para cuando cargas un mandato pequeno pero persistente: no falles, no incomodes, se fuerte, callate, se buena persona, no superes a nadie, no cobres tanto, no descanses, no digas que no.","No siempre viene como orden directa. A veces llega como mirada, costumbre, frase familiar o expectativa silenciosa. Este ritual no rompe el vinculo con nadie. Devuelve una expectativa que no quieres seguir cargando igual."],"principio":["Muchas expectativas llegan antes de que podamos elegir. El cuerpo las toma como instrucciones de pertenencia: si hago esto, sigo siendo aceptado; si no lo hago, algo se rompe.","Escribir el mandato, romperlo y meterlo en un sobre marcado Devuelto al remitente crea un acto de diferenciacion. No destruye a la persona ni a la familia. Devuelve una carga simbolica al lugar de donde vino."],"materiales":["Una hoja.","Un sobre.","Pluma o marcador.","Una mesa.","Un lugar donde guardar el sobre durante 7 dias."],"cuando":"Hazlo cuando identifiques una expectativa que sigues obedeciendo automaticamente, aunque ya no te haga bien.","steps":[{"title":"reconocer el mandato","phrase":"Esto es lo que hago: obedezco una expectativa que no elegi.","body":"Siéntate frente a la hoja."},{"title":"respirar antes de devolver","phrase":"Estoy aqui. Puedo mirar esto sin obedecerlo todavia.","body":"Pon una mano sobre la hoja y otra en el pecho."},{"title":"reconocer que hay eleccion","phrase":"Tengo opcion. Puedo recibir, revisar y devolver.","body":"Toma el sobre vacio."},{"title":"de donde viene","phrase":"De donde aprendi que tenia que vivir asi?","body":"Mira la frase escrita."},{"title":"romper y devolver","phrase":"Esto llego a mi. Hoy no lo cargo igual.","body":"Lee la frase una ultima vez."}],"central":"Esto llego a mi. Hoy no lo cargo igual.","newPhrase":"Elijo una forma nueva. No necesito cargar la antigua igual.","cierre":["Despues de 7 dias, decide:","si el mandato perdio fuerza, tira el sobre\nsi aun pesa, repite el ritual con una frase mas especifica\nsi requiere una conversacion real, escribe una accion concreta"],"observar":["Si aparece culpa o miedo de traicionar.","Si notas que el mandato opera en situaciones pequenas.","Si la frase nueva se siente posible o lejana.","Si el cuerpo se relaja o se activa despues de cerrar el sobre.","Si aparece claridad sobre una accion pendiente."]},{"num":"20","title":"20. El Plato de Lo Mio y Lo Tuyo","subtitle":"Ritual para distinguir responsabilidad de sacrificio","para":["Para cuando confundes amar con cargar todo. Te haces responsable de emociones, decisiones, consecuencias o necesidades que no son completamente tuyas. Terminas agotado, resentido o culpable, pero sigues diciendo si no lo hago yo, nadie lo hace.","Este ritual separa visual y fisicamente lo que te toca de lo que no te toca. No elimina el cuidado. Le devuelve borde."],"principio":["El sacrificio se instala cuando todo cae en el mismo plato. Lo mio, lo tuyo, lo urgente, lo emocional, lo historico, lo que puedo hacer y lo que no puedo controlar. Si todo esta junto, el cuerpo intenta cargarlo todo.","Dos platos o dos hojas crean una separacion concreta. Mover papelitos de un lado a otro ayuda al cuerpo a entender que amar no significa absorber todas las responsabilidades."],"materiales":["Dos platos, o dos hojas si no quieres usar platos.","Papelitos pequenos.","Pluma.","Una mesa."],"cuando":"Hazlo cuando estes cargando una relacion, familia, trabajo o situacion donde no distingues que es tuyo y que pertenece a otra persona.","steps":[{"title":"poner todo junto","phrase":"Esto es lo que hago: pongo todo junto y lo cargo todo.","body":"Coloca un solo plato u hoja frente a ti."},{"title":"respirar frente al monton","phrase":"Mi cuerpo esta aqui. Puedo separar antes de cargar.","body":"Mira el plato lleno."},{"title":"preparar dos espacios","phrase":"Tengo dos espacios. No todo pertenece al mismo lugar.","body":"Coloca dos platos u hojas frente a ti."},{"title":"separar con honestidad","phrase":"Esto me toca a mi, o lo estoy cargando por otro?","body":"Toma cada papelito del monton y preguntale al cuerpo:"},{"title":"retirar lo que no corresponde","phrase":"Puedo amar sin cargar lo que no me toca.","body":"Toma el plato u hoja TUYO/NO MIO."}],"central":"Puedo amar sin cargar lo que no me toca.","newPhrase":"Esto si me toca. Esto puedo atender.","cierre":["Conserva el papel MIO que elegiste.","Cierra o dobla la hoja/plato TUYO/NO MIO y dejalo aparte. Si son papelitos que no requieren accion, tiralos. Si requieren conversacion, guardalos en un sobre marcado para hablar, no para cargar."],"observar":["Si aparece culpa al alejar lo que no es tuyo.","Si el plato MIO se siente mas manejable.","Si descubres que estabas cargando reacciones ajenas.","Si aparece una accion concreta mas clara.","Si necesitas repetir el ritual con una relacion especifica."]},{"num":"21","title":"21. La Mano que Vuelve","subtitle":"Ritual de cierre e integracion del cuaderno","para":["Para cerrar un ciclo de uso del cuaderno. Puede hacerse despues de completar varios rituales, al terminar los 21, o cuando sientas que algo importante volvio a tu cuerpo: voz, descanso, limite, direccion, energia, calma o presencia.","Este ritual no abre un tema nuevo. Integra lo movido. La mano se vuelve mapa de lo que regreso."],"principio":["Despues de mover patrones, el cuerpo necesita registrar que algo cambio. Si solo pasas al siguiente ritual, puedes acumular experiencias sin integrarlas. Cerrar es tan importante como abrir.","Trazar tu mano en una hoja crea una imagen fisica de presencia: esta es mi mano, este es mi cuerpo, esto volvio a mi. Colocar encima un objeto usado en algun ritual une memoria, accion y cuerpo."],"materiales":["Una hoja.","Pluma o marcador.","Un objeto usado en algun ritual anterior: piedra, sobre, taza, trozo de cinta, llave, tela, tarjeta, etc.","Tu cuaderno."],"cuando":"Hazlo al terminar el cuaderno, despues de una semana de practica o cuando sientas que necesitas integrar antes de seguir moviendo cosas.","steps":[{"title":"reconocer que has estado moviendo","phrase":"Esto es lo que hice: movi algo que mi cuerpo cargaba.","body":"Coloca frente a ti el objeto elegido de un ritual anterior."},{"title":"llegar al cierre","phrase":"Estoy aqui. Puedo cerrar y recibir lo que cambio.","body":"Pon una mano en el pecho y otra en el abdomen."},{"title":"sentir la mano propia","phrase":"Esta es mi mano. Este es mi cuerpo. Estoy aqui.","body":"Extiende una mano sobre la hoja."},{"title":"que volvio","phrase":"Que volvio a mi cuerpo?","body":"Traza el contorno de tu mano sobre la hoja."},{"title":"sellar la integracion","phrase":"Esto volvio a mi cuerpo. Lo reconozco.","body":"Coloca el objeto elegido encima del centro de la mano dibujada."}],"central":"Esto volvio a mi cuerpo. Lo reconozco.","newPhrase":"No termino perfecto. Termino presente.","cierre":["Este ritual cierra el ciclo. No hagas otro ritual profundo el mismo dia. Deja que el cuerpo integre.","Si quieres continuar, vuelve al indice y elige solo un ritual para repetir durante la semana siguiente."],"observar":["Si puedes reconocer cambios pequenos sin exigir una transformacion total.","Si algun ritual del cuaderno aparece como el mas importante.","Si el objeto elegido despierta una memoria corporal.","Si hay cansancio, alivio, orgullo, tristeza o calma.","Si surge una practica que quieras sostener."]}];

const DCCtx = React.createContext(null);
function DesignCanvas({ children }) {
  const [focus, setFocus] = React.useState(null);
  const api = React.useMemo(() => ({ focus, setFocus }), [focus]);
  const registry = {}, sectionMeta = {};
  React.Children.forEach(children, sec => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    const ids = [];
    React.Children.forEach(sec.props.children, ab => {
      if (!ab || (ab.type !== DCArtboard && ab.type !== Board)) return;
      const aid = ab.props.id ?? ab.props.label;
      registry[`${sid}/${aid}`] = { sectionId:sid, artboard:ab };
      ids.push(aid);
    });
    sectionMeta[sid] = { slotIds:ids };
  });
  React.useEffect(() => {
    const k = e => { if (e.key==='Escape') setFocus(null); };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  }, []);
  return <DCCtx.Provider value={api}><DCViewport>{children}</DCViewport>{focus && registry[focus] && <DCFocusOverlay entry={registry[focus]} sectionMeta={sectionMeta}/>}</DCCtx.Provider>;
}
function DCViewport({ children }) {
  const vpRef = React.useRef(null), worldRef = React.useRef(null);
  const tf = React.useRef({ x:0, y:0, scale:1 });
  const apply = React.useCallback(() => {
    const {x,y,scale}=tf.current;
    if(worldRef.current) worldRef.current.style.transform=`translate3d(${x}px,${y}px,0) scale(${scale})`;
  },[]);
  React.useEffect(() => {
    const vp = vpRef.current; if(!vp) return;
    const zoomAt=(cx,cy,f)=>{const r=vp.getBoundingClientRect(),t=tf.current,n=Math.min(8,Math.max(0.1,t.scale*f)),k=n/t.scale;t.x=(cx-r.left)-((cx-r.left)-t.x)*k;t.y=(cy-r.top)-((cy-r.top)-t.y)*k;t.scale=n;apply();};
    let drag=null;
    const onW=e=>{e.preventDefault();if(e.ctrlKey){zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.01))}else{tf.current.x-=e.deltaX;tf.current.y-=e.deltaY;apply();}};
    const onPD=e=>{if(!(e.button===1||(e.button===0&&!e.target.closest('[data-dc-slot]'))))return;e.preventDefault();vp.setPointerCapture(e.pointerId);drag={id:e.pointerId,lx:e.clientX,ly:e.clientY};vp.style.cursor='grabbing';};
    const onPM=e=>{if(!drag||e.pointerId!==drag.id)return;tf.current.x+=e.clientX-drag.lx;tf.current.y+=e.clientY-drag.ly;drag.lx=e.clientX;drag.ly=e.clientY;apply();};
    const onPU=e=>{if(!drag||e.pointerId!==drag.id)return;vp.releasePointerCapture(e.pointerId);drag=null;vp.style.cursor='';};
    vp.addEventListener('wheel',onW,{passive:false}); vp.addEventListener('pointerdown',onPD); vp.addEventListener('pointermove',onPM); vp.addEventListener('pointerup',onPU);
    return()=>{vp.removeEventListener('wheel',onW);vp.removeEventListener('pointerdown',onPD);vp.removeEventListener('pointermove',onPM);vp.removeEventListener('pointerup',onPU);};
  },[apply]);
  const grid=`url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='rgba(0,0,0,0.055)' stroke-width='1'/%3E%3C/svg%3E")`;
  return <div ref={vpRef} style={{height:'100vh',width:'100vw',background:'#f0ede8',overflow:'hidden',overscrollBehavior:'none',touchAction:'none',position:'relative'}}><div ref={worldRef} style={{position:'absolute',top:0,left:0,transformOrigin:'0 0',willChange:'transform',width:'max-content',minWidth:'100%',minHeight:'100%',padding:'60px 0 80px'}}><div style={{position:'absolute',inset:-6000,backgroundImage:grid,backgroundSize:'120px 120px',pointerEvents:'none',zIndex:-1}}/>{children}</div></div>;
}
function DCSection({ id, title, children, gap=40 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const abs = React.Children.toArray(children).filter(c=>c&&(c.type===DCArtboard || c.type===Board));
  return <div style={{marginBottom:72}}><div style={{padding:'0 60px 40px',fontSize:22,fontWeight:600,color:'rgba(40,30,20,0.85)',fontFamily:'-apple-system,sans-serif'}}>{title}</div><div style={{display:'flex',gap,padding:'0 60px',alignItems:'flex-start',width:'max-content'}}>{abs.map(ab=>{const aid=ab.props.id??ab.props.label;return <div key={aid} data-dc-slot={aid} style={{position:'relative',flexShrink:0}}><div style={{position:'absolute',bottom:'100%',left:-4,marginBottom:4,fontSize:13,fontWeight:500,color:'rgba(60,50,40,0.7)',fontFamily:'-apple-system,sans-serif',padding:'0 6px 3px',userSelect:'none'}}>{ab.props.label}</div><button className="dc-exp" onClick={()=>ctx&&ctx.setFocus(`${sid}/${aid}`)}><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg></button><div style={{borderRadius:2,boxShadow:'0 1px 3px rgba(0,0,0,.09),0 4px 16px rgba(0,0,0,.07)',overflow:'hidden',width:ab.props.width||450,height:ab.props.height||690}}>{artboardContent(ab)}</div></div>})}</div></div>;
}
function DCArtboard(){return null}
function artboardContent(ab){ return ab.type===Board ? <S>{ab.props.children}</S> : ab.props.children; }
function DCFocusOverlay({ entry, sectionMeta }) {
  const ctx = React.useContext(DCCtx); const { sectionId, artboard } = entry; const aid = artboard.props.id ?? artboard.props.label; const peers = sectionMeta[sectionId]?.slotIds||[]; const idx = peers.indexOf(aid);
  const go = d => { const n=peers[(idx+d+peers.length)%peers.length]; if(n) ctx.setFocus(`${sectionId}/${n}`); };
  React.useEffect(()=>{const k=e=>{if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}if(e.key==='ArrowRight'){e.preventDefault();go(1)}};document.addEventListener('keydown',k);return()=>document.removeEventListener('keydown',k);});
  const [vp,setVp]=React.useState({w:window.innerWidth,h:window.innerHeight}); React.useEffect(()=>{const r=()=>setVp({w:window.innerWidth,h:window.innerHeight});window.addEventListener('resize',r);return()=>window.removeEventListener('resize',r)},[]);
  const {width=450,height=690}=artboard.props; const scale=Math.max(0.1,Math.min((vp.w-160)/width,(vp.h-220)/height,2));
  return ReactDOM.createPortal(<div onClick={()=>ctx.setFocus(null)} style={{position:'fixed',inset:0,zIndex:100,background:'rgba(0,0,0,.72)',backdropFilter:'blur(16px)'}}><div onClick={e=>e.stopPropagation()} style={{position:'absolute',top:0,right:0,padding:16}}><button onClick={()=>ctx.setFocus(null)} style={{border:'none',background:'transparent',color:'rgba(255,255,255,.6)',width:32,height:32,borderRadius:16,fontSize:22,cursor:'pointer',lineHeight:1}}>×</button></div><div style={{position:'absolute',top:60,bottom:48,left:80,right:80,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14}}><div onClick={e=>e.stopPropagation()} style={{width:width*scale,height:height*scale,position:'relative'}}><div style={{width,height,transform:`scale(${scale})`,transformOrigin:'top left',background:'#fff',overflow:'hidden',boxShadow:'0 20px 80px rgba(0,0,0,.45)'}}>{artboardContent(artboard)}</div></div><div style={{fontSize:13,opacity:.8,color:'#fff',fontFamily:'-apple-system,sans-serif'}}>{artboard.props.label} <span style={{opacity:.5}}>{idx+1}/{peers.length}</span></div></div></div>, document.body);
}

    <Ct>
      <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
        <Vortex size={16} color={C.ink}/>
        <div>
          <div style={{fontFamily:MONO,fontSize:7,letterSpacing:'0.15em',textTransform:'uppercase',color:C.grey,lineHeight:1.3}}>Instituto</div>
          <div style={{fontFamily:MONO,fontSize:7,letterSpacing:'0.15em',textTransform:'uppercase',color:C.grey,lineHeight:1.3}}>Centrobioenergetica</div>
        </div>
      </div>
      <div style={{marginTop:24,fontFamily:MONO,fontSize:8.5,letterSpacing:'0.14em',textTransform:'uppercase',color:C.grey,flexShrink:0}}>Actos que Mueven · Libro de rituales</div>
      <div style={{marginTop:12,flexShrink:0}}>
        <div style={{fontFamily:SERIF,fontSize:47,fontWeight:300,lineHeight:0.92,color:C.ink}}>
          Rituales<br/><em style={{fontStyle:'italic',color:C.grey}}>para la</em><br/>Vida Diaria
        </div>
      </div>
      <div style={{marginTop:15,width:40,height:1,background:C.ink,flexShrink:0}}/>
      <div style={{marginTop:11,fontFamily:SERIF,fontSize:14.5,fontWeight:300,fontStyle:'italic',color:C.grey,lineHeight:1.45,flexShrink:0}}>
        Libro de rituales para la vida cotidiana
      </div>
      <div style={{marginTop:9,fontSize:10.5,color:C.grey,lineHeight:1.5,width:270,flexShrink:0}}>
        Actos cotidianos para descanso, limites, direccion, energia e integracion corporal.
      </div>
      <div style={{flex:1}}/>
      <div style={{border:`1px solid ${C.rule}`,padding:'11px 13px',flexShrink:0}}>
        <Lbl color={C.grey}>Nombre</Lbl>
        <div style={{height:1,background:C.rule,marginTop:6,marginBottom:10}}/>
        <Lbl color={C.grey}>Fecha</Lbl>
        <div style={{height:1,background:C.rule,marginTop:6}}/>
      </div>
      <div style={{marginTop:11,paddingTop:8,borderTop:`1px solid ${C.rule}`,flexShrink:0,display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
        <div>
          <div style={{fontFamily:MONO,fontSize:8,letterSpacing:'0.12em',textTransform:'uppercase',color:C.grey}}>Dr. Miguel Ojeda Rios</div>
          <div style={{fontFamily:MONO,fontSize:7,letterSpacing:'0.08em',color:C.grey,marginTop:2}}>Ritual Experiencing · Bioenergetica V4</div>
        </div>
        <div style={{fontFamily:SERIF,fontSize:12,fontWeight:300,color:C.grey}}>2026</div>
      </div>
    </Ct>
  </Pg>;
}
function Guide({pgN}){
  return <Pg><Ct><Lbl color={C.ink}>Como usar este libro</Lbl><Heading>Hazlo para mover algo, no para entenderlo todo.</Heading><Rule color={C.siena+'35'} my={10}/><P>Este libro contiene rituales breves para la vida diaria. No son meditaciones ni ejercicios de reflexion. Cada ritual usa un objeto, una accion fisica y una frase dicha en voz alta para darle al cuerpo una experiencia distinta.</P><P>Elige un ritual por situacion. No hagas varios rituales profundos el mismo dia. Si el cuerpo se abruma, vuelve a la respiracion, toca el suelo, mira alrededor y busca apoyo.</P><Mini>Reglas basicas</Mini>{['Di las frases en voz alta.','No saltes la pausa despues del acto central.','Haz la accion nueva, aunque sea pequena.','Observa el cuerpo despues, no solo lo que piensas.','Si hay crisis, riesgo o trauma activo, busca acompanamiento.'].map(x=><Bullet key={x}>{x}</Bullet>)}<Rule my={10}/><Mini>La secuencia TAME</Mini>{['Inducir el cambio: mirar el patron de frente.','Generar regulacion: volver a ventana de tolerancia.','Colocar en recursos: sentir lo que si tienes.','Ampliar conciencia: preguntar al cuerpo.','Influir sobre N3: acto fisico, frase, pausa y accion nueva.'].map(x=><Bullet key={x}>{x}</Bullet>)}<PgN n={pgN}/></Ct></Pg>;
}
function IndexPage({pgN}){
  return <Pg><Ct><Lbl color={C.ink}>Indice de rituales</Lbl><Heading>Veintiun actos cotidianos</Heading><Rule color={C.siena+'35'} my={8}/><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px 14px',marginTop:2}}>{RITUALES.map((r,i)=><div key={r.num} style={{display:'flex',gap:5,borderBottom:`1px solid ${C.rule}`,padding:'2px 0 3px',alignItems:'baseline'}}><span style={{fontFamily:MONO,fontSize:6.5,color:C.sienaL,width:13}}>{r.num}</span><span style={{fontSize:8.3,color:C.ink,lineHeight:1.1}}>{r.title.replace(/^\d+\.\s*/,'')}</span></div>)}</div><div style={{marginTop:14,padding:9,border:`1px solid ${C.siena}30`,background:C.arenaL}}><Mini>Modo sugerido</Mini><P style={{marginBottom:0}}>Usa los rituales como un mapa, no como una lista obligatoria. Algunos son para noche, otros para manana, ansiedad, vinculos, trabajo, dinero, culpa o cierre.</P></div><PgN n={pgN}/></Ct></Pg>;
}
function RitualIntro({r,pgN}){
  return <Pg><Ct><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}}><div><Lbl color={C.ink}>Ritual {r.num}</Lbl><Heading>{r.title.replace(/^\d+\.\s*/,'')}</Heading></div><Vortex size={32} color={C.ink}/></div><P style={{fontStyle:'italic',color:C.siena,marginTop:5}}>{r.subtitle.replace(/^Ritual\s+/, '')}</P><Rule color={C.siena+'35'} my={8}/><Mini>Para quien es</Mini>{r.para.map((p,i)=><P key={i}>{p}</P>)}<Mini>Principio</Mini>{r.principio.map((p,i)=><P key={i}>{p}</P>)}<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:2,overflow:'hidden'}}><div><Mini>Materiales</Mini>{r.materiales.slice(0,7).map(x=><Bullet key={x}>{x}</Bullet>)}</div><div><Mini>Cuando hacerlo</Mini><P>{r.cuando}</P></div></div><PgN n={pgN}/></Ct></Pg>;
}
function RitualTame({r,pgN}){
  return <Pg><Ct><Lbl color={C.ink}>Ritual {r.num} · TAME</Lbl><Heading>{r.title.replace(/^\d+\.\s*/,'')}</Heading><Rule color={C.siena+'35'} my={8}/>{r.steps.map((s,i)=><div key={i} style={{display:'flex',gap:7,marginBottom:6.5,flexShrink:0}}><div style={{fontFamily:MONO,fontSize:6.5,color:C.sienaL,width:12,paddingTop:2}}>{i+1}</div><div style={{flex:1}}><div style={{fontSize:9.5,color:C.siena,fontWeight:500,lineHeight:1.12}}>{s.title}</div>{s.body&&<P style={{fontSize:8.1,marginBottom:2,lineHeight:1.32}}>{s.body}</P>}{s.phrase&&<Quote>{s.phrase}</Quote>}</div></div>)}<Rule my={6}/><Mini>Accion nueva</Mini>{r.newPhrase ? <Quote>{r.newPhrase}</Quote> : <P>{r.cierre[0]}</P>}<Mini>Observa despues</Mini>{r.observar.slice(0,4).map(x=><Bullet key={x}>{x}</Bullet>)}<PgN n={pgN}/></Ct></Pg>;
}
function Registro({pgN}){
  return <Pg><Ct><Lbl color={C.ink}>Registro de integracion</Lbl><Heading>Lo que se movio en mi cuerpo</Heading><Rule color={C.siena+'35'} my={10}/><P>Usa esta pagina despues de cualquier ritual. Registra sensaciones, no solo ideas.</P>{['Ritual realizado','Objeto usado','Frase que movio algo','Donde lo senti en el cuerpo','Que cambio despues de la pausa','Que accion nueva hice'].map(x=><div key={x} style={{marginTop:8,flexShrink:0}}><Mini>{x}</Mini><div style={{height:22,borderBottom:`1px solid ${C.rule}`}}/></div>)}<NoteLines/><PgN n={pgN}/></Ct></Pg>;
}
function Back(){
  return <Pg bg={C.warm}><Ct style={{alignItems:'center',justifyContent:'center',textAlign:'center'}}><Vortex size={70} color={C.ink}/><div style={{fontSize:26,fontStyle:'italic',fontWeight:300,color:C.ink,lineHeight:1.05,marginTop:24}}>No termino perfecto.<br/>Termino presente.</div><div style={{fontSize:11,color:C.grey,lineHeight:1.55,marginTop:22,width:250}}>Un ritual no borra la vida. Le da al cuerpo una experiencia nueva para volver a habitarla.</div><Rule color="#11111155" my={24}/><div style={{fontSize:8.5,color:C.grey,fontFamily:MONO,letterSpacing:'0.12em',textTransform:'uppercase'}}>Rituales para la Vida Diaria · Actos que Mueven</div></Ct></Pg>;
}
function Board({id,label,children}){return <DCArtboard id={id} label={label} width={AW} height={AH}><S>{children}</S></DCArtboard>}
function App(){
  let page=1;
  const ritualBoards = RITUALES.flatMap(r => {
    const a = <Board key={r.num+'a'} id={`r${r.num}a`} label={`${String(page).padStart(2,'0')} · ${r.num} intro`}><RitualIntro r={r} pgN={page++}/></Board>;
    const b = <Board key={r.num+'b'} id={`r${r.num}b`} label={`${String(page).padStart(2,'0')} · ${r.num} TAME`}><RitualTame r={r} pgN={page++}/></Board>;
    return [a,b];
  });
  const cover = <Board id="p01" label="01 · Portada"><Cover/></Board>; page++;
  const guide = <Board id="p02" label="02 · Guia"><Guide pgN={2}/></Board>; page++;
  const index = <Board id="p03" label="03 · Indice"><IndexPage pgN={3}/></Board>; page++;
  const startPage = 4;
  page = startPage;
  const boards = RITUALES.flatMap(r => {
    const p1=page++; const p2=page++;
    return [
      <Board key={r.num+'a'} id={`r${r.num}a`} label={`${String(p1).padStart(2,'0')} · ${r.num} intro`}><RitualIntro r={r} pgN={p1}/></Board>,
      <Board key={r.num+'b'} id={`r${r.num}b`} label={`${String(p2).padStart(2,'0')} · ${r.num} TAME`}><RitualTame r={r} pgN={p2}/></Board>
    ];
  });
  const registroN=page++;
  return <DesignCanvas><DCSection id="cubierta" title="Cubierta">{cover}</DCSection><DCSection id="guia" title="Guia de uso">{guide}{index}</DCSection><DCSection id="rituales" title="Los 21 rituales">{boards}</DCSection><DCSection id="cierre" title="Cierre"><Board id="registro" label={`${String(registroN).padStart(2,'0')} · Registro`}><Registro pgN={registroN}/></Board><Board id="contra" label={`${String(page).padStart(2,'0')} · Contraportada`}><Back/></Board></DCSection></DesignCanvas>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
