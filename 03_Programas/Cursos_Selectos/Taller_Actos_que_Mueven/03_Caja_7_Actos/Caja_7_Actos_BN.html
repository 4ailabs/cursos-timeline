// ─── DESIGN CANVAS (mismo sistema) ───────────────────────
if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style'); s.id='dc-styles';
  s.textContent = '.dc-exp{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s;width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}[data-dc-slot]:hover .dc-exp{opacity:1}.dc-exp:hover{background:rgba(0,0,0,.06)}';
  document.head.appendChild(s);
}
const DCCtx = React.createContext(null);
function DesignCanvas({ children }) {
  const [focus, setFocus] = React.useState(null);
  const api = React.useMemo(() => ({ focus, setFocus }), [focus]);
  const registry = {}, sectionMeta = {};
  React.Children.forEach(children, sec => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    const ids = [];
    React.Children.forEach(sec.props.children, ab => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      registry[`${sid}/${aid}`] = { sectionId:sid, artboard:ab };
      ids.push(aid);
    });
    sectionMeta[sid] = { slotIds:ids };
  });
  React.useEffect(() => { const k = e => { if (e.key==='Escape') setFocus(null); }; document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, []);
  return (<DCCtx.Provider value={api}><DCViewport>{children}</DCViewport>{focus && registry[focus] && <DCFocusOverlay entry={registry[focus]} sectionMeta={sectionMeta}/>}</DCCtx.Provider>);
}
function DCViewport({ children }) {
  const vpRef = React.useRef(null), worldRef = React.useRef(null);
  const tf = React.useRef({ x:0, y:0, scale:1 });
  const apply = React.useCallback(() => { const {x,y,scale}=tf.current; if(worldRef.current) worldRef.current.style.transform=`translate3d(${x}px,${y}px,0) scale(${scale})`; },[]);
  React.useEffect(() => {
    const vp = vpRef.current; if(!vp) return;
    const zoomAt=(cx,cy,f)=>{const r=vp.getBoundingClientRect(),t=tf.current,n=Math.min(8,Math.max(0.1,t.scale*f)),k=n/t.scale;t.x=(cx-r.left)-((cx-r.left)-t.x)*k;t.y=(cy-r.top)-((cy-r.top)-t.y)*k;t.scale=n;apply();};
    let drag=null;
    const onW=e=>{e.preventDefault();if(e.ctrlKey){zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.01))}else{tf.current.x-=e.deltaX;tf.current.y-=e.deltaY;apply();}};
    const onPD=e=>{if(!(e.button===1||(e.button===0&&!e.target.closest('[data-dc-slot]'))))return;e.preventDefault();vp.setPointerCapture(e.pointerId);drag={id:e.pointerId,lx:e.clientX,ly:e.clientY};vp.style.cursor='grabbing';};
    const onPM=e=>{if(!drag||e.pointerId!==drag.id)return;tf.current.x+=e.clientX-drag.lx;tf.current.y+=e.clientY-drag.ly;drag.lx=e.clientX;drag.ly=e.clientY;apply();};
    const onPU=e=>{if(!drag||e.pointerId!==drag.id)return;vp.releasePointerCapture(e.pointerId);drag=null;vp.style.cursor='';};
    vp.addEventListener('wheel',onW,{passive:false}); vp.addEventListener('pointerdown',onPD); vp.addEventListener('pointermove',onPM); vp.addEventListener('pointerup',onPU);
    return()=>{vp.removeEventListener('wheel',onW);vp.removeEventListener('pointerdown',onPD);vp.removeEventListener('pointermove',onPM);vp.removeEventListener('pointerup',onPU);};
  },[apply]);
  const grid=`url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='rgba(0,0,0,0.055)' stroke-width='1'/%3E%3C/svg%3E")`;
  return (<div ref={vpRef} style={{height:'100vh',width:'100vw',background:'#f0ede8',overflow:'hidden',overscrollBehavior:'none',touchAction:'none',position:'relative'}}><div ref={worldRef} style={{position:'absolute',top:0,left:0,transformOrigin:'0 0',willChange:'transform',width:'max-content',minWidth:'100%',minHeight:'100%',padding:'60px 0 80px'}}><div style={{position:'absolute',inset:-6000,backgroundImage:grid,backgroundSize:'120px 120px',pointerEvents:'none',zIndex:-1}}/>{children}</div></div>);
}
function DCSection({ id, title, children, gap=30 }) {
  const ctx = React.useContext(DCCtx); const sid = id ?? title;
  const abs = React.Children.toArray(children).filter(c=>c&&c.type===DCArtboard);
  return (<div style={{marginBottom:191.1}}><div style={{padding:'0 60px 40px',fontSize:50.6,fontWeight:600,color:'rgba(40,30,20,0.85)',fontFamily:'-apple-system,sans-serif'}}>{title}</div><div style={{display:'flex',gap,padding:'0 60px',alignItems:'flex-start',width:'max-content',flexWrap:'wrap'}}>{abs.map(ab=>{const aid=ab.props.id??ab.props.label;return(<div key={aid} data-dc-slot={aid} style={{position:'relative',flexShrink:0}}><div style={{position:'absolute',bottom:'100%',left:-4,marginBottom:10.5,fontSize:25.2,fontWeight:500,color:'rgba(60,50,40,0.7)',fontFamily:'-apple-system,sans-serif',padding:'0 6px 3px',userSelect:'none'}}>{ab.props.label}</div><button className="dc-exp" onClick={()=>ctx&&ctx.setFocus(`${sid}/${aid}`)}><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg></button><div style={{borderRadius:2,boxShadow:'0 1px 3px rgba(0,0,0,.09),0 4px 16px rgba(0,0,0,.07)',overflow:'hidden',width:ab.props.width||310,height:ab.props.height||480}}>{ab.props.children}</div></div>);})}</div></div>);
}
function DCArtboard() { return null; }
function DCFocusOverlay({ entry, sectionMeta }) {
  const ctx = React.useContext(DCCtx); const { sectionId, artboard } = entry; const aid = artboard.props.id ?? artboard.props.label;
  const peers = sectionMeta[sectionId]?.slotIds||[]; const idx = peers.indexOf(aid);
  const go = d => { const n=peers[(idx+d+peers.length)%peers.length]; if(n) ctx.setFocus(`${sectionId}/${n}`); };
  React.useEffect(()=>{const k=e=>{if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}if(e.key==='ArrowRight'){e.preventDefault();go(1);}};document.addEventListener('keydown',k);return()=>document.removeEventListener('keydown',k);});
  const [vp,setVp]=React.useState({w:window.innerWidth,h:window.innerHeight});
  React.useEffect(()=>{const r=()=>setVp({w:window.innerWidth,h:window.innerHeight});window.addEventListener('resize',r);return()=>window.removeEventListener('resize',r);},[]);
  const {width=310,height=480}=artboard.props; const scale=Math.max(0.1,Math.min((vp.w-160)/width,(vp.h-220)/height,2));
  return ReactDOM.createPortal(
    <div onClick={()=>ctx.setFocus(null)} style={{position:'fixed',inset:0,zIndex:100,background:'rgba(20,15,10,.65)',backdropFilter:'blur(16px)'}}>
      <div onClick={e=>e.stopPropagation()} style={{position:'absolute',top:0,right:0,padding:24}}><button onClick={()=>ctx.setFocus(null)} style={{border:'none',background:'transparent',color:'rgba(255,255,255,.6)',width:32,height:32,borderRadius:16,fontSize:50.6,cursor:'pointer',lineHeight:1}}>×</button></div>
      <div style={{position:'absolute',top:60,bottom:48,left:80,right:80,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:27.9}}>
        <div onClick={e=>e.stopPropagation()} style={{width:width*scale,height:height*scale,position:'relative'}}><div style={{width,height,transform:`scale(${scale})`,transformOrigin:'top left',background:'#fff',overflow:'hidden',boxShadow:'0 20px 80px rgba(0,0,0,.45)'}}>{artboard.props.children}</div></div>
        <div style={{fontSize:29.9,opacity:.8,color:'#fff',fontFamily:'-apple-system,sans-serif'}}>{artboard.props.label} <span style={{opacity:.5}}>{idx+1}/{peers.length}</span></div>
      </div>
      {[[-1,'left'],[1,'right']].map(([d,dir])=>(<button key={dir} onClick={e=>{e.stopPropagation();go(d);}} style={{position:'absolute',top:'50%',[dir]:24,transform:'translateY(-50%)',border:'none',background:'rgba(255,255,255,.08)',color:'rgba(255,255,255,.9)',width:40,height:40,borderRadius:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d={dir==='left'?'M11 3L5 9l6 6':'M7 3l6 6-6 6'}/></svg></button>))}
      <div onClick={e=>e.stopPropagation()} style={{position:'absolute',bottom:16,left:'50%',transform:'translateX(-50%)',display:'flex',gap:14}}>{peers.map((p,i)=><button key={p} onClick={()=>ctx.setFocus(`${sectionId}/${p}`)} style={{border:'none',padding:0,cursor:'pointer',width:6,height:6,borderRadius:3,background:i===idx?'#fff':'rgba(255,255,255,.3)'}}/>)}</div>
    </div>, document.body);
}

const Ph=({text})=>(<div style={{borderLeft:`3px solid ${C.siena}45`,paddingLeft:12,marginTop:6,fontFamily:SERIF,fontSize:19.5,fontStyle:'italic',color:C.ink,lineHeight:1.45,flexShrink:0}}>"{text}"</div>);

    <div style={{flex:1}}>
      <div style={{fontFamily:SERIF,fontSize:21,fontWeight:500,color:C.siena,lineHeight:1.2}}>{name}</div>
      {inst&&<div style={{fontFamily:SERIF,fontSize:18,color:C.grey,lineHeight:1.45,marginTop:3}}>{inst}</div>}
      {phrases.length>0&&<div style={{fontFamily:MONO,fontSize:12.9,letterSpacing:'0.1em',textTransform:'uppercase',color:C.sienaL,marginTop:8,marginBottom:4.1,flexShrink:0}}>Di en voz alta</div>}
      {phrases.map((p,i)=><Ph key={i} text={p}/>)}
    </div>
  </div>
);

// ═══════════════════════════════════════════════════════════
const R01_1=()=>(

// ═══════════════════════════════════════════════════════════

const R02_1=()=>(<Pg><Ct>
  <Lbl color={C.siena}>Acto 02</Lbl>
  <div style={{marginTop:10.1,fontFamily:SERIF,fontSize:43.7,fontWeight:300,fontStyle:'italic',color:C.ink,lineHeight:1.05,flexShrink:0}}>La Mesa<br/>de Uno</div>

  <div style={{marginTop:6,fontFamily:SERIF,fontSize:18.3,color:C.ink,lineHeight:1.5,flexShrink:0}}>Para cuando sirves, atiendes, cuidas, resuelves — y al final del día no queda nada para tu cuerpo. Comes de pie. Comes rápido. Comes lo que sobró. Tu cuerpo aprendió que primero son los demás. Que sentarte a comer con calma, sola, es un lujo que no te corresponde.</div>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Principio</Lbl>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:18.3,color:C.ink,lineHeight:1.5,flexShrink:0}}>Si de niña recibiste el mensaje de que atenderte primero era egoísmo, el sistema nervioso grabó esa regla. Cuando te sientas sola frente a un plato que tú misma te serviste y comes despacio, el cuerpo recibe una experiencia que contradice la regla vieja.</div>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Materiales</Lbl>
  <Bul text="Un plato · Una fruta que te guste · Cuchillo"/>
  <Bul text="Servilleta de tela · Mesa despejada · Silla"/>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="02" p={1} of={4}/></Pg>);

const R02_2=()=>(<Pg><Ct>
  <Lbl color={C.siena}>La Mesa de Uno</Lbl>
  <Rule my={5} color={`${C.siena}30`}/>
  <RitualStep n="01" name="Nombrar lo que haces" inst="De pie frente a la mesa vacía. Sin plato, sin comida. Solo la mesa y tú. Siente lo que aparece cuando ves una mesa vacía que es solo para ti. 15 segundos mirando. Pies en el suelo." phrases={['Esto es lo que hago: alimento a todos y me dejo al final.']}/>
  <RitualStep n="02" name="Volver al cuerpo" inst="Una mano en el pecho, otra en el abdomen. Inhala 4 — sostén 4 — exhala 6. Cinco veces. Con cada exhalación, siente el peso de tu cuerpo de pie frente a la mesa." phrases={['Mi cuerpo está aquí. Puedo sentarme sin pedir permiso.']}/>
  <RitualStep n="03" name="Reconocer lo que tienes" inst="Pies firmes en el suelo. Mira tus manos — las mismas que sirven, cocinan, resuelven, sostienen. Hoy van a hacer algo diferente: van a servirte a ti." phrases={['Estas manos saben dar. Hoy saben recibir.']}/>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="02" p={2} of={4}/></Pg>);

const R02_3=()=>(<Pg><Ct>

  <RitualStep n="04" name="Escuchar al cuerpo" inst="Coloca la servilleta de tela sobre la mesa. Pon el plato encima. Pon la fruta en el plato. Mira el plato servido. Es uno solo. Es para ti. Pregúntale al cuerpo. Espera 60 segundos." phrases={['¿Qué se siente ver un plato que es solo para mí?','Esto es real. Lo reconozco.']}/>
  <RitualStep n="05" name="El acto" inst="Siéntate frente a la mesa. Completa. No en la orilla. Corta la fruta despacio. Escucha el sonido del corte. Huele la fruta. Toma el primer trozo. Come despacio. Siente la textura, el sabor, el jugo. La fruta que comiste no puede deshacerse. Lo que te diste ya es tuyo. Cuando termines, quédate sentada. 60 segundos. No te levantes. No recojas." phrases={['Me sirvo primero. Esto es mío.']}/>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="02" p={3} of={4}/></Pg>);

  <RitualStep n="03" name="Reconocer lo que tienes" inst="Pies en el suelo. Piensa en algo que hayas logrado por ti misma — no por la regla, sino a pesar de ella." phrases={['Tengo lo que construí. Eso no depende de esta regla.']}/>

  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Acción nueva</Lbl>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:18.3,color:C.ink,lineHeight:1.5,flexShrink:0}}>Mete los pedazos en el sobre. No los releas. Cierra el sobre. Séllalo con cinta — que quede cerrado de verdad. Toma el vaso con agua. Bebe tres tragos lentos. Siente el agua bajar por la garganta — la misma que acaba de hablar.</div>
  <Ph text="Mi garganta tiene espacio. Lo que viene, sale."/>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Cierre</Lbl>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:18.3,color:C.ink,lineHeight:1.5,flexShrink:0}}>El sobre se queda cerrado. Lo que importaba ya salió por tu boca. Guárdalo donde lo veas. Si la garganta se cierra otra vez, míralo o tócalo: ya hablaste una vez. Puedes volver a hacerlo.</div>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Qué observar después</Lbl>
  <Bul text="Si la garganta se siente más abierta, más suelta"/>
  <Bul text="Si aparecen ganas de decir cosas que normalmente callarías"/>
  <Bul text="Si el cuerpo suelta algo inesperado: suspiros, bostezos, calor"/>
  <Bul text="Si sientes alivio, tristeza, enojo o una mezcla — todo es parte"/>
  <div style={{flex:1}}/>
  <div style={{fontFamily:SERIF,fontSize:16.1,color:C.grey2,lineHeight:1.45,fontStyle:'italic',flexShrink:0}}>Si la emoción es demasiado intensa o sostenida, busca apoyo: una persona de confianza o un profesional.</div>
</Ct><PgFoot acto="04" p={4} of={4}/></Pg>);

// ═══════════════════════════════════════════════════════════
// ACTO 05 — EL PESO PRESTADO
// ═══════════════════════════════════════════════════════════
const R05_1=()=>(<Pg><Ct>
  <Lbl color={C.siena}>Acto 05</Lbl>
  <div style={{marginTop:7,fontFamily:SERIF,fontSize:43.7,fontWeight:300,fontStyle:'italic',color:C.ink,lineHeight:1.05,flexShrink:0}}>El Peso<br/>Prestado</div>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:20.7,color:C.grey,fontStyle:'italic',lineHeight:1.4,flexShrink:0}}>Para cuando cargas emociones que no son tuyas.</div>
  <Rule my={4} color={`${C.siena}30`}/>
  <Lbl>Para quién es</Lbl>
  <div style={{marginTop:5,fontFamily:SERIF,fontSize:17.5,color:C.ink,lineHeight:1.42,flexShrink:0}}>Para cuando los hombros pesan, la espalda duele y la mitad de lo que cargas no es tuyo. La tristeza de tu mamá. La frustración de tu pareja. El miedo de tu hijo. Tu cuerpo aprendió a absorber lo que les pasa a otros y cargarlo como propio — no por debilidad, por lealtad.</div>
  <Rule my={4} color={`${C.siena}30`}/>
  <Lbl>Principio</Lbl>
  <div style={{marginTop:5,fontFamily:SERIF,fontSize:17.5,color:C.ink,lineHeight:1.42,flexShrink:0}}>Cuando sacas esos pesos del cuerpo físicamente — los nombras, los sostienes, los depositas fuera — el cuerpo recibe un mensaje nuevo: puedo cuidar sin cargar. Puedo amar sin absorber. Lo que suelto no abandona a nadie.</div>
  <Rule my={4} color={`${C.siena}30`}/>
  <Lbl>Materiales</Lbl>
  <Bul text="Mochila o bolsa resistente"/>
  <Bul text="3-5 objetos pesados (libros, botellas, latas)"/>
  <Bul text="3 etiquetas adhesivas · Pluma o marcador"/>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="05" p={1} of={4}/></Pg>);

const R05_2=()=>(<Pg><Ct>
  <Lbl color={C.siena}>El Peso Prestado</Lbl>
  <Rule my={5} color={`${C.siena}30`}/>
  <RitualStep n="01" name="Nombrar lo que cargas" inst="Mochila abierta en el suelo. En cada etiqueta escribe un peso prestado: 'La tristeza de mamá', 'La presión de mi jefe'. Pega cada etiqueta en un objeto pesado. Uno por uno, mételos en la mochila. Ciérrala. Levántala con las dos manos. Siente cuánto pesa. 15 segundos." phrases={['Esto es lo que cargo: peso que no es mío y que mi cuerpo sostiene como si lo fuera.']}/>
  <RitualStep n="02" name="Volver al cuerpo" inst="Mochila en el suelo. Una mano en el pecho, otra en el abdomen. Inhala 4 — sostén 4 — exhala 6. Cinco veces. Nota la diferencia entre tenerla cargada y en el piso." phrases={['Mi cuerpo está aquí. Puedo soltar sin abandonar.']}/>
  <RitualStep n="03" name="Reconocer lo que tienes" inst="Pies firmes. Columna erguida. Brazos sueltos. Tu cuerpo está de pie sin la mochila. Así se siente cuando cargas solo lo tuyo." phrases={['Sin este peso, mi cuerpo sigue de pie. Eso basta.']}/>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="05" p={2} of={4}/></Pg>);

const R05_3=()=>(<Pg><Ct>
  <Lbl color={C.siena}>El Peso Prestado</Lbl>
  <Rule my={5} color={`${C.siena}30`}/>
  <RitualStep n="04" name="Escuchar al cuerpo" inst="Ponte la mochila sobre los hombros. Siente cómo cambia tu postura: la presión en los hombros, la tensión en la espalda. Pregúntale al cuerpo. 60 segundos." phrases={['¿Qué pasaría si dejo de cargar esto?','Eso es lo que mi cuerpo teme al soltar. Lo reconozco.']}/>
  <RitualStep n="05" name="El acto" inst="Camina despacio hacia la puerta de tu cuarto. Detente en el umbral. Baja la mochila lentamente. Ábrela. Saca cada objeto. Despega cada etiqueta. Mientras despegas y rompes cada etiqueta, di la frase. Las etiquetas rotas no pueden volver a pegarse. Deja los objetos fuera. Vuelve con la mochila vacía. 60 segundos en silencio de pie." phrases={['Esto no es mío. Lo devuelvo.']}/>
  <div style={{marginTop:7.9,fontFamily:SERIF,fontSize:18.3,color:C.grey,lineHeight:1.45,fontStyle:'italic',flexShrink:0}}>Las personas que nombraste siguen ahí. No las perdiste al soltar lo que cargabas. Soltaste el peso, no el vínculo.</div>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="05" p={3} of={4}/></Pg>);

const R05_4=()=>(<Pg><Ct>
  <Lbl color={C.siena}>El Peso Prestado</Lbl>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Acción nueva</Lbl>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:18.3,color:C.ink,lineHeight:1.5,flexShrink:0}}>Toma la mochila vacía. Ábrela de par en par. Déjala abierta en un lugar visible de tu cuarto durante 7 días.</div>
  <Ph text="Puedo cuidar sin cargar. Lo que no es mío, no entra aquí."/>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Cierre</Lbl>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:18.3,color:C.ink,lineHeight:1.5,flexShrink:0}}>Los objetos puedes regresarlos a su lugar después de 24 horas — ya no tienen etiqueta. Si vuelves a absorber carga ajena, pon las manos frente a ti con las palmas hacia afuera y di: "Esto no es mío."</div>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Qué observar después</Lbl>
  <Bul text="Si hombros y espalda se sienten diferentes"/>
  <Bul text="Si aparece culpa por haber soltado — y si va cambiando"/>
  <Bul text="Si notas con más claridad cuando absorbes algo ajeno"/>
  <Bul text="Si cambia algo con las personas que nombraste"/>
  <div style={{flex:1}}/>
  <div style={{fontFamily:SERIF,fontSize:16.1,color:C.grey2,lineHeight:1.45,fontStyle:'italic',flexShrink:0}}>Si aparece malestar que no baja — angustia intensa, llanto que no para — busca apoyo profesional.</div>
</Ct><PgFoot acto="05" p={4} of={4}/></Pg>);

// ═══════════════════════════════════════════════════════════
// ACTO 06 — EL PERMISO ROTO
// ═══════════════════════════════════════════════════════════
const R06_1=()=>(<Pg><Ct>
  <Lbl color={C.siena}>Acto 06</Lbl>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:43.7,fontWeight:300,fontStyle:'italic',color:C.ink,lineHeight:1.05,flexShrink:0}}>El Permiso<br/>Roto</div>
  <div style={{marginTop:5,fontFamily:SERIF,fontSize:19.5,color:C.grey,fontStyle:'italic',lineHeight:1.4,flexShrink:0}}>Para cuando necesitas autorización para existir.</div>
  <Rule my={3} color={`${C.siena}30`}/>
  <Lbl>Para quién es</Lbl>
  <div style={{marginTop:4,fontFamily:SERIF,fontSize:17,color:C.ink,lineHeight:1.42,flexShrink:0}}>Para cuando antes de hablar miras a los lados. Antes de decidir preguntas si está bien. Tu cuerpo aprendió que actuar sin autorización es peligroso — que si haces algo sin que te lo aprueben, molestas, sobras, invades. Sientes que tu presencia incomoda, que ocupar espacio es arrogancia.</div>
  <Rule my={3} color={`${C.siena}30`}/>
  <Lbl>Principio</Lbl>
  <div style={{marginTop:4,fontFamily:SERIF,fontSize:17,color:C.ink,lineHeight:1.42,flexShrink:0}}>Cuando rompes físicamente el papel que dice "permiso" y después actúas sin autorización — y nada malo pasa — el cuerpo recibe una experiencia que contradice la regla vieja. Actuaste sin permiso y el mundo sigue igual. El espacio no se cerró.</div>
  <Rule my={3} color={`${C.siena}30`}/>
  <Lbl>Materiales</Lbl>
  <Bul text="Hoja de papel · Pluma o marcador"/>
  <Bul text="Silla · Espacio donde puedas estar de pie con brazos abiertos"/>
  <Bul text="Un objeto pequeño que te guste (taza, fruta, libro)"/>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="06" p={1} of={4}/></Pg>);

const R06_2=()=>(<Pg><Ct>
  <Lbl color={C.siena}>El Permiso Roto</Lbl>
  <Rule my={5} color={`${C.siena}30`}/>
  <RitualStep n="01" name="Nombrar lo que haces" inst="Siéntate en la orilla de la silla. Encogida: hombros arriba, brazos pegados, piernas juntas. La postura de quien pide permiso para estar. Escribe en el centro de la hoja con letras grandes: PERMISO. Mira esa palabra. 15 segundos." phrases={['Esto es lo que hago: espero que alguien me autorice antes de actuar.']}/>
  <RitualStep n="02" name="Volver al cuerpo" inst="Hoja en el regazo. Una mano en el pecho, otra en el abdomen. Inhala 4 — sostén 4 — exhala 6. Cinco veces. Con cada exhalación, baja los hombros. Suelta la mandíbula. Ocupa más espacio en la silla sin que nadie te lo pida." phrases={['Mi cuerpo está aquí. Puedo moverme sin que nadie me lo permita.']}/>
  <RitualStep n="03" name="Reconocer lo que tienes" inst="De pie. Pies firmes. Siente tu peso real. Estira los brazos a los costados — ese es tu tamaño real. No el que muestras para no molestar." phrases={['Tengo cuerpo. Tiene tamaño. Cabe en este espacio.']}/>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="06" p={2} of={4}/></Pg>);

const R06_3=()=>(<Pg><Ct>
  <Lbl color={C.siena}>El Permiso Roto</Lbl>
  <Rule my={5} color={`${C.siena}30`}/>
  <RitualStep n="04" name="Escuchar al cuerpo" inst="Siéntate. Sostén la hoja con PERMISO frente al pecho. Siente el peso de toda una vida esperando autorización. Pregúntale al cuerpo. 60 segundos." phrases={['¿Qué me ha costado esperar este permiso?','Eso es real. Todo lo que no hice mientras esperaba. Lo reconozco.']}/>
  <RitualStep n="05" name="El acto" inst="De pie. Sostén la hoja. Nombra lo que el cuerpo teme. Mira PERMISO una última vez. Rasga la hoja por la mitad — lento, deliberado, que pase por en medio de la palabra. Suelta los pedazos. Ahora: camina al centro de la habitación. Abre los brazos completos. Levanta la barbilla. Respira profundo. Nadie te dijo que podías hacer esto. 60 segundos así. Sin encogerte. Sin mirar a los lados." phrases={['Si hago algo sin permiso, mi cuerpo cree que...','Rompo este permiso. Ya no lo necesito para actuar.']}/>
  <div style={{marginTop:7.9,fontFamily:SERIF,fontSize:18.3,color:C.grey,lineHeight:1.45,fontStyle:'italic',flexShrink:0}}>Nadie te castigó. Nadie se fue. El espacio te cabe.</div>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="06" p={3} of={4}/></Pg>);

const R06_4=()=>(<Pg><Ct>
  <Lbl color={C.siena}>El Permiso Roto</Lbl>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Acción nueva</Lbl>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:18.3,color:C.ink,lineHeight:1.5,flexShrink:0}}>Camina hacia el objeto que elegiste. Tómalo sin pedir permiso. Sosténlo con las dos manos. Siéntate completa — al fondo de la silla, espalda contra el respaldo.</div>
  <Ph text="Esto es lo nuevo. Tomo lo que quiero. Mi mano no pide permiso."/>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Cierre</Lbl>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:18.3,color:C.ink,lineHeight:1.5,flexShrink:0}}>Guarda un pedazo del papel donde lo veas — tu cartera, tu escritorio. El otro va a la basura ahora. El objeto que tomaste déjalo donde lo pusiste hasta mañana: prueba de que actuaste sin autorización y nada se rompió.</div>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Qué observar después</Lbl>
  <Bul text="Si notas el impulso de pedir permiso y ahora lo ves más rápido"/>
  <Bul text="Si los hombros están más bajos o la postura cambia"/>
  <Bul text="Si aparecen ganas de hacer cosas sin preguntar primero"/>
  <Bul text="Si cambió algo en cómo entras a una habitación o te sientas"/>
  <div style={{flex:1}}/>
  <div style={{fontFamily:SERIF,fontSize:16.1,color:C.grey2,lineHeight:1.45,fontStyle:'italic',flexShrink:0}}>Si aparece angustia intensa o sensación de no merecer estar, detente. Manos en el pecho, respira lento, busca apoyo profesional.</div>
</Ct><PgFoot acto="06" p={4} of={4}/></Pg>);

// ═══════════════════════════════════════════════════════════
// ACTO 07 — LA VELA QUE VUELVE
// ═══════════════════════════════════════════════════════════
const R07_1=()=>(<Pg><Ct>
  <Lbl color={C.siena}>Acto 07</Lbl>
  <div style={{marginTop:8,fontFamily:SERIF,fontSize:43.7,fontWeight:300,fontStyle:'italic',color:C.ink,lineHeight:1.05,flexShrink:0}}>La Vela<br/>que Vuelve</div>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:20.7,color:C.grey,fontStyle:'italic',lineHeight:1.4,flexShrink:0}}>Para cuando algo se apagó por dentro.</div>
  <Rule my={4} color={`${C.siena}30`}/>
  <Lbl>Para quién es</Lbl>
  <div style={{marginTop:5,fontFamily:SERIF,fontSize:17.8,color:C.ink,lineHeight:1.45,flexShrink:0}}>Para cuando algo que antes estaba encendido ya no está. La motivación, las ganas, la curiosidad, la energía. El cuerpo bajó la energía como medida de protección y se quedó ahí, en modo ahorro, más tiempo del necesario.</div>
  <Rule my={4} color={`${C.siena}30`}/>
  <Lbl>Principio</Lbl>
  <div style={{marginTop:5,fontFamily:SERIF,fontSize:17.8,color:C.ink,lineHeight:1.45,flexShrink:0}}>El cuerpo confunde haberse apagado con no poder encenderse. Cuando estás en la oscuridad real y enciendes un cerillo con tus propias manos, el cuerpo recibe una experiencia directa: la oscuridad no era permanente. La capacidad de producir luz seguía ahí.</div>
  <Rule my={4} color={`${C.siena}30`}/>
  <Lbl>Materiales</Lbl>
  <Bul text="Vela pequeña · 3 cerillos o encendedor"/>
  <Bul text="Plato resistente al calor · Vaso con agua (seguridad)"/>
  <Bul text="Espacio que puedas oscurecer bien"/>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="07" p={1} of={4}/></Pg>);

const R07_2=()=>(<Pg><Ct>
  <Lbl color={C.siena}>La Vela que Vuelve</Lbl>
  <Rule my={5} color={`${C.siena}30`}/>
  <RitualStep n="01" name="Nombrar lo que se apagó" inst="Entra al espacio. Apaga todas las luces. Quédate de pie en la oscuridad. Siente la temperatura del aire, el piso, el silencio. Piensa en lo que se apagó: las ganas, la energía, lo que ya no buscas." phrases={['Esto es lo que hago: me quedo en la oscuridad y creo que ya no puedo encender.']}/>
  <RitualStep n="02" name="Encontrar el cuerpo" inst="Una mano en el pecho, otra en el vientre. Inhala 4 — sostén 4 — exhala 6. Seis ciclos. Siente el peso de tu cuerpo hacia abajo." phrases={['Mi cuerpo está aquí. La oscuridad no me borró.']}/>
  <RitualStep n="03" name="Tocar lo que tienes" inst="Busca la vela y los cerillos a tientas — con las manos, no con la luz. Siente el peso de la vela. Siente la caja de cerillos. Tus manos ya tienen lo que necesitan. Coloca la vela sobre el plato." phrases={['Tengo manos. Tengo fuego. La capacidad sigue aquí.']}/>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="07" p={2} of={4}/></Pg>);

const R07_3=()=>(<Pg><Ct>
  <Lbl color={C.siena}>La Vela que Vuelve</Lbl>
  <Rule my={5} color={`${C.siena}30`}/>
  <RitualStep n="04" name="Preguntarle al cuerpo" inst="De pie frente a la vela sin encender, en la oscuridad. Mano en el pecho. Pregunta. Dale 30 segundos al silencio." phrases={['¿Qué se apagó en mí y desde cuándo?','Eso es real. No tengo que entenderlo. Solo reconocerlo.']}/>
  <RitualStep n="05" name="Encender" inst="Toma un cerillo. Quédate 30 segundos más en la oscuridad con el cerillo en la mano, sin rasparlo. Siente que la oscuridad es todo lo que hay. Luego raspa el cerillo. Prende la vela. Mira la llama. Mira cómo la oscuridad retrocede. Mira tu mano iluminada. El cerillo quemado no puede volver a ser lo que era — produjo fuego. Eso es irreversible. 60 segundos mirando la llama." phrases={['Estoy en la oscuridad. Mi cuerpo cree que esto ya no cambia.','Enciendo. La luz vuelve porque yo la enciendo.']}/>
  <div style={{flex:1}}/>
</Ct><PgFoot acto="07" p={3} of={4}/></Pg>);

const R07_4=()=>(<Pg><Ct>
  <Lbl color={C.siena}>La Vela que Vuelve</Lbl>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Acción nueva</Lbl>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:18.3,color:C.ink,lineHeight:1.5,flexShrink:0}}>Acerca las manos a la llama (sin quemarte). Siente el calor en las palmas. Toma el cerillo quemado. Guárdalo junto a la vela donde los veas los próximos días.</div>
  <Ph text="Esto es lo nuevo. Hay calor en mis manos y yo lo hice."/>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Cierre</Lbl>
  <div style={{marginTop:6,fontFamily:SERIF,fontSize:18.3,color:C.ink,lineHeight:1.5,flexShrink:0}}>Deja la vela encendida mientras estés ahí. Al irte, apágala de un soplo suave. El cerillo quemado no se tira — es la prueba de que la capacidad de encender seguía en tus manos. Tienes 3 cerillos. Cuando se acaben, observa si necesitas más.</div>
  <Rule my={5} color={`${C.siena}30`}/>
  <Lbl>Qué observar después</Lbl>
  <Bul text="Si al día siguiente apareció alguna gana pequeña"/>
  <Bul text="Si 'la capacidad sigue aquí' aparece en tu cabeza"/>
  <Bul text="Si tu energía subió o el cuerpo se siente menos pesado"/>
  <Bul text="Si soñaste algo con luz, fuego o calor"/>
  <div style={{flex:1}}/>
  <div style={{fontFamily:SERIF,fontSize:16.1,color:C.grey2,lineHeight:1.45,fontStyle:'italic',flexShrink:0}}>Si después de repetir 3 veces la oscuridad no se mueve, busca a alguien: un terapeuta, un médico. Pedir ayuda también es una forma de encender.</div>
</Ct><PgFoot acto="07" p={4} of={4}/></Pg>);
