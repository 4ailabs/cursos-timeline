<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aplicación documental del logo Los Cuatro Caminos</title>
  <desc id="desc">Ejemplo de la firma horizontal aplicada como encabezado en un documento rectangular.</desc>
  <rect width="1600" height="900" fill="#E9E2D6"/>
  <rect x="70" y="55" width="1460" height="790" rx="4" fill="#FAF6F0"/>

  <!-- Logo al 39% de su tamaño maestro. -->
  <g transform="translate(112 84) scale(.39)">
    <g fill="none" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M270 110H120v150" stroke="#8FA87A"/>
      <path d="M350 110h150v150" stroke="#B5604A"/>
      <path d="M500 390v150H350" stroke="#8FA87A"/>
      <path d="M270 540H120V390" stroke="#362F29"/>
    </g>
    <circle cx="310" cy="258" r="38" fill="#FAF6F0"/>
    <path d="M261 258v-10c0-29 22-50 49-50s49 21 49 50v10h-11v-13q-10 0-15-10-5 10-15 10t-15-10q-5 10-15 10t-15-10q-5 10-12 10v13z" fill="#B5604A"/>
    <path d="M270 326Q278 300 310 300t40 26l26 79q6 18-8 27t-26-9l-9-29 7 106h-28l-3-68q-1-15-9-15t-9 15l-3 68h-28l7-106-9 29q-12 18-26 9t-8-27z" fill="#362F29"/>
    <g font-family="Inter, Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="650" y="260" fill="#362F29" font-size="76" font-weight="500" letter-spacing="22">LOS CUATRO</text>
      <text x="638" y="415" fill="#362F29" font-size="152" font-weight="650" letter-spacing="18">CAMINOS</text>
      <line x1="650" y1="476" x2="735" y2="476" stroke="#B5604A" stroke-width="5"/>
      <text x="775" y="487" fill="#8FA87A" font-size="28" font-weight="650" letter-spacing="9">FORMACIÓN EN TERAPIA CON MUÑECOS</text>
    </g>
  </g>

  <text x="1400" y="137" text-anchor="end" fill="#746C62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="2">MÓDULO 1 · DOCUMENTO DE TRABAJO</text>
  <line x1="112" y1="330" x2="1488" y2="330" stroke="#E2D6C6" stroke-width="2"/>

  <text x="112" y="415" fill="#B5604A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="3">LECTURA DE LA DIRECCIÓN</text>
  <text x="112" y="495" fill="#362F29" font-family="Palatino, Georgia, serif" font-size="58" font-weight="600">La dirección, y cómo se lee</text>
  <text x="112" y="555" fill="#746C62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26">Una figura cae sobre la hoja. La lectura comienza por lo obvio.</text>

  <g fill="#E2D6C6">
    <rect x="112" y="635" width="810" height="12" rx="6"/>
    <rect x="112" y="671" width="930" height="12" rx="6"/>
    <rect x="112" y="707" width="745" height="12" rx="6"/>
    <rect x="112" y="743" width="875" height="12" rx="6"/>
  </g>
  <rect x="1190" y="620" width="298" height="150" rx="3" fill="#F1E9DB"/>
  <line x1="1339" y1="644" x2="1339" y2="746" stroke="#B5604A" stroke-width="2"/>
  <line x1="1214" y1="695" x2="1464" y2="695" stroke="#B5604A" stroke-width="2"/>
  <circle cx="1339" cy="695" r="5" fill="#B5604A"/>
</svg>
