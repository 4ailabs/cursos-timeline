  <title id="title">Los Cuatro Caminos</title>
  <desc id="desc">Firma horizontal con un muñeco fiel al logo original en el centro de cuatro aperturas direccionales.</desc>
  <defs>
    <symbol id="muneco" viewBox="0 0 260 350">
      <path d="M47 106C43 91 43 70 49 52C61 18 92 0 130 0s69 18 81 52c6 18 6 39 2 54l-18 3V88c-7 0-14-4-18-11-4 7-12 11-21 11s-17-4-21-11c-4 7-12 11-21 11s-17-4-21-11c-4 7-12 11-21 11-3 0-6 0-8-1v22z" fill="#FF9F1C"/>
      <path d="M65 87c9 0 19-4 24-12 5 8 14 12 24 12s19-4 24-12c5 8 14 12 24 12s19-4 24-12c3 7 8 11 10 12v26c0 34-27 55-65 55s-65-21-65-55z" fill="#FFF3DA"/>
      <path d="M82 170h96c21 0 31 10 37 31l15 49c3 9 6 15 11 21 7 8 6 16 0 23l-6 6c-5 5-11 3-15-4-6 7-12 7-18 3-8-6-9-13-5-22l7-10-26-49 6 132h-36l-4-66c-1-12-5-18-14-18s-13 6-14 18l-4 66H76l6-132-26 49 7 10c4 9 3 16-5 22-6 4-12 4-18-3-4 7-10 9-15 4l-6-6c-6-7-7-15 0-23 5-6 8-12 11-21l15-49c6-21 16-31 37-31z" fill="#079BC7"/>
    </symbol>
  </defs>

  <!-- Cuatro aperturas: marco direccional, no contenedor cerrado. -->
  <g fill="none" stroke="#087FAE" stroke-width="22" stroke-linecap="square">
    <path d="M270 70H80v175"/>
    <path d="M350 70h190v175"/>
    <path d="M540 405v175H350"/>
    <path d="M270 580H80V405"/>
  </g>
  <use href="#muneco" x="154" y="108" width="312" height="420"/>

  <!-- Wordmark horizontal, heredando el contraste azul/naranja del curso anterior. -->
  <g font-family="Inter, Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="650" y="255" fill="#075577" font-size="76" font-weight="560" letter-spacing="22">LOS CUATRO</text>
    <text x="638" y="417" fill="#075577" font-size="154" font-weight="700" letter-spacing="15">CAMINOS</text>
    <line x1="650" y1="478" x2="744" y2="478" stroke="#FF9F1C" stroke-width="7"/>
    <text x="790" y="489" fill="#087FAE" font-size="28" font-weight="650" letter-spacing="9">FORMACIÓN EN TERAPIA CON MUÑECOS</text>
  </g>
