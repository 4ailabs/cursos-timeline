<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Isla bioeléctrica y reconexión — centro completamente conectado</title>
  <desc id="desc">Dos campos celulares equivalentes. En el primero, una región ámbar presenta conexiones periféricas discontinuas. En el segundo, la misma región se integra mediante conexiones continuas.</desc>
  <defs>
    <style>
      .type{font-family:Arial,Helvetica,sans-serif}.heading{fill:#26343A;font-weight:600}
      .cell{fill:#FCFCFA;stroke:#7FA7A2;stroke-width:2}.island{fill:#F4DFC1;stroke:#CB8428;stroke-width:2.2}
      .restored{fill:#D2E9E6;stroke:#16877F;stroke-width:2.2}.link{fill:none;stroke:#16877F;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#536268" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- Una silueta celular orgánica, reutilizada con rotaciones sutiles. -->
    <path id="cell-shape" d="M-24-3C-23-19-13-27 2-26 18-25 27-15 26 1 25 17 15 26-1 26-17 26-26 15-24-3Z"/>
  </defs>

  <rect width="1120" height="460" fill="#FCFCFA"/>

  <!-- Estado 1 -->
  <g transform="translate(285 245)">
    <text x="0" y="-166" text-anchor="middle" class="type heading" font-size="20">Isla bioeléctrica</text>

    <!-- Estructura del colectivo: continua y secundaria. -->
    <g class="link" opacity=".38">
      <path d="M-151-77C-112-96-79-100-42-91M-42-91C-7-103 30-100 66-88M66-88C104-96 132-87 153-67"/>
      <path d="M-153 79C-112 96-76 100-39 91M-39 91C-4 102 33 99 69 88M69 88C106 96 134 86 151 67"/>
    </g>

    <!-- Solo el contacto con la isla se vuelve discontinuo. -->
    <g fill="none" stroke="#CB8428" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 7" opacity=".82">
      <path d="M-151-77L-58-37M-42-91l13 40M66-88L45-48M153-67L65-34M-153 79l94-36M-39 91L-8 67M69 88L22 66M151 67L61 39"/>
    </g>

    <g class="cell">
      <use href="#cell-shape" transform="translate(-151 -77) rotate(-8)"/><use href="#cell-shape" transform="translate(-42 -91) rotate(5)"/>
      <use href="#cell-shape" transform="translate(66 -88) rotate(-4)"/><use href="#cell-shape" transform="translate(153 -67) rotate(9)"/>
      <use href="#cell-shape" transform="translate(-153 79) rotate(7)"/><use href="#cell-shape" transform="translate(-39 91) rotate(-5)"/>
      <use href="#cell-shape" transform="translate(69 88) rotate(4)"/><use href="#cell-shape" transform="translate(151 67) rotate(-8)"/>
    </g>
    <g class="island">
      <use href="#cell-shape" transform="translate(-39 -25) rotate(-5) scale(1.16)"/>
      <use href="#cell-shape" transform="translate(42 -22) rotate(6) scale(1.16)"/>
      <use href="#cell-shape" transform="translate(2 45) rotate(-2) scale(1.16)"/>
    </g>
  </g>

  <!-- Pausa y transición: pequeña, pero inequívoca. -->
  <g transform="translate(500 245)">
    <path d="M0 0h120" stroke="#536268" stroke-width="1.45" marker-end="url(#arrow)"/>
    <text x="58" y="-15" text-anchor="middle" class="type" font-size="10.5" font-weight="600" letter-spacing="1" fill="#536268">REPOLARIZACIÓN</text>
  </g>

  <!-- Estado 2: misma geometría exacta. -->
  <g transform="translate(835 245)">
    <text x="0" y="-166" text-anchor="middle" class="type heading" font-size="20">Reconexión</text>

    <!-- Un solo trazado cerrado: no existen líneas superior e inferior separadas. -->
    <path class="link" opacity=".78" d="M-151-77C-112-96-79-100-42-91C-7-103 30-100 66-88C104-96 132-87 153-67C171-33 170 34 151 67C106 96 106 96 69 88C33 99-4 102-39 91C-76 100-112 96-153 79C-171 39-170-39-151-77Z"/>
    <g class="cell">
      <use href="#cell-shape" transform="translate(-151 -77) rotate(-8)"/><use href="#cell-shape" transform="translate(-42 -91) rotate(5)"/>
      <use href="#cell-shape" transform="translate(66 -88) rotate(-4)"/><use href="#cell-shape" transform="translate(153 -67) rotate(9)"/>
      <use href="#cell-shape" transform="translate(-153 79) rotate(7)"/><use href="#cell-shape" transform="translate(-39 91) rotate(-5)"/>
      <use href="#cell-shape" transform="translate(69 88) rotate(4)"/><use href="#cell-shape" transform="translate(151 67) rotate(-8)"/>
    </g>
    <g class="restored">
      <use href="#cell-shape" transform="translate(-39 -25) rotate(-5) scale(1.16)"/>
      <use href="#cell-shape" transform="translate(42 -22) rotate(6) scale(1.16)"/>
      <use href="#cell-shape" transform="translate(2 45) rotate(-2) scale(1.16)"/>
    </g>
    <!-- Enlaces visibles de borde a borde, dibujados después de las células. -->
    <g class="link" stroke-width="2.35">
      <path d="M-127-66L-68-38M-41-65L-40-56M58-63L50-51M129-57L70-33"/>
      <path d="M-128 73L-31 52M-22 72L-17 66M51 70L22 65M126 63L33 50"/>
      <path d="M-8-24L11-23M-24 1L-13 19M27 4L17 19"/>
    </g>
  </g>
</svg>
