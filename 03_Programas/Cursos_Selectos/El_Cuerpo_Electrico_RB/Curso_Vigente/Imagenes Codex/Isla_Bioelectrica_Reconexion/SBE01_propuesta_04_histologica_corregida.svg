<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Isla bioeléctrica y reconexión — esquema histológico corregido</title>
  <desc id="desc">Dos mosaicos epiteliales idénticos comparan una isla multicelular despolarizada, cuyas gap junctions periféricas están cerradas, con la misma región repolarizada y reconectada. Una ampliación inferior muestra membranas adyacentes y conexones cerrados y abiertos.</desc>
  <defs>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif}.ink{fill:#24333A}.muted{fill:#69777C}.head{font-weight:700}
      .cell{fill:#E8EEF0;stroke:#AAB8BD;stroke-width:2.2;stroke-linejoin:round}
      .island{fill:#F5DFC2;stroke:#D98B2B;stroke-width:2.4;stroke-linejoin:round}
      .restored{fill:#CFE9E6;stroke:#138A86;stroke-width:2.4;stroke-linejoin:round}
      .nucleus{fill:#AAB8BD;opacity:.52}.nucleus-a{fill:#D98B2B;opacity:.42}.nucleus-g{fill:#138A86;opacity:.4}
      .gj-open{stroke:#138A86;stroke-width:5;stroke-linecap:round}.gj-closed{stroke:#D98B2B;stroke-width:5;stroke-linecap:round}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1l6 3.5L1 8" fill="none" stroke="#24333A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="leftClip"><rect x="58" y="132" width="542" height="330" rx="2"/></clipPath>
    <clipPath id="rightClip"><rect x="800" y="132" width="542" height="330" rx="2"/></clipPath>
  </defs>

  <rect width="1400" height="760" fill="#FCFCFA"/>
  <text x="58" y="49" class="t ink head" font-size="15" letter-spacing="2">ACOPLAMIENTO BIOELÉCTRICO EN UN TEJIDO CELULAR</text>
  <line x1="58" y1="70" x2="1342" y2="70" stroke="#D8DFE1"/>

  <!-- Encabezados -->
  <g class="t">
    <text x="58" y="108" class="ink head" font-size="23">Isla bioeléctrica</text>
    <text x="238" y="108" class="muted" font-size="14">región despolarizada · acoplamiento periférico interrumpido</text>
    <text x="800" y="108" class="ink head" font-size="23">Reconexión</text>
    <text x="932" y="108" class="muted" font-size="14">región repolarizada · acoplamiento restablecido</text>
  </g>

  <!-- Mosaico izquierdo: células contiguas -->
  <g clip-path="url(#leftClip)">
    <rect x="58" y="132" width="542" height="330" fill="#F3F6F6"/>
    <g class="cell">
      <path d="M40 110L135 105l43 67-30 72-96 3-35-67Z"/><path d="M135 105l98-14 46 61-29 75-72-55Z"/>
      <path d="M233 91l102 17 27 71-64 59-48-11 29-75Z"/><path d="M335 108l94-4 43 63-36 70-74-58Z"/>
      <path d="M429 104l101 12 29 73-51 57-72-9 36-70Z"/><path d="M530 116l100-9 40 70-27 71-84-59Z"/>
      <path d="M17 180l35 67 96-3 32 75-57 58-96-17-38-70Z"/><path d="M148 244l30-72 72 55 8 87-78 5Z"/>
      <path d="M436 237l72 9 33 76-62 58-78-24Z"/><path d="M508 246l51-57 84 59 6 80-108-6Z"/>
      <path d="M-11 290l38 70 96 17 19 85H35l-57-80Z"/><path d="M123 377l57-58 78-5 29 72-47 76h-98Z"/>
      <path d="M401 356l78 24 18 82H389l-39-67Z"/><path d="M479 380l62-58 108 6 22 77-76 57h-98Z"/>
    </g>
    <!-- isla: mismas células, dentro del mosaico -->
    <g class="island">
      <path d="M250 227l48 11 64-59 74 58-35 119-74 18-69-60Z"/>
      <path d="M258 314l69 60-40 12-29-72Z"/>
      <path d="M327 374l74-18-51 39-63-9Z"/>
    </g>
    <!-- núcleos -->
    <g class="nucleus">
      <ellipse cx="99" cy="171" rx="15" ry="10" transform="rotate(-12 99 171)"/><ellipse cx="222" cy="150" rx="14" ry="10"/><ellipse cx="320" cy="151" rx="15" ry="10" transform="rotate(16 320 151)"/>
      <ellipse cx="417" cy="162" rx="15" ry="10"/><ellipse cx="514" cy="170" rx="15" ry="10"/><ellipse cx="580" cy="158" rx="15" ry="10"/>
      <ellipse cx="88" cy="304" rx="15" ry="10"/><ellipse cx="201" cy="271" rx="15" ry="10"/><ellipse cx="472" cy="294" rx="15" ry="10"/><ellipse cx="572" cy="278" rx="15" ry="10"/>
      <ellipse cx="78" cy="412" rx="15" ry="10"/><ellipse cx="207" cy="394" rx="15" ry="10"/><ellipse cx="439" cy="412" rx="15" ry="10"/><ellipse cx="558" cy="404" rx="15" ry="10"/>
    </g>
    <g class="nucleus-a"><ellipse cx="336" cy="272" rx="16" ry="11"/><ellipse cx="294" cy="337" rx="13" ry="9"/><ellipse cx="357" cy="365" rx="13" ry="9"/></g>
    <!-- placas periféricas cerradas: ubicadas sobre membranas compartidas -->
    <g class="gj-closed">
      <path d="M278 231l-13 19M357 184l16 13M430 237l-9 24M400 355l-21 5M328 373l-18 9M258 313l-17-3"/>
    </g>
    <!-- símbolos discretos de cierre -->
    <g stroke="#D98B2B" stroke-width="2.4" stroke-linecap="round">
      <path d="M266 235l9 9m0-9l-9 9M363 185l9 9m0-9l-9 9M418 245l9 9m0-9l-9 9M383 354l9 9m0-9l-9 9M310 374l9 9m0-9l-9 9M244 306l9 9m0-9l-9 9"/>
    </g>
    <!-- información en red que no cruza el perímetro -->
    <g fill="#24333A" opacity=".72"><circle cx="92" cy="220" r="4"/><circle cx="122" cy="220" r="4"/><circle cx="152" cy="220" r="4"/><circle cx="182" cy="220" r="4"/><circle cx="212" cy="220" r="4"/><circle cx="236" cy="220" r="4"/></g>
    <path d="M236 220l13-7" stroke="#D98B2B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <rect x="58" y="132" width="542" height="330" fill="none" stroke="#D8DFE1"/>

  <!-- Transición -->
  <g transform="translate(646 294)">
    <path d="M0 0h92" stroke="#24333A" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="45" y="-18" text-anchor="middle" class="t ink head" font-size="11">REPOLARIZACIÓN</text>
    <text x="45" y="23" text-anchor="middle" class="t muted" font-size="11">reapertura</text>
  </g>

  <!-- Mosaico derecho: geometría idéntica -->
  <g clip-path="url(#rightClip)" transform="translate(742 0)">
    <rect x="58" y="132" width="542" height="330" fill="#F3F6F6"/>
    <g class="cell">
      <path d="M40 110L135 105l43 67-30 72-96 3-35-67Z"/><path d="M135 105l98-14 46 61-29 75-72-55Z"/>
      <path d="M233 91l102 17 27 71-64 59-48-11 29-75Z"/><path d="M335 108l94-4 43 63-36 70-74-58Z"/>
      <path d="M429 104l101 12 29 73-51 57-72-9 36-70Z"/><path d="M530 116l100-9 40 70-27 71-84-59Z"/>
      <path d="M17 180l35 67 96-3 32 75-57 58-96-17-38-70Z"/><path d="M148 244l30-72 72 55 8 87-78 5Z"/>
      <path d="M436 237l72 9 33 76-62 58-78-24Z"/><path d="M508 246l51-57 84 59 6 80-108-6Z"/>
      <path d="M-11 290l38 70 96 17 19 85H35l-57-80Z"/><path d="M123 377l57-58 78-5 29 72-47 76h-98Z"/>
      <path d="M401 356l78 24 18 82H389l-39-67Z"/><path d="M479 380l62-58 108 6 22 77-76 57h-98Z"/>
    </g>
    <g class="restored">
      <path d="M250 227l48 11 64-59 74 58-35 119-74 18-69-60Z"/><path d="M258 314l69 60-40 12-29-72Z"/><path d="M327 374l74-18-51 39-63-9Z"/>
    </g>
    <g class="nucleus">
      <ellipse cx="99" cy="171" rx="15" ry="10" transform="rotate(-12 99 171)"/><ellipse cx="222" cy="150" rx="14" ry="10"/><ellipse cx="320" cy="151" rx="15" ry="10" transform="rotate(16 320 151)"/>
      <ellipse cx="417" cy="162" rx="15" ry="10"/><ellipse cx="514" cy="170" rx="15" ry="10"/><ellipse cx="580" cy="158" rx="15" ry="10"/>
      <ellipse cx="88" cy="304" rx="15" ry="10"/><ellipse cx="201" cy="271" rx="15" ry="10"/><ellipse cx="472" cy="294" rx="15" ry="10"/><ellipse cx="572" cy="278" rx="15" ry="10"/>
      <ellipse cx="78" cy="412" rx="15" ry="10"/><ellipse cx="207" cy="394" rx="15" ry="10"/><ellipse cx="439" cy="412" rx="15" ry="10"/><ellipse cx="558" cy="404" rx="15" ry="10"/>
    </g>
    <g class="nucleus-g"><ellipse cx="336" cy="272" rx="16" ry="11"/><ellipse cx="294" cy="337" rx="13" ry="9"/><ellipse cx="357" cy="365" rx="13" ry="9"/></g>
    <!-- mismas posiciones, ahora placas abiertas -->
    <g class="gj-open"><path d="M278 231l-13 19M357 184l16 13M430 237l-9 24M400 355l-21 5M328 373l-18 9M258 313l-17-3"/></g>
    <!-- información distribuida sin onda ECG -->
    <g fill="#138A86"><circle cx="92" cy="220" r="4"/><circle cx="122" cy="220" r="4"/><circle cx="152" cy="220" r="4"/><circle cx="182" cy="220" r="4"/><circle cx="212" cy="220" r="4"/><circle cx="242" cy="220" r="4"/><circle cx="272" cy="220" r="4"/><circle cx="302" cy="220" r="4"/><circle cx="332" cy="220" r="4"/><circle cx="362" cy="220" r="4"/><circle cx="392" cy="220" r="4"/><circle cx="422" cy="220" r="4"/><circle cx="452" cy="220" r="4"/><circle cx="482" cy="220" r="4"/><circle cx="512" cy="220" r="4"/><circle cx="542" cy="220" r="4"/></g>
  </g>
  <rect x="800" y="132" width="542" height="330" fill="none" stroke="#D8DFE1"/>

  <!-- Detalle de gap junction -->
  <line x1="58" y1="498" x2="1342" y2="498" stroke="#D8DFE1"/>
  <text x="58" y="528" class="t ink head" font-size="13" letter-spacing="1.4">DETALLE DE LA UNIÓN INTERCELULAR</text>

  <g transform="translate(410 625)">
    <text x="-160" y="-73" text-anchor="middle" class="t ink head" font-size="14">Acoplamiento interrumpido</text>
    <!-- membranas contiguas -->
    <path d="M-275-48C-250-25-250 25-275 48" fill="none" stroke="#D98B2B" stroke-width="5"/>
    <path d="M-45-48C-70-25-70 25-45 48" fill="none" stroke="#D98B2B" stroke-width="5"/>
    <g fill="none" stroke="#D98B2B" stroke-width="4"><path d="M-263-30h78M-57-30h-78M-263 0h78M-57 0h-78M-263 30h78M-57 30h-78"/></g>
    <g stroke="#D98B2B" stroke-width="3" stroke-linecap="round"><path d="M-176-37l14 14m0-14l-14 14M-176-7l14 14m0-14l-14 14M-176 23l14 14m0-14l-14 14"/></g>
    <text x="-160" y="76" text-anchor="middle" class="t muted" font-size="12">conexones no alineados / canal cerrado</text>

    <path d="M0 0h78" stroke="#24333A" stroke-width="1.7" marker-end="url(#arrow)"/>

    <text x="250" y="-73" text-anchor="middle" class="t ink head" font-size="14">Acoplamiento restablecido</text>
    <path d="M135-48C160-25 160 25 135 48" fill="none" stroke="#138A86" stroke-width="5"/>
    <path d="M365-48C340-25 340 25 365 48" fill="none" stroke="#138A86" stroke-width="5"/>
    <g fill="none" stroke="#138A86" stroke-width="4"><path d="M147-30h206M147 0h206M147 30h206"/></g>
    <g fill="#138A86"><circle cx="190" cy="-30" r="4"/><circle cx="230" cy="-30" r="4"/><circle cx="270" cy="-30" r="4"/><circle cx="310" cy="-30" r="4"/></g>
    <text x="250" y="76" text-anchor="middle" class="t muted" font-size="12">conexones alineados / comunicación directa</text>
  </g>

  <text x="58" y="735" class="t muted" font-size="12"><tspan class="ink head">Convención gráfica:</tspan> ámbar = despolarización; verde azulado = reintegración funcional. Los colores no representan una tinción histológica.</text>
</svg>
