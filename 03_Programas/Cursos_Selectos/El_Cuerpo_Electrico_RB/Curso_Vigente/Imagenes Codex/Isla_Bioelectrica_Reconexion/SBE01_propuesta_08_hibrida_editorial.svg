<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Isla bioeléctrica y reconexión — versión híbrida editorial</title>
  <desc id="desc">Dos redes celulares equivalentes muestran una isla despolarizada con conexiones periféricas cerradas y la misma región reintegrada, con conexiones abiertas y señal compartida.</desc>
  <defs>
    <style>
      .type{font-family:Arial,Helvetica,sans-serif}.ink{fill:#24333A}.muted{fill:#69777C}
      .cell{fill:#FCFCFA;stroke:#138A86;stroke-width:2.6}.island{fill:#F5DFC2;stroke:#D98B2B;stroke-width:2.8}
      .restored{fill:#CFE9E6;stroke:#138A86;stroke-width:2.8}.nucleus{fill:#138A86;opacity:.18}.nucleus-a{fill:#D98B2B;opacity:.3}
      .net{fill:none;stroke:#138A86;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#24333A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="flow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#138A86" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="outer-cells">
      <circle cx="0" cy="-142" r="24"/><circle cx="100" cy="-101" r="24"/><circle cx="142" cy="0" r="24"/><circle cx="100" cy="101" r="24"/>
      <circle cx="0" cy="142" r="24"/><circle cx="-100" cy="101" r="24"/><circle cx="-142" cy="0" r="24"/><circle cx="-100" cy="-101" r="24"/>
    </g>
    <g id="outer-nuclei">
      <circle cx="0" cy="-142" r="7"/><circle cx="100" cy="-101" r="7"/><circle cx="142" cy="0" r="7"/><circle cx="100" cy="101" r="7"/>
      <circle cx="0" cy="142" r="7"/><circle cx="-100" cy="101" r="7"/><circle cx="-142" cy="0" r="7"/><circle cx="-100" cy="-101" r="7"/>
    </g>
    <g id="inner-cells"><circle cx="-39" cy="-27" r="31"/><circle cx="39" cy="-27" r="31"/><circle cx="0" cy="43" r="31"/></g>
    <g id="inner-nuclei"><circle cx="-39" cy="-27" r="9"/><circle cx="39" cy="-27" r="9"/><circle cx="0" cy="43" r="9"/></g>
  </defs>

  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="60" y="47" class="type ink" font-size="14" font-weight="700" letter-spacing="1.8">DEL AISLAMIENTO A LA RECONEXIÓN</text>
  <line x1="60" y1="68" x2="1140" y2="68" stroke="#D8DFE1"/>

  <!-- Isla -->
  <g transform="translate(300 330)">
    <text x="0" y="-224" text-anchor="middle" class="type ink" font-size="23" font-weight="700">Isla bioeléctrica</text>
    <text x="0" y="-198" text-anchor="middle" class="type muted" font-size="14">despolarizada · conexiones periféricas cerradas</text>
    <circle r="176" fill="#E8EEF0" opacity=".28"/>
    <circle r="91" fill="#F5DFC2" opacity=".16" stroke="#D98B2B" stroke-width="1.8" stroke-dasharray="5 7"/>
    <g class="net" opacity=".48"><path d="M0-142L-39-58M100-101L63-51M142 0L72-18M100 101L30 69M0 142V78M-100 101L-30 69M-142 0L-72-18M-100-101l37 50"/></g>
    <g class="cell"><use href="#outer-cells"/></g><g class="nucleus"><use href="#outer-nuclei"/></g>
    <g class="island"><use href="#inner-cells"/></g><g class="nucleus-a"><use href="#inner-nuclei"/></g>
    <!-- cierre inequívoco sobre las conexiones que llegan a la isla -->
    <g stroke="#B94E37" stroke-width="3.2" stroke-linecap="round">
      <path d="M-23-78l12 12m0-12l-12 12M53-72l12 12m0-12l-12 12M81-31l12 12m0-12l-12 12M42 72l12 12m0-12l-12 12M-13 82l12 12m0-12l-12 12M-62 59l12 12m0-12l-12 12M-91-31l12 12m0-12l-12 12M-65-72l12 12m0-12l-12 12"/>
    </g>
    <!-- señal que llega pero no atraviesa -->
    <path d="M-171 17C-142 5-123 29-98 17" fill="none" stroke="#24333A" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-87" cy="17" r="3.2" fill="#D98B2B"/><circle cx="-76" cy="17" r="2.8" fill="#D98B2B" opacity=".38"/>
  </g>

  <!-- Transición -->
  <g transform="translate(534 330)">
    <path d="M0 0h132" stroke="#24333A" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="64" y="-18" text-anchor="middle" class="type ink" font-size="11" font-weight="700" letter-spacing=".7">REPOLARIZACIÓN</text>
    <text x="64" y="25" text-anchor="middle" class="type muted" font-size="11">se reabren las conexiones</text>
  </g>

  <!-- Reconexión -->
  <g transform="translate(900 330)">
    <text x="0" y="-224" text-anchor="middle" class="type ink" font-size="23" font-weight="700">Reconexión</text>
    <text x="0" y="-198" text-anchor="middle" class="type muted" font-size="14">repolarizada · reintegrada al colectivo</text>
    <circle r="176" fill="#CFE9E6" opacity=".28"/>
    <g class="net"><path d="M0-142L-39-58M100-101L63-51M142 0L72-18M100 101L30 69M0 142V78M-100 101L-30 69M-142 0L-72-18M-100-101l37 50M-39-27h78M39-27L0 43M0 43l-39-70"/></g>
    <g class="cell"><use href="#outer-cells"/></g><g class="nucleus"><use href="#outer-nuclei"/></g>
    <g class="restored"><use href="#inner-cells"/></g><g class="nucleus"><use href="#inner-nuclei"/></g>
    <!-- señal compartida: entra, cruza la antigua isla y continúa -->
    <path d="M-171 17C-142 5-123 29-98 17S-50 5-25 17 23 29 48 17 96 5 121 17 151 23 170 16" fill="none" stroke="#138A86" stroke-width="3.2" stroke-linecap="round" marker-end="url(#flow)"/>
    <g fill="#138A86"><circle cx="-123" cy="17" r="3"/><circle cx="-73" cy="17" r="3"/><circle cx="-23" cy="17" r="3"/><circle cx="27" cy="17" r="3"/><circle cx="77" cy="17" r="3"/><circle cx="127" cy="17" r="3"/></g>
  </g>

  <line x1="60" y1="548" x2="1140" y2="548" stroke="#D8DFE1"/>
  <text x="60" y="576" class="type muted" font-size="13"><tspan class="ink" font-weight="700">Idea clave.</tspan> Reconectar es restablecer el intercambio entre la región y la red bioeléctrica del tejido.</text>
  <g transform="translate(60 612)" class="type muted" font-size="11.5">
    <circle cx="5" cy="-4" r="5" fill="#D98B2B"/><text x="18" y="0">región desacoplada</text>
    <circle cx="171" cy="-4" r="5" fill="#138A86"/><text x="184" y="0">red conectada</text>
    <path d="M303-4h26" stroke="#138A86" stroke-width="3" stroke-linecap="round"/><text x="341" y="0">información compartida</text>
  </g>
</svg>
