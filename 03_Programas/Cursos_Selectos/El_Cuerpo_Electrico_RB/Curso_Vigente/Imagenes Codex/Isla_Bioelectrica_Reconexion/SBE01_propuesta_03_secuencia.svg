<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Secuencia bioeléctrica — aislamiento, reapertura y reconexión</title>
  <desc id="desc">Tres campos equivalentes muestran una región tisular desacoplada, la reapertura de sus uniones y el retorno de la señal colectiva.</desc>
  <defs><style>.t{font-family:Arial,Helvetica,sans-serif}.h{font-weight:700;fill:#24333A}.s{fill:#69777C}.base{fill:#E8EEF0;stroke:#AAB8BD;stroke-width:2}.bad{fill:#F5DFC2;stroke:#D98B2B;stroke-width:2.3}.good{fill:#CFE9E6;stroke:#138A86;stroke-width:2.3}.ln{fill:none;stroke:#AAB8BD;stroke-width:2.5;stroke-linecap:round}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#24333A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1200" height="600" fill="#FCFCFA"/>
  <text x="60" y="48" class="t h" font-size="14" letter-spacing="1.8">DE LA ISLA AL PATRÓN COLECTIVO</text><line x1="60" y1="68" x2="1140" y2="68" stroke="#D8DFE1"/>

  <!-- módulos reutilizados visualmente -->
  <g transform="translate(190 290)">
    <text x="0" y="-190" text-anchor="middle" class="t h" font-size="18">1 · Aislamiento</text><text x="0" y="-165" text-anchor="middle" class="t s" font-size="13">la señal se interrumpe</text>
    <ellipse rx="134" ry="132" fill="#E8EEF0" opacity=".28"/>
    <g class="ln"><path d="M-93-54l74-50M-93-54l-7 90M-100 36l75 61M69-91l57 53M126-38l-7 83M119 45l-65 55"/></g>
    <g class="base"><path d="M-124-78q31-28 62 0v48q-31 28-62 0Z"/><path d="M-50-128q31-28 62 0v48q-31 28-62 0Z"/><path d="M-131 12q31-28 62 0v48q-31 28-62 0Z"/><path d="M-56 73q31-28 62 0v48q-31 28-62 0Z"/><path d="M38-115q31-28 62 0v48q-31 28-62 0Z"/><path d="M95-62q31-28 62 0v48q-31 28-62 0Z"/><path d="M88 21q31-28 62 0v48q-31 28-62 0Z"/><path d="M23 76q31-28 62 0v48q-31 28-62 0Z"/></g>
    <ellipse cx="9" cy="1" rx="65" ry="72" fill="none" stroke="#D98B2B" stroke-width="2" stroke-dasharray="6 7"/>
    <g class="bad"><path d="M-31-48q32-30 64 0v50q-32 30-64 0Z"/><path d="M-8 13q32-30 64 0v50q-32 30-64 0Z"/></g>
    <path d="M-143 4h30l15-22 20 44 15-22h18" fill="none" stroke="#24333A" stroke-width="3" stroke-linecap="round"/><path d="M-43 4h16" stroke="#24333A" stroke-width="3" stroke-dasharray="3 5"/>
  </g>
  <path d="M345 290h65" stroke="#24333A" stroke-width="1.7" marker-end="url(#a)"/>

  <g transform="translate(600 290)">
    <text x="0" y="-190" text-anchor="middle" class="t h" font-size="18">2 · Reapertura</text><text x="0" y="-165" text-anchor="middle" class="t s" font-size="13">se recupera el acoplamiento</text>
    <ellipse rx="134" ry="132" fill="#E8EEF0" opacity=".28"/>
    <g class="ln"><path d="M-93-54l74-50M-93-54l-7 90M-100 36l75 61M69-91l57 53M126-38l-7 83M119 45l-65 55M-19-104L1-24M69-91L1-24M1-24l23 61M24 37l30 63"/></g>
    <g class="base"><path d="M-124-78q31-28 62 0v48q-31 28-62 0Z"/><path d="M-50-128q31-28 62 0v48q-31 28-62 0Z"/><path d="M-131 12q31-28 62 0v48q-31 28-62 0Z"/><path d="M-56 73q31-28 62 0v48q-31 28-62 0Z"/><path d="M38-115q31-28 62 0v48q-31 28-62 0Z"/><path d="M95-62q31-28 62 0v48q-31 28-62 0Z"/><path d="M88 21q31-28 62 0v48q-31 28-62 0Z"/><path d="M23 76q31-28 62 0v48q-31 28-62 0Z"/></g>
    <g><path d="M-31-48q32-30 64 0v50q-32 30-64 0Z" fill="#E6EDEB" stroke="#7FAAA5" stroke-width="2.3"/><path d="M-8 13q32-30 64 0v50q-32 30-64 0Z" fill="#DCECE8" stroke="#5A9F98" stroke-width="2.3"/></g>
