  </g>
  <path d="M755 290h65" stroke="#24333A" stroke-width="1.7" marker-end="url(#a)"/>

  <g transform="translate(1010 290)">
    <text x="0" y="-190" text-anchor="middle" class="t h" font-size="18">3 · Reconexión</text><text x="0" y="-165" text-anchor="middle" class="t s" font-size="13">la información vuelve a circular</text>
    <ellipse rx="134" ry="132" fill="#CFE9E6" opacity=".28"/>
    <g class="ln" stroke="#138A86"><path d="M-93-54l74-50M-93-54l-7 90M-100 36l75 61M69-91l57 53M126-38l-7 83M119 45l-65 55M-19-104L1-24M69-91L1-24M1-24l23 61M24 37l30 63"/></g>
    <g class="base"><path d="M-124-78q31-28 62 0v48q-31 28-62 0Z"/><path d="M-50-128q31-28 62 0v48q-31 28-62 0Z"/><path d="M-131 12q31-28 62 0v48q-31 28-62 0Z"/><path d="M-56 73q31-28 62 0v48q-31 28-62 0Z"/><path d="M38-115q31-28 62 0v48q-31 28-62 0Z"/><path d="M95-62q31-28 62 0v48q-31 28-62 0Z"/><path d="M88 21q31-28 62 0v48q-31 28-62 0Z"/><path d="M23 76q31-28 62 0v48q-31 28-62 0Z"/></g>
    <g class="good"><path d="M-31-48q32-30 64 0v50q-32 30-64 0Z"/><path d="M-8 13q32-30 64 0v50q-32 30-64 0Z"/></g>
    <path d="M-143 4h30l15-22 20 44 15-22h42l16-23 21 46 19-24h39l17-22 20 43 18-20h30" fill="none" stroke="#138A86" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line x1="60" y1="515" x2="1140" y2="515" stroke="#D8DFE1"/>
  <g class="t s" font-size="12" transform="translate(60 550)"><circle cx="5" cy="-4" r="5" fill="#D98B2B"/><text x="18">despolarización</text><circle cx="166" cy="-4" r="5" fill="#138A86"/><text x="179">integración</text><path d="M282-4h28" stroke="#24333A" stroke-width="3"/><text x="323">señal bioeléctrica compartida</text></g>
</svg>
