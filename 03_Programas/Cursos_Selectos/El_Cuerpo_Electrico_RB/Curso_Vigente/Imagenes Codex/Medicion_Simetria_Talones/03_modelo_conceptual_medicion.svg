<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Modelo conceptual para medir e interpretar la simetría de los talones</title>
  <desc id="desc">La posición estandariza la medición. El talón izquierdo establece una referencia fija y el derecho actúa como variable. Una diferencia igual a cero indica isometría; un desplazamiento superior del talón derecho indica acortamiento funcional y nodo activo.</desc>
  <defs>
    <style>
      .type{font-family:Arial,Helvetica,sans-serif}.ink{fill:#24333A}.muted{fill:#6D7A7F}.teal{fill:#138A86}.amber{fill:#D98B2B}
      .line{fill:none;stroke:#24333A;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .quiet{fill:none;stroke:#AAB8BD;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#6D7A7F" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#138A86" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amber-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#D98B2B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="heel">
      <path d="M-40-96C-37-127-20-144 0-144s37 17 40 48l7 75C49 7 31 24 0 24S-49 7-47-21Z" fill="#FCFCFA" stroke="#536268" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M-35 5C-18 15 18 15 35 5" fill="none" stroke="#536268" stroke-width="2.7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1400" height="700" fill="#FCFCFA"/>
  <text x="65" y="51" class="type ink" font-size="14" font-weight="700" letter-spacing="1.9">ANTES DE EMPEZAR · MEDICIÓN</text>
  <text x="65" y="96" class="type ink" font-size="30" font-weight="700">La izquierda fija el cero. La derecha revela la variación.</text>
  <text x="65" y="128" class="type muted" font-size="15">La maniobra convierte una diferencia visual en una decisión de rastreo.</text>
  <line x1="65" y1="154" x2="1335" y2="154" stroke="#D8DFE1"/>

  <!-- 1 · estandarizar -->
  <g transform="translate(70 190)">
    <text x="0" y="0" class="type teal" font-size="12" font-weight="700" letter-spacing="1.4">1 · ESTANDARIZAR</text>
    <text x="0" y="33" class="type ink" font-size="20" font-weight="700">Una sola posición</text>
    <text x="0" y="57" class="type muted" font-size="13">para que la diferencia sea legible</text>

    <!-- síntesis lateral de la maniobra -->
    <path d="M12 277H292" stroke="#AAB8BD" stroke-width="6" stroke-linecap="round"/>
    <path d="M32 282v88M262 282v88" class="quiet" stroke-width="4"/>
    <circle cx="59" cy="227" r="21" fill="none" stroke="#24333A" stroke-width="3"/>
    <path d="M80 235C132 243 185 242 221 239" class="line"/>
    <path d="M221 239L365 156M226 249L370 166" class="line"/>
    <path d="M365 156l37-1 23 14-55-3M370 166l36-1 22 13-53-2" class="line"/>
    <path d="M345 139c14 0 23 8 27 21M348 183c13-2 21-9 24-20" fill="none" stroke="#138A86" stroke-width="3" stroke-linecap="round"/>
    <path d="M221 239h90" stroke="#AAB8BD" stroke-width="1.4" stroke-dasharray="4 5"/>
    <path d="M273 239A52 52 0 0 0 266 213" fill="none" stroke="#138A86" stroke-width="2"/>
    <text x="286" y="217" class="type teal" font-size="14" font-weight="700">≈30°</text>
    <g class="type" font-size="12" fill="#24333A">
      <text x="13" y="406"><tspan font-weight="700">tobillos</tspan> sujetos</text>
      <text x="141" y="406"><tspan font-weight="700">eje</tspan> alineado</text>
      <text x="266" y="406"><tspan font-weight="700">talones</tspan> libres</text>
    </g>
  </g>

  <path d="M465 390h68" stroke="#6D7A7F" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2 · comparar -->
  <g transform="translate(555 190)">
    <text x="0" y="0" class="type teal" font-size="12" font-weight="700" letter-spacing="1.4">2 · COMPARAR</text>
    <text x="0" y="33" class="type ink" font-size="20" font-weight="700">Una referencia y una variable</text>
    <text x="0" y="57" class="type muted" font-size="13">no se comparan dos valores independientes</text>

    <!-- talones: izquierda fija el cero -->
    <g transform="translate(96 275)"><use href="#heel"/><text x="0" y="62" text-anchor="middle" class="type ink" font-size="12" font-weight="700">I · REFERENCIA</text></g>
    <g transform="translate(263 247)"><use href="#heel" opacity=".24"/><text x="0" y="90" text-anchor="middle" class="type ink" font-size="12" font-weight="700">D · VARIABLE</text></g>
    <!-- posición isométrica del derecho como contorno fantasma -->
    <g transform="translate(263 275)" opacity=".45"><path d="M-40-96C-37-127-20-144 0-144s37 17 40 48l7 75C49 7 31 24 0 24S-49 7-47-21Z" fill="none" stroke="#138A86" stroke-width="2" stroke-dasharray="5 5"/><path d="M-35 5C-18 15 18 15 35 5" fill="none" stroke="#138A86" stroke-width="2"/></g>

    <!-- línea cero originada por la izquierda -->
    <path d="M22 287H337" stroke="#138A86" stroke-width="2.2" stroke-linecap="round"/>
    <text x="24" y="309" class="type teal" font-size="11" font-weight="700">CERO</text>
    <!-- delta de la derecha -->
    <path d="M326 259h23M326 287h23M341 263v20" stroke="#D98B2B" stroke-width="2" stroke-linecap="round"/>
    <text x="359" y="277" class="type amber" font-size="15" font-weight="700">Δ</text>

    <text x="180" y="406" text-anchor="middle" class="type ink" font-size="14"><tspan font-weight="700">Δ = posición del talón D − referencia I</tspan></text>
  </g>

  <path d="M930 390h68" stroke="#6D7A7F" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 · interpretar -->
  <g transform="translate(1020 190)">
    <text x="0" y="0" class="type teal" font-size="12" font-weight="700" letter-spacing="1.4">3 · INTERPRETAR</text>
    <text x="0" y="33" class="type ink" font-size="20" font-weight="700">La diferencia decide</text>
    <text x="0" y="57" class="type muted" font-size="13">dos estados, dos rutas</text>

    <circle cx="116" cy="142" r="28" fill="#FCFCFA" stroke="#536268" stroke-width="2"/>
    <text x="116" y="148" text-anchor="middle" class="type ink" font-size="16" font-weight="700">Δ</text>

    <!-- ruta isometría -->
    <path d="M94 163C60 196 48 222 48 254" fill="none" stroke="#138A86" stroke-width="2.2" marker-end="url(#teal-arrow)"/>
    <circle cx="48" cy="281" r="6" fill="#138A86"/>
    <text x="64" y="278" class="type ink" font-size="14" font-weight="700">Δ = 0</text>
    <text x="64" y="300" class="type muted" font-size="12.5">isometría</text>
    <text x="64" y="321" class="type teal" font-size="12.5" font-weight="700">rastrear por zonas</text>

    <!-- ruta acortamiento -->
    <path d="M138 163C174 196 188 222 188 254" fill="none" stroke="#D98B2B" stroke-width="2.2" marker-end="url(#amber-arrow)"/>
    <circle cx="188" cy="281" r="6" fill="#D98B2B"/>
    <text x="204" y="278" class="type ink" font-size="14" font-weight="700">D ↑</text>
    <text x="204" y="300" class="type muted" font-size="12.5">acortamiento</text>
    <text x="204" y="321" class="type amber" font-size="12.5" font-weight="700">nodo activo</text>
  </g>

  <line x1="65" y1="636" x2="1335" y2="636" stroke="#D8DFE1"/>
  <text x="65" y="665" class="type muted" font-size="13"><tspan class="ink" font-weight="700">Principio de lectura.</tspan> La izquierda establece el patrón; únicamente se interpreta el desplazamiento funcional de la derecha.</text>
</svg>
