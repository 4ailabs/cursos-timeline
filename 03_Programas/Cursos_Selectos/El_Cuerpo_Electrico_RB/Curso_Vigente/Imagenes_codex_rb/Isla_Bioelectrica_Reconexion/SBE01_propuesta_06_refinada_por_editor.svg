<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Isla bioeléctrica y reconexión — versión editorial refinada</title>
  <desc id="desc">Comparación esquemática de una región celular con acoplamiento bioeléctrico reducido y la misma región después del restablecimiento del acoplamiento intercelular.</desc>
  <defs>
    <style>
      .type{font-family:Arial,Helvetica,sans-serif}.ink{fill:#24333A}.muted{fill:#66757A}
      .cell{fill:#E8EEF0;stroke:#AAB8BD;stroke-width:1.8;stroke-linejoin:round}.island{fill:#F5DFC2;stroke:#D98B2B;stroke-width:2.2;stroke-linejoin:round}
      .reconnected{fill:#CFE9E6;stroke:#138A86;stroke-width:2.2;stroke-linejoin:round}.network{fill:none;stroke:#AAB8BD;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#24333A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="cells-neutral" class="cell">
      <path d="M-207-93q32-28 66-2l2 47q-30 30-66 4Z"/><path d="M-125-156q33-28 67-2l1 47q-31 29-66 4Z"/>
      <path d="M-216 1q34-28 68-1l1 47q-31 30-67 4Z"/><path d="M-151 78q34-28 68-1l2 47q-32 30-67 4Z"/>
      <path d="M57-157q34-28 68-1l2 47q-32 30-67 4Z"/><path d="M132-95q34-28 68-1l2 47q-32 30-67 4Z"/>
      <path d="M163-4q34-28 68-1l2 47q-32 30-67 4Z"/><path d="M108 79q34-28 68-1l2 47q-32 30-67 4Z"/>
      <path d="M16 106q34-28 68-1l2 47q-32 30-67 4Z"/>
    </g>
    <g id="cells-focus">
      <path d="M-55-70q36-31 73-2l2 52q-34 32-73 3Z"/><path d="M25-75q36-31 73-2l2 52q-34 32-73 3Z"/><path d="M-14-3q36-31 73-2l2 52q-34 32-73 3Z"/>
    </g>
  </defs>
  <rect width="1200" height="600" fill="#FCFCFA"/>
  <text x="60" y="48" class="type ink" font-size="14" font-weight="700" letter-spacing="1.7">ACOPLAMIENTO BIOELÉCTRICO DEL TEJIDO</text>
  <line x1="60" y1="68" x2="1140" y2="68" stroke="#D8DFE1" stroke-width="1"/>

  <g transform="translate(60 104)">
    <text x="0" y="18" class="type ink" font-size="22" font-weight="700">Isla bioeléctrica</text>
    <text x="0" y="43" class="type muted" font-size="14">acoplamiento intercelular reducido</text>
    <g transform="translate(227 226)">
      <path d="M-205-69l67-91 104 30 83-49 101 46 73 88-15 113-84 79-105 18-103-39-94-76Z" fill="#E8EEF0" opacity=".30"/>
      <g class="network"><path d="M-171-68L-90-131M-171-68l-9 95M-180 27l65 76M-115 103l98 31M-90-131l92 25M92-132l75 62M167-70l31 91M198 21l-55 83M143 104l-92 27"/></g>
      <use href="#cells-neutral"/>
      <ellipse cx="23" cy="-22" rx="94" ry="91" fill="#F5DFC2" fill-opacity=".10" stroke="#D98B2B" stroke-width="1.8" stroke-dasharray="5 7"/>
      <g class="island"><use href="#cells-focus"/></g>
      <!-- Pares de contactos intercelulares desalineados: acoplamiento funcional reducido. -->
      <g fill="none" stroke="#D98B2B" stroke-width="2.6" stroke-linecap="round">
        <path d="M-69-88h15m7 0h9M-71-45h15m7 0h9M96-91h9m7 0h15M98-48h9m7 0h15M-43 56l8 12m6 8 5 8M62 54l8 12m6 8 5 8"/>
      </g>
      <!-- La señal compartida llega al perímetro de la isla y se atenúa. -->
      <path d="M-224 3c28-10 51-10 73 0s42 10 62 1" fill="none" stroke="#24333A" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="-82" cy="4" r="3" fill="#D98B2B"/><circle cx="-70" cy="4" r="2.7" fill="#D98B2B" opacity=".42"/><circle cx="-59" cy="4" r="2.3" fill="#D98B2B" opacity=".18"/>
    </g>
  </g>

  <g transform="translate(552 326)"><path d="M0 0h75" stroke="#24333A" stroke-width="1.7" marker-end="url(#arrow)"/><text x="36" y="-15" class="type ink" font-size="11" font-weight="700" letter-spacing=".55" text-anchor="middle">REACOPLAMIENTO</text></g>

  <g transform="translate(660 104)">
    <text x="0" y="18" class="type ink" font-size="22" font-weight="700">Reconexión</text>
    <text x="0" y="43" class="type muted" font-size="14">acoplamiento intercelular restablecido</text>
    <g transform="translate(227 226)">
      <path d="M-205-69l67-91 104 30 83-49 101 46 73 88-15 113-84 79-105 18-103-39-94-76Z" fill="#CFE9E6" opacity=".24"/>
      <g class="network" stroke="#138A86"><path d="M-171-68L-90-131M-171-68l-9 95M-180 27l65 76M-115 103l98 31M-90-131l92 25M2-106l90-26M92-132l75 62M167-70l31 91M198 21l-55 83M143 104l-92 27M-90-2l50-39M61-43l73-27M23 52l-40 82M61-43L23 52M-40-41L23 52"/></g>
      <use href="#cells-neutral"/>
      <g class="reconnected"><use href="#cells-focus"/></g>
      <!-- Contactos continuos en los mismos límites funcionales. -->
      <g stroke="#138A86" stroke-width="3" stroke-linecap="round"><path d="M-69-88h31M-71-45h31M96-91h31M98-48h31M-43 56l19 28M62 54l19 28"/></g>
      <!-- Señal suave y continua, contenida dentro del panel. -->
      <path d="M-224 3c28-10 51-10 73 0s43 10 64 0 43-10 65 0 43 10 65 0 43-10 65 0 43 10 65 0 35-8 51-3" fill="none" stroke="#138A86" stroke-width="2.6" stroke-linecap="round"/>
      <g fill="#138A86"><circle cx="-151" cy="3" r="2.8"/><circle cx="-87" cy="3" r="2.8"/><circle cx="-22" cy="3" r="2.8"/><circle cx="43" cy="3" r="2.8"/><circle cx="108" cy="3" r="2.8"/><circle cx="173" cy="3" r="2.8"/></g>
    </g>
  </g>

  <line x1="60" y1="540" x2="1140" y2="540" stroke="#D8DFE1" stroke-width="1"/>
  <text x="60" y="564" class="type muted" font-size="13"><tspan class="ink" font-weight="700">Idea clave.</tspan> La arquitectura se conserva; cambia el acoplamiento y la continuidad de la información bioeléctrica compartida.</text>
  <text x="60" y="584" class="type muted" font-size="10.5">Esquema funcional: el color y las líneas codifican estados de acoplamiento; no representan una tinción ni un tejido específico.</text>
</svg>
