<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Isla bioeléctrica — ampliación de la unión celular</title>
  <desc id="desc">El tejido contextualiza una isla bioeléctrica y una ampliación compara una gap junction cerrada con una restablecida.</desc>
  <defs><style>.t{font-family:Arial,Helvetica,sans-serif}.h{font-weight:700;fill:#24333A}.s{fill:#69777C}.cell{fill:#E8EEF0;stroke:#AAB8BD;stroke-width:2}.amber{fill:#F5DFC2;stroke:#D98B2B;stroke-width:2.4}.green{fill:#CFE9E6;stroke:#138A86;stroke-width:2.4}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#24333A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1200" height="600" fill="#FCFCFA"/>
  <text x="60" y="48" class="t h" font-size="14" letter-spacing="1.8">LA UNIÓN DEFINE EL ESTADO COLECTIVO</text><line x1="60" y1="68" x2="1140" y2="68" stroke="#D8DFE1"/>

  <g transform="translate(60 112)">
    <text x="0" y="18" class="t h" font-size="22">La isla permanece dentro del tejido</text>
    <text x="0" y="44" class="t s" font-size="14">El desacoplamiento es funcional, no espacial.</text>
    <g transform="translate(235 230)">
      <path d="M-198-103l92-57 98 26 91-41 101 63 26 102-45 106-106 55-112-9-103-60-54-91Z" fill="#E8EEF0" opacity=".32"/>
