    <path d="M253 205h48" stroke="#24333A" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="277" y="184" text-anchor="middle" class="t h" font-size="10">REPOLARIZA</text>
  </g>
  <line x1="60" y1="540" x2="1140" y2="540" stroke="#D8DFE1"/>
  <text x="60" y="568" class="t s" font-size="13"><tspan class="h">Mecanismo visual.</tspan> La continuidad del canal convierte una zona desacoplada en parte activa del patrón tisular.</text>
