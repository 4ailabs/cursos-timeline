      <g class="cell"><path d="M-201-102q36-34 72 0v52q-36 34-72 0Z"/><path d="M-118-159q36-34 72 0v52q-36 34-72 0Z"/><path d="M-220-9q36-34 72 0v52q-36 34-72 0Z"/><path d="M-142 70q36-34 72 0v52q-36 34-72 0Z"/><path d="M68-160q36-34 72 0v52q-36 34-72 0Z"/><path d="M133-95q36-34 72 0v52q-36 34-72 0Z"/><path d="M151-2q36-34 72 0v52q-36 34-72 0Z"/><path d="M101 82q36-34 72 0v52q-36 34-72 0Z"/></g>
      <ellipse cx="17" cy="-4" rx="94" ry="102" fill="none" stroke="#D98B2B" stroke-width="2" stroke-dasharray="6 7"/>
      <g class="amber"><path d="M-58-64q38-36 76 0v58q-38 36-76 0Z"/><path d="M25-67q38-36 76 0v58q-38 36-76 0Z"/><path d="M-16 8q38-36 76 0v58q-38 36-76 0Z"/></g>
      <circle cx="77" cy="-10" r="18" fill="none" stroke="#24333A" stroke-width="1.8"/><path d="M90 3l76 78" stroke="#24333A" stroke-width="1.6"/>
    </g>
  </g>

  <line x1="540" y1="106" x2="540" y2="508" stroke="#D8DFE1"/>

  <g transform="translate(590 112)">
    <text x="0" y="18" class="t h" font-size="22">Detalle · gap junction</text>
    <text x="0" y="44" class="t s" font-size="14">La reapertura restablece el acoplamiento eléctrico.</text>
    <g transform="translate(145 205)">
      <text x="0" y="-114" text-anchor="middle" class="t h" font-size="15" fill="#D98B2B">Cerrada</text>
      <path d="M-100-72q48-27 96 0v144q-48 27-96 0Z" fill="#F5DFC2" stroke="#D98B2B" stroke-width="2.4"/>
      <path d="M4-72q48-27 96 0v144q-48 27-96 0Z" fill="#F5DFC2" stroke="#D98B2B" stroke-width="2.4"/>
      <g stroke="#D98B2B" stroke-width="7" stroke-linecap="round"><path d="M-13-37h9M-13-12h9M-13 13h9M-13 38h9M4-37h9M4-12h9M4 13h9M4 38h9"/></g>
      <path d="M-79 0h37" stroke="#24333A" stroke-width="3"/><path d="M-34-8l16 16m0-16l-16 16" stroke="#D98B2B" stroke-width="4" stroke-linecap="round"/>
