function regions(){let labels=['Cabeza','SNC','Cuello','Tórax','Abd. sup.','Pelvis','Dorso','Eje axial','M. sup.','M. inf.'];return `<svg class="svg" viewBox="0 0 500 380"><g font-family="Georgia"><path d="M250 35c-37 0-49 35-35 57l-20 32-33 47 26 57 17 95 26 30h38l26-30 17-95 26-57-33-47-20-32c14-22 2-57-35-57z" fill="#e8e6de" stroke="#77746c"/><g fill="#0f6e56">${labels.map((l,i)=>{let x=i<5?60:365,y=55+i%5*66;let cy=65+i*25;return `<circle cx="${i<5?220:280}" cy="${cy}" r="5"/><path d="M${i<5?215:285} ${cy}H${i<5?125:355}" stroke="#0f6e56"/><text x="${x}" y="${y}" font-size="13">${l}</text>`}).join('')}</g><text x="250" y="365" text-anchor="middle" font-size="14" fill="#57544e">diez regiones · perfiles anatómicos diferenciados</text></g></svg>`}
const slides=[
{t:'cover',section:'Módulo 1 · Bloque 2',title:'El instrumento|y el sustrato',sub:'Con qué se toca el cuerpo eléctrico y dónde actúa.',image:imgs.substrate},
{t:'grid',section:'Encuadre',title:'Tres preguntas ordenan el bloque',n:3,cols:[['01','¿Cómo toca el campo?','Cuatro mecanismos que interactúan con la célula y convergen en el Vmem.'],['02','¿Qué es el instrumento?','Campo estático, Tesla, profundidad, gradiente, polaridad y seguridad.'],['03','¿Dónde actúa?','Un sustrato continuo: matriz, fascia, red bioeléctrica e inmunidad.']]},
{t:'hero',section:'1 · Campo y célula',title:'El efecto ocurre|en estructuras cooperativas',lead:'Un ion aislado no explica la respuesta. Membranas, canales, cristales y redes ordenadas sí pueden sumar efectos.',caption:'La escala relevante no es una molécula aislada: es la organización supramolecular del tejido.',image:imgs.mem},
{t:'dark',section:'1 · Idea clave',body:'El campo no “añade energía” al cuerpo: <em>modifica estados</em> en estructuras que ya son eléctricas.'},
{t:'hero',section:'1 · Mecanismo 1',title:'La membrana es|una diana física',lead:'La anisotropía diamagnética reorienta parcialmente fosfolípidos y modifica la geometría de canales iónicos.',caption:'Torque sobre la bicapa → cinética de apertura del canal.',image:imgs.mem},
{t:'diagram',section:'1 · Mecanismo 2',title:'Del campo|al gen',lead:'Los canales de Ca²⁺ tipo T actúan como transductores directos: bloquear el canal elimina el efecto observado.',svg:cascade()},
{t:'hero',section:'1 · Mecanismo 3',title:'Magnetita biogénica:|un punto de anclaje',lead:'Un cristal ferromagnético de dominio único puede experimentar torque al estar anclado a membrana o citoesqueleto.',caption:'La existencia de magnetita biogénica está documentada; su distribución periférica sigue siendo una pregunta abierta.',image:imgs.mag},
{t:'compare',section:'1 · Mecanismo 4',title:'El microambiente también es inmunológico',cards:[['M1','Estado proinflamatorio','Señalización y matriz bajo estrés.'],['M2','Estado reparativo','Resolución y organización del microambiente.']],image:imgs.immune},

{t:'diagram',section:'2 · El instrumento',title:'El imán estático',lead:'Un imán permanente mantiene un campo constante en el tiempo. No “emite” energía: crea una región de interacción física medible.',svg:magnet()},
{t:'statement',section:'2 · Medición',title:'Tesla y Gauss expresan|la misma magnitud',lead:'La RB reporta Tesla y militesla: conecta la práctica con la literatura científica y evita inflar el número.',a:['1 T','10,000 G'],b:['100 mT','1,000 G']},
{t:'grid',section:'2 · Materiales',title:'Los dos tipos que se usan',n:2,cols:[['Ferrita','Estable y tradicional','Menor intensidad, bajo costo, resistente al calor y a la corrosión.'],['Neodimio','Compacto y potente','Mayor intensidad; requiere cuidado frente a golpes, temperatura y pinzamiento.']]},

{t:'grid',section:'2 · Seguridad',title:'Seguridad: primero verificar',n:3,cols:[['Dispositivos','Marcapasos, bombas y electrónica implantable requieren exclusión.'],['Implantes','Confirmar material ferromagnético y antecedentes quirúrgicos.'],['Manejo','Retirar tarjetas y dispositivos; proteger manos ante imanes potentes.']]},

{t:'hero',section:'3 · Sustrato continuo',title:'La RB actúa sobre|una continuidad',lead:'Matriz extracelular, fascia, red bioeléctrica e inmunidad describen el mismo territorio desde cuatro lenguajes científicos.',caption:'No son cuatro tejidos separados: son cuatro descripciones convergentes.',image:imgs.substrate},
{t:'grid',section:'3 · Convergencia',title:'Cuatro tradiciones,|un mismo sustrato',n:4,cols:[['Fascia','Planos y nodos','Vasos, nervios y matriz convergen en territorios funcionales.'],['MEC','Carga y fluido','La matriz regula hidratación, iones y comunicación local.'],['Redes','Gap junctions','Células acopladas comparten señal e información.'],['MALT','Territorios','La inmunidad mucosa se organiza regionalmente sobre la matriz.']]},

{t:'close',section:'Cierre',title:'Campo local. Vmem.|Sustrato continuo.',body:'El instrumento tiene propiedades físicas medibles; el cuerpo ofrece una red biológica donde esas propiedades pueden interactuar.'}
];
function render(s,i){let n=i+1,common=slideChrome(s.section,n);if(s.t==='cover')return `<section class="slide cover">${common}<img class="image" src="${s.image}" alt=""><i class="seam"></i><div class="copy"><p class="kicker" style="color:#d85a30">Formación en Regulación Bioeléctrica</p><div class="accent"></div><h1>${s.title.replace('|','<span>')}</span></h1><p class="sub">${s.sub}</p></div><p class="meta"><b>Dr. Miguel Ojeda Rios</b> · Instituto Centrobioenergetica · 2026</p></section>`;if(s.t==='hero')return `<section class="slide hero">${common}<img class="image" src="${s.image}" alt=""><i class="seam"></i><div class="copy"><p class="kicker">${s.section}</p><div class="accent"></div><h2>${s.title.replace('|','<br>')}</h2><p class="lead">${s.lead}</p></div><p class="caption"><b>Lectura.</b> ${s.caption}</p></section>`;if(s.t==='dark')return `<section class="slide dark">${common}<div class="copy"><p class="lab">Idea clave</p><h2>${s.body}</h2></div></section>`;if(s.t==='grid')return `<section class="slide grid">${common}<div class="head"><p class="kicker">${s.section}</p><h2>${s.title.replace('|','<br>')}</h2></div><div class="cols" style="--n:${s.n}">${s.cols.map(c=>`<div class="col"><p class="num">${c[0]}</p><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join('')}</div></section>`;if(s.t==='diagram')return `<section class="slide diagram">${common}<div class="copy"><p class="kicker">${s.section}</p><div class="accent"></div><h2>${s.title.replace('|','<br>')}</h2><p class="lead">${s.lead}</p></div><div class="plate">${s.svg}</div></section>`;if(s.t==='statement')return `<section class="slide statement">${common}<div class="copy"><p class="kicker">${s.section}</p><div class="accent"></div><h2>${s.title.replace('|','<br>')}</h2><p class="lead">${s.lead}</p></div><div class="split"><div><b>${s.a[0]}</b><p>${s.a[1]}</p></div><i></i><div><b>${s.b[0]}</b><p>${s.b[1]}</p></div></div></section>`;if(s.t==='compare')return `<section class="slide compare">${common}<div class="head"><p class="kicker">${s.section}</p><h2>${s.title}</h2></div><div class="cards">${s.cards.map((c,j)=>`<div class="card"><p class="lab">${c[0]}</p><h3>${c[1]}</h3><p>${c[2]}</p><img src="${s.image}" style="object-position:${j?'right':'left'}" alt=""></div>`).join('')}</div></section>`;return `<section class="slide close">${common}<div class="copy"><div class="dip" style="transform:scale(1.6);margin-bottom:48px"><i></i></div><h2>${s.title.replace('|','<br>')}</h2><p>${s.body}</p></div></section>`}
document.getElementById('deck').innerHTML=slides.map(render).join('');let at=0,all=[...document.querySelectorAll('.slide')];function show(i){at=(i+all.length)%all.length;all.forEach((e,j)=>e.classList.toggle('active',j===at));history.replaceState(null,'','#'+(at+1))}show(Math.max(0,(+location.hash.slice(1)||1)-1));document.getElementById('prev').onclick=()=>show(at-1);document.getElementById('next').onclick=()=>show(at+1);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(at+1);if(e.key==='ArrowLeft')show(at-1)});
</script>
