<!doctype html><html lang="es"><meta charset="utf-8"><title>Bloque 4 · Rastreo y nodo de lesión</title><style>:root{--p:#f7f4ec;--t:#0f6e56;--a:#ba7517;--i:#25241e;--m:#77746c;--l:#dcd7cb;--M:84px}*{box-sizing:border-box}body{margin:0;background:#17130e;font-family:Georgia;color:var(--i)}.deck{display:grid;gap:34px;padding:34px;justify-content:center}.slide{position:relative;width:1280px;height:720px;background:var(--p);overflow:hidden;box-shadow:0 20px 60px #0009}.top{position:absolute;top:42px;left:84px;right:56px;display:flex;justify-content:space-between;color:var(--t);font-size:14px;letter-spacing:2px;text-transform:uppercase}.foot{position:absolute;bottom:34px;left:84px;right:56px;border-top:1px solid var(--l);padding-top:12px;color:var(--m);font-size:14px;letter-spacing:2px}.copy{position:absolute;left:84px;top:150px;width:590px}.k{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--t)}.bar{width:58px;height:3px;background:var(--a);margin:24px 0}h1,h2,h3,p{margin:0;font-weight:400}h1{font-size:82px;line-height:.98}h2{font-size:48px;line-height:1.12}h3{font-size:26px;color:var(--t)}p{font-size:21px;line-height:1.5;color:#56534d}.hero img{position:absolute;right:0;top:0;width:489px;height:100%;object-fit:cover}.hero:after{content:'';position:absolute;right:489px;top:0;bottom:0;width:2px;background:var(--t)}.grid .head{position:absolute;left:84px;top:120px}.cols{position:absolute;left:84px;right:84px;top:250px;display:grid;grid-template-columns:repeat(var(--n,3),1fr)}.col{padding:10px 25px;border-left:1px solid var(--l)}.col:first-child{border:none;padding-left:0}.num{font-size:14px;letter-spacing:2px;color:var(--m);margin-bottom:16px}.col p{font-size:18px;margin-top:12px}.plate{position:absolute;right:56px;top:165px;width:520px;height:450px;background:#edf4ef;border-left:2px solid var(--t);padding:28px}.dark{background:#093f34}.dark .copy{top:0;bottom:0;width:auto;right:120px;display:flex;flex-direction:column;justify-content:center}.dark h2{color:#f7f4ec;font-size:51px;line-height:1.3}.dark em{color:#e8b75b;font-style:normal}.dark .top,.dark .foot{color:#c1e5d7}.dark .foot{border-color:#ffffff33}.svg{width:100%;height:auto}@media print{body{background:#fff}.deck{display:block;padding:0}.slide{break-after:page;box-shadow:none}@page{size:13.333in 7.5in;margin:0}}</style><body><main class="deck" id="deck"></main><script>
const A='assets/';const I={scan:A+'01-rastreo.png',node:A+'02-nodo.png',vagus:A+'03-vagal.png'};const slideHeader=(s,n)=>`<div class="top"><span>◐ el cuerpo eléctrico</span><span>${s}</span></div><div class="foot">Regulación Bioeléctrica · ${String(n).padStart(2,'0')}</div>`;const flow=()=>`<svg class="svg" viewBox="0 0 470 350"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#0f6e56"/></marker></defs><g font-family="Georgia" text-anchor="middle"><g fill="#fff" stroke="#0f6e56">${[30,130,230,330].map(x=>`<rect x="${x}" y="88" width="80" height="52" rx="9"/>`).join('')}</g><g font-size="13"><text x="70" y="118">Polo −</text><text x="170" y="112">Respuesta</text><text x="170" y="128">iliopsoas</text><text x="270" y="112">Polo +</text><text x="270" y="128">complemento</text><text x="370" y="112">Dipolo</text><text x="370" y="128">confirmado</text></g><g stroke="#0f6e56" stroke-width="2" marker-end="url(#a)"><path d="M110 114h15"/><path d="M210 114h15"/><path d="M310 114h15"/></g><text x="235" y="205" font-size="16" fill="#ba7517">rastreo → aplicación → verificación</text><path d="M140 250Q235 320 330 250" fill="none" stroke="#5dcaa5" stroke-width="3" marker-end="url(#a)"/></g></svg>`;const grid=()=>`<svg class="svg" viewBox="0 0 470 350"><g font-family="Georgia" text-anchor="middle">${[[145,110,'−'],[300,110,'+'],[145,230,'+'],[300,230,'−']].map(x=>`<circle cx="${x[0]}" cy="${x[1]}" r="42" fill="${x[2]=='−'?'#0f6e56':'#ba7517'}"/><text x="${x[0]}" y="${x[1]+10}" font-size="29" fill="#fff">${x[2]}</text>`).join('')}<path d="M145 110H300M145 230H300M145 110V230M300 110V230" stroke="#5dcaa5" stroke-width="2" stroke-dasharray="5 5"/><circle cx="222" cy="170" r="22" fill="#e7f5ee" stroke="#0f6e56"/><text x="222" y="176" font-size="12">epicentro</text><text x="222" y="320" font-size="15" fill="#77746c">fronteras de gradiente en cruz</text></g></svg>`;
const S=[
['cover','Módulo 1 · Bloque 4','El rastreo|y el nodo de lesión','De la teoría a las manos: leer el perfil y regular una lesión.',I.scan],
['dark','Propósito','Del marco bioeléctrico|a una <em>lectura clínica</em>.'],
['grid','Ruta del bloque','Dos técnicas base',[['Rastreo','Leer','Localiza zonas con respuesta en el microambiente.'],['Nodo de lesión','Regular','Trabaja una zona lesionada como polo bioeléctrico.'],['Tono vagal','Sistémico','Aborda alerta sostenida y mantenimiento.']]],
['hero','1 · Rastreo','Leer el estado|del microambiente','El rastreo no nombra enfermedades: observa una respuesta y construye un perfil del momento.',I.scan],
['grid','1 · Rastreo','Los tres elementos de la lectura',[['Instrumento','Imán, polo negativo','Se coloca sobre la zona que se explora.'],['Indicador','Iliopsoas derecho','Su cambio de tono muestra una respuesta.'],['Sustrato','Continuidad corporal','Fascia, MEC y uniones comunican la señal.']]],
['diagram','1 · Mecanismo propuesto','Del campo a la pierna','Campo local → cambio iónico → sustrato continuo → cadena simpática → tono del iliopsoas.',flow()],
['grid','1 · Interpretación','Qué produce el rastreo',[['Sí produce','Perfil bioeléctrico','Mapa de zonas con respuesta durante esa sesión.'],['Se interpreta con','Historia clínica','Densidad, simetría y vecindad anatómica.'],['No produce','Diagnóstico','No identifica enfermedad, infección o microorganismo.']]],
['dark','Lenguaje clínico','“Hay respuesta en la región X”.|No: <em>“tienes una infección”.</em>'],
['hero','2 · Calibración basal','Poner el cero|antes de leer','El acortamiento basal del hemicuerpo derecho puede ocultar las respuestas específicas.',I.scan],
['grid','2 · Calibración','Qué se observa primero',[['Posición','Decúbito supino','Persona relajada; pies al borde de la camilla.'],['Comparación','Talones simétricos','Presión suave, pareja y sin forzar.'],['Hallazgo','AHD basal','No es un hueso más corto: es tono asimétrico.']]],
['grid','2 · Calibración','Corrección cuando hay AHD',[['Polo positivo','Zona renal derecha','Región lumbar derecha, aproximada L1–L2.'],['Polo negativo','Parietal izquierdo','Completa el par de calibración.'],['Verificación','Piernas niveladas','Una vez nivelado, puede empezar el rastreo.']]],
['grid','2 · Tiempo y criterio','Qué hacer después',[['Si hay simetría inicial','Rastrear directo','No se realiza corrección.'],['Si se nivela','Mantener 15–20 min','La calibración puede continuar durante el rastreo.'],['Objetivo','Cero neutro','Las lecturas posteriores adquieren significado.']]],
['hero','3 · Principio','Cómo nace un|dipolo','El negativo revela un nodo; el positivo se desplaza hasta revertir la respuesta.',I.node],
['diagram','3 · Secuencia','Negativo → respuesta → positivo','El acortamiento abre la búsqueda. La reversión confirma que ambas zonas se leen como un par.',flow()],
['grid','3 · Búsqueda','Jerarquía del complementario',[['1 · Local','Alrededor del nodo','Arriba, abajo y a los lados.'],['2 · Anatómica','Bilateral o A–P','Mismo punto contralateral o cara opuesta.'],['3 · Distante','Otra región / riñón','Se explora si no revierte en el territorio.']]],
['grid','3 · Dos estrategias','Rastreo abierto y catálogo',[['Abierto','Sin ruta fija','Más exhaustivo; la respuesta guía el recorrido.'],['Por catálogo','Zonas frecuentes','Más ágil; puede omitir hallazgos del abierto.'],['Uso clínico','Combinado','Catálogo de base; abierto según historia clínica.']]],
['hero','4 · Ciclo clínico','Rastrear y aplicar|no se separan','Cada dipolo confirmado queda trabajando mientras se explora el siguiente punto.',I.scan],
['grid','4 · Ciclo','Cuatro movimientos de sesión',[['1 · Buscar','Negativo sobre un punto','Sin acortamiento: continuar.'],['2 · Confirmar','Añadir positivo','La reversión establece el dipolo.'],['3 · Aplicar','Dejar ambos imanes','El par permanece en posición.'],['4 · Continuar','Tomar otro par','Se retoma el rastreo.']]],
['grid','4 · Respuesta válida','Cuatro rasgos que se buscan',[['Inmediata','En segundos','Aparece tras colocar el imán.'],['Reversible','Al retirar','Desaparece cuando se retira.'],['Reproducible','Al repetir','Vuelve con la misma colocación.'],['Específica','En zona activa','No ocurre de modo generalizado.']]],
['grid','4 · Excepción práctica','Cuando dos dipolos comparten nodo',[['No simultáneos','Un nodo compartido','No se colocan dos configuraciones a la vez.'],['En secuencia','Aplicar y retirar','Se trabaja un dipolo y luego el siguiente.'],['Al cierre','Re-rastrear','Persistencia = registro para seguimiento.']]],
['dark','Regla operativa','Ante una respuesta pequeña o dudosa:|<em>re-rastrear.</em>'],
['grid','5 · Límites','Lo establecido y lo abierto',[['Documentado','Eslabones separados','Fascia, señal autonómica, tono y asimetría.'],['No establecido','Cadena completa','No se ha verificado como secuencia única.'],['Pendiente','Fiabilidad entre operadores','Aún no existe medición formal.']]],
['grid','5 · Disciplina técnica','Cómo reducir sesgos',[['Talones','Presión suave y simétrica','Evita crear una diferencia por la mano.'],['Ritmo','Segundos por punto','Da tiempo a percibir sin inducir expectativa.'],['Confirmación','Repetir positivos','Un nodo real da la misma respuesta.']]],
['hero','6 · Nodo de lesión','El punto trauma|se vuelve un nodo','Una lesión es una zona desregulada que puede responder al rastreo y encontrar complementario.',I.node],
['grid','6 · Origen','Qué puede iniciar un nodo',[['Impacto','Golpe o caída','Traumatismo físico localizado.'],['Intervención','Cirugía o extracción','Lesión mecánica de un tejido.'],['Resultado','Despolarización','Una isla queda fuera de coordinación.']]],
['grid','6 · Concepto','Tres piezas, un nombre',[['Becker','Corriente de lesión','La lesión genera un voltaje.'],['Levin','Isla despolarizada','K⁺ elevado y uniones cerradas desconectan la zona.'],['Rastreo','Nodo','Un polo con respuesta que busca complementario.']]],
['grid','6 · Operación','Cómo se forma el dipolo',[['Historia','Señala el trauma','Se rastrea directamente sobre la zona.'],['Nodo','Polo negativo','La respuesta confirma que la zona está activa.'],['Complementario','Local o renal','El dipolo se confirma por nivelación.']]],
['dark','Idea central','Regular el nodo es facilitar que la isla|vuelva al <em>colectivo</em>.'],
['grid','7 · Seguridad','Antes de aplicar',[['Dispositivos','Marcapasos / electrónicos','No aplicar sobre o cerca de ellos.'],['Zona','Embarazo y abdomen','Evitar esta aplicación.'],['Piel y metal','Herida / implante','Usar barrera en piel; valorar metal ferromagnético.'],['Material','Alergia al níquel','Usar cubierta entre imán y piel.']]],
['grid','7 · Técnica 1','Distante: lesión ↔ riñón',[['Indicación','Inflamación','Trauma con componente inflamatorio.'],['Configuración','− lesión / + regulador','Se busca la reversión con el complementario.'],['Tiempo','20–30 minutos','Recomputación del patrón.'],['Verificación','Retirar y probar','Se comprueba que no persista respuesta.']]],
['grid','7 · Reguladores','Jerarquía autonómica distante',[['Bulbo','Control central','Organiza centros vasomotor, cardiorrespiratorio y vago.'],['Suprarrenal','Efector neuroendocrino','K⁺ / Na⁺, cortisol y respuesta de estrés.'],['Hígado','Efector metabólico','Lactato y respuesta de fase aguda.'],['Riñón','Entorno iónico','Complementario frecuente del nodo.']]],
['diagram','7 · Técnica 2','Local: dos polos, un gradiente','Para dolor agudo: positivo adyacente al negativo; ambos quedan 15–30 minutos.',grid()],
['grid','7 · Técnica 2','Qué se busca localmente',[['Entrada','Zona dolorosa','Negativo confirma la respuesta.'],['Gradiente','Polos adyacentes','Frontera empinada entre signos opuestos.'],['Efecto propuesto','Bloqueo reversible','Modula potenciales de acción sin daño neural.']]],
['diagram','7 · Técnica 3','Rejilla de polos','Cuatro imanes alternos forman fronteras en cruz sobre el epicentro del dolor.',grid()],
['grid','7 · Técnica 3','Aplicación de la rejilla',[['Indicación','Trauma localizado','Dolor musculoesquelético o inflamación aguda.'],['Colocación','Epicentro','Centro de la cruz sobre máximo dolor.'],['Tiempo','20–30 minutos','Intervención local multidireccional.']]],
['grid','7 · Técnica 4','Combinada: local + sistémica',[['En la lesión','Rejilla','Gradiente multidireccional local.'],['A distancia','Imán convencional','Complementario hallado durante rastreo.'],['A la vez','Dos escalas','Dolor local y componente sistémico.']]],
['dark','Tiempo de aplicación','20–30 minutos: tiempo de|<em>recomputar el patrón.</em>'],
['hero','8 · Tono vagal','Cuando la desregulación|es sistémica','No trabaja un punto trauma: trabaja alerta sostenida, recuperación y mantenimiento.',I.vagus],
['grid','8 · Indicación','Cuándo pensar en esta técnica',[['Difuso','Estrés crónico','No hay un nodo local dominante.'],['Estado','Alerta sostenida','El sistema permanece en activación.'],['Mantenimiento','Persona sana','Apoyo del tono vagal de fondo.']]],
['grid','8 · Red parasimpática','Puntos bilaterales del eje',[['Craneal','Pineal / base del cráneo','Extremo superior y referencia craneal.'],['Tronco','Supraclavicular / escápula / riñón','Trayecto distribuido de aplicación.'],['Extremidades','Rodilla / tríceps / Aquiles / empeine','Continuidad territorial.'],['Ancla','Cervical–sacro','Une los extremos del eje craneosacro.']]],
['grid','8 · Lectura','Qué se observa',[['Objetivo','Mayor tono vagal','Favorece transición hacia recuperación.'],['Escala','Sistema completo','No es una intervención sobre un punto.'],['Signo posible','Movimientos oculares rápidos','A veces se asocia a recuperación profunda.']]],
['grid','9 · Síntesis','Lo que debe quedar claro',[['Rastreo','Perfil, no diagnóstico','Lee respuesta del microambiente.'],['Calibración','Pone el cero','Evita confundir asimetría basal con hallazgo.'],['Nodo','Lesión como polo','Se regula con complementario local o distante.'],['Tono vagal','Escala sistémica','Trabaja alerta sostenida.']]],
['dark','Cierre','Rastrear es leer el estado.|Regular es facilitar la <em>reconexión</em>.']
];
function r(s,i){let c=slideHeader(s[1],i+1);if(s[0]=='cover'||s[0]=='hero')return `<section class="slide hero">${c}<img src="${s[4]}"><div class="copy"><p class="k">${s[1]}</p><div class="bar"></div><h1>${s[2].replace('|','<br>')}</h1><p style="margin-top:25px;font-size:24px">${s[3]}</p></div></section>`;if(s[0]=='grid')return `<section class="slide grid">${c}<div class="head"><p class="k">${s[1]}</p><h2>${s[2].replace('|','<br>')}</h2></div><div class="cols" style="--n:${s[3].length}">${s[3].map((x,j)=>`<div class="col"><p class="num">${String(j+1).padStart(2,'0')}</p><h3>${x[0]}</h3><p>${x[1]}<br>${x[2]}</p></div>`).join('')}</div></section>`;if(s[0]=='diagram')return `<section class="slide grid">${c}<div class="copy"><p class="k">${s[1]}</p><div class="bar"></div><h2>${s[2].replace('|','<br>')}</h2><p style="margin-top:20px">${s[3]}</p></div><div class="plate">${s[4]}</div></section>`;return `<section class="slide dark">${c}<div class="copy"><p class="k" style="color:#e8b75b">Idea clave</p><h2>${s[2]}</h2></div></section>`}deck.innerHTML=S.map(r).join('');</script></body></html>
