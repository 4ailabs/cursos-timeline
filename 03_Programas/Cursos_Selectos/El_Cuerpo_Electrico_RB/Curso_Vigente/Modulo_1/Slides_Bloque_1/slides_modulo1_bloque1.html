<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El Cuerpo Eléctrico · Módulo 1 · Bloque 1 — Deck</title>
<style>
:root{
  --teal:#0F6E56; --teal2:#5DCAA5; --tealT:#E1F5EE;
  --cream:#E8E6DE; --paper:#F7F4EC; --ink:#2C2C2A; --muted:#8A897F;
  --amber:#BA7517; --coral:#D85A30; --purple:#534AB7; --line:#DCD7CB;
  /* rejilla áurea sobre 1280×720 */
  --M:84px;            /* margen mayor */
  --gold:791px;        /* 1280 / φ  → línea de división principal */
  --minor:489px;       /* 1280 − 791 → columna de imagen (sección áurea menor) */
}
*{box-sizing:border-box}
html,body{margin:0;background:#15100B;color:var(--ink)}
body{font-family:Georgia,"Times New Roman",serif}
.deck{display:grid;gap:34px;padding:34px;justify-content:center}
.slide{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--paper);box-shadow:0 22px 64px #000a}

/* ───────── chrome ───────── */
.dipole{position:absolute;left:var(--M);top:46px;z-index:6;line-height:0}
.section{position:absolute;left:150px;top:50px;color:var(--teal);font:15px Georgia,serif;letter-spacing:2.4px;text-transform:uppercase;z-index:6}
.folio{position:absolute;right:56px;bottom:34px;color:var(--muted);font:15px Georgia,serif;letter-spacing:2px;z-index:6}
.rule{position:absolute;left:var(--M);right:var(--M);bottom:56px;height:1px;background:var(--line)}
.rule::after{content:"";position:absolute;left:0;top:0;height:1px;width:0;background:var(--teal)}
.slide.in .rule::after{animation:ruleGrow 1s .25s cubic-bezier(.2,.7,.2,1) forwards}
.eyebrow{color:var(--teal);font:15px Georgia,serif;letter-spacing:2.4px;text-transform:uppercase}
.lead{font:24px/1.5 Georgia,serif;color:#57544E}

/* ───────── motion ───────── */
.r{opacity:0;transform:translateY(20px)}
.slide.in .r{animation:riseIn .7s cubic-bezier(.2,.7,.2,1) forwards}
.slide.in .r.d1{animation-delay:.09s}.slide.in .r.d2{animation-delay:.18s}
.slide.in .r.d3{animation-delay:.27s}.slide.in .r.d4{animation-delay:.36s}
.slide.in .r.d5{animation-delay:.45s}.slide.in .r.d6{animation-delay:.54s}
.slide.in .r.d7{animation-delay:.63s}.slide.in .r.d8{animation-delay:.72s}
@keyframes riseIn{to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
@keyframes ruleGrow{to{width:200px}}
@keyframes dipulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes kenburns{0%{transform:scale(1)}100%{transform:scale(1.035)}} /* zoom suave: no recorta etiquetas de las láminas Codex */
@keyframes revealPanel{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@keyframes revealPanelL{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}} /* reveal para paneles espejados (imagen a la izquierda) */
@keyframes ionPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.16);opacity:.72}}
.slide.in .dipole{animation:dipulse 3.6s ease-in-out infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.slide.in .draw{animation:draw 1.7s .35s ease forwards}
.slide.in .draw.d2{animation-delay:.9s}
.ion{transform-box:fill-box;transform-origin:center}
.slide.in .ion{animation:ionPulse 2.6s ease-in-out infinite}
.slide.in .ion.a{animation-delay:.4s}.slide.in .ion.b{animation-delay:.8s}.slide.in .ion.c{animation-delay:1.2s}
.dot-appear{opacity:0}.slide.in .dot-appear{animation:fadeIn .5s 1.4s forwards}

/* ───────── panel de imagen (sección áurea menor) ─────────
   Las láminas Codex son fondo blanco: el panel se iguala a blanco y usa
   object-fit:contain para NO recortar etiquetas cercanas al borde. */
.imgpanel{position:absolute;top:0;bottom:0;right:0;width:var(--minor);overflow:hidden;background:#FDFDFC}
.imgpanel img{width:100%;height:100%;object-fit:contain;display:block}
.slide.in .imgpanel img.kb{animation:kenburns 20s ease-in-out infinite alternate}
.imgpanel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:48px;background:linear-gradient(90deg,#2c2c2a12,#2c2c2a00);z-index:3} /* costura suavizada */
.imgpanel::after{content:"";position:absolute;left:0;top:0;bottom:0;width:1.5px;background:var(--teal);opacity:.9;z-index:4} /* hairline teal más fina */
.slide.in .imgpanel{animation:revealPanel .9s .1s cubic-bezier(.2,.7,.2,1) both}

/* ───────── cover ───────── */
.cover{background:linear-gradient(155deg,#FBF9F2,#F0ECDF)}
.cover .mark{position:absolute;left:var(--M);top:52px}
.cover .copy{position:absolute;left:var(--M);top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center}
.cover .kicker{color:var(--teal);font:15px Georgia,serif;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px} /* regla: el eyebrow/kicker es teal en todo el deck; ámbar/coral quedan como acentos */
.cover .accent{width:64px;height:3px;background:var(--amber);margin-bottom:26px}
.cover h1{margin:0;font:400 82px/.96 Georgia,serif;letter-spacing:-2.6px}
.cover h1 span{display:block;color:var(--teal)}
.cover .sub{margin-top:28px;width:480px;font:400 25px/1.42 Georgia,serif;color:#57544E;font-style:italic}
.cover .prog{margin-top:32px;color:var(--muted);font:15px Georgia,serif;letter-spacing:1.6px;text-transform:uppercase}
.cover .presenter{position:absolute;left:var(--M);bottom:50px;color:var(--muted);font:15px Georgia,serif;letter-spacing:.4px}
.cover .presenter b{color:var(--teal);font-weight:700}

/* ───────── statement (ancho completo) ───────── */
.statement .accent{position:absolute;left:var(--M);top:150px;width:66px;height:3px;background:var(--amber)}
.statement .copy{position:absolute;left:var(--M);top:184px;width:1060px}
.statement h2{margin:0;font:400 52px/1.17 Georgia,serif;letter-spacing:-1.6px}
.statement h2 strong{font-weight:400;color:var(--teal)}
.statement .lead{margin-top:28px;width:940px;font-size:24px}
.statement .phases{position:absolute;left:var(--M);right:var(--M);bottom:96px;display:grid;grid-template-columns:1fr 1px 1fr;gap:56px;align-items:start}
.statement .divider{align-self:stretch;background:var(--line);position:relative}
.statement .divider .dip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);padding:10px 0;line-height:0}
.statement .ph .lab{display:flex;align-items:center;gap:14px}
.statement .ph .gl{width:38px;height:38px;color:var(--teal)}
.statement .ph.b .gl{color:var(--amber)}
.statement .ph b{font:400 27px Georgia,serif;color:var(--teal)}
.statement .ph.b b{color:var(--amber)}
.statement .ph p{margin:13px 0 0;font:20px/1.5 Georgia,serif;color:#5A5852}

/* ───────── idea clave (teal) ───────── */
.idea{background:var(--teal)}
.idea .section{color:var(--teal2)}
.idea .copy{position:absolute;left:120px;right:120px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.idea .lab{color:#F0B45A;font:15px Georgia,serif;letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:28px}
.idea .lab .dot{width:9px;height:9px;border-radius:50%;background:#F0B45A}
.idea h2{margin:0;font:400 46px/1.34 Georgia,serif;letter-spacing:-.6px;color:var(--cream);max-width:1000px}
.idea h2 em{font-style:normal;color:#F0B45A}
.idea .folio{color:#E8E6DE88}
.idea .quote-dip{position:absolute;right:100px;top:92px}

/* ───────── hero (imagen vertical Codex, sección áurea) ───────── */
.hero .htext{position:absolute;left:var(--M);top:120px;bottom:172px;width:600px;display:flex;flex-direction:column;justify-content:center}
.hero .kick{color:var(--teal);font:15px Georgia,serif;letter-spacing:2.4px;text-transform:uppercase;margin-bottom:20px}
.hero .tick{width:54px;height:3px;background:var(--amber);margin-bottom:28px}
.hero h2{margin:0;font:400 46px/1.15 Georgia,serif;letter-spacing:-1.4px}
.hero .lead{margin-top:24px;width:560px;font-size:24px;line-height:1.5}
.hero .figcap{position:absolute;left:var(--M);bottom:52px;width:600px;font:16px/1.5 Georgia,serif;color:var(--muted)}
.hero .figcap b{color:var(--teal)}
/* variación sistemática: heros alternos espejan el panel (imagen a la izquierda),
   manteniendo la rejilla áurea — el texto ocupa la columna mayor a la derecha */
.hero.flip .imgpanel{right:auto;left:0}
.hero.flip .imgpanel::before{left:auto;right:0;background:linear-gradient(270deg,#2c2c2a12,#2c2c2a00)}
.hero.flip .imgpanel::after{left:auto;right:0}
.hero.flip .htext{left:auto;right:var(--M)}
.hero.flip .figcap{left:auto;right:var(--M);width:560px;text-align:right}
.slide.in .hero.flip .imgpanel,.hero.flip.slide.in .imgpanel{animation:revealPanelL .9s .1s cubic-bezier(.2,.7,.2,1) both}

/* ───────── diagrama SVG (plate tintada, mismo seam que las imágenes) ───────── */
.figsvg .htext{position:absolute;left:var(--M);top:120px;bottom:172px;width:600px;display:flex;flex-direction:column;justify-content:center}
.figsvg .tick{width:54px;height:3px;background:var(--amber);margin-bottom:28px}
.figsvg .plate{position:absolute;top:0;bottom:0;right:0;width:var(--minor);background:#F1F4EE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:52px 26px}
.figsvg .plate::after{content:"";position:absolute;left:0;top:0;bottom:0;width:1.5px;background:var(--teal);opacity:.9} /* hairline igualada a .imgpanel */
.slide.in .figsvg .plate,.figsvg.slide.in .plate{animation:revealPanel .9s .1s cubic-bezier(.2,.7,.2,1) both}
.figsvg .plate svg{width:100%;height:auto}
.figsvg .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 22px;font:16px Georgia,serif;color:#4C4A44}
.figsvg .legend span{display:inline-flex;align-items:center;gap:9px}
.figsvg .legend i{width:20px;height:4px;border-radius:2px;display:inline-block}
.figsvg .badge{align-self:flex-start;color:var(--teal);font:15px Georgia,serif;letter-spacing:2.4px;text-transform:uppercase;margin-bottom:18px}
.figsvg h2{margin:0;font:400 42px/1.16 Georgia,serif;letter-spacing:-1px}
.figsvg .lead{margin-top:22px;width:560px}
.figsvg .figcap{position:absolute;left:var(--M);bottom:52px;width:600px;font:16px/1.5 Georgia,serif;color:var(--muted)}
.figsvg .figcap b{color:var(--teal)}

/* ───────── grid de 4 (Becker) ───────── */
.grid4 .head{position:absolute;left:var(--M);top:116px;width:1000px}
.grid4 .title{font:400 44px/1.1 Georgia,serif;letter-spacing:-1.2px}
.grid4 .cols{position:absolute;left:var(--M);right:var(--M);top:224px;bottom:82px;display:grid;grid-template-columns:repeat(4,1fr)}
.grid4 .col{padding:8px 24px;display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--line)}
.grid4 .col:first-child{border-left:none;padding-left:0}
.grid4 .col:last-child{padding-right:0}
.grid4 .gl{width:52px;height:52px;color:var(--teal)}
.grid4 .col:nth-child(2) .gl{color:var(--amber)}
.grid4 .col:nth-child(3) .gl{color:var(--purple)}
.grid4 .col:nth-child(4) .gl{color:var(--coral)}
.grid4 .col .n{font:15px Georgia,serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.grid4 .col b{font:400 24px/1.22 Georgia,serif;color:var(--ink)}
.grid4 .col p{margin:0;font:18px/1.44 Georgia,serif;color:#4C4A44}

/* ───────── trio ───────── */
.trio .head{position:absolute;left:var(--M);top:116px;width:1000px}
.trio .title{font:400 44px/1.1 Georgia,serif;letter-spacing:-1.2px}
.trio .cols{position:absolute;left:var(--M);right:var(--M);top:230px;display:grid;grid-template-columns:repeat(3,1fr)}
.trio .col{padding:0 40px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.trio .col:first-child{border-left:none;padding-left:0}
.trio .col:last-child{padding-right:0}
.trio .gl{width:58px;height:58px;color:var(--teal);margin-bottom:4px}
.trio .col:nth-child(2) .gl{color:var(--amber)}
.trio .col:nth-child(3) .gl{color:var(--purple)}
.trio .col .tag{font:15px Georgia,serif;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.trio .col b{font:400 31px Georgia,serif;color:var(--teal)}
.trio .col:nth-child(2) b{color:var(--amber)}.trio .col:nth-child(3) b{color:var(--purple)}
.trio .col p{margin:0;font:20px/1.5 Georgia,serif;color:#4C4A44}
.trio .converge{position:absolute;left:180px;right:180px;bottom:80px;text-align:center;font:italic 400 21px/1.45 Georgia,serif;color:#4C4A44;padding-top:26px;border-top:1px solid var(--line)}

/* ───────── objectives ───────── */
.objectives .head{position:absolute;left:var(--M);top:114px;width:1000px}
.objectives .title{font:400 44px/1.12 Georgia,serif;letter-spacing:-1.2px}
.objectives .list{position:absolute;left:var(--M);right:var(--M);top:214px;bottom:92px;display:flex;flex-direction:column}
.objectives .item{flex:1;display:grid;grid-template-columns:340px 1fr;gap:48px;align-items:center;border-top:1px solid var(--line)}
.objectives .item:last-child{border-bottom:1px solid var(--line)}
.objectives .gl{width:56px;height:56px;color:var(--teal)}
.objectives h3{margin:0;font:400 27px Georgia,serif;color:var(--teal)}
.objectives .item p{margin:0;font:20px/1.46 Georgia,serif;color:#4C4A44;max-width:660px}
.objectives .note{position:absolute;left:var(--M);bottom:56px;font:15px Georgia,serif;letter-spacing:.6px;color:var(--muted)}

/* ───────── recap ───────── */
.recap .head{position:absolute;left:var(--M);top:114px;width:1000px}
.recap .title{font:400 44px/1.1 Georgia,serif;letter-spacing:-1.2px}
.recap .rows{position:absolute;left:var(--M);right:var(--M);top:206px;bottom:72px;display:flex;flex-direction:column}
.recap .row{flex:1;display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:center;border-top:1px solid var(--line)}
.recap .row:last-child{border-bottom:1px solid var(--line)}
.recap .row .node{width:36px}
.recap .row .k{font:400 24px Georgia,serif;color:var(--teal)}
.recap .row .v{font:20px/1.46 Georgia,serif;color:#4C4A44;max-width:820px}
.recap .row .v b{color:var(--ink)}

/* ───────── feature (lámina enmarcada — infografía del sistema anterior) ─────────
   Se presenta como "plate" intencional: matte crema del deck + hairline y sombra
   suaves, con chrome del deck (dipolo, section, folio). NO se altera la imagen. */
.feature{background:linear-gradient(155deg,#FBF9F2,#F0ECDF)} /* matte igualado al degradado de portada */
.feature .plateframe{position:absolute;left:var(--M);right:var(--M);top:104px;bottom:110px;display:flex;align-items:center;justify-content:center}
.feature .plateframe img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#F6F1E7;border:1px solid var(--line);border-radius:3px;box-shadow:0 18px 46px #2c2c2a24}
.feature .figcap{position:absolute;left:0;right:0;bottom:56px;text-align:center;font:16px/1.5 Georgia,serif;color:var(--muted)}
.feature .figcap b{color:var(--teal)}
.feature .folio{color:var(--muted)}

/* ───────── close ───────── */
.close{background:var(--teal)}
.close .mark{position:absolute;left:50%;top:130px;transform:translateX(-50%)}
.close .copy{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.close h2{margin:0;font:400 60px/1.05 Georgia,serif;color:var(--cream);letter-spacing:-1.4px;max-width:940px}
.close p{margin:32px auto 0;max-width:720px;color:#E8E6DEC4;font:22px/1.5 Georgia,serif}
.close .endorsement{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);width:250px;filter:brightness(0) invert(1);opacity:.85}

/* ───────── responsive + print ───────── */
@media(max-width:1340px){body{overflow-x:hidden}.deck{justify-content:start;padding:12px}}
@media print{
  @page{size:13.333in 7.5in;margin:0}
  body{background:#fff}.deck{display:block;padding:0}
  .slide{break-after:page;box-shadow:none}
}
@media print,(prefers-reduced-motion:reduce){
  .r{opacity:1!important;transform:none!important;animation:none!important}
  .rule::after{width:200px!important;animation:none!important}
  .dipole,.imgpanel,.imgpanel img,.figsvg .plate,.draw,.ion,.feature img{animation:none!important}
  .imgpanel{clip-path:none!important}
  .draw{stroke-dashoffset:0!important}
}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const logo="../../Marca_Visual/Branding_RB_2026/svg/";
const codex="../Imagenes%20Codex/";
const nano="../Imagenes/nano%20banana/";
const sisv="../Sistema_Vigente/imagenes%20slides/";

/* ============ Figuras SVG premium (animadas) — reusadas del manual A5 ============ */

// Fig.1 — Corriente de lesión (Becker): curva de voltaje salamandra / rana, con dibujo animado
function beckerCurve(){return `<svg viewBox="0 0 437 330" role="img" aria-label="Voltaje del muñón en salamandra y rana tras amputación" style="width:100%;height:auto">

  <text x="416" y="220" text-anchor="end" font-family="Georgia,serif" font-size="16" fill="#0F6E56">−30 mV · regenera</text>
  <text x="416" y="136" text-anchor="end" font-family="Georgia,serif" font-size="16" fill="#C0512B">−10 mV · cicatriza</text>
  <g font-family="Georgia,serif" font-size="15" fill="#6E6A61">
    <text x="52" y="270" text-anchor="middle">Reposo</text><text x="120" y="270" text-anchor="middle">Corte</text>
    <text x="190" y="270" text-anchor="middle">1 día</text><text x="286" y="270" text-anchor="middle">1 sem</text>
    <text x="352" y="270" text-anchor="middle">2 sem</text><text x="416" y="270" text-anchor="middle">4 sem</text>
  </g>
</svg>`}

// Fig.3 — El potencial de Donnan: carga fija concentra cationes, excluye Cl⁻ y genera voltaje interno
function donnanFig(){return `<svg viewBox="0 0 437 402" role="img" aria-label="La carga fija concentra cationes, excluye el cloruro y genera un voltaje interno de Donnan" style="width:100%;height:auto">
  <text x="168" y="20" text-anchor="middle" font-family="Georgia,serif" font-size="15" letter-spacing="1" fill="#6E6A61">TEJIDO CARGADO (MATRIZ)</text>
  <rect x="14" y="34" width="308" height="252" rx="16" fill="#F6FAF8" stroke="#0F6E56" stroke-width="2.6"/>
  <g fill="none" stroke="#0F6E56" stroke-width="1.8" opacity="0.85"><path d="M34,98 Q120,82 205,98 T312,98"/><path d="M34,162 Q120,146 205,162 T312,162"/><path d="M34,226 Q120,210 205,226 T312,226"/></g>
  <g fill="#0F6E56"><circle cx="70" cy="95" r="8"/><circle cx="170" cy="102" r="8"/><circle cx="280" cy="95" r="8"/><circle cx="118" cy="159" r="8"/><circle cx="232" cy="165" r="8"/><circle cx="70" cy="223" r="8"/><circle cx="170" cy="230" r="8"/><circle cx="280" cy="223" r="8"/></g>
  <g fill="#fff" font-family="Georgia,serif" font-size="14" font-weight="700" text-anchor="middle"><text x="70" y="100">–</text><text x="170" y="107">–</text><text x="280" y="100">–</text><text x="118" y="164">–</text><text x="232" y="170">–</text><text x="70" y="228">–</text><text x="170" y="235">–</text><text x="280" y="228">–</text></g>
  <g fill="#BA7517"><circle class="ion" cx="118" cy="128" r="12"/><circle class="ion a" cx="228" cy="128" r="12"/><circle class="ion b" cx="170" cy="192" r="12"/><circle class="ion c" cx="262" cy="196" r="12"/><circle class="ion a" cx="80" cy="192" r="12"/></g>

 ["La jerarquía","El Vmem organiza; el pH es una lectura. <b>La regulación actúa sobre el voltaje.</b>"]

{type:"close",title:"El microambiente que conduce, y el voltaje que instruye.",body:"Sobre estos dos pilares se construye todo el método. Continúa en el Bloque 2: El instrumento y el sustrato."}

];

/* ============ Render ============ */
function chrome(s,i,dark){return `<div class="dipole">${dipoleIcon(dark?'#5DCAA5':'#0F6E56',44)}</div><div class="section">${s.section||""}</div><div class="folio">${String(i+1).padStart(2,"0")}</div>`}

let heroOrd=0; /* cuenta de heros para alternar el lado del panel (regla: heros impares espejados) */
function render(s,i){
 const cls=s.type==="figsvg"?"figsvg":s.type;
 const flip=(s.type==="hero" && (heroOrd++ %2===1))?" flip":"";
 let x=`<section class="slide ${cls}${flip}">`;

 if(s.type==="cover")return x+`<div class="dipole">${dipoleIcon('#0F6E56',44)}</div><div class="copy"><div class="kicker r">${s.kicker}</div><div class="accent r d1"></div><h1 class="r d2">${s.title.replace("|","<span>")}</span></h1><p class="sub r d4">${s.sub}</p><div class="prog r d5">${s.prog}</div></div><div class="presenter r d5"><b>Dr. Miguel Ojeda Rios</b> · Instituto Centrobioenergetica · 2026</div><div class="imgpanel"><img class="kb" src="${s.img}" alt=""></div></section>`;

 if(s.type==="close")return x+`<div class="dipole">${dipoleIcon('#5DCAA5',44)}</div><div class="copy"><h2 class="r d1">${s.title}</h2><p class="r d3">${s.body}</p></div><img class="endorsement r d4" src="${logo}endorsement_instituto.svg" alt=""></section>`;

 if(s.type==="idea")return x+chrome(s,i,true)+`<div class="copy"><div class="lab r"><span class="dot"></span>Idea clave</div><h2 class="r d2">${s.body}</h2></div></section>`;

 if(s.type==="feature")return x+chrome(s,i)+`<div class="plateframe r"><img src="${s.img}" alt=""></div>${s.cap?`<div class="figcap r d2">${s.cap}</div>`:""}</section>`;

 x+=chrome(s,i);

 if(s.type==="objectives"){
  x+=`<div class="head"><h2 class="title r">${s.title}</h2></div><div class="list">${s.items.map((it,j)=>`<div class="item r d${j+1}"><h3>${it[0]}</h3><p>${it[1]}</p></div>`).join("")}</div><div class="note r d5">${s.note}</div>`;
 }

 if(s.type==="statement"){
  x+=`<div class="accent r"></div><div class="copy"><h2 class="r d1">${s.title}</h2><p class="lead r d2">${s.lead}</p></div>`;
  if(s.chips){
   x+=`<div class="phases"><div class="ph r d3"><div class="lab"><b>${s.chips[0][0]}</b></div><p>${s.chips[0][1]}</p></div><div class="divider r d3"></div><div class="ph b r d4"><div class="lab"><b>${s.chips[1][0]}</b></div><p>${s.chips[1][1]}</p></div></div>`;
  }
 }

 if(s.type==="hero"){
  const kick=s.badge?`<div class="kick r">${s.badge}</div>`:"";
  const cap=s.cap?`<div class="figcap r d3">${s.cap}</div>`:"";
  x+=`<div class="htext">${kick}<div class="tick r"></div><h2 class="r d1">${s.title}</h2>${s.lead?`<p class="lead r d2">${s.lead}</p>`:""}</div><div class="imgpanel"><img class="kb" src="${s.img}" alt=""></div>${cap}`;
 }

 if(s.type==="figsvg"){
  const legend=s.legend?`<div class="legend">${s.legend.map(l=>`<span><i style="background:${l[0]}"></i>${l[1]}</span>`).join("")}</div>`:"";
  const badge=s.badge?`<div class="badge r">${s.badge}</div>`:"";
  const cap=s.cap?`<div class="figcap r d3">${s.cap}</div>`:"";
  x+=`<div class="htext">${badge}<div class="tick r"></div><h2 class="r d1">${s.title}</h2>${s.lead?`<p class="lead r d2">${s.lead}</p>`:""}</div><div class="plate">${s.svg}${legend}</div>${cap}`;
 }

 if(s.type==="grid4"){
  x+=`<div class="head"><h2 class="title r">${s.title}</h2></div><div class="cols">${s.cards.map((c,j)=>`<div class="col r d${j+1}"><div class="n">${c[1]}</div><b>${c[2]}</b><p>${c[3]}</p></div>`).join("")}</div>`;
 }

 if(s.type==="trio"){
  x+=`<div class="head"><h2 class="title r">${s.title}</h2></div><div class="cols">${s.cols.map((c,j)=>`<div class="col r d${j+1}"><span class="tag">${c[0]}</span><b>${c[1]}</b><p>${c[2]}</p></div>`).join("")}</div><div class="converge r d4">${s.converge}</div>`;
 }

 if(s.type==="recap"){
  x+=`<div class="head"><h2 class="title r">${s.title}</h2></div><div class="rows">${s.rows.map((r,j)=>`<div class="row r d${j+1}"><div class="k">${r[0]}</div><div class="v">${r[1]}</div></div>`).join("")}</div>`;
 }

 const noRule=(s.type==="hero"||s.type==="figsvg");
 return x+(noRule?"":`<div class="rule"></div>`)+`</section>`;
}

document.getElementById("deck").innerHTML=slides.map(render).join("");

const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.22});
document.querySelectorAll(".slide").forEach(s=>io.observe(s));

function fitDeck(){
 const deck=document.getElementById("deck");
 if(innerWidth<1340){
   const scale=(innerWidth-24)/1280;
   deck.style.transform=`scale(${scale})`;deck.style.transformOrigin="top left";deck.style.width="1280px";deck.style.position="absolute";deck.style.left="0";deck.style.top="0";
   document.body.style.height=`${deck.scrollHeight*scale}px`;
 }else{deck.style.transform="";deck.style.width="";deck.style.position="";deck.style.left="";deck.style.top="";document.body.style.height="";}
}
fitDeck();addEventListener("resize",fitDeck);addEventListener("load",fitDeck);
</script>
</body>
</html>
