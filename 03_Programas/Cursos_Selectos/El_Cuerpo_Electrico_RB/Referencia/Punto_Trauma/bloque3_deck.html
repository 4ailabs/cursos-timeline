rAll('.slide')];function show(i){at=(i+all.length)%all.length;all.forEach((x,j)=>x.classList.toggle('active',j===at));history.replaceState(null,'','#'+(at+1))}show(Math.max(0,(+location.hash.slice(1)||1)-1));prev.onclick=()=>show(at-1);next.onclick=()=>show(at+1);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(at+1);if(e.key==='ArrowLeft')show(at-1)});
