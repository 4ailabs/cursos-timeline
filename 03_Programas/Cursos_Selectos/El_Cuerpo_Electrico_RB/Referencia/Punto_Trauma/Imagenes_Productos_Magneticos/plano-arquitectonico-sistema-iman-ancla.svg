<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Plano arquitectónico del sistema modular con imán ancla</title>
  <desc id="desc">Plano técnico con tres etapas de montaje y un corte lateral del sistema de seis módulos magnéticos para muñeca.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#66736F"/></marker>
    <marker id="dimA" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="none" stroke="#66736F" stroke-width="1.5"/></marker>
    <marker id="dimB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#66736F" stroke-width="1.5"/></marker>
    <style>
      .sheet{fill:#F6F2E9}.ink{stroke:#263B37;fill:none;stroke-width:3}.thin{stroke:#66736F;fill:none;stroke-width:2}.dash{stroke:#87908C;fill:none;stroke-width:2;stroke-dasharray:8 7}.panel{fill:#FBF9F3;stroke:#A6AEA9;stroke-width:2}.skin{fill:#E8D3C0;stroke:#806F63;stroke-width:2}.frame{fill:#1F514A;stroke:#173C37;stroke-width:3}.well{fill:#F6F2E9;stroke:#173C37;stroke-width:2}.north{fill:#2F8778;stroke:#173C37;stroke-width:3}.south{fill:#B9B4A8;stroke:#4E504D;stroke-width:3}.silicone{fill:#EAE4D8;stroke:#756F65;stroke-width:2}.lock{fill:#D79A64;stroke:#674D38;stroke-width:2}.label{font-family:Arial,sans-serif;fill:#263B37;font-size:24px}.small{font-family:Arial,sans-serif;fill:#53605C;font-size:19px}.head{font-family:Arial,sans-serif;fill:#263B37;font-size:28px;font-weight:700}.pole{font-family:Arial,sans-serif;fill:#FFFFFF;font-size:26px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.poleDark{font-family:Arial,sans-serif;fill:#263B37;font-size:26px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.dim{font-family:Arial,sans-serif;fill:#53605C;font-size:18px;text-anchor:middle}.call{font-family:Arial,sans-serif;fill:#263B37;font-size:18px}.num{font-family:Arial,sans-serif;fill:#FFFFFF;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect class="sheet" width="1600" height="1120"/>
  <text class="head" x="70" y="58">SISTEMA MODULAR · IMÁN ANCLA + REJILLA 3 × 2</text>
  <text class="small" x="70" y="90">Plano conceptual · cotas provisionales en milímetros · verificar campo, tolerancias y materiales antes de fabricar</text>

  <g transform="translate(55 130)">
    <rect class="panel" width="470" height="460" rx="10"/>
    <circle cx="40" cy="40" r="22" fill="#1F514A"/><text class="num" x="40" y="41">1</text>
    <text class="head" x="78" y="48">LOCALIZAR Y FIJAR</text>
    <text class="small" x="32" y="86">El punto P queda bajo el módulo ancla. No se mueve.</text>
    <rect class="skin" x="90" y="145" width="300" height="200" rx="92"/>
    <circle cx="173" cy="226" r="8" fill="#D05E55"/>
    <line class="thin" x1="173" y1="226" x2="70" y2="118" marker-end="url(#arrow)"/>
    <text class="small" x="68" y="112">Punto P</text>
    <rect class="silicone" x="142" y="195" width="76" height="76" rx="10"/>
    <rect class="north" x="150" y="203" width="60" height="60" rx="5"/>
    <text class="pole" x="180" y="233">N</text>
    <text class="small" x="132" y="302">módulo ancla</text>
    <line class="thin" x1="142" y1="368" x2="218" y2="368" marker-start="url(#dimA)" marker-end="url(#dimB)"/>
    <text class="dim" x="180" y="393">19 base / 17 cápsula</text>
  </g>

  <line class="thin" x1="535" y1="360" x2="585" y2="360" marker-end="url(#arrow)"/>

  <g transform="translate(585 130)">
    <rect class="panel" width="470" height="460" rx="10"/>
    <circle cx="40" cy="40" r="22" fill="#1F514A"/><text class="num" x="40" y="41">2</text>
    <text class="head" x="78" y="48">CAPTURAR EL ANCLA</text>
    <text class="small" x="32" y="86">El marco C entra desde la derecha, todavía sin imanes.</text>
    <rect class="skin" x="85" y="145" width="300" height="200" rx="92"/>
    <rect class="silicone" x="100" y="160" width="76" height="76" rx="10"/>
    <rect class="north" x="108" y="168" width="60" height="60" rx="5"/>
    <text class="pole" x="138" y="198">N</text>
    <path class="frame" d="M176 153 H400 V313 H164 V238 H186 V291 H378 V175 H176 Z"/>
    <rect class="well" x="191" y="175" width="55" height="55" rx="4"/>
    <rect class="well" x="257" y="175" width="55" height="55" rx="4"/>
    <rect class="well" x="323" y="175" width="55" height="55" rx="4"/>
    <rect class="well" x="191" y="241" width="55" height="55" rx="4"/>
    <rect class="well" x="257" y="241" width="55" height="55" rx="4"/>
    <rect class="well" x="323" y="241" width="55" height="55" rx="4"/>
    <path class="dash" d="M94 153 H180 V239 H94"/>
    <rect class="lock" x="70" y="247" width="84" height="16" rx="7"/>
    <line class="thin" x1="70" y1="255" x2="94" y2="255" marker-end="url(#arrow)"/>
    <text class="small" x="52" y="288">puente de cierre</text>
    <line class="thin" x1="400" y1="132" x2="184" y2="132" marker-end="url(#arrow)"/>
    <text class="small" x="286" y="119">entrada lateral del marco C</text>
    <text class="small" x="190" y="348">5 cavidades quedan vacías</text>
  </g>

  <line class="thin" x1="1065" y1="360" x2="1115" y2="360" marker-end="url(#arrow)"/>

  <g transform="translate(1115 130)">
    <rect class="panel" width="430" height="460" rx="10"/>
    <circle cx="40" cy="40" r="22" fill="#1F514A"/><text class="num" x="40" y="41">3</text>
    <text class="head" x="78" y="48">COMPLETAR REJILLA</text>
    <text class="small" x="32" y="86">Los otros cinco módulos entran verticalmente.</text>
    <rect class="skin" x="65" y="145" width="300" height="200" rx="92"/>
    <rect class="frame" x="68" y="151" width="294" height="188" rx="10"/>
    <rect class="north" x="78" y="161" width="84" height="78" rx="6"/><text class="pole" x="120" y="200">N</text>
    <rect class="south" x="168" y="161" width="84" height="78" rx="6"/><text class="poleDark" x="210" y="200">S</text>
    <rect class="north" x="258" y="161" width="84" height="78" rx="6"/><text class="pole" x="300" y="200">N</text>
    <rect class="south" x="78" y="249" width="84" height="78" rx="6"/><text class="poleDark" x="120" y="288">S</text>
    <rect class="north" x="168" y="249" width="84" height="78" rx="6"/><text class="pole" x="210" y="288">N</text>
    <rect class="south" x="258" y="249" width="84" height="78" rx="6"/><text class="poleDark" x="300" y="288">S</text>
    <circle cx="120" cy="220" r="7" fill="#D05E55"/>
    <text class="small" x="86" y="372">• el punto P continúa bajo el ancla</text>
    <line class="thin" x1="68" y1="397" x2="362" y2="397" marker-start="url(#dimA)" marker-end="url(#dimB)"/>
    <text class="dim" x="215" y="423">59 mm</text>
    <line class="thin" x1="386" y1="151" x2="386" y2="339" marker-start="url(#dimA)" marker-end="url(#dimB)"/>
    <text class="dim" x="405" y="250" transform="rotate(-90 405 250)">40 mm</text>
  </g>

  <g transform="translate(55 635)">
    <rect class="panel" width="1490" height="420" rx="10"/>
    <text class="head" x="32" y="48">CORTE A–A · MÓDULO ANCLA Y MARCO</text>
    <line class="dash" x1="50" y1="338" x2="1430" y2="338"/>
    <text class="small" x="1370" y="366">piel</text>
    <rect class="skin" x="90" y="338" width="520" height="34" rx="12"/>
    <rect class="silicone" x="190" y="290" width="118" height="48" rx="12"/>
    <rect class="north" x="208" y="260" width="82" height="60" rx="5"/>
    <rect class="silicone" x="200" y="250" width="98" height="78" rx="10" fill="none"/>
    <path class="frame" d="M310 275 H570 V328 H310 V310 H350 V293 H310 Z"/>
    <rect class="lock" x="304" y="295" width="48" height="14" rx="5"/>
    <line class="thin" x1="249" y1="225" x2="249" y2="258" marker-end="url(#arrow)"/>
    <text class="call" x="170" y="212">núcleo 15 × 15 × 3</text>
    <line class="thin" x1="220" y1="382" x2="220" y2="330" marker-end="url(#arrow)"/>
    <text class="call" x="85" y="407">silicona hacia piel 1–2</text>
    <line class="thin" x1="450" y1="235" x2="450" y2="273" marker-end="url(#arrow)"/>
    <text class="call" x="367" y="221">marco rígido 1.5–2</text>
    <line class="thin" x1="326" y1="385" x2="326" y2="310" marker-end="url(#arrow)"/>
    <text class="call" x="291" y="410">cierre</text>

    <g transform="translate(720 82)">
      <text class="head" x="0" y="0">ARQUITECTURA DE PIEZAS</text>
      <circle cx="18" cy="52" r="15" fill="#1F514A"/><text class="num" x="18" y="53">A</text><text class="label" x="50" y="60">Módulo ancla sellado, con cara N dirigida a la piel</text>
      <circle cx="18" cy="105" r="15" fill="#1F514A"/><text class="num" x="18" y="106">B</text><text class="label" x="50" y="113">Base de acoplamiento que permanece adherida al punto P</text>
      <circle cx="18" cy="158" r="15" fill="#1F514A"/><text class="num" x="18" y="159">C</text><text class="label" x="50" y="166">Marco C sin imanes; captura el ancla desde un lado</text>
      <circle cx="18" cy="211" r="15" fill="#1F514A"/><text class="num" x="18" y="212">D</text><text class="label" x="50" y="219">Puente mecánico; impide que el marco vuelva a abrirse</text>
      <circle cx="18" cy="264" r="15" fill="#1F514A"/><text class="num" x="18" y="265">E</text><text class="label" x="50" y="272">Cinco módulos secundarios insertados después, desde arriba</text>
    </g>
  </g>
</svg>
