<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Rejilla de ocho imanes cuadrados sobre muñeca</title>
  <desc id="desc">Diagrama superior de una muñeca de seis por cuatro centímetros con ocho imanes de trece milímetros en patrón alternado norte-sur.</desc>
  <rect width="1200" height="800" fill="#F7F3EA"/>
  <text x="600" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#263B37">Muñeca 6 × 4 cm · rejilla 4 × 2</text>
  <line x1="270" y1="155" x2="930" y2="155" stroke="#6F7773" stroke-width="3"/><line x1="270" y1="142" x2="270" y2="168" stroke="#6F7773" stroke-width="3"/><line x1="930" y1="142" x2="930" y2="168" stroke="#6F7773" stroke-width="3"/>
  <text x="600" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#4C5753">6 cm</text>
  <rect x="270" y="210" width="660" height="440" rx="210" fill="#DFE6E0" stroke="#263B37" stroke-width="5"/>
  <line x1="220" y1="210" x2="220" y2="650" stroke="#6F7773" stroke-width="3"/><line x1="207" y1="210" x2="233" y2="210" stroke="#6F7773" stroke-width="3"/><line x1="207" y1="650" x2="233" y2="650" stroke="#6F7773" stroke-width="3"/>
  <text x="190" y="430" text-anchor="middle" transform="rotate(-90 190 430)" font-family="Arial, sans-serif" font-size="25" fill="#4C5753">4 cm</text>
  <g stroke="#263B37" stroke-width="4">
    <rect x="281" y="276" width="143" height="143" fill="#0F6E56"/><rect x="446" y="276" width="143" height="143" fill="#B9BDB6"/><rect x="611" y="276" width="143" height="143" fill="#0F6E56"/><rect x="776" y="276" width="143" height="143" fill="#B9BDB6"/>
    <rect x="281" y="441" width="143" height="143" fill="#B9BDB6"/><rect x="446" y="441" width="143" height="143" fill="#0F6E56"/><rect x="611" y="441" width="143" height="143" fill="#B9BDB6"/><rect x="776" y="441" width="143" height="143" fill="#0F6E56"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle"><g fill="#FFFFFF"><text x="353" y="358">N</text><text x="683" y="358">N</text><text x="518" y="523">N</text><text x="848" y="523">N</text></g><g fill="#263B37"><text x="518" y="358">S</text><text x="848" y="358">S</text><text x="353" y="523">S</text><text x="683" y="523">S</text></g></g>
  <circle cx="353" cy="382" r="10" fill="#E36C5C" stroke="#263B37" stroke-width="3"/>
  <text x="600" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#4C5753">Imanes de 13 × 13 mm · 2 mm entre bordes · huella 58 × 28 mm</text>
</svg>
