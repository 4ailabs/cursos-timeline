<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bases de RB y el Punto Trauma — Jueves de Wellkitt</title>
<style>
:root{--teal:#0F6E56;--teal2:#5DCAA5;--tealT:#E1F5EE;--cream:#E8E6DE;--paper:#F7F4EC;--ink:#2C2C2A;--muted:#77756F;--amber:#BA7517;--coral:#D85A30;--purple:#534AB7;--line:#D5D0C4}
*{box-sizing:border-box}html,body{margin:0;background:#171816;color:var(--ink)}body{font-family:Arial,Helvetica,sans-serif}
.deck{display:grid;gap:36px;padding:36px;justify-content:center}.slide{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--paper);box-shadow:0 18px 55px #0007}
.dipole{position:absolute;left:64px;top:46px;width:52px}.section{position:absolute;left:132px;top:49px;color:var(--teal);font:14px Arial;letter-spacing:2.6px;text-transform:uppercase}
.folio{position:absolute;right:64px;bottom:24px;color:var(--muted);font:14px Arial;letter-spacing:2px}.rule{position:absolute;left:64px;right:64px;bottom:49px;height:1px;background:var(--line)}
.title{font:400 44px/1.1 Georgia,serif;letter-spacing:-1.2px}.lead{font:20px/1.45 Georgia,serif;color:#56534D}.eyebrow{color:var(--teal);font:14px Arial;letter-spacing:2.8px;text-transform:uppercase}
.program{position:absolute;left:64px;top:48px;width:188px}.endorsement{position:absolute;right:64px;top:55px;width:250px}
.head{position:absolute;left:64px;top:104px;width:1150px}

/* ---------- Portada / cierre / declaración / cita (texto, sin diagrama) ---------- */
.cover .copy{position:absolute;left:64px;top:220px;width:900px}.cover h1{margin:20px 0 0;padding-bottom:7px;font:400 80px/1 Georgia,serif;letter-spacing:-2px}.cover h1 span{display:block;color:var(--teal)}.cover .lead{margin-top:28px;width:760px;font-size:22px}.cover .presenter{position:absolute;left:64px;bottom:56px;color:var(--muted);font:13px Arial;letter-spacing:1px}
.cover .signal{position:absolute;left:0;right:0;bottom:0;height:180px;opacity:.5}

.quote{background:var(--teal);color:var(--cream)}.quote .program,.quote .endorsement{filter:brightness(0) invert(1);opacity:.75}.quote .copy{position:absolute;left:92px;top:166px;width:1030px}.quote .eyebrow{color:var(--teal2)}.quote h2{margin:28px 0 0;font:400 52px/1.15 Georgia,serif;letter-spacing:-1.5px}.quote h2 em{font-style:normal;color:#F0B45A}.quote p{margin-top:34px;width:800px;color:#E8E6DEB8;font:18px/1.5 Arial}.quote .folio{color:#E8E6DE88}.quote .dots{position:absolute;right:80px;top:80px}

.statement .copy{position:absolute;left:88px;top:170px;width:1060px}.statement h2{margin:18px 0 0;font:400 56px/1.12 Georgia,serif;letter-spacing:-1.6px}.statement h2 strong{font-weight:400;color:var(--teal)}.statement .lead{margin-top:30px;width:840px;font-size:21px}.statement .accent{position:absolute;left:88px;top:132px;width:76px;height:3px;background:var(--amber)}

.close .copy{position:absolute;left:0;right:0;top:250px;text-align:center}.close h2{margin:24px 0 0;font:400 50px Georgia,serif}.close .lead{margin:24px auto 0;max-width:680px}.close .program{left:50%;top:70px;transform:translateX(-50%)}

.split .cols{position:absolute;left:64px;right:64px;top:210px;bottom:78px;display:grid;grid-template-columns:1fr 1fr;align-items:center}
.split .col{position:relative;padding:44px 46px}
.split .col.a{padding-right:70px}.split .col.b{padding-left:70px}
.split .divider{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);transform:translateX(-.5px)}
.split .divider .dipole-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;background:var(--paper);display:grid;place-items:center}
.split .icon{width:44px;height:44px;margin-bottom:22px}
.split .stat{font:400 46px/1 Georgia,serif;color:var(--teal);letter-spacing:-1px}
.split .col.b .stat{color:var(--amber)}
.split .statlabel{margin:8px 0 20px;font:13px Arial;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.split h3{margin:0 0 10px;font:400 24px/1.2 Georgia,serif}.split p{margin:0;font:16px/1.52 Arial;color:#5A5852;max-width:420px}

.table .rows{position:absolute;left:64px;right:64px;top:250px;bottom:78px;display:flex;flex-direction:column;gap:2px}.table .row{display:grid;grid-template-columns:1.1fr 1.6fr 1.6fr 1fr;gap:16px;align-items:center;padding:12px 18px;background:#fff}.table .row.head-row{background:transparent;color:var(--teal);font:13px Arial;letter-spacing:1.4px;text-transform:uppercase}.table .row:not(.head-row):nth-child(odd){background:#F1EFE8}.table .row b{font:400 18px Georgia,serif}.table .row span{font:14px/1.3 Arial;color:#5A5852}

/* ---------- CASCADE: espina vertical de nodos (extiende el dipolo) ---------- */
.cascade .wrap{position:absolute;left:96px;right:96px;top:250px;bottom:70px;display:flex;align-items:center}
.cascade .wrap.aside{right:auto;width:600px}
.cascade .aside-visual{position:absolute;right:96px;top:224px;bottom:96px;width:440px;background:#fff;display:flex;align-items:center;justify-content:center;padding:28px}
.cascade .steps{position:relative;width:1120px}
.cascade .spine{position:absolute;left:15px;top:16px;bottom:16px;width:2px;background:linear-gradient(var(--teal),var(--teal2))}
.cascade .step{position:relative;display:flex;align-items:flex-start;gap:26px;padding-bottom:30px}
.cascade .step:last-child{padding-bottom:0}
.cascade .node{position:relative;z-index:2;flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:13px Arial;box-shadow:0 0 0 6px var(--paper)}
.cascade .body{padding-top:2px}.cascade .body b{font:400 22px Georgia,serif;color:var(--ink)}.cascade .body p{margin:4px 0 0;font:15px/1.4 Arial;color:#5A5852;max-width:920px}
.cascade.tight .step{padding-bottom:36px}.cascade.tight .node{width:38px;height:38px;font-size:14px}.cascade.tight .body b{font-size:24px}.cascade.tight .body p{font-size:16px;margin-top:6px}

/* ---------- TRACE: gráfico de voltaje real (corriente de lesión) ---------- */
.trace .chart{position:absolute;left:96px;right:96px;top:230px;bottom:130px}
.trace .legend{position:absolute;left:96px;bottom:70px;display:flex;gap:34px;font:14px Arial;color:#5A5852}
.trace .legend span{display:inline-flex;align-items:center;gap:8px}
.trace .legend i{width:22px;height:3px;display:inline-block;border-radius:2px}

/* ---------- GRADIENT-CONCEPT: B(x) vs dB/dx ---------- */
.gconcept .chart{position:absolute;left:96px;right:96px;top:196px;bottom:120px}
.gconcept .note{position:absolute;left:96px;right:96px;bottom:66px;font:15px/1.4 Arial;color:#5A5852}

/* ---------- NETWORK: red de nodos / isla eléctrica ---------- */
.network .diagram{position:absolute;left:96px;right:96px;top:230px;bottom:130px}
.network .caption{position:absolute;left:96px;bottom:66px;right:96px;display:flex;justify-content:space-between;font:14px Arial;color:#5A5852}
.network .caption b{color:var(--ink);font-weight:700}

/* ---------- FIELD: campo radial (atenuación con la distancia) ---------- */
.field .diagram{position:absolute;left:64px;top:196px;width:560px;height:480px}
.field .readout{position:absolute;right:96px;top:250px;width:420px;display:flex;flex-direction:column;gap:14px}
.field .readout .r{display:flex;justify-content:space-between;align-items:baseline;padding:12px 20px;background:#fff;border-left:4px solid var(--teal)}
.field .readout .r b{font:400 26px Georgia,serif;color:var(--teal)}.field .readout .r span{font:14px Arial;color:#5A5852}

/* ---------- MECHANISMS: grid de 4 mecanismos con ícono propio ---------- */
.mechanisms .grid{position:absolute;left:64px;right:64px;top:224px;bottom:70px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.mechanisms .card{background:#fff;border-top:4px solid var(--teal);padding:22px 18px;display:flex;flex-direction:column;gap:12px}
.mechanisms .card:nth-child(2){border-color:var(--amber)}.mechanisms .card:nth-child(3){border-color:var(--purple)}.mechanisms .card:nth-child(4){border-color:var(--coral)}
.mechanisms .card b{font:400 19px Georgia,serif}.mechanisms .card p{margin:0;font:14px/1.4 Arial;color:#5A5852}

/* ---------- GRADIENT: imán simple vs. arreglo cuadripolar ---------- */
.gradient .panels{position:absolute;left:64px;right:64px;top:210px;display:grid;grid-template-columns:1fr 1fr;gap:32px}
.gradient .panel{background:#fff;padding:20px 22px 22px}
.gradient .panel b{font:400 20px Georgia,serif;display:block;margin-bottom:4px}
.gradient .panel .sub{font:13px Arial;color:var(--muted);margin-bottom:10px;display:block}
.gradient .panel .diagram-box{height:190px}
.gradient .panel p{margin:10px 0 0;font:14px/1.4 Arial;color:#5A5852}
.gradient .note{position:absolute;left:64px;right:64px;bottom:70px;padding:14px 22px;background:var(--ink);color:var(--cream);font:15px/1.4 Georgia,serif;text-align:center}

/* ---------- GAUGE: escala de voltaje ---------- */
.gauge .scale{position:absolute;left:120px;right:120px;top:340px;height:6px;background:linear-gradient(90deg,var(--coral),var(--amber),var(--teal2),var(--teal))}
.gauge .tick{position:absolute;top:-30px;text-align:center;transform:translateX(-50%)}
.gauge .tick .dot{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--ink);margin:0 auto 10px}
.gauge .tick b{display:block;font:400 20px Georgia,serif}.gauge .tick span{display:block;font:13px Arial;color:#5A5852;max-width:180px}
.gauge .axis{position:absolute;left:120px;right:120px;top:352px;display:flex;justify-content:space-between;font:12px Arial;color:var(--muted)}

/* ---------- TRIO: tres columnas que convergen ---------- */
.trio .cols{position:absolute;left:80px;right:80px;top:220px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px}
.trio .col{background:#fff;border-top:4px solid var(--teal);padding:20px 20px 60px;position:relative;min-height:210px}
.trio .col:nth-child(2){border-color:var(--amber)}.trio .col:nth-child(3){border-color:var(--purple)}
.trio .col b{font:400 20px/1.2 Georgia,serif;display:block;margin-bottom:8px}.trio .col p{margin:0;font:14px/1.42 Arial;color:#5A5852}
.trio .converge{position:absolute;left:80px;right:80px;bottom:70px;padding:16px 24px;background:var(--ink);color:var(--cream);text-align:center;font:16px/1.4 Georgia,serif}
.trio svg.wires{position:absolute;left:80px;right:80px;top:430px;height:70px;width:calc(100% - 160px)}

/* ---------- MODEL-3D: escenas de objeto y mecanismo ---------- */
@media(max-width:1320px){body{overflow-x:hidden}.deck{justify-content:start;padding:12px}}
@media print{@page{size:13.333in 7.5in;margin:0}body{background:#fff}.deck{display:block;padding:0}.slide{break-after:page;box-shadow:none}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const logo="../../../Marca_Visual/Branding_RB_2026/svg/";

/* ============ Generadores de diagramas propios (SVG) ============ */

// Dipolo — el símbolo de marca, usado como átomo visual base
function dipoleIcon(color,size){size=size||18;return `<svg width="${size*2}" height="${size}" viewBox="0 0 40 20"><circle cx="10" cy="10" r="9" fill="${color}"/><line x1="19" y1="10" x2="21" y2="10" stroke="${color}" stroke-width="1.4"/><circle cx="30" cy="10" r="9" fill="${color}" opacity="0.35"/></svg>`}

// Fondo decorativo de portada — una línea de voltaje continua, de baja intensidad
function signalPath(){
  let d="M0,90 ";
  for(let x=0;x<=1280;x+=8){
    const y=90+Math.sin(x*0.012)*22+Math.sin(x*0.031)*10;
    d+=`L${x},${y.toFixed(1)} `;
  }
  return `<svg class="signal" viewBox="0 0 1280 180" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#0F6E56" stroke-width="2"/><path d="${d}" fill="none" stroke="#0F6E56" stroke-width="1" transform="translate(0,26)" opacity="0.5"/></svg>`
}

// TRACE — gráfico de voltaje real: dos curvas (salamandra / rana) en el tiempo
function traceChart(){
  // Eje X: 0=reposo,1=corte,2=día siguiente,3=1 sem,4=2 sem,5=4 sem  → mapeado a 0..1000
  const xs=[0,150,300,550,750,1000];
  const yScale=v=>240-(v+30)*2.2; // -30..+40mV -> 0..240 aprox, invertido
  const sala=[-10,-10,20,5,-30,-30];
  const rana=[-10,-10,20,5,-2,-10];
  const pathOf=arr=>xs.map((x,i)=>`${i===0?'M':'L'}${x},${yScale(arr[i]).toFixed(1)}`).join(' ');
  const zero=yScale(0);
  return `<svg viewBox="0 0 1000 300" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible">
    <line x1="0" y1="${zero}" x2="1000" y2="${zero}" stroke="#D5D0C4" stroke-width="1"/>
    <text x="0" y="${zero-10}" font-family="Arial" font-size="13" fill="#77756F">0 mV</text>
    <path d="${pathOf(rana)}" fill="none" stroke="#BA7517" stroke-width="3.5"/>
    <path d="${pathOf(sala)}" fill="none" stroke="#0F6E56" stroke-width="3.5"/>
    ${xs.map((x,i)=>`<circle cx="${x}" cy="${yScale(sala[i])}" r="6" fill="#0F6E56"/>`).join('')}
    ${xs.map((x,i)=>`<circle cx="${x}" cy="${yScale(rana[i])}" r="6" fill="#BA7517"/>`).join('')}
    <text x="150" y="${yScale(20)-16}" font-family="Georgia" font-size="17" fill="#2C2C2A">+20 mV — corriente de lesión</text>
    <text x="1000" y="${yScale(-30)+26}" text-anchor="end" font-family="Georgia" font-size="17" fill="#0F6E56">−30 mV — regenera</text>
    <text x="1000" y="${yScale(-10)+30}" text-anchor="end" font-family="Georgia" font-size="17" fill="#BA7517">−10 mV — solo cicatriza</text>
    <g font-family="Arial" font-size="13" fill="#77756F">
      <text x="0" y="290">Reposo</text><text x="150" y="290" text-anchor="middle">Corte</text><text x="300" y="290" text-anchor="middle">1 día</text><text x="550" y="290" text-anchor="middle">1 sem.</text><text x="750" y="290" text-anchor="middle">2 sem.</text><text x="1000" y="290" text-anchor="end">4 sem.</text>
    </g>
  </svg>`
}

// GAUGE — escala horizontal de Vmem con marcadores
function gaugeTicks(items){
  // items: [{pos:0-100, label, value, color}]
  return items.map(it=>`<div class="tick" style="left:${it.pos}%"><div class="dot" style="border-color:${it.color}"></div><b style="color:${it.color}">${it.value}</b><span>${it.label}</span></div>`).join('')
}

// NETWORK — red de nodos conectados; variant "healthy" o "isla"
function networkDiagram(variant){
  // Grid de nodos con conexiones tipo malla; en "isla" el cluster central se apaga y sus líneas se cortan
  const nodes=[
    {x:80,y:60},{x:230,y:40},{x:400,y:70},{x:560,y:45},{x:720,y:75},{x:860,y:50},
    {x:120,y:190},{x:280,y:210},{x:430,y:180},{x:590,y:215},{x:740,y:185},{x:840,y:220},
    {x:60,y:320},{x:210,y:300},{x:370,y:330},{x:520,y:295},{x:680,y:325},{x:830,y:300}
  ];
  const edges=[[0,1],[1,2],[2,3],[3,4],[4,5],[0,6],[1,7],[2,8],[3,9],[4,10],[5,11],[6,7],[7,8],[8,9],[9,10],[10,11],[6,12],[7,13],[8,14],[9,15],[10,16],[11,17],[12,13],[13,14],[14,15],[15,16],[16,17]];
  const isla=[7,8,9,13,14,15]; // nodos que forman la isla desconectada
  const isIsla=n=>variant==='isla'&&isla.includes(n);
  const edgeBroken=(a,b)=>variant==='isla'&&(isla.includes(a)||isla.includes(b))&&!(isla.includes(a)&&isla.includes(b));
  const edgeInsideIsla=(a,b)=>variant==='isla'&&isla.includes(a)&&isla.includes(b);
  let svg=`<svg viewBox="0 0 900 380" style="width:100%;height:100%">`;
  edges.forEach(([a,b])=>{
    const A=nodes[a],B=nodes[b];
    if(edgeBroken(a,b)){
      svg+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#D85A30" stroke-width="2" stroke-dasharray="3,7" opacity="0.65"/>`;
    }else if(edgeInsideIsla(a,b)){
      svg+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#D85A30" stroke-width="1.6" opacity="0.55"/>`;
    }else{
      svg+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#0F6E56" stroke-width="1.6" opacity="0.45"/>`;
    }
  });
  nodes.forEach((n,i)=>{
    const dead=isIsla(i);
    svg+=`<circle cx="${n.x}" cy="${n.y}" r="${dead?11:9}" fill="${dead?'#D85A30':'#0F6E56'}" opacity="${dead?0.85:1}"/>`;
  });
  if(variant==='isla'){
    svg+=`<text x="450" y="215" text-anchor="middle" font-family="Georgia" font-size="16" fill="#D85A30" font-style="italic">isla eléctrica</text>`;
  }
  svg+=`</svg>`;
  return svg;
}

// FIELD — anillos concéntricos de intensidad de campo
function fieldRings(){
  const rings=[{r:170,op:.55},{r:130,op:.4},{r:90,op:.3},{r:52,op:.22}];
  let svg=`<svg viewBox="0 0 560 480" style="width:100%;height:100%">`;
  rings.slice().reverse().forEach(rg=>{svg+=`<circle cx="280" cy="240" r="${rg.r}" fill="#0F6E56" opacity="${rg.op*0.35}"/>`});
  rings.forEach(rg=>{svg+=`<circle cx="280" cy="240" r="${rg.r}" fill="none" stroke="#0F6E56" stroke-width="1" opacity="${rg.op}"/>`});
  svg+=`<rect x="260" y="222" width="40" height="36" rx="3" fill="#2C2C2A"/><text x="270" y="245" font-family="Arial" font-size="12" fill="#fff">N</text><text x="278" y="245" font-family="Arial" font-size="12" fill="#fff"></text><line x1="280" y1="222" x2="280" y2="70" stroke="#CBC7BC" stroke-width="1" stroke-dasharray="2,4"/>`;
  svg+=`</svg>`;
  return svg;
}

// GRADIENT — imán simple (campo suave) vs. arreglo cuadripolar (frontera empinada)
// GRADIENT-CONCEPT — B(x) intensidad vs. dB/dx gradiente: son dos cosas distintas
function gradientConceptChart(){
  const xs=[]; for(let x=0;x<=1000;x+=10) xs.push(x);
  const B=x=>20+320*Math.exp(-x/230); // curva de intensidad, decae con la distancia
  const yB=v=>170-(v)*0.42; // escala para intensidad (arriba)
  const bPath=xs.map((x,i)=>`${i===0?'M':'L'}${x},${yB(B(x)).toFixed(1)}`).join(' ');
  // pendiente (derivada) aproximada, reescalada para verse como segunda curva abajo
  const dB=x=>-320/230*Math.exp(-x/230);
  const maxSlope=Math.abs(dB(0));
  const yG=v=>380-(Math.abs(v)/maxSlope)*120;
  const gPath=xs.map((x,i)=>`${i===0?'M':'L'}${x},${yG(dB(x)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 1000 420" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible">
    <text x="0" y="20" font-family="Arial" font-size="13" letter-spacing="1.5" fill="#77756F">INTENSIDAD — B(x)</text>
    <path d="${bPath}" fill="none" stroke="#0F6E56" stroke-width="3.5"/>
    <line x1="0" y1="255" x2="1000" y2="255" stroke="#D5D0C4" stroke-width="1"/>
    <rect x="0" y="80" width="130" height="90" fill="#D85A30" opacity="0.08"/>
    <text x="10" y="95" font-family="Georgia" font-size="15" fill="#D85A30" font-style="italic">cambia rápido</text>
    <text x="10" y="114" font-family="Arial" font-size="13" fill="#5A5852">= gradiente alto</text>
    <rect x="600" y="150" width="400" height="60" fill="#0F6E56" opacity="0.06"/>
    <text x="610" y="182" font-family="Georgia" font-size="15" fill="#0F6E56" font-style="italic">cambia lento = gradiente bajo</text>
    <text x="0" y="290" font-family="Arial" font-size="13" letter-spacing="1.5" fill="#77756F">GRADIENTE — dB/dx</text>
    <path d="${gPath}" fill="none" stroke="#BA7517" stroke-width="3.5"/>
    <line x1="0" y1="380" x2="1000" y2="380" stroke="#D5D0C4" stroke-width="1"/>
    <text x="1000" y="410" text-anchor="end" font-family="Arial" font-size="13" fill="#77756F">distancia al imán →</text>
  </svg>`
}

function bipolarPanel(){
  return `<svg viewBox="0 0 300 190" style="width:100%;height:100%">
    <rect x="80" y="70" width="60" height="50" rx="4" fill="#2C2C2A"/>
    <text x="98" y="100" font-family="Arial" font-size="15" fill="#fff">N</text><text x="122" y="100" font-family="Arial" font-size="15" fill="#77756F">S</text>
    ${[36,58,82].map(r=>`<circle cx="110" cy="95" r="${r}" fill="none" stroke="#0F6E56" stroke-width="1.4" opacity="${0.55-r*0.004}"/>`).join('')}
    <text x="110" y="178" text-anchor="middle" font-family="Arial" font-size="12" fill="#77756F">gradiente parejo y suave</text>
  </svg>`
}
function quadripolarPanel(){
  const cells=[["N","S"],["S","N"]];
  let svg=`<svg viewBox="0 0 300 190" style="width:100%;height:100%">`;
  for(let r=0;r<2;r++)for(let c=0;c<2;c++){
    const x=70+c*70,y=45+r*60;
    svg+=`<rect x="${x}" y="${y}" width="66" height="56" fill="${cells[r][c]==='N'?'#2C2C2A':'#fff'}" stroke="#2C2C2A" stroke-width="1.6"/>`;

function chrome(s,i,dark){return `<img class="dipole" src="${logo+(dark?'icono_dipolo_dark.svg':'icono_dipolo.svg')}" alt=""><div class="section">${s.section||""}</div><div class="folio">${String(i+1).padStart(2,"0")}</div>`}

function render(s,i){
 let x=`<section class="slide ${s.type}">`;

 if(s.type==="cover") return x+`<img class="program" src="${logo}programa_el_cuerpo_electrico.svg" alt=""><img class="endorsement" src="${logo}endorsement_instituto.svg" alt="">${signalPath()}<div class="copy"><div class="eyebrow">Jueves de Wellkitt</div><h1>${s.title.replace("|","<span>")}</span></h1><p class="lead">${s.body}</p></div><div class="presenter">Dr. Miguel Ojeda Rios · Instituto Centrobioenergetica</div></section>`;

 if(s.type==="quote") return x+`<img class="program" src="${logo}programa_el_cuerpo_electrico.svg" alt=""><img class="endorsement" src="${logo}endorsement_instituto.svg" alt=""><div class="dots">${dipoleIcon('#5DCAA5',26)}</div><div class="copy"><div class="eyebrow">${s.section}</div><h2>${s.title}</h2><p>${s.body}</p></div><div class="folio">${String(i+1).padStart(2,"0")}</div></section>`;

 if(s.type==="close") return x+`<img class="program" src="${logo}programa_el_cuerpo_electrico.svg" alt=""><div class="copy"><h2>${s.title}</h2><p class="lead">${s.body}</p></div></section>`;

 x+=chrome(s,i);

 if(s.type==="statement")x+=`<div class="accent"></div><div class="copy"><div class="eyebrow">${s.section}</div><h2>${s.title}</h2><p class="lead">${s.body}</p></div>`;

 if(s.type==="split")x+=`<div class="head"><h2 class="title">${s.title}</h2></div><div class="cols"><div class="col a"><div class="icon">${s.leftIcon||clockIcon("#0F6E56")}</div><div class="stat">${s.leftStat}</div><div class="statlabel">${s.leftStatLabel}</div><h3>${s.leftTitle}</h3><p>${s.leftBody}</p></div><div class="divider"><div class="dipole-mid">${dipoleIcon("#77756F",13)}</div></div><div class="col b"><div class="icon">${s.rightIcon||layersIcon("#BA7517")}</div><div class="stat">${s.rightStat}</div><div class="statlabel">${s.rightStatLabel}</div><h3>${s.rightTitle}</h3><p>${s.rightBody}</p></div></div>`;

 if(s.type==="table")x+=`<div class="head"><h2 class="title">${s.title}</h2></div><div class="rows"><div class="row head-row"><span>Nodo</span><span>Controla</span><span>Aparece cuando</span><span>Inervación</span></div>${s.rows.map(r=>`<div class="row"><b>${r[0]}</b><span>${r[1]}</span><span>${r[2]}</span><span>${r[3]}</span></div>`).join("")}</div>`;

 if(s.type==="cascade")x+=`<div class="head"><h2 class="title">${s.title}</h2></div><div class="wrap ${s.aside?'aside':''}"><div class="steps ${s.tight?'tight':''}"><div class="spine"></div>${s.steps.map((st,j)=>`<div class="step"><div class="node">${String(j+1).padStart(2,"0")}</div><div class="body"><b>${st[0]}</b>${st[1]?`<p>${st[1]}</p>`:""}</div></div>`).join("")}</div></div>${s.aside?`<div class="aside-visual">${s.aside}</div>`:""}`;

 if(s.type==="trace")x+=`<div class="head"><h2 class="title">${s.title}</h2><p style="margin-top:6px;font:14px Arial;color:var(--muted)">${s.note||""}</p></div><div class="chart">${traceChart()}</div><div class="legend"><span><i style="background:#0F6E56"></i>Salamandra — regenera</span><span><i style="background:#BA7517"></i>Rana — cicatriza</span></div>`;

 if(s.type==="network")x+=`<div class="head"><h2 class="title">${s.title}</h2></div><div class="diagram">${networkDiagram(s.variant)}</div><div class="caption">${s.caption.map(c=>`<span>${c}</span>`).join("")}</div>`;

 if(s.type==="field")x+=`<div class="head"><h2 class="title">${s.title}</h2></div><div class="diagram">${fieldRings()}</div><div class="readout">${s.readout.map(r=>`<div class="r"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}<p style="font:14px/1.4 Arial;color:#5A5852;margin-top:6px">${s.note||""}</p></div>`;

 if(s.type==="mechanisms")x+=`<div class="head"><h2 class="title">${s.title}</h2></div><div class="grid">${s.items.map(it=>`<div class="card">${ICONS[it[0]]}<b>${it[1]}</b><p>${it[2]}</p></div>`).join("")}</div>`;

 if(s.type==="gconcept")x+=`<div class="head"><h2 class="title">${s.title}</h2></div><div class="chart">${gradientConceptChart()}</div><div class="note">${s.note}</div>`;

 if(s.type==="gradient")x+=`<div class="head"><h2 class="title">${s.title}</h2></div><div class="panels"><div class="panel"><b>${s.left[0]}</b><span class="sub">${s.left[1]}</span><div class="diagram-box">${bipolarPanel()}</div><p>${s.left[2]}</p></div><div class="panel"><b>${s.right[0]}</b><span class="sub">${s.right[1]}</span><div class="diagram-box">${quadripolarPanel()}</div><p>${s.right[2]}</p></div></div><div class="note">${s.note}</div>`;

 if(s.type==="gauge")x+=`<div class="head"><h2 class="title">${s.title}</h2></div><div class="scale">${gaugeTicks(s.items)}</div><div class="axis"><span>${s.min}</span><span>${s.max}</span></div>`;

 if(s.type==="trio")x+=`<div class="head"><h2 class="title">${s.title}</h2></div><div class="cols">${s.cols.map(c=>`<div class="col"><b>${c[0]}</b><p>${c[1]}</p></div>`).join("")}</div>${trioWires()}<div class="converge">${s.converge}</div>`;

 return x+`<div class="rule"></div></section>`;
}
document.getElementById("deck").innerHTML=slides.map(render).join("");
function fitDeck(){
 const deck=document.getElementById("deck");
 if(innerWidth<1320){
   const scale=(innerWidth-24)/1280;
   deck.style.transform=`scale(${scale})`;deck.style.transformOrigin="top left";deck.style.width="1280px";deck.style.position="absolute";deck.style.left="0";deck.style.top="0";
   document.body.style.height=`${deck.scrollHeight*scale}px`;
 }else{deck.style.transform="";deck.style.width="";deck.style.position="";deck.style.left="";deck.style.top="";document.body.style.height="";}
}
fitDeck();addEventListener("resize",fitDeck);addEventListener("load",fitDeck);
</script>
